name: Web GPT No-Fix Snapshot Guard

on:
  push:
    branches:
      - web-gpt/review-fix/5eb816d-c2b6893

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Apply no-fix snapshot guard
        run: |
          python3 .github/web-gpt-no-fix-snapshot.py
          gofmt -w glm-worker/internal/workflow/review_flow.go glm-worker/internal/workflow/quality_fixer_snapshot_test.go
          rm .github/web-gpt-no-fix-snapshot.py .github/workflows/web-gpt-no-fix-snapshot.yml
          git diff --check
      - name: Focused tests
        run: |
          go -C glm-worker test ./internal/workflow ./internal/harnesslint
      - name: Repository lint
        run: |
          quality_bin="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./harnesslint
      - name: Commit production fix
        run: |
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m 'Guard no-fix quality snapshot'
          git push origin HEAD:web-gpt/review-fix/5eb816d-c2b6893
