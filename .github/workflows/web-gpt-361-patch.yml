name: Web GPT Issue 361 Patch

on:
  push:
    branches:
      - web-gpt/issue-361-structured-validation-telemetry
    paths:
      - .github/workflows/web-gpt-361-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python3 .github/scripts/web-gpt-361-patch.py
      - name: Commit patch
        run: |
          git config user.name "Web GPT"
          git config user.email "web-gpt@users.noreply.github.com"
          git rm .github/workflows/web-gpt-361-patch.yml .github/scripts/web-gpt-361-patch.py
          git add glm-worker/internal/runner/stream_events.go glm-worker/internal/app/quality_gate.go
          git commit -m "Bind structured validation execution telemetry"
          git push
