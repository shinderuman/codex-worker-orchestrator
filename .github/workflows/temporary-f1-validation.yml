name: Temporary F1 Validation

on:
  push:
    branches:
      - hardening-task/instruction-surface-ownership

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Targeted tests
        run: go -C glm-worker test ./internal/runner ./internal/workflow ./internal/app
      - name: Targeted vet
        run: go -C glm-worker vet ./internal/runner ./internal/workflow ./internal/app
      - name: Build
        run: go -C glm-worker build ./...
