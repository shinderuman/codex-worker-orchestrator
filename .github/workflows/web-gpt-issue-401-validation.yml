name: Web GPT Issue 401 Validation

on:
  push:
    branches:
      - web-gpt/issue-401-new-task-atomic

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read Go version
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools"
          printf 'QUALITY_TOOLS_BIN_DIR=%s\n' "$quality_bin" >> "$GITHUB_ENV"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
      - name: Repository validation
        run: |
          ./commentlint
          ./harnesslint
          ./goquality vet
          ./goquality build
          (cd glm-worker && go test ./...)
