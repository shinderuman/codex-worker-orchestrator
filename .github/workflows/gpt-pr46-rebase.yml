name: GPT PR46 Rebase Helper

on:
  push:
    branches:
      - gpt/effective-compaction-window
    paths:
      - .github/workflows/gpt-pr46-rebase.yml

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt/effective-compaction-window
      - name: Merge current main and preserve PR46 workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          feature_head="$(git rev-parse HEAD)"
          merge_base="$(git merge-base "$feature_head" origin/main)"
          git diff --binary "$merge_base" "$feature_head" -- glm-worker/internal/workflow/workflow.go > /tmp/pr46-workflow.patch

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          if (( merge_rc != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if (( ${#conflicts[@]} != 1 )) || [[ "${conflicts[0]}" != "glm-worker/internal/workflow/workflow.go" ]]; then
              printf 'unexpected conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --theirs -- glm-worker/internal/workflow/workflow.go
            git add glm-worker/internal/workflow/workflow.go
          fi

          git apply --3way /tmp/pr46-workflow.patch
          git add glm-worker/internal/workflow/workflow.go
          git diff --check --cached
          git commit -m "Merge main into PR46 after Task 012 completion"
          git push origin HEAD:gpt/effective-compaction-window
