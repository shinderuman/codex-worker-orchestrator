name: Web GPT PR 1380 temporary verification
on:
  push:
    branches:
      - 'web-gpt/active-only-stale-successor-publication'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install pinned quality tools
        run: QUALITY_TOOLS_BIN_DIR="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools" ./install-quality-tools.sh
      - name: Repository lint
        run: ./harnesslint
        env:
          QUALITY_TOOLS_BIN_DIR: ${{ runner.temp }}/codex-worker-orchestrator-quality-tools
      - name: Go vet
        run: ./goquality vet
        env:
          QUALITY_TOOLS_BIN_DIR: ${{ runner.temp }}/codex-worker-orchestrator-quality-tools
      - name: Go build
        run: ./goquality build
        env:
          QUALITY_TOOLS_BIN_DIR: ${{ runner.temp }}/codex-worker-orchestrator-quality-tools
      - name: Go full suite
        working-directory: glm-worker
        run: go test -timeout=25m ./...
