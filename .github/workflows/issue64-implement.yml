name: Issue 64 Implementation

on:
  push:
    branches:
      - gpt/issue-64-parent-review-start-guard

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, 'Implement issue 64 parent review guard') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/issue-64-parent-review-start-guard
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Implement guard and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('glm-worker/internal/workflow/workflow.go')
          s = p.read_text()
          needle = '''func (w *Workflow) validateNewTaskStart() error {
          \tif w.state.Exists("pending-decision") {
          \t\treturn &WorkerError{Message: "previous task is waiting for Sol decision; use --decision or --reset"}
          \t}
          '''
          needle = '\n'.join(line[10:] if line.startswith('          ') else line for line in needle.splitlines()) + '\n'
          replacement = needle + '''\tif open := w.state.OpenParentReviewLabel(); open != "none" {
          \t\treturn &WorkerError{Message: fmt.Sprintf("previous task has unresolved parent review (%s); resolve it explicitly with --accept (or --fix when rework is required) before starting a new task", open)}
          \t}
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if needle not in s:
              raise SystemExit('validateNewTaskStart anchor not found')
          p.write_text(s.replace(needle, replacement, 1))

          p = Path('glm-worker/internal/app/parent_review_test.go')
          s = p.read_text()
          start = s.index('func TestExecuteNewTaskClosesOpenOpportunityAsUnknown')
          end = s.index('func TestExecuteAcceptRejectsPendingDecisionOpportunity', start)
          test = r'''func TestExecuteNewTaskRejectsOpenParentReviewUntilAccepted(t *testing.T) {
          cfg, st := newParentReviewOpportunity(t)
          before, err := st.CurrentTaskStats()
          if err != nil {
              t.Fatal(err)
          }
          if before.ParentReviewOpen == nil || before.ParentReviewOpen.PacketStatus != "NEEDS_SOL_REVIEW" {
              t.Fatalf("前taskのparent reviewがopenではありません: %#v", before.ParentReviewOpen)
          }
          beforeLogs, err := st.ReadModelCallLogs(before.TaskID)
          if err != nil {
              t.Fatal(err)
          }

          rejected := &fakeRunner{steps: []fakeStep{
              {structured: implementedPacketApp("must not run")},
              {structured: passPacketApp()},
          }}
          err = Execute(Command{Mode: ModeNewTask, Payload: "request2"}, cfg, rejected.factory(), io.Discard, io.Discard)
          if err == nil || !strings.Contains(err.Error(), "unresolved parent review") || !strings.Contains(err.Error(), "--accept") {
              t.Fatalf("未解決parent reviewの新task開始を明示的に拒否する必要があります: %v", err)
          }
          if len(rejected.prompts) != 0 {
              t.Fatalf("拒否時はmodelを呼び出してはいけません: %d", len(rejected.prompts))
          }

          after, err := st.CurrentTaskStats()
          if err != nil {
              t.Fatal(err)
          }
          if after.TaskID != before.TaskID || after.ParentReviewOpen == nil || after.ParentReviewOpen.PacketStatus != "NEEDS_SOL_REVIEW" {
              t.Fatalf("拒否時にcurrent task/reviewが変化しました: before=%#v after=%#v", before, after)
          }
          if after.ParentOutcomes[state.ParentOutcomeUnknown] != 0 {
              t.Fatalf("拒否時にunknown outcomeを記録してはいけません: %#v", after.ParentOutcomes)
          }
          afterLogs, err := st.ReadModelCallLogs(after.TaskID)
          if err != nil {
              t.Fatal(err)
          }
          if len(afterLogs) != len(beforeLogs) {
              t.Fatalf("拒否時にtelemetryが変化しました: before=%d after=%d", len(beforeLogs), len(afterLogs))
          }

          if accept := executeAccept(t, cfg); !accept.Accepted {
              t.Fatal("open parent reviewをacceptできませんでした")
          }
          if got := st.TaskStatus(); got != state.TaskStatusWaitingSolReview {
              t.Fatalf("accept後のstale lifecycle status = %q want %q", got, state.TaskStatusWaitingSolReview)
          }

          next := &fakeRunner{steps: []fakeStep{
              {structured: implementedPacketApp("next")},
              {structured: passPacketApp()},
          }}
          if err := Execute(Command{Mode: ModeNewTask, Payload: "request2"}, cfg, next.factory(), io.Discard, io.Discard); err != nil {
              t.Fatalf("parent review解決後はstale statusだけで新taskを拒否してはいけません: %v", err)
          }

          all, err := st.AllTaskStats()
          if err != nil {
              t.Fatal(err)
          }
          var archived state.TaskStats
          for _, stats := range all {
              if stats.TaskID == before.TaskID {
                  archived = stats
                  break
              }
          }
          if archived.TaskID == "" || archived.ArchivedAt == nil {
              t.Fatalf("前task statsがarchiveされていません: %#v", all)
          }
          if archived.ParentOutcomes[state.ParentOutcomeAccepted] != 1 || archived.ParentOutcomes[state.ParentOutcomeUnknown] != 0 {
              t.Fatalf("明示parent outcomeが保持されていません: %#v", archived.ParentOutcomes)
          }
          }

          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines())
          p.write_text(s[:start] + test + s[end:])

          p = Path('glm-worker/internal/app/execute_test.go')
          s = p.read_text()
          anchor = '''\tif !st.Exists("lock") {
          \t\tt.Fatal("lockファイルが作成されていません")
          \t}

          \tsecond := &fakeRunner{steps: []fakeStep{
          '''
          anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in anchor.splitlines()) + '\n'
          replacement = '''\tif !st.Exists("lock") {
          \t\tt.Fatal("lockファイルが作成されていません")
          \t}
          \tif accept := executeAccept(t, cfg); !accept.Accepted {
          \t\tt.Fatal("lock解放後の次task開始前にparent reviewを解決できませんでした")
          \t}

          \tsecond := &fakeRunner{steps: []fakeStep{
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if anchor not in s:
              raise SystemExit('lock test anchor not found')
          p.write_text(s.replace(anchor, replacement, 1))
          PY
          gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/app/parent_review_test.go glm-worker/internal/app/execute_test.go
          git diff --check
      - name: Validate
        run: |
          (cd glm-worker && go test ./...)
          (cd glm-worker && go vet ./...)
          (cd glm-worker && go build ./...)
          ./harnesslint
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow/workflow.go glm-worker/internal/app/parent_review_test.go glm-worker/internal/app/execute_test.go
          git commit -m 'Implement issue 64 parent review guard'
          git push origin HEAD:gpt/issue-64-parent-review-start-guard
