name: Web GPT 1287 Cutover Runner

on:
  push:
    branches:
      - web-gpt/issue-1287-controller-runtime-binding

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-1287-controller-runtime-binding
      - uses: actions/setup-go@v7
        with:
          go-version-file: glm-worker/go.mod
      - name: Apply exact cutover script
        run: |
          python3 - <<'BOOT'
          from pathlib import Path

          source = Path('.github/workflows/web-gpt-1287-cutover.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('embedded cutover script markers are not unique')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, 'web-gpt-1287-cutover.py', 'exec'))

          test_path = Path('glm-worker/internal/state/controller_runtime_binding_test.go')
          generated = test_path.read_text()
          broken = '[]byte("not-json' + chr(10) + '"),'
          fixed = '[]byte("not-json' + r'\n' + '"),'
          if generated.count(broken) != 1:
              raise SystemExit('generated corrupt-binding test literal is not unique')
          test_path.write_text(generated.replace(broken, fixed, 1))

          active_path = Path('glm-worker/internal/workflow/activetask.go')
          active = active_path.read_text()
          unused = '\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"\n'
          if active.count(unused) != 1:
              raise SystemExit('workflow activetask state import is not unique')
          active_path.write_text(active.replace(unused, '', 1))

          workflow_path = Path('glm-worker/internal/workflow/workflow.go')
          workflow_text = workflow_path.read_text()
          before = (
              '\tif err := w.initializeNewTaskState(threadID, claimID); err != nil {\n'
              '\t\treturn "", err\n'
              '\t}\n'
              '\tif err := w.persistParentActionCodexIdentity(); err != nil {\n'
          )
          after = (
              '\tif err := w.initializeNewTaskState(threadID, claimID); err != nil {\n'
              '\t\treturn "", err\n'
              '\t}\n'
              '\tif w.canonicalAdmission != nil {\n'
              '\t\tif err := w.bindCanonicalWorkflowAttempt(*w.canonicalAdmission); err != nil {\n'
              '\t\t\treturn "", err\n'
              '\t\t}\n'
              '\t}\n'
              '\tif err := w.persistParentActionCodexIdentity(); err != nil {\n'
          )
          if workflow_text.count(before) != 1:
              raise SystemExit('fresh task binding rematerialization boundary is not unique')
          workflow_path.write_text(workflow_text.replace(before, after, 1))

          projection_path = Path('glm-worker/internal/parentcontinuation/projection.go')
          projection = projection_path.read_text()
          fallback_before = (
              '\ttask, canonical, err := controller.WorkflowExecutionTask(cfg)\n'
              '\tif canonical && err != nil {\n'
              '\t\ttask, err = quiescentControllerTask(cfg, err)\n'
              '\t}\n'
          )
          fallback_after = (
              '\ttask, canonical, err := controller.WorkflowExecutionTask(cfg)\n'
              '\tquiescent := canonical && err != nil\n'
              '\tif quiescent {\n'
              '\t\ttask, err = quiescentControllerTask(cfg, err)\n'
              '\t}\n'
          )
          if projection.count(fallback_before) != 1:
              raise SystemExit('canonical quiescent fallback boundary is not unique')
          projection = projection.replace(fallback_before, fallback_after, 1)
          strict = (
              '\tif binding.TaskPath != task.TaskPath || binding.TaskContractDigest != task.ContractDigest {\n'
              '\t\treturn Request{}, true, errors.New("controller runtime binding does not match canonical execution task")\n'
              '\t}\n'
          )
          live_only = (
              '\tif !quiescent && (binding.TaskPath != task.TaskPath || binding.TaskContractDigest != task.ContractDigest) {\n'
              '\t\treturn Request{}, true, errors.New("controller runtime binding does not match canonical execution task")\n'
              '\t}\n'
          )
          if projection.count(strict) != 1:
              raise SystemExit('canonical live binding validation boundary is not unique')
          projection_path.write_text(projection.replace(strict, live_only, 1))
          BOOT

          changed_go="$(git status --porcelain | awk '{print $2}' | grep '\.go$' || true)"
          if [ -n "$changed_go" ]; then
            gofmt -w $changed_go
          fi
          cd glm-worker
          go test ./...
      - name: Commit validated cutover
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal
          git commit -m "Use one controller runtime binding"
          git push