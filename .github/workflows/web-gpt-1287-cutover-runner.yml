name: Web GPT 1287 Cutover Runner

on:
  push:
    branches:
      - web-gpt/issue-1287-controller-runtime-binding

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-1287-controller-runtime-binding
      - uses: actions/setup-go@v7
        with:
          go-version-file: glm-worker/go.mod
      - name: Apply exact cutover script
        run: |
          python3 - <<'BOOT'
          from pathlib import Path

          source = Path('.github/workflows/web-gpt-1287-cutover.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('embedded cutover script markers are not unique')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, 'web-gpt-1287-cutover.py', 'exec'))

          test_path = Path('glm-worker/internal/state/controller_runtime_binding_test.go')
          generated = test_path.read_text()
          broken = '[]byte("not-json' + chr(10) + '"),'
          fixed = '[]byte("not-json' + r'\n' + '"),'
          if generated.count(broken) != 1:
              raise SystemExit('generated corrupt-binding test literal is not unique')
          test_path.write_text(generated.replace(broken, fixed, 1))
          BOOT

          changed_go="$(git status --porcelain | awk '{print $2}' | grep '\.go$' || true)"
          if [ -n "$changed_go" ]; then
            gofmt -w $changed_go
          fi
          cd glm-worker
          go test ./...
      - name: Commit validated cutover
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal
          git commit -m "Use one controller runtime binding"
          git push