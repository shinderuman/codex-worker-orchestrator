name: Issue 239 transition migration

on:
  push:
    branches:
      - web-gpt/issue-239-lifecycle-transition-authority
    paths:
      - .github/workflows/issue-239-transition-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/web-gpt/issue-239-lifecycle-transition-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-239-lifecycle-transition-authority
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Migrate production lifecycle writes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'glm-worker/internal/workflow/workflow.go': [
                  ('''\t\tif err := w.state.SetTaskStatus(state.TaskStatusActive); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tw.state.RecordDecision()\n\n\t\tif _, err := w.state.RecordParentOutcome(state.ParentOutcomeDecision, ""); err != nil {\n\t\t\treturn err\n\t\t}\n''', '''\t\tif err := w.state.BeginParentDecision(); err != nil {\n\t\t\treturn err\n\t\t}\n'''),
                  ('''\t\tif err := w.state.SetTaskStatus(state.TaskStatusActive); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tw.state.RecordFix()\n\n\t\tif _, err := w.state.RecordParentOutcome(state.ParentOutcomeFix, origin); err != nil {\n\t\t\treturn err\n\t\t}\n''', '''\t\tif err := w.state.BeginParentFix(origin); err != nil {\n\t\t\treturn err\n\t\t}\n'''),
                  ('''func (w *Workflow) activateResume(checkpoint state.ResumeCheckpoint) error {\n\tif err := w.state.SetTaskStatus(state.TaskStatusActive); err != nil {\n\t\treturn err\n\t}\n\tw.state.RecordResume()\n\tw.currentResumeSource = checkpoint.StopKind.ResumeSource()\n\treturn nil\n}\n''', '''func (w *Workflow) activateResume(checkpoint state.ResumeCheckpoint) error {\n\tif err := w.state.BeginResume(checkpoint); err != nil {\n\t\treturn err\n\t}\n\tw.currentResumeSource = checkpoint.StopKind.ResumeSource()\n\treturn nil\n}\n'''),
                  ('''\tcase packet.StatusNeedsSolDecision:\n\t\tif err := w.state.Touch("pending-decision"); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tif err := w.state.SetTaskStatus(state.TaskStatusWaitingDecision); err != nil {\n\t\t\treturn err\n\t\t}\n\t\treturn w.emitResult(workerResult)\n\tcase "IMPLEMENTED":\n\t\tif err := w.state.Remove("pending-decision"); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tif err := w.state.SetTaskStatus(state.TaskStatusActive); err != nil {\n\t\t\treturn err\n\t\t}\n''', '''\tcase packet.StatusNeedsSolDecision:\n\t\tif err := w.state.WaitForDecision(); err != nil {\n\t\t\treturn err\n\t\t}\n\t\treturn w.emitResult(workerResult)\n\tcase "IMPLEMENTED":\n\t\tif err := w.state.ContinueAfterWorkerResult(); err != nil {\n\t\t\treturn err\n\t\t}\n'''),
                  ('''func (w *Workflow) finishReview(status state.TaskStatus, result packet.Result) error {\n\tif err := w.state.SetTaskStatus(status); err != nil {\n\t\treturn err\n\t}\n\treturn w.emitResult(result)\n}\n''', '''func (w *Workflow) finishReview(status state.TaskStatus, result packet.Result) error {\n\tif err := w.state.FinishReview(status); err != nil {\n\t\treturn err\n\t}\n\treturn w.emitResult(result)\n}\n'''),
                  ('''\tcase packet.StatusNeedsSolDecision:\n\t\tif err := w.state.Touch("pending-decision"); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tif err := w.state.SetTaskStatus(state.TaskStatusWaitingDecision); err != nil {\n\t\t\treturn err\n\t\t}\n\t\treturn w.emitResult(fixResult)\n\n\tcase packet.StatusImplemented:\n\t\tif err := w.state.Remove("pending-decision"); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tif err := w.state.SetTaskStatus(state.TaskStatusActive); err != nil {\n\t\t\treturn err\n\t\t}\n''', '''\tcase packet.StatusNeedsSolDecision:\n\t\tif err := w.state.WaitForDecision(); err != nil {\n\t\t\treturn err\n\t\t}\n\t\treturn w.emitResult(fixResult)\n\n\tcase packet.StatusImplemented:\n\t\tif err := w.state.ContinueAfterWorkerResult(); err != nil {\n\t\t\treturn err\n\t\t}\n'''),
                  ('''\tif err := w.state.SaveResumeCheckpoint(checkpoint); err != nil {\n\t\treturn "", err\n\t}\n\tif err := w.state.SetTaskStatus(state.TaskStatusRateLimited); err != nil {\n\t\treturn "", err\n\t}\n''', '''\tif err := w.state.EnterStop(checkpoint); err != nil {\n\t\treturn "", err\n\t}\n'''),
                  ('''\tif err := w.state.SaveResumeCheckpoint(checkpoint); err != nil {\n\t\treturn nil, err\n\t}\n\tif err := w.state.SetTaskStatus(state.TaskStatusProviderUnavailable); err != nil {\n\t\treturn nil, err\n\t}\n''', '''\tif err := w.state.EnterStop(checkpoint); err != nil {\n\t\treturn nil, err\n\t}\n'''),
                  ('''\tif err := w.state.SaveResumeCheckpoint(checkpoint); err != nil {\n\t\treturn err\n\t}\n\tif err := w.state.SetTaskStatus(state.TaskStatusInterrupted); err != nil {\n\t\treturn err\n\t}\n''', '''\tif err := w.state.EnterStop(checkpoint); err != nil {\n\t\treturn err\n\t}\n'''),
              ],
              'glm-worker/internal/workflow/decision_boundary_review.go': [
                  ('''func (w *Workflow) finishReviewerDecision(result packet.Result) error {\n\tif err := w.state.Touch("pending-decision"); err != nil {\n\t\treturn err\n\t}\n\treturn w.finishReview(state.TaskStatusWaitingDecision, result)\n}\n''', '''func (w *Workflow) finishReviewerDecision(result packet.Result) error {\n\tif err := w.state.WaitForDecision(); err != nil {\n\t\treturn err\n\t}\n\treturn w.emitResult(result)\n}\n'''),
              ],
              'glm-worker/internal/workflow/execution_milestone_fix.go': [
                  ('''\tif err := w.state.SetTaskStatus(state.TaskStatusActive); err != nil {\n\t\treturn err\n\t}\n\tw.state.RecordFix()\n\tif _, err := w.state.RecordParentOutcome(state.ParentOutcomeFix, origin); err != nil {\n\t\treturn err\n\t}\n''', '''\tif err := w.state.BeginParentFix(origin); err != nil {\n\t\treturn err\n\t}\n'''),
              ],
              'glm-worker/internal/workflow/execution_milestone_flow.go': [
                  ('''\tif err := w.state.SetTaskStatus(state.TaskStatusActive); err != nil {\n\t\treturn executionMilestoneDecisionContext{}, err\n\t}\n\tw.state.RecordDecision()\n\tif _, err := w.state.RecordParentOutcome(state.ParentOutcomeDecision, ""); err != nil {\n\t\treturn executionMilestoneDecisionContext{}, err\n\t}\n''', '''\tif err := w.state.BeginParentDecision(); err != nil {\n\t\treturn executionMilestoneDecisionContext{}, err\n\t}\n'''),
                  ('''func (w *Workflow) stopExecutionMilestoneForDecision(result packet.Result) error {\n\tif err := w.state.Touch("pending-decision"); err != nil {\n\t\treturn err\n\t}\n\tif err := w.state.SetTaskStatus(state.TaskStatusWaitingDecision); err != nil {\n\t\treturn err\n\t}\n\treturn w.emitResult(result)\n}\n''', '''func (w *Workflow) stopExecutionMilestoneForDecision(result packet.Result) error {\n\tif err := w.state.WaitForDecision(); err != nil {\n\t\treturn err\n\t}\n\treturn w.emitResult(result)\n}\n'''),
                  ('''\tif err := w.state.Remove("pending-decision"); err != nil {\n\t\treturn err\n\t}\n\tif err := w.state.SetTaskStatus(state.TaskStatusActive); err != nil {\n\t\treturn err\n\t}\n''', '''\tif err := w.state.ContinueAfterWorkerResult(); err != nil {\n\t\treturn err\n\t}\n'''),
              ],
              'glm-worker/internal/workflow/quality_gate.go': [
                  ('''\tif err := w.state.SetTaskStatus(state.TaskStatusWaitingSolReview); err != nil {\n\t\treturn err\n\t}\n''', '''\tif err := w.state.WaitForSolReview(); err != nil {\n\t\treturn err\n\t}\n'''),
              ],
              'glm-worker/internal/workflow/externalfeasibility.go': [
                  ('''\t\tif err := w.state.SetTaskStatus(state.TaskStatusWaitingSolReview); err != nil {\n\t\t\treturn err\n\t\t}\n''', '''\t\tif err := w.state.WaitForSolReview(); err != nil {\n\t\t\treturn err\n\t\t}\n'''),
                  ('''\tif err := w.state.Touch("pending-decision"); err != nil {\n\t\treturn err\n\t}\n\tif err := w.state.SetTaskStatus(state.TaskStatusWaitingDecision); err != nil {\n\t\treturn err\n\t}\n''', '''\tif err := w.state.WaitForDecision(); err != nil {\n\t\treturn err\n\t}\n'''),
              ],
              'glm-worker/internal/workflow/planfile.go': [
                  ('''\tif err := w.state.ClearResumeCheckpoint(); err != nil {\n\t\treturn err\n\t}\n\tif err := w.state.SetTaskStatus(state.TaskStatusWaitingSolReview); err != nil {\n\t\treturn err\n\t}\n''', '''\tif err := w.state.DiscardResumeAndWaitForSolReview(); err != nil {\n\t\treturn err\n\t}\n'''),
              ],
              'glm-worker/internal/workflow/quality_surface_approval.go': [
                  ('''func (w *Workflow) activateApprovedQualitySurface() error {\n\tif err := w.state.ClearResumeCheckpoint(); err != nil {\n\t\treturn err\n\t}\n\treturn w.state.SetTaskStatus(state.TaskStatusActive)\n}\n''', '''func (w *Workflow) activateApprovedQualitySurface() error {\n\treturn w.state.ActivateQualitySurfaceApproval()\n}\n'''),
              ],
              'glm-worker/internal/workflow/guard_recovery.go': [
                  ('''\tif err := w.state.SaveResumeCheckpoint(checkpoint); err != nil {\n\t\treturn err\n\t}\n\tif err := w.state.Remove("pending-decision"); err != nil {\n\t\treturn err\n\t}\n\tif err := w.state.SetTaskStatus(state.TaskStatusGuardRecoverable); err != nil {\n\t\treturn err\n\t}\n''', '''\tif err := w.state.EnterStop(checkpoint); err != nil {\n\t\treturn err\n\t}\n'''),
              ],
          }

          changed = []
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly one replacement, got {count}: {old[:80]!r}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(name)
          print('changed:')
          print('\n'.join(changed))
          PY

          remaining=$(grep -RIn --include='*.go' --exclude='*_test.go' 'SetTaskStatus' glm-worker/internal | grep -v '/internal/state/' || true)
          if [[ -n "$remaining" ]]; then
            echo 'remaining production SetTaskStatus references outside state:'
            echo "$remaining"
            exit 1
          fi

          mapfile -t changed < <(git diff --name-only -- 'glm-worker/internal/**/*.go')
          if ((${#changed[@]})); then
            gofmt -w "${changed[@]}"
          fi
          cd glm-worker
          go test ./internal/state ./internal/workflow ./internal/app
      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal
          if git diff --cached --quiet; then
            echo 'no migration changes'
            exit 0
          fi
          git commit -m 'refactor: route lifecycle writes through state authority'
          git push origin HEAD:web-gpt/issue-239-lifecycle-transition-authority
