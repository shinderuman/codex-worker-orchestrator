name: Issue 371 validation

on:
  push:
    branches:
      - web-gpt/issue-371-parent-plan-continuation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-371-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Wire continuation into handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/app/parent_handoff.go')
          text = path.read_text()
          replacements = [
              (
                  '\tRoutingEvidence          []parentHandoffRoutingEvidence   `json:"routing_evidence"`\n\tSessionRotation          *state.SessionRotationProjection `json:"session_rotation"`\n}',
                  '\tRoutingEvidence          []parentHandoffRoutingEvidence   `json:"routing_evidence"`\n\tSessionRotation          *state.SessionRotationProjection `json:"session_rotation"`\n\tParentRequest            *ParentRequestCompletionProjection `json:"parent_request"`\n}',
              ),
              (
                  '\tLastMaterial             *parentHandoffRecoveryMaterial   `json:"last_material"`\n\tSessionRotation          *state.SessionRotationProjection `json:"session_rotation"`\n\tGuardFailure',
                  '\tLastMaterial             *parentHandoffRecoveryMaterial   `json:"last_material"`\n\tSessionRotation          *state.SessionRotationProjection `json:"session_rotation"`\n\tParentRequest            *ParentRequestCompletionProjection `json:"parent_request"`\n\tGuardFailure',
              ),
              (
                  'const parentHandoffVersion = 1',
                  'const parentHandoffVersion = 2',
              ),
              (
                  '\t\tParentReviewOpen:         output.ParentReviewOpen,\n\t\tSessionRotation:          output.SessionRotation,',
                  '\t\tParentReviewOpen:         output.ParentReviewOpen,\n\t\tSessionRotation:          output.SessionRotation,\n\t\tParentRequest:            output.ParentRequest,',
              ),
              (
                  '\tapplyParentActionPlan(st, &output)\n\tapplyParentSnapshot(repoRoot, &output)',
                  '\tapplyParentActionPlan(st, &output)\n\tapplyParentRequestCompletion(repoRoot, st, &output)\n\tapplyParentSnapshot(repoRoot, &output)',
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit('handoff patch anchor missing: ' + old[:80])
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          gofmt -w glm-worker/internal/app/parent_handoff.go glm-worker/internal/app/parent_handoff_continuation.go
          if ! git diff --quiet -- glm-worker/internal/app/parent_handoff.go glm-worker/internal/app/parent_handoff_continuation.go; then
            git config user.name 'shinderuman'
            git config user.email 'shinderuman@gmail.com'
            git add glm-worker/internal/app/parent_handoff.go glm-worker/internal/app/parent_handoff_continuation.go
            git commit -m 'Expose project continuation in parent handoff'
            git push origin HEAD:web-gpt/issue-371-parent-plan-continuation
          fi
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Check gofmt
        run: |
          files='glm-worker/internal/app/parent_request_completion.go
          glm-worker/internal/app/parent_request_completion_test.go
          glm-worker/internal/app/parent_handoff.go
          glm-worker/internal/app/parent_handoff_continuation.go
          glm-worker/internal/workflow/plan_final_head.go
          glm-worker/internal/workflow/plan_completion_blocked_test.go
          glm-worker/internal/parentactioncmd/complete.go
          glm-worker/internal/parentactioncmd/complete_continuation_test.go'
          diff=$(gofmt -d $files)
          test -z "$diff" || { printf '%s\n' "$diff"; exit 1; }
      - name: Targeted tests
        working-directory: glm-worker
        run: go test ./internal/app ./internal/workflow ./internal/parentactioncmd ./internal/autoresume
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Repository lint gate
        run: ./harnesslint
      - name: Full Go test suite
        working-directory: glm-worker
        run: go test ./...
