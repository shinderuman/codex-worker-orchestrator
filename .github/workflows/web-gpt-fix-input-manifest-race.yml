name: Web GPT Fix Input Manifest Race

on:
  push:
    branches:
      - web-gpt/review-fix/5eb816d-c2b6893

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Apply input manifest race fix
        run: |
          python3 .github/web-gpt-fix-input-manifest-race.py
          gofmt -w glm-worker/internal/harnesslint/fix_isolation.go glm-worker/internal/harnesslint/fix_isolation_test.go
          rm .github/web-gpt-fix-input-manifest-race.py .github/workflows/web-gpt-fix-input-manifest-race.yml
          git diff --check
      - name: Focused tests
        run: |
          go -C glm-worker test ./internal/harnesslint ./internal/workflow
      - name: Repository lint
        run: |
          quality_bin="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./harnesslint
      - name: Commit production fix
        run: |
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m 'Bind quality fixer input manifest'
          git push origin HEAD:web-gpt/review-fix/5eb816d-c2b6893
