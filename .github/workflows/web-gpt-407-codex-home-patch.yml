name: Web GPT Issue 407 Codex Home Patch

on:
  push:
    branches:
      - web-gpt/issue-407-project-scoped-agents

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Issue 407 Codex home authority patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch Codex home authority
        run: python3 .web-gpt-407-codex-home.py
      - name: Commit patch
        run: |
          rm -f .web-gpt-407-codex-home.py .github/workflows/web-gpt-407-codex-home-patch.yml
          git diff --check
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m 'Honor Codex home for scoped instruction paths'
          git push origin HEAD:web-gpt/issue-407-project-scoped-agents
