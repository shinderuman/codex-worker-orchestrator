name: Web GPT Debug 1038

on:
  push:
    branches:
      - 'web-gpt/refactor-1038-reopen-recovery'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harnesslint-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools"
          printf 'QUALITY_TOOLS_BIN_DIR=%s\n' "$quality_bin" >> "$GITHUB_ENV"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
      - name: Capture harnesslint output
        run: |
          set +e
          ./harnesslint > harnesslint.log 2>&1
          printf '%s\n' "$?" > harnesslint.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: harnesslint-1038
          path: |
            harnesslint.log
            harnesslint.exit
