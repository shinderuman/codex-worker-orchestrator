name: Temporary Issue 72 Patch

on:
  push:
    branches:
      - gpt/bundle-provenance-72

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/bundle-provenance-72
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Apply task-authority provenance patch
        shell: bash
        run: |
          echo '...Q==' | base64 -d >/tmp/issue72-patch.py
          python3 /tmp/issue72-patch.py
          gofmt -w glm-worker/internal/state/task_authority.go glm-worker/internal/state/task_authority_test.go glm-worker/internal/workflow/externalfeasibility.go glm-worker/internal/workflow/task_authority_snapshot_test.go glm-worker/internal/app/bundle.go glm-worker/internal/app/bundle_authority_snapshot_test.go
          (cd glm-worker && go test ./internal/state ./internal/workflow ./internal/app ./internal/taskdiff)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/state/task_authority.go glm-worker/internal/state/task_authority_test.go glm-worker/internal/workflow/externalfeasibility.go glm-worker/internal/workflow/task_authority_snapshot_test.go glm-worker/internal/app/bundle.go glm-worker/internal/app/bundle_authority_snapshot_test.go
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve task authority in analysis bundles'
          git push origin HEAD:gpt/bundle-provenance-72
