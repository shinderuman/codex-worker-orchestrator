name: Web GPT Alias Followup

on:
  push:
    branches:
      - web-gpt/review-fix/91cc885-6682699
    paths:
      - .github/workflows/web-gpt-alias-followup.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/review-fix/91cc885-6682699
          fetch-depth: 0
      - name: Apply alias classification repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}")
              p.write_text(text.replace(old, new, count))

          replace(
              "glm-worker/internal/parentactioncmd/publication_pretool.go",
              '''\tif publicationGitNoVerify(segment[commandIndex+1:]) {
          \t\treturn publicationGitGuardBypassCode, publicationGitNoVerifyReason
          \t}
          ''',
              '''\targv := segment[commandIndex+1:]
          \tif subcommand := publicationGitSubcommand(argv); subcommand != "" && !publicationGitBuiltinSubcommand(subcommand) {
          \t\treturn publicationGitClassificationCode, publicationGitClassificationReason
          \t}
          \tif publicationGitNoVerify(argv) {
          \t\treturn publicationGitGuardBypassCode, publicationGitNoVerifyReason
          \t}
          ''',
          )

          replace(
              "glm-worker/internal/parentactioncmd/publication_pretool.go",
              '''\tfor index := 0; index < len(argv); index++ {
          \t\tvalue := argv[index].Value
          \t\tif value == "--" {
          ''',
              '''\tfor index := 0; index < len(argv); index++ {
          \t\tvalue := argv[index].Value
          \t\tif redirection, next, unavailable := publicationLeadingRedirection(argv, index); redirection {
          \t\t\tif unavailable {
          \t\t\t\treturn ""
          \t\t\t}
          \t\t\tindex = next - 1
          \t\t\tcontinue
          \t\t}
          \t\tif value == "--" {
          ''',
          )

          builtins = '''func publicationGitBuiltinSubcommand(value string) bool {
          \tswitch value {
          \tcase "add", "am", "annotate", "apply", "archive", "bisect", "blame", "branch", "bugreport", "bundle",
          \t\t"cat-file", "check-attr", "check-ignore", "check-mailmap", "check-ref-format", "checkout", "checkout--worker", "checkout-index",
          \t\t"cherry", "cherry-pick", "clean", "clone", "column", "commit", "commit-graph", "commit-tree", "config", "count-objects",
          \t\t"credential", "credential-cache", "credential-cache--daemon", "credential-store", "describe", "diagnose", "diff", "diff-files",
          \t\t"diff-index", "diff-tree", "difftool", "fast-export", "fast-import", "fetch", "fetch-pack", "fmt-merge-msg", "for-each-ref",
          \t\t"for-each-repo", "format-patch", "fsck", "fsck-objects", "fsmonitor--daemon", "gc", "get-tar-commit-id", "grep", "hash-object",
          \t\t"help", "hook", "index-pack", "init", "init-db", "interpret-trailers", "log", "ls-files", "ls-remote", "ls-tree", "mailinfo",
          \t\t"mailsplit", "maintenance", "merge", "merge-base", "merge-file", "merge-index", "merge-ours", "merge-recursive",
          \t\t"merge-recursive-ours", "merge-recursive-theirs", "merge-subtree", "merge-tree", "mktag", "mktree", "multi-pack-index", "mv",
          \t\t"name-rev", "notes", "pack-objects", "pack-redundant", "pack-refs", "patch-id", "pickaxe", "prune", "prune-packed", "pull",
          \t\t"push", "range-diff", "read-tree", "rebase", "receive-pack", "reflog", "refs", "remote", "remote-ext", "remote-fd", "repack",
          \t\t"replace", "replay", "rerere", "reset", "restore", "rev-list", "rev-parse", "revert", "rm", "send-pack", "shortlog", "show",
          \t\t"show-branch", "show-index", "show-ref", "sparse-checkout", "stage", "stash", "status", "stripspace", "submodule--helper", "switch",
          \t\t"symbolic-ref", "tag", "unpack-file", "unpack-objects", "update-index", "update-ref", "update-server-info", "upload-archive",
          \t\t"upload-archive--writer", "upload-pack", "var", "verify-commit", "verify-pack", "verify-tag", "version", "whatchanged", "worktree", "write-tree":
          \t\treturn true
          \tdefault:
          \t\treturn false
          \t}
          }

          '''
          replace(
              "glm-worker/internal/parentactioncmd/publication_pretool.go",
              "func publicationGitNoVerify(argv []publicationShellWord) bool {\n",
              builtins + "func publicationGitNoVerify(argv []publicationShellWord) bool {\n",
          )

          replace(
              "glm-worker/internal/parentactioncmd/publication_pretool_test.go",
              '''\t\t"script -c 'git push origin main --no-verify' /dev/null",
          ''',
              '''\t\t"script -c 'git push origin main --no-verify' /dev/null",
          \t\t"git escape",
          \t\t"git -c alias.escape='commit -n' escape -m bypass",
          \t\t"GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=alias.escape GIT_CONFIG_VALUE_0='commit -n' git escape -m bypass",
          ''',
          )
          replace(
              "glm-worker/internal/parentactioncmd/publication_pretool_test.go",
              '''\t\t"git push -n origin main",
          ''',
              '''\t\t"git push -n origin main",
          \t\t"git status --short",
          \t\t"git rev-parse HEAD",
          \t\t"git commit -m safe",
          ''',
          )
          PY
          gofmt -w glm-worker/internal/parentactioncmd/publication_pretool.go glm-worker/internal/parentactioncmd/publication_pretool_test.go
      - name: Focused validation
        working-directory: glm-worker
        run: go test ./internal/parentactioncmd
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'web-gpt-review-fix'
          git config user.email 'web-gpt-review-fix@users.noreply.github.com'
          git rm .github/workflows/web-gpt-alias-followup.yml
          git add glm-worker/internal/parentactioncmd/publication_pretool.go glm-worker/internal/parentactioncmd/publication_pretool_test.go
          git commit -m 'Fail closed on ambiguous Git subcommands'
          git push origin HEAD:web-gpt/review-fix/91cc885-6682699
