name: Fixed Range Review Validation

on:
  push:
    branches:
      - review-fix/75ef77a-0dc7a50

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read Go version
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Formatter
        run: test -z "$(gofmt -l glm-worker/internal/parentactioncmd/guard_repair.go glm-worker/internal/parentactioncmd/guard_repair_resume_error_test.go)"
      - name: Repository lint
        run: ./harnesslint
      - name: Targeted regression test
        working-directory: glm-worker
        run: go test ./internal/parentactioncmd -run '^TestResumeWithRepairedWorkerDoesNotCompleteFailedResume$'
      - name: Go vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Go build
        working-directory: glm-worker
        run: go build ./...
      - name: Full Go test suite
        working-directory: glm-worker
        run: go test ./...
