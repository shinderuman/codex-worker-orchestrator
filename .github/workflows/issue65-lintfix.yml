name: Issue 65 Lintfix

on:
  push:
    branches:
      - gpt/issue-65-attributable-quality

permissions:
  contents: write

jobs:
  lintfix:
    if: ${{ contains(github.event.head_commit.message, 'lintfix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/issue-65-attributable-quality
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Rebuild implementation and apply lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/issue65-finalize.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(text) if line == '      - name: Rebuild implementation and align tests')
          run = next(i for i in range(start + 1, len(text)) if text[i] == '        run: |')
          end = next(i for i in range(run + 1, len(text)) if text[i] == '      - name: Validate')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in text[run + 1:end]) + '\n'
          Path('/tmp/issue65-finalize.sh').write_text(body)
          PY
          bash /tmp/issue65-finalize.sh

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              return text.replace(old, new, 1)

          p = Path('glm-worker/internal/app/routingeval.go')
          s = p.read_text()
          s = replace_once(s,
              '\t"os"\n\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"',
              '\t"os"\n\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/packet"\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"',
              'packet import')
          s = replace_once(s, 'case "PASS":', 'case string(packet.StatusPass):', 'PASS status')
          s = replace_once(s, 'case "FIX_REQUIRED":', 'case string(packet.StatusFixRequired):', 'FIX_REQUIRED status')
          p.write_text(s)

          p = Path('glm-worker/internal/state/routingeval_test.go')
          s = p.read_text()
          old = '''\tlogs := append(left, routingSufficientFixture("78787878", "haiku", "glm-4.7", "HIGH", RoundDeltaSemantic, base)...)
          \treport := BuildModelRoutingReport(logs)'''
          new = '''\tleft = append(left, routingSufficientFixture("78787878", "haiku", "glm-4.7", "HIGH", RoundDeltaSemantic, base)...)
          \treport := BuildModelRoutingReport(left)'''
          s = replace_once(s, old, new, 'appendAssign')
          p.write_text(s)
          PY

          gofmt -w glm-worker/internal/state/callstats.go glm-worker/internal/state/routingeval.go glm-worker/internal/state/routingeval_test.go glm-worker/internal/app/routingeval.go glm-worker/internal/app/routingeval_test.go
          git diff --check
      - name: Validate
        run: |
          (cd glm-worker && go test ./...)
          (cd glm-worker && go vet ./...)
          (cd glm-worker && go build ./...)
          rm -f .github/workflows/issue65-implement.yml .github/workflows/issue65-retry.yml .github/workflows/issue65-finalize.yml .github/workflows/issue65-lintfix.yml
          ./harnesslint
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/state/callstats.go glm-worker/internal/state/routingeval.go glm-worker/internal/state/routingeval_test.go glm-worker/internal/app/routingeval.go glm-worker/internal/app/routingeval_test.go
          git commit -m 'Implement issue 65 attributable quality'
          git push origin HEAD:gpt/issue-65-attributable-quality
