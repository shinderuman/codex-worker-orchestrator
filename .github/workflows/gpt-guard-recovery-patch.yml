name: GPT guard recovery validation

on:
  push:
    branches:
      - gpt/guard-failure-task-recovery

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Go test
        working-directory: glm-worker
        run: go test ./...
      - name: Go vet
        working-directory: glm-worker
        run: go vet ./...
