name: Temporary F4 Quality Evidence

on:
  push:
    branches:
      - hardening-task/quality-evidence-mutation-risk

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wire quality evidence risk floor
        run: |
          python3 .github/f4_patch.py
          gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/quality_evidence_test.go
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Workflow tests
        run: go -C glm-worker test ./internal/workflow
      - name: Workflow vet
        run: go -C glm-worker vet ./internal/workflow
      - name: Build all packages
        run: go -C glm-worker build ./...
      - name: Commit validated F4 wiring
        run: |
          rm .github/workflows/temporary-f4-quality-evidence.yml .github/f4_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/quality_evidence_test.go .github/workflows/temporary-f4-quality-evidence.yml .github/f4_patch.py
          git commit -m 'hardening: wire quality evidence risk floor'
          git push
