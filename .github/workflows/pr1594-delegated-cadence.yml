name: PR 1594 isolated module-cache cadence verification

on:
  push:
    branches:
      - 'web-gpt/pr1594-review-fixes'
    paths:
      - '.github/workflows/pr1594-delegated-cadence.yml'

permissions:
  contents: read

jobs:
  canonical-validation-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      GOMODCACHE: /home/runner/go/pkg/mod
      GOPATH: /home/runner/go
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-quality-go
      - name: Verify pinned offline lint Go toolchain
        run: GOTOOLCHAIN=go1.22.12 GOPROXY=off go version
      - name: Verify canonical validation cadence
        run: ./goquality test -tags=workflowintegration -run '^TestCanonicalValidationCadenceWithoutRuntimeRepair$' -count=1 -timeout=30m ./internal/app
