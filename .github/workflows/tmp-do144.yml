name: tmp do144 patch

on:
  push:
    branches:
      - gpt/do-144-go-cache

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/do-144-go-cache
          fetch-depth: 0
      - name: Read Go version
        id: go-version
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: false
      - name: Apply focused launcher patch
        run: |
          cat > goquality <<'EOF'
          #!/bin/sh
          set -eu
          repo_root=$(git rev-parse --show-toplevel)
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' "$repo_root/quality-tools.yml")
          export GOTOOLCHAIN="go$GO_VERSION"
          export GOCACHE="${TMPDIR:-/tmp}/codex-worker-orchestrator-go-$GO_VERSION"

          if [ "$#" -ne 1 ]; then
            echo "usage: $0 <vet|build>" >&2
            exit 2
          fi

          case "$1" in
            vet)
              exec go -C "$repo_root/glm-worker" vet ./...
              ;;
            build)
              exec go -C "$repo_root/glm-worker" build ./...
              ;;
            *)
              echo "usage: $0 <vet|build>" >&2
              exit 2
              ;;
          esac
          EOF
          chmod +x goquality

          python3 - <<'PY'
          from pathlib import Path
          p = Path('codex/instructions/quality-gate-capability.md')
          text = p.read_text()
          old = '`go vet ./...`、`go build ./...`、gofmt、`harnesslint`、`commentlint`、Shell lint、`git diff`等、追加capabilityを必要としないcommandはsandbox内で実行する。capability根拠のないcommandへ昇格権限を広げない。'
          new = '''`go vet ./...`・`go build ./...`相当の親final gateはrepository rootの固定入口`./goquality vet`・`./goquality build`をsandbox内で実行する。`goquality`は`quality-tools.yml`からrepository-authoritative Go versionを読み、`harnesslint`と同じ`${TMPDIR:-/tmp}`配下のdeterministic `GOCACHE`を使う。親Codexがtaskごとのcache pathを合成せず、homeのGo build cacheへ触るためだけにescalateしない。\n\ngofmt、`harnesslint`、`commentlint`、Shell lint、`git diff`等、その他の追加capabilityを必要としないcommandもsandbox内で実行する。capability根拠のないcommandへ昇格権限を広げない。'''
          if old not in text:
              raise SystemExit('quality gate instruction anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate fixed entrypoints
        run: |
          ./goquality vet
          ./goquality build
          (cd glm-worker && go test ./internal/workflow/... ./internal/harnesslint/...)
          git diff --check
      - name: Commit validated patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-do144.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add goquality codex/instructions/quality-gate-capability.md .github/workflows/tmp-do144.yml
          git commit -m "fix: sandbox parent vet and build cache"
          git push origin HEAD:gpt/do-144-go-cache
