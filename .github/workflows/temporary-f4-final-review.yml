name: Temporary F4 Final Review

on:
  push:
    branches:
      - hardening-task/quality-evidence-mutation-risk

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply final false-positive fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/workflow/quality_evidence.go')
          text = path.read_text()
          old = '''\t\tcase *ast.CallExpr:\n\t\t\tsignatures = append(signatures, "call:"+normalizeGoEvidenceNode(value))\n\t\t\tif selector, ok := value.Fun.(*ast.SelectorExpr); ok && selector.Sel.Name == "Run" {\n\t\t\t\tsignatures = append(signatures, "subtest")\n\t\t\t}\n'''
          new = '''\t\tcase *ast.CallExpr:\n\t\t\tif isGoFailureCall(value) {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tif selector, ok := value.Fun.(*ast.SelectorExpr); ok && selector.Sel.Name == "Run" {\n\t\t\t\tsignatures = append(signatures, "subtest:"+goSubtestEvidence(value))\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tsignatures = append(signatures, "call:"+normalizeGoEvidenceNode(value))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'call evidence anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          anchor = '''func goNodeContainsFailure(node ast.Node) bool {'''
          helper = '''func goSubtestEvidence(call *ast.CallExpr) string {\n\tif len(call.Args) == 0 {\n\t\treturn "<missing-name>"\n\t}\n\treturn normalizeGoEvidenceNode(call.Args[0])\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'helper anchor count={text.count(anchor)}')
          path.write_text(text.replace(anchor, helper + anchor, 1))

          test_path = Path('glm-worker/internal/workflow/quality_evidence_test.go')
          tests = test_path.read_text()
          anchor = '''func TestQualityEvidenceNegativeCaseDeletionRaisesRisk(t *testing.T) {'''
          insert = '''func TestQualityEvidenceFailureMessageChangeStaysLow(t *testing.T) {\n\tbase := qualityEvidenceGoTest("got", "1", true)\n\troot, baseline := newQualityEvidenceRepo(t, base)\n\twriteGitTestFile(t, root, "sample_test.go", strings.Replace(base, "got %d", "value %d", 1))\n\tdecision := qualityEvidenceDecisionForTest(t, root, baseline)\n\tif decision.High {\n\t\tt.Fatalf("failure message change raised risk: %#v", decision)\n\t}\n}\n\nfunc TestQualityEvidenceSubtestFailureMessageChangeStaysLow(t *testing.T) {\n\tbase := qualityEvidenceSubtests(true)\n\troot, baseline := newQualityEvidenceRepo(t, base)\n\twriteGitTestFile(t, root, "sample_test.go", strings.Replace(base, `t.Fatal("negative")`, `t.Fatal("details")`, 1))\n\tdecision := qualityEvidenceDecisionForTest(t, root, baseline)\n\tif decision.High {\n\t\tt.Fatalf("subtest failure message change raised risk: %#v", decision)\n\t}\n}\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'test anchor count={tests.count(anchor)}')
          test_path.write_text(tests.replace(anchor, insert + anchor, 1))
          PY
          gofmt -w glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/quality_evidence_test.go
      - name: Workflow tests
        run: go -C glm-worker test ./internal/workflow
      - name: Workflow vet
        run: go -C glm-worker vet ./internal/workflow
      - name: Build packages
        run: go -C glm-worker build ./...
      - name: Commit validated final review fix
        run: |
          rm .github/workflows/temporary-f4-final-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/quality_evidence_test.go .github/workflows/temporary-f4-final-review.yml
          git commit -m 'hardening: avoid mechanical test-message risk escalation'
          git push
