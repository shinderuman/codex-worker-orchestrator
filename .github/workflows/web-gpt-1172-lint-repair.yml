name: Web GPT 1172 lint repair

on:
  push:
    branches:
      - web-gpt/1172-review-target-shadow-evidence
    paths:
      - .github/workflows/web-gpt-1172-lint-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1172-review-target-shadow-evidence
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Apply lint repair and clean temporary files
        run: |
          python3 .github/web-gpt-1172-lint-repair.py
          gofmt -w glm-worker/internal/shadoweval/input.go
          cd glm-worker
          go test ./internal/shadoweval
          cd ..
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/shadoweval/input.go
          git rm .github/web-gpt-1172-lint-repair.py .github/workflows/web-gpt-1172-lint-repair.yml
          git commit -m "fix: simplify shadow evidence priority classification"
          git push origin HEAD:web-gpt/1172-review-target-shadow-evidence
