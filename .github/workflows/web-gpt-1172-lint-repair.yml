name: Web GPT 1172 lint repair

on:
  push:
    branches:
      - web-gpt/1172-review-target-shadow-evidence
    paths:
      - .github/workflows/web-gpt-1172-lint-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1172-review-target-shadow-evidence
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Reduce bounded selector complexity and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/shadoweval/input.go')
          text = path.read_text()
          old = '''func eventEvidencePriority(record state.TaskEventRecord) int {
\tif record.IsError || validationHasCorrectnessSignal(record.Validation) {
\t\treturn 3
\t}
\thasValidation := record.Validation != nil
\thasOperation := len(record.SearchPaths) > 0
\tfor _, block := range record.Blocks {
\t\tif block.IsError {
\t\t\treturn 3
\t\t}
\t\tif block.OperationCategory != "" {
\t\t\thasOperation = true
\t\t}
\t\tif len(block.Validation) > 0 {
\t\t\thasValidation = true
\t\t}
\t\tfor _, observation := range block.Validation {
\t\t\tif validationResultHasCorrectnessSignal(observation.Result) {
\t\t\t\treturn 3
\t\t\t}
\t\t}
\t}
\tif hasValidation {
\t\treturn 2
\t}
\tif hasOperation {
\t\treturn 1
\t}
\treturn 0
}
'''
          new = '''func eventEvidencePriority(record state.TaskEventRecord) int {
\tif record.IsError || validationHasCorrectnessSignal(record.Validation) {
\t\treturn 3
\t}
\tpriority := 0
\tif record.Validation != nil {
\t\tpriority = 2
\t} else if len(record.SearchPaths) > 0 {
\t\tpriority = 1
\t}
\tfor _, block := range record.Blocks {
\t\tblockPriority := eventBlockPriority(block)
\t\tif blockPriority == 3 {
\t\t\treturn 3
\t\t}
\t\tif blockPriority > priority {
\t\t\tpriority = blockPriority
\t\t}
\t}
\treturn priority
}

func eventBlockPriority(block state.TaskBlockSummary) int {
\tif block.IsError {
\t\treturn 3
\t}
\tfor _, observation := range block.Validation {
\t\tif validationResultHasCorrectnessSignal(observation.Result) {
\t\t\treturn 3
\t\t}
\t}
\tif len(block.Validation) > 0 {
\t\treturn 2
\t}
\tif block.OperationCategory != "" {
\t\treturn 1
\t}
\treturn 0
}
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one eventEvidencePriority, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w glm-worker/internal/shadoweval/input.go
          cd glm-worker
          go test ./internal/shadoweval
          cd ..
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/shadoweval/input.go
          git rm .github/workflows/web-gpt-1172-lint-repair.yml
          git commit -m "fix: simplify shadow evidence priority classification"
          git push origin HEAD:web-gpt/1172-review-target-shadow-evidence
