name: Temporary F10 Wiring
on:
  push:
    branches:
      - hardening-task/exhaustive-search-gate
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
      - name: Apply F10 production wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('glm-worker/internal/workflow/workflow.go')
          s = p.read_text()
          reps = [
            (
              '\t\tprompt := w.newWorkerTaskPrompt(request, activeTaskPath)\n',
              '\t\tprompt := w.newWorkerTaskPrompt(request, activeTaskPath)\n\t\texhaustiveContext, err := w.exhaustiveSearchContext(request, activeTaskPath, state.WorkerRole, 1)\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t\tprompt += exhaustiveContext\n'
            ),
            (
              '\t\tprompt := decisionPrompt(request, decision, activeTaskPath)\n',
              '\t\tprompt := decisionPrompt(request, decision, activeTaskPath)\n\t\texhaustiveContext, err := w.exhaustiveSearchContext(request, activeTaskPath, state.WorkerRole, 1)\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t\tprompt += exhaustiveContext\n'
            ),
            (
              '\t\tprompt := explicitFixPrompt(request, decision, review, instruction, activeTaskPath)\n',
              '\t\tprompt := explicitFixPrompt(request, decision, review, instruction, activeTaskPath)\n\t\texhaustiveContext, err := w.exhaustiveSearchContext(request, activeTaskPath, state.WorkerRole, 1)\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t\tprompt += exhaustiveContext\n'
            ),
          ]
          for old, new in reps:
            if old not in s:
              raise SystemExit(f'missing wiring anchor: {old!r}')
            s = s.replace(old, new, 1)
          old = '\treviewNavigation := w.reviewerDiffFirstContext(request, reviewNumber)\n\tprompt := reviewerPrompt(\n'
          new = '\treviewNavigation := w.reviewerDiffFirstContext(request, reviewNumber)\n\texhaustiveNavigation, err := w.exhaustiveSearchContext(request, activeTaskPath, state.ReviewerRole, reviewNumber+1)\n\tif err != nil {\n\t\treturn state.ResumeCheckpoint{}, "", false, err\n\t}\n\treviewNavigation += exhaustiveNavigation\n\tprompt := reviewerPrompt(\n'
          if old not in s:
            raise SystemExit('missing reviewer wiring anchor')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/exhaustive_search.go glm-worker/internal/reposearch/exhaustive.go glm-worker/internal/reposearch/exhaustive_test.go
      - name: Validate
        working-directory: glm-worker
        run: |
          go test ./internal/reposearch ./internal/workflow
          go test -race ./internal/reposearch ./internal/workflow
          go vet ./...
          go build ./...
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/exhaustive_search.go glm-worker/internal/reposearch/exhaustive.go glm-worker/internal/reposearch/exhaustive_test.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: wire exhaustive search proof into model dispatch'
          git push origin HEAD:hardening-task/exhaustive-search-gate
