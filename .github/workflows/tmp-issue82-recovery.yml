name: Temporary Issue 82 Recovery

on:
  push:
    branches:
      - gpt/accept-completes-82

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/accept-completes-82
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Patch
        run: python3 .github/issue82_recover_patch.py
      - name: Format
        working-directory: glm-worker
        run: gofmt -w internal/state/parent_accept.go internal/app/output.go
      - name: Test
        working-directory: glm-worker
        run: go test ./...
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/state/parent_accept.go glm-worker/internal/app/output.go
          git diff --cached --quiet && exit 0
          git commit -m 'Make parent accept retry-safe'
          git push origin HEAD:gpt/accept-completes-82
