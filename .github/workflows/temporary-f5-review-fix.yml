name: Temporary F5 Review Fix

on:
  push:
    branches:
      - hardening-task/deterministic-rule-activation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply review fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/workflow/rule_activation.go')
          text = path.read_text()
          old = '''var stateRuleTokens = map[string]struct{}{
          \t"state": {}, "states": {}, "config": {}, "configs": {}, "configuration": {},
          \t"cache": {}, "caches": {}, "migration": {}, "migrations": {},
          }

          var cliRuleTokens = map[string]struct{}{
          \t"cmd": {}, "cli": {}, "bin": {}, "command": {}, "commands": {},
          }
          '''.replace('          ', '')
          new = '''var stateRuleTokens = map[string]struct{}{
          \t"state": {}, "states": {}, "config": {}, "configs": {}, "configuration": {},
          \t"setting": {}, "settings": {}, "cache": {}, "caches": {},
          \t"migration": {}, "migrations": {}, "upgrade": {}, "upgrades": {},
          \t"manifest": {}, "manifests": {}, "sidecar": {}, "sidecars": {},
          \t"persistent": {}, "persistence": {}, "storage": {}, "store": {},
          \t"database": {}, "databases": {}, "db": {},
          }

          var cliRuleTokens = map[string]struct{}{
          \t"cmd": {}, "cli": {}, "bin": {}, "command": {}, "commands": {},
          \t"flag": {}, "flags": {}, "arg": {}, "args": {}, "argv": {},
          \t"option": {}, "options": {}, "subcommand": {}, "subcommands": {},
          }
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('rule token anchor not found')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('glm-worker/internal/workflow/rule_activation_test.go')
          tests = test_path.read_text()
          anchor = 'func TestRequiredWorkerRulesDoNotRouteStateFromTestPackageName(t *testing.T) {'
          addition = r'''func TestRequiredWorkerRulesCoverPersistentAndCLIAliases(t *testing.T) {
          \ttests := []struct {
          \t\tname string
          \t\tpath string
          \t\twant workerRule
          \t}{
          \t\t{name: "settings", path: "internal/settings/loader.go", want: ruleStateTransitions},
          \t\t{name: "upgrade", path: "upgrade/schema.go", want: ruleStateTransitions},
          \t\t{name: "manifest", path: "internal/manifest/writer.go", want: ruleStateTransitions},
          \t\t{name: "sidecar", path: "internal/sidecar/file.go", want: ruleStateTransitions},
          \t\t{name: "storage", path: "internal/storage/record.go", want: ruleStateTransitions},
          \t\t{name: "database", path: "internal/database/query.go", want: ruleStateTransitions},
          \t\t{name: "flags", path: "internal/app/flags.go", want: ruleCLI},
          \t\t{name: "args", path: "internal/app/args.go", want: ruleCLI},
          \t\t{name: "options", path: "internal/app/options.go", want: ruleCLI},
          \t\t{name: "subcommand", path: "internal/app/subcommand.go", want: ruleCLI},
          \t}
          \tfor _, tt := range tests {
          \t\tt.Run(tt.name, func(t *testing.T) {
          \t\t\trules := requiredWorkerRules(t.TempDir(), []string{tt.path})
          \t\t\tif !slices.Contains(rules, tt.want) {
          \t\t\t\tt.Fatalf("rules = %v, missing %s for %s", rules, tt.want, tt.path)
          \t\t\t}
          \t\t})
          \t}
          }

          '''.replace('          ', '')
          if anchor not in tests:
              raise SystemExit('test anchor not found')
          test_path.write_text(tests.replace(anchor, addition + anchor, 1))
          PY
          gofmt -w glm-worker/internal/workflow/rule_activation.go glm-worker/internal/workflow/rule_activation_test.go
      - name: Focused tests
        working-directory: glm-worker
        run: go test ./internal/workflow ./internal/runner
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
      - name: Commit validated fixes
        run: |
          rm .github/workflows/temporary-f5-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/workflow/rule_activation.go glm-worker/internal/workflow/rule_activation_test.go .github/workflows/temporary-f5-review-fix.yml
          git commit -m 'fix: broaden deterministic rule routing'
          git push
