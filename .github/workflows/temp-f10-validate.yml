name: Temporary F10 Final Validation
on:
  push:
    branches:
      - hardening-task/exhaustive-search-gate
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
      - name: Validate F10
        working-directory: glm-worker
        run: |
          gofmt -d internal/reposearch/exhaustive.go internal/reposearch/exhaustive_test.go internal/workflow/exhaustive_search.go internal/workflow/exhaustive_search_test.go internal/workflow/workflow.go
          test -z "$(gofmt -l internal/reposearch/exhaustive.go internal/reposearch/exhaustive_test.go internal/workflow/exhaustive_search.go internal/workflow/exhaustive_search_test.go internal/workflow/workflow.go)"
          go test ./internal/reposearch ./internal/workflow
          go test -race ./internal/reposearch ./internal/workflow
          go vet ./...
          go build ./...
