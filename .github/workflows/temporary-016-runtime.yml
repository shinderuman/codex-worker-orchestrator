name: Temporary 016 Runtime Completion

on:
  push:
    branches:
      - hardening-task/worker-repo-search-integration

permissions:
  contents: write

jobs:
  runtime-016:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install quality prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate installed runtime
        run: |
          git branch -m hardening/agent-guardrails
          ./install.sh
          build_dir=$(mktemp -d)
          trap 'rm -rf "$build_dir"' EXIT
          cd glm-worker
          for name in glm-worker commentlint harnesslint merge-json; do
            go build -buildvcs=false -trimpath -o "$build_dir/$name" "./cmd/$name"
            cmp "$build_dir/$name" "$HOME/.local/bin/$name"
          done
          cd ..
          cmp codex/AGENTS.md "$HOME/.codex/AGENTS.md"
          cmp codex/glm-worker/prompts/WORKER.md "$HOME/.codex/glm-worker/prompts/WORKER.md"
          cmp codex/instructions/worker/go.md "$HOME/.codex/instructions/worker/go.md"
          "$HOME/.local/bin/glm-worker" --status > /tmp/glm-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/glm-status.json').read_text())
          if not isinstance(value, dict):
              raise SystemExit('installed --status did not return a JSON object')
          PY
          git branch -m hardening-task/worker-repo-search-integration
      - name: Record runtime evidence
        env:
          RUNTIME_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          run_id = os.environ['RUNTIME_RUN_ID']
          history_path = Path('IMPLEMENTATION_HISTORY.md')
          history = history_path.read_text()
          anchor = '既知target taskへの追加search/model/Sol callは0、target不明時の追加はlocal BM25 searchだけで追加Sol/Codex callは0。'
          replacement = anchor + f' runtime completion run `{run_id}`で`install.sh`本配置、`glm-worker`/`commentlint`/`harnesslint`/`merge-json`のsource rebuild一致、managed instruction/prompt一致、installed `glm-worker --status` JSON smokeをPASSした。'
          if anchor not in history:
              raise SystemExit('016 history runtime anchor missing')
          history_path.write_text(history.replace(anchor, replacement, 1))

          plan_path = Path('IMPLEMENTATION_PLAN.local.md')
          plan = plan_path.read_text()
          old_current = '- current implementation: 016 `worker-repo-search-integration`はproduction routing、独立review修正、恒久Repository Lint `33121225295`までCOMPLETE。F9 `017-reviewer-diff-first-search.md`をACTIVEへ昇格したが、PR #22のruntime completion・final lint・Squash Merge完了まではF9実装を開始しない'
          new_current = f'- current implementation: 016 `worker-repo-search-integration`はproduction routing、独立review修正、恒久Repository Lint `33121225295`、completion metadata lint `33121393248`、runtime completion `{run_id}`までCOMPLETE。F9 `017-reviewer-diff-first-search.md`をACTIVEへ昇格済みで、PR #22のfinal lint・Squash Merge完了まではF9実装を開始しない'
          if old_current not in plan:
              raise SystemExit('plan current implementation runtime anchor missing')
          plan = plan.replace(old_current, new_current, 1)
          old_stop = '016実装は完了し、PR #22のruntime completion / final lint / Squash Merge待ち。F9はACTIVEへ昇格済みだが016 integration完了までは実装開始しない。'
          new_stop = '016実装・runtime completionは完了し、PR #22のfinal Repository Lint / Squash Merge待ち。F9はACTIVEへ昇格済みだが016 integration完了までは実装開始しない。'
          if old_stop not in plan:
              raise SystemExit('plan stop runtime anchor missing')
          plan = plan.replace(old_stop, new_stop, 1)
          old_next = '016 completion treeでinstall.sh本配置・source equality・installed smokeを確認し、runtime evidenceをPlan/Historyへ同期、final Repository Lint後にPR #22をReady化してSquash Mergeする。その後F9専用branchへlatest integrationを履歴を書き換えず同期する。'
          new_next = 'runtime evidence記録後のfinal completion treeを恒久Repository Lintで確認し、PR #22本文をcompletion evidenceへ同期、Ready化してSquash Mergeする。その後F9専用branchへlatest integrationを履歴を書き換えず同期する。'
          if old_next not in plan:
              raise SystemExit('plan next runtime anchor missing')
          plan_path.write_text(plan.replace(old_next, new_next, 1))
          PY
      - name: Commit runtime evidence
        run: |
          rm .github/workflows/temporary-016-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record 016 runtime evidence'
          git push origin HEAD:hardening-task/worker-repo-search-integration
