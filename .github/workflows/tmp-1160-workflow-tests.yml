name: Temporary #1160 workflow test redistribution

on:
  push:
    branches:
      - web-gpt/1160-codex-working-set

permissions:
  contents: write

jobs:
  redistribute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1160-codex-working-set
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
          cache: false
      - name: Move tests to semantic owners
        shell: bash
        run: |
          cat >/tmp/move_funcs.go <<'GO'
          package main

          import (
              "fmt"
              "go/ast"
              "go/parser"
              "go/token"
              "os"
              "sort"
              "strings"
          )

          type move struct {
              start  int
              end    int
              name   string
              target string
              text   string
          }

          func main() {
              source := "glm-worker/internal/workflow/workflow_test.go"
              targetFor := map[string]string{}
              add := func(target string, names ...string) {
                  for _, name := range names { targetFor[name] = target }
              }

              add("glm-worker/internal/workflow/model_call_telemetry_test.go",
                  "TestRunModelRecordsPromptResponseAndUsage",
                  "TestRunModelCanOmitTelemetryContent",
              )
              add("glm-worker/internal/workflow/result_correction_test.go",
                  "constraintViolatingImplementedPacket",
                  "oversizeImplementedPacket",
                  "TestBoundedTextKeepsSingleLineFieldContract",
                  "TestRunModelCorrectsInvalidResultInSameRunner",
                  "TestRunModelFailsClosedOnStructuredMismatch",
                  "TestRunModelFailsClosedOnStructuredOutputError",
                  "TestExecuteEmitsAcceptedResultExactlyOnce",
                  "TestEmitResultRecordsEmittedPayloadBytes",
                  "TestRunModelStopsAfterRepeatedConstraintViolations",
                  "TestRunModelPreservesResultCorrectionAcrossRateLimit",
                  "TestRunModelCorrectsArtifactOutsideTaskDir",
                  "TestRunModelPreservesResultCorrectionPromptAcrossRateLimit",
                  "TestRetryPromptsDelegatePacketGrammar",
                  "TestFixRequiredTargetsPacketDispatchesReportOnlyPrompt",
                  "TestFixRequiredOtherTargetsKeepsImplementationAutoFix",
                  "TestFixRequiredWithoutTargetsCorrectsBeforeAutoFix",
                  "TestNeedsSolDecisionWithoutTargetsCorrectsBeforeParentDispatch",
                  "TestFixRequiredBlankTargetsElementCorrectsBeforeAutoFix",
                  "TestNeedsSolDecisionMixedNoneTargetsCorrectsBeforeParentDispatch",
                  "TestNeedsSolReviewNoneElementCorrectsBeforeSolReviewDispatch",
              )
              add("glm-worker/internal/workflow/risk_floor_test.go",
                  "TestHighRiskWorkerUsesHighRiskReviewer",
                  "TestReviewNeedsHighRiskFloor",
                  "TestRiskFloorFailClosedPacketIsValid",
                  "TestResolveRiskFloorReemitAcceptsCompliantAndFailsClosed",
                  "TestRiskFloorRejectsPassOnHighRiskWorker",
                  "TestRiskFloorRejectsPassAfterDecision",
                  "TestRiskFloorRejectsPassAfterAutoFix",
                  "TestRiskFloorRejectsPassAfterExplicitFix",
                  "TestRiskFloorRejectsPassAfterResume",
                  "TestRiskFloorAllowsLowRiskPass",
                  "TestRiskFloorReemitFailClosedOnRepeatedPass",
                  "TestRiskFloorReemitResumeCompliant",
                  "TestRiskFloorReemitResumeFailClosed",
              )

              data, err := os.ReadFile(source)
              if err != nil { panic(err) }
              fset := token.NewFileSet()
              file, err := parser.ParseFile(fset, source, data, parser.ParseComments)
              if err != nil { panic(err) }

              var moves []move
              seen := map[string]bool{}
              byTarget := map[string][]move{}
              for _, decl := range file.Decls {
                  fn, ok := decl.(*ast.FuncDecl)
                  if !ok { continue }
                  target, ok := targetFor[fn.Name.Name]
                  if !ok { continue }
                  start := fset.Position(fn.Pos()).Offset
                  end := fset.Position(fn.End()).Offset
                  m := move{start:start, end:end, name:fn.Name.Name, target:target, text:string(data[start:end])}
                  moves = append(moves, m)
                  byTarget[target] = append(byTarget[target], m)
                  seen[fn.Name.Name] = true
              }
              for name := range targetFor {
                  if !seen[name] { panic(fmt.Sprintf("requested function not found: %s", name)) }
              }

              sort.Slice(moves, func(i, j int) bool { return moves[i].start > moves[j].start })
              remaining := append([]byte(nil), data...)
              for _, m := range moves {
                  remaining = append(remaining[:m.start], remaining[m.end:]...)
              }
              if err := os.WriteFile(source, remaining, 0o644); err != nil { panic(err) }

              targets := make([]string, 0, len(byTarget))
              for target := range byTarget { targets = append(targets, target) }
              sort.Strings(targets)
              for _, target := range targets {
                  group := byTarget[target]
                  sort.Slice(group, func(i, j int) bool { return group[i].start < group[j].start })
                  fragments := make([]string, 0, len(group))
                  for _, m := range group { fragments = append(fragments, strings.TrimSpace(m.text)) }
                  existing, err := os.ReadFile(target)
                  if os.IsNotExist(err) {
                      existing = []byte("package workflow\n")
                  } else if err != nil { panic(err) }
                  out := strings.TrimRight(string(existing), "\n") + "\n\n" + strings.Join(fragments, "\n\n") + "\n"
                  if err := os.WriteFile(target, []byte(out), 0o644); err != nil { panic(err) }
              }
          }
          GO
          go run /tmp/move_funcs.go
          go run golang.org/x/tools/cmd/goimports@v0.38.0 -w \
            glm-worker/internal/workflow/workflow_test.go \
            glm-worker/internal/workflow/result_correction_test.go \
            glm-worker/internal/workflow/model_call_telemetry_test.go \
            glm-worker/internal/workflow/risk_floor_test.go
          gofmt -w \
            glm-worker/internal/workflow/workflow_test.go \
            glm-worker/internal/workflow/result_correction_test.go \
            glm-worker/internal/workflow/model_call_telemetry_test.go \
            glm-worker/internal/workflow/risk_floor_test.go
          git diff --check
          wc -l \
            glm-worker/internal/workflow/workflow_test.go \
            glm-worker/internal/workflow/result_correction_test.go \
            glm-worker/internal/workflow/model_call_telemetry_test.go \
            glm-worker/internal/workflow/risk_floor_test.go
      - name: Targeted workflow validation
        working-directory: glm-worker
        run: go test ./internal/workflow
      - name: Commit redistribution and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-1160-workflow-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: redistribute workflow semantic tests'
          git push origin HEAD:web-gpt/1160-codex-working-set
