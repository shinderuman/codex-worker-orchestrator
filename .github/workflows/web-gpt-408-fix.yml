name: Web GPT Issue 408 Ownership Fix

on:
  push:
    branches:
      - web-gpt/issue-408-codex-install-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tmp_issue408_fix.py
      - name: Format
        run: |
          cd glm-worker
          gofmt -w cmd/codex-install/main.go internal/codexinstallcmd/run.go internal/codexinstall/*.go
      - name: Commit patch
        run: |
          rm -f tmp_issue408_fix.py .github/workflows/web-gpt-408-fix.yml
          git diff --check
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m 'Fix Codex install ownership migration for Issue 408'
          git push origin HEAD:web-gpt/issue-408-codex-install-ownership
