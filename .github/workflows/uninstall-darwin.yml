name: Uninstall Darwin Acceptance

on:
  pull_request:
    paths:
      - 'glm-worker/internal/uninstallcmd/**'
      - 'glm-worker/internal/codexinstall/**'
      - 'glm-worker/internal/cliinstall/**'
      - 'glm-worker/internal/installlock/**'
      - 'glm-worker/internal/claudesettings/**'
      - 'glm-worker/internal/mergejsoncmd/**'
      - 'glm-worker/internal/claudeoverride/**'
      - 'glm-worker/go.mod'
      - 'glm-worker/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'install.sh'
      - 'scripts/manage-pull-hook.sh'
      - 'claude/settings-managed.json'
      - 'codex/**'
      - 'quality-tools.yml'
      - 'install-quality-tools.sh'
      - 'glm-worker/internal/pathalias/**'
      - 'glm-worker/internal/settingsmerge/**'
      - 'uninstall.sh'
      - 'tests/install_smoke.sh'
      - '.github/workflows/uninstall-darwin.yml'
  push:
    branches:
      - main
      - 'web-gpt/**'
    paths:
      - 'glm-worker/internal/uninstallcmd/**'
      - 'glm-worker/internal/codexinstall/**'
      - 'glm-worker/internal/cliinstall/**'
      - 'glm-worker/internal/installlock/**'
      - 'glm-worker/internal/claudesettings/**'
      - 'glm-worker/internal/mergejsoncmd/**'
      - 'glm-worker/internal/claudeoverride/**'
      - 'glm-worker/go.mod'
      - 'glm-worker/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'install.sh'
      - 'scripts/manage-pull-hook.sh'
      - 'claude/settings-managed.json'
      - 'codex/**'
      - 'quality-tools.yml'
      - 'install-quality-tools.sh'
      - 'glm-worker/internal/pathalias/**'
      - 'glm-worker/internal/settingsmerge/**'
      - 'uninstall.sh'
      - 'tests/install_smoke.sh'
      - '.github/workflows/uninstall-darwin.yml'

permissions:
  contents: read

concurrency:
  group: uninstall-darwin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uninstall-macos:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'web-gpt/') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read Go toolchain version
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Darwin uninstall regression
        working-directory: glm-worker
        run: go test -count=1 ./internal/uninstallcmd
      - name: Darwin uninstall race regression
        working-directory: glm-worker
        run: go test -race -count=1 ./internal/uninstallcmd
      - name: Install quality tools for smoke
        run: |
          quality_bin="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools"
          printf 'QUALITY_TOOLS_BIN_DIR=%s\n' "$quality_bin" >> "$GITHUB_ENV"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
      - name: Actual macOS /var/folders install-uninstall-reinstall
        run: ./tests/install_smoke.sh
      - name: Actual macOS /private/tmp baseline install-uninstall-reinstall
        env:
          TMPDIR: /private/tmp
        run: ./tests/install_smoke.sh
