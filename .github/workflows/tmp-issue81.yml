name: Temporary issue 81 validation

on:
  push:
    branches:
      - gpt/run-control-81

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/run-control-81
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Apply instruction boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          execution = Path('codex/instructions/glm-execution.md')
          text = execution.read_text()
          old = '- taskへの追加指示・Sol判断の内容・review指摘の範囲変更は、次の呼出前にtask fileのAmendmentsへ追記してから委譲する。USER_REQUEST・decision本文・fix本文だけで要求を差し替えない。task完了前のtask file削除・history移行・plan昇格は行わない。'
          new = '- user指示をACTIVE taskのdurable requirementへ反映する境界は`~/.codex/instructions/task-request-boundary.md`に従う。task完了前のtask file削除・history移行・plan昇格は行わない。'
          if text.count(old) != 1:
              raise SystemExit(f'glm-execution replacement count={text.count(old)}')
          execution.write_text(text.replace(old, new, 1))

          agents = Path('codex/AGENTS.md')
          text = agents.read_text()
          old = '- GLM実行・待機 → `~/.codex/instructions/glm-execution.md`'
          new = '- GLM実行・待機 → `~/.codex/instructions/glm-execution.md`\n- ACTIVE task開始・再開時のuser指示とrun-control分離 → `~/.codex/instructions/task-request-boundary.md`'
          if text.count(old) != 1:
              raise SystemExit(f'AGENTS replacement count={text.count(old)}')
          agents.write_text(text.replace(old, new, 1))

          Path('codex/instructions/task-request-boundary.md').write_text('''# ACTIVE task要求とrun-controlの分離\n\nACTIVE taskを開始・再開するとき、user messageをdurable task contractへ反映する境界にだけ適用する。\n\n## Durable requirement\n\n- `## Amendments`へ永続化するのは、task固有の要求・制約・Acceptance criteria・既存Sol判断の意味を変更するsemantic deltaだけとする。\n- semantic deltaは省略・要約で意味を落とさず、次のmodel call前にtask fileへ反映する。decision/fix本文だけでdurable requirementを差し替えない。\n- 既にACTIVE task fileへ置いたsubstantive requirementを`USER_REQUEST`へ重複転記しない。`USER_REQUEST`はtask要旨・task file参照と、その呼出に必要なrun-controlだけに留める。\n\n## Run control\n\n- start/resume許可、現在task後の停止境界、runtime preflight、待機・進捗報告、親Codexのreview/commit/Plan・History更新、最終報告形式は親orchestrationの実行状態であり、userがdurable task contractへ含めると明示した場合を除き`## Amendments`へコピーしない。\n- run-controlだけのmessageではtask fileを変更しない。\n- 1つのmessageにsemantic amendmentとrun-controlが混在する場合、semantic amendmentだけをlosslessに分離してtask fileへ反映し、message全体をamendmentとして転記しない。\n- user messageの意味を判定するためのgeneric classifier・追加model callは作らない。親Codexが通常の要求解釈として境界を判断する。\n\n## 境界例\n\n- `ACTIVE taskを開始し、完了したら次taskへ進まず結果を報告する`はrun-controlだけなのでtask fileを変更しない。\n- `ACTIVE taskを開始する。production test selectionは導入しない、をMust notへ追加する`は後半だけをdurable requirementとしてtask fileへ反映し、開始・停止・報告手順は転記しない。\n''')
          PY
      - name: Test
        working-directory: glm-worker
        run: go test ./...
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Commit instruction change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex/AGENTS.md codex/instructions/glm-execution.md codex/instructions/task-request-boundary.md
          git diff --cached --check
          git commit -m 'Separate task amendments from run control'
          git push origin HEAD:gpt/run-control-81
