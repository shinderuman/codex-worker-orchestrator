name: Temporary F1 Completion

on:
  push:
    branches:
      - hardening-task/instruction-surface-ownership

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Complete F1 metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plan_path = Path("IMPLEMENTATION_PLAN.local.md")
          plan = plan_path.read_text()
          old_schedule = """## ACTIVE

          - `IMPLEMENTATION_TASKS/instruction-surface-ownership.md`

          ## NEXT（優先順）

          - `IMPLEMENTATION_TASKS/unknown-production-surface-risk.md`
          """
          new_schedule = """## ACTIVE

          - `IMPLEMENTATION_TASKS/unknown-production-surface-risk.md`

          ## NEXT（優先順）

          """
          if old_schedule not in plan:
              raise SystemExit("expected F1 ACTIVE schedule not found")
          plan = plan.replace(old_schedule, new_schedule, 1)
          marker = "## 現在のGit境界"
          if marker not in plan:
              raise SystemExit("git boundary section not found")
          boundary = """## 現在のGit境界

          - branch: `hardening/agent-guardrails`
          - accepted main baseline: `815efc8f6601d344a93e8fa213d0227306db1f0d`
          - implementation boundary: PR #3 `6f08b301e9c4e1444af80c9b9ee646eb778a3baa`でrepository quality linter、PR #4 `b5a4f2e9fd4a3199470e9df0759c8b969f6813c5`でrepository-wide quality enforcement、PR #5 `21cb94b5f4b9800f8092f2e2f5afc276ad37ae62`でmetadata reconciliation、PR #6 `2c8bf5fe22b529dd446c65bd43b6a2289819730d`でPlan branch metadata修復、PR #7 `a111e0adc2d4f299e677f85148f34906d74e9c2c`でinstaller Homebrew hint、PR #9 `84e3baf18fc8d1c722682288c91ceb1623fd4e20`で恒久Repository Lint、PR #10 `815efc8f6601d344a93e8fa213d0227306db1f0d`でGreptile / CodeRabbit自動review停止をmainへ反映済み
          - preserved boundary: wake coalescing、machine output、safe-stop/resume、provider accounting、parent-managed metadata guard、GLM commit/push禁止、Direct Codex対orchestratedのCodex Reduction / Quality Delta最上位評価を維持
          - current implementation: F1 `instruction-surface-ownership`は`hardening-task/instruction-surface-ownership`のPR #8でproduction実装・回帰test・Actions validationまで完了し、`hardening/agent-guardrails`へのSquash Merge待ち。次ACTIVEは`unknown-production-surface-risk`
          - merge boundary: hardening taskは専用task branchへ細かくcheckpoint commit/pushし、taskごとに`hardening/agent-guardrails`向けPRをSquash Mergeして1 task = 1 integration commitとする。hardening campaign完了時はintegrationからmainへSquashしないmergeを行う

          ## 現在の停止理由

          F1はtask contractとvalidationを満たした。PR #8をintegrationへSquash MergeするまでF2 implementationは開始しない。

          ## 次の親Codex操作

          PR #8のcompletion metadata込み最終treeを恒久lintで確認して`hardening/agent-guardrails`へSquash Mergeする。その後integration HEADから`unknown-production-surface-risk`専用task branchを作成してF2を開始する。
          """
          plan = plan[:plan.index(marker)] + boundary
          plan_path.write_text(plan)

          next_task_path = Path("IMPLEMENTATION_TASKS/unknown-production-surface-risk.md")
          next_task = next_task_path.read_text()
          current_marker = "## Current boundary\n\n"
          if current_marker not in next_task:
              raise SystemExit("F2 current boundary not found")
          next_task = next_task[:next_task.index(current_marker)] + current_marker + "ACTIVE / NARROW。現mainで`glm-worker/internal/`と`glm-worker/cmd/`配下のproduction Goは新package名でもHIGHだが、既知prefix外の新しいproduction-like script / config / file type等は未分類LOWへ落ち得る残余failure classがある。F1のintegration squash完了後、known-safe LOWとunknown production-like surfaceを区別するTrack A / Track B境界から着手する。\n"
          next_task_path.write_text(next_task)

          history_path = Path("IMPLEMENTATION_HISTORY.md")
          history = history_path.read_text()
          evidence = "- [x] F1 instruction surface ownership: Track Aとして任意repo内の`AGENTS.md` / `AGENTS.local.md`（nested、tracked/ignoredを問わない）をtask-wide identityへ固定し、model call前の同一task mismatchをfail closed、call中の追加・変更・削除をpre-call snapshotへrestoreしてcallを失敗させ、instruction mutation検出時はworker/reviewer session identityを破棄して汚染sessionのresumeを防止した。instruction file symlinkはmutable external authorityを避けるためfail closedとし、通常source editはguard対象外、新taskでは親が選んだinstructionを新baselineとして受理する。Track Bとして本repoのroot/nested `AGENTS.md` / `AGENTS.local.md`をself-protection HIGH (`repo-instructions`)へ分類した。production entrypointはguarded runner factoryへ配線し、fake Claude subprocessが`AGENTS.local.md`を実変更するproduction-path regressionを含む。Actions run `33092397845`でrunner/workflow/app targeted tests、targeted vet、全package buildがPASSし、Repository Lint runs `33092246330`、`33092606205`、`33093034956`もPASSした。\n"
          if evidence not in history:
              with history_path.open("a") as stream:
                  stream.write("\n## 2026-08-28 hardening completion\n\n")
                  stream.write(evidence)

          Path("IMPLEMENTATION_TASKS/instruction-surface-ownership.md").unlink()
          PY
          rm .github/workflows/temporary-f1-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: complete instruction surface ownership task'
          git push origin "HEAD:${GITHUB_REF_NAME}"
