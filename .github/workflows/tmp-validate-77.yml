name: Temporary Validate 77

on:
  push:
    branches:
      - gpt/git-temp-root-77

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Format check
        working-directory: glm-worker
        run: test -z "$(gofmt -l internal/runner/git_authority_claude_wrapper.go internal/runner/git_authority_temp_root_test.go)"
      - name: Test
        working-directory: glm-worker
        run: go test ./...
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
