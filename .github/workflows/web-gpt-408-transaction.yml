name: Web GPT Issue 408 Transaction Patch

on:
  push:
    branches:
      - web-gpt/issue-408-codex-install-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tmp_issue408_transaction.py
      - name: Format
        run: |
          cd glm-worker
          gofmt -w internal/harnesslint/process_stream.go internal/codexinstall/*.go
      - name: Commit patch
        run: |
          rm -f tmp_issue408_transaction.py .github/workflows/web-gpt-408-transaction.yml
          git diff --check
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m 'Make Codex install mutations rollback-safe for Issue 408'
          git push origin HEAD:web-gpt/issue-408-codex-install-ownership
