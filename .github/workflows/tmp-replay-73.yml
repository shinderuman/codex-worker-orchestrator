name: Temporary Replay 73

on:
  push:
    branches:
      - gpt/validation-evidence-73-replay

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/validation-evidence-73-replay
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Replay validated issue 73 diff
        shell: bash
        run: |
          git fetch origin gpt/validation-evidence-73
          git diff 62e1ea455b9851a551af072ed1617ca7bf56a29c..cad739dbdb222fd49fcc98f11e794d09de0541b9 -- \
            glm-worker/internal/app/install_smoke.go \
            glm-worker/internal/app/quality_gate.go \
            glm-worker/internal/app/validation_evidence_test.go \
            glm-worker/internal/runner/stream_events.go \
            glm-worker/internal/runner/validation_observation.go \
            glm-worker/internal/runner/validation_observation_test.go \
            glm-worker/internal/state/events.go \
            glm-worker/internal/state/validation.go \
            glm-worker/internal/state/validation_test.go > /tmp/issue73.patch
          git apply --3way /tmp/issue73.patch
          cd glm-worker
          gofmt -w internal/app/install_smoke.go internal/app/quality_gate.go internal/app/validation_evidence_test.go internal/runner/stream_events.go internal/runner/validation_observation.go internal/runner/validation_observation_test.go internal/state/events.go internal/state/validation.go internal/state/validation_test.go
          go test ./...
          go vet ./...
          go build ./...
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve task-attributable validation evidence'
          git push origin HEAD:gpt/validation-evidence-73-replay
