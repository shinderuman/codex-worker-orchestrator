name: Web GPT 364 Fix Module Fixture

on:
  push:
    branches:
      - web-gpt/364-quality-scope-fail-closed

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/364-quality-scope-fail-closed
          fetch-depth: 0
      - name: Add module identity to active fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/app/multirepo_process_test.go')
          text = path.read_text()
          old = '\t\t"glm-worker/internal/workflow/workflow.go",\n'
          new = '\t\t"glm-worker/go.mod",\n' + old
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('fixture insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/app/multirepo_process_test.go
          git commit -m 'test: include module identity in active process fixture'
          git push origin HEAD:web-gpt/364-quality-scope-fail-closed
