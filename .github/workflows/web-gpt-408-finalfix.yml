name: Web GPT Issue 408 Final Fix

on:
  push:
    branches:
      - web-gpt/issue-408-codex-install-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python3 tmp_issue408_finalfix.py
      - name: Format
        run: |
          cd glm-worker
          gofmt -w internal/codexinstall/*.go
      - name: Commit patch
        run: |
          rm -f tmp_issue408_finalfix.py .github/workflows/web-gpt-408-finalfix.yml
          git diff --check
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m 'Complete Issue 408 ownership regressions'
          git push origin HEAD:web-gpt/issue-408-codex-install-ownership
