name: Temporary F4 History

on:
  push:
    branches:
      - hardening-task/quality-evidence-mutation-risk

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Record F4 completion evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_HISTORY.md')
          text = path.read_text()
          anchor = '## 重大インシデント / 再オープン中\n\n'
          entry = '- [x] F4 quality evidence mutation risk: Track Aとして通常LOWのquality-evidence surfaceだけをbaseline差分で再分類し、Go testはAST由来signatureでassertion削除・negative case削除・expected behavior変更をHIGHへ昇格、test追加・identifier rename・同一evidence rename・failure messageだけの機械的変更はLOWを維持した。非Go text/fixtureはsignificant evidence unit数、JSON fixtureはparse後の構造unit数だけをgeneric coverage縮退signalとし、同数の機械的更新をSolへ上げない。Track Bとして現行`tests/parent-behavior-evals.json`をcase IDとcontract fieldsで比較し、status-only更新はLOW、case削除/contract変更/parse failureはHIGHへfail closed。quality evidence変更がない通常reviewでは追加baseline Git probeを行わずmodel callも追加しないためsteady-state Codex/Sol cost増加は0。evidence変更時だけlocal Git read + AST/JSON/text解析を追加する。production wiring run `33103239842`、cost run `33103429475`、non-Go narrowing run `33104521707`、lint-fix run `33105031225`でworkflow tests/vet/buildを通し、final Repository Lint `33105152483` PASS。final reviewで非Go exact-content比較とfailure message差分の不要HIGHを検出して狭め、初回Repository Lint `33104625687`のgocognit/goconst/errorlint 3 findingも解消した。\n'
          if anchor not in text:
              raise SystemExit('history anchor missing')
          if 'F4 quality evidence mutation risk:' not in text:
              text = text.replace(anchor, anchor + entry, 1)
          path.write_text(text)
          PY
      - name: Commit history evidence
        run: |
          rm .github/workflows/temporary-f4-history.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_HISTORY.md .github/workflows/temporary-f4-history.yml
          git commit -m 'chore: record F4 completion evidence'
          git push
