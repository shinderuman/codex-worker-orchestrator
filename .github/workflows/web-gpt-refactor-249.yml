name: web-gpt-refactor-249
on: push
permissions:
  contents: write
jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/refactor-249-telemetry-classification
      - run: python3 .github/web-gpt-refactor-249.py
      - run: gofmt -w glm-worker/internal/state/telemetry.go glm-worker/internal/state/coverage.go glm-worker/internal/state/telemetry_classification_test.go glm-worker/internal/app/bundle.go glm-worker/internal/app/bundle_telemetry_classification_test.go
      - name: Commit edit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/state/telemetry.go glm-worker/internal/state/coverage.go glm-worker/internal/state/telemetry_classification_test.go glm-worker/internal/app/bundle.go glm-worker/internal/app/bundle_telemetry_classification_test.go
          git commit -m 'refactor: centralize task-call telemetry classification'
          git push origin HEAD:web-gpt/refactor-249-telemetry-classification
