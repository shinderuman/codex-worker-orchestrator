name: GPT compaction event patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'gpt/compaction-event-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Read Go version
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Preserve sanitized compaction metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/state/events.go')
          text = path.read_text()
          old = 'type TaskEventUsage struct {\n\tInputTokens              int64 `json:"input_tokens,omitempty"`\n\tCacheCreationInputTokens int64 `json:"cache_creation_input_tokens,omitempty"`\n\tCacheReadInputTokens     int64 `json:"cache_read_input_tokens,omitempty"`\n\tOutputTokens             int64 `json:"output_tokens,omitempty"`\n}\n'
          new = old + '\ntype TaskCompactionSummary struct {\n\tTrigger                 string `json:"trigger,omitempty"`\n\tPreTokens               int64  `json:"pre_tokens,omitempty"`\n\tPostTokens              int64  `json:"post_tokens,omitempty"`\n\tCumulativeDroppedTokens int64  `json:"cumulative_dropped_tokens,omitempty"`\n\tDurationMS              int64  `json:"duration_ms,omitempty"`\n}\n'
          if text.count(old) != 1:
              raise SystemExit(f'events usage match count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '\tMessageModel  string             `json:"message_model,omitempty"`\n\tBlocks        []TaskBlockSummary `json:"blocks,omitempty"`'
          new = '\tMessageModel string                  `json:"message_model,omitempty"`\n\tCompaction  *TaskCompactionSummary `json:"compaction,omitempty"`\n\tBlocks      []TaskBlockSummary      `json:"blocks,omitempty"`'
          if text.count(old) != 1:
              raise SystemExit(f'events record match count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('glm-worker/internal/runner/stream_events.go')
          text = path.read_text()
          old = '\tUsage         *state.TaskEventUsage `json:"usage"`\n}'
          new = '\tUsage           *state.TaskEventUsage `json:"usage"`\n\tCompactMetadata *streamCompactMetadata `json:"compactMetadata"`\n}'
          if text.count(old) != 1:
              raise SystemExit(f'stream event match count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '\tcase "system":\n\t\trecord.MessageModel = event.Model'
          new = '\tcase "system":\n\t\trecord.MessageModel = event.Model\n\t\tif event.Subtype == "compact_boundary" {\n\t\t\trecord.Compaction = reduceCompactionMetadata(event.CompactMetadata)\n\t\t}'
          if text.count(old) != 1:
              raise SystemExit(f'system reducer match count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > glm-worker/internal/runner/compaction_events.go <<'EOF'
          package runner

          import "github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"

          type streamCompactMetadata struct {
          	Trigger                 string `json:"trigger"`
          	PreTokens               int64  `json:"preTokens"`
          	PostTokens              int64  `json:"postTokens"`
          	CumulativeDroppedTokens int64  `json:"cumulativeDroppedTokens"`
          	DurationMS              int64  `json:"durationMs"`
          }

          func reduceCompactionMetadata(metadata *streamCompactMetadata) *state.TaskCompactionSummary {
          	if metadata == nil {
          		return nil
          	}
          	return &state.TaskCompactionSummary{
          		Trigger:                 sanitizedCompactionTrigger(metadata.Trigger),
          		PreTokens:               metadata.PreTokens,
          		PostTokens:              metadata.PostTokens,
          		CumulativeDroppedTokens: metadata.CumulativeDroppedTokens,
          		DurationMS:              metadata.DurationMS,
          	}
          }

          func sanitizedCompactionTrigger(trigger string) string {
          	switch trigger {
          	case "auto", "manual":
          		return trigger
          	default:
          		return ""
          	}
          }
          EOF

          cat > glm-worker/internal/runner/compaction_events_test.go <<'EOF'
          package runner

          import (
          	"encoding/json"
          	"strings"
          	"testing"
          	"time"

          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"
          )

          func TestReduceStreamEventPreservesOnlySanitizedCompactionMetadata(t *testing.T) {
          	raw := []byte(`{"type":"system","subtype":"compact_boundary","content":"Conversation compacted","compactMetadata":{"trigger":"auto","preTokens":167257,"postTokens":15406,"durationMs":94025,"cumulativeDroppedTokens":151851,"preservedSegment":{"headUuid":"secret-head","anchorUuid":"secret-anchor"},"preservedMessages":{"uuids":["secret-message"]},"summary":"secret-summary"}}`)
          	record := reduceStreamEvent(raw, state.TaskEventRecord{TaskID: "task", CallID: "call"}, 1, time.Unix(1, 0).UTC())
          	if record.Kind != "system" || record.Subtype != "compact_boundary" || record.Compaction == nil {
          		t.Fatalf("compaction event = %#v", record)
          	}
          	got := record.Compaction
          	if got.Trigger != "auto" || got.PreTokens != 167257 || got.PostTokens != 15406 ||
          		got.DurationMS != 94025 || got.CumulativeDroppedTokens != 151851 {
          		t.Fatalf("compaction metadata = %#v", got)
          	}
          	encoded, err := json.Marshal(record)
          	if err != nil {
          		t.Fatal(err)
          	}
          	for _, forbidden := range []string{"secret-head", "secret-anchor", "secret-message", "secret-summary", "preservedSegment", "preservedMessages"} {
          		if strings.Contains(string(encoded), forbidden) {
          			t.Fatalf("sanitized event contains %q: %s", forbidden, encoded)
          		}
          	}
          }

          func TestReduceStreamEventDropsUnknownCompactionTrigger(t *testing.T) {
          	raw := []byte(`{"type":"system","subtype":"compact_boundary","compactMetadata":{"trigger":"provider-specific","preTokens":10}}`)
          	record := reduceStreamEvent(raw, state.TaskEventRecord{}, 1, time.Unix(1, 0).UTC())
          	if record.Compaction == nil || record.Compaction.Trigger != "" || record.Compaction.PreTokens != 10 {
          		t.Fatalf("compaction metadata = %#v", record.Compaction)
          	}
          }
          EOF

          gofmt -w glm-worker/internal/state/events.go glm-worker/internal/runner/stream_events.go glm-worker/internal/runner/compaction_events.go glm-worker/internal/runner/compaction_events_test.go
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/state/events.go glm-worker/internal/runner/stream_events.go glm-worker/internal/runner/compaction_events.go glm-worker/internal/runner/compaction_events_test.go
          git commit -m 'feat: retain sanitized compaction event metrics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Focused tests
        working-directory: glm-worker
        run: go test ./internal/runner ./internal/state -count=1
      - name: Full tests
        working-directory: glm-worker
        run: go test ./... -count=1
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
