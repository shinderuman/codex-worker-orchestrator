name: GPT guard recovery stop endpoint patch

on:
  push:
    branches:
      - gpt/guard-failure-task-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/guard-failure-task-recovery
          fetch-depth: 0
      - name: Configure bot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Patch stop endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/app/stop_endpoint.go')
          text = path.read_text()
          old = '''\t\tstate.TaskStatusRateLimited,\n\t\tstate.TaskStatusProviderUnavailable,\n\t\tstate.TaskStatusInterrupted:\n'''
          new = '''\t\tstate.TaskStatusRateLimited,\n\t\tstate.TaskStatusProviderUnavailable,\n\t\tstate.TaskStatusGuardRecoverable,\n\t\tstate.TaskStatusInterrupted:\n'''
          if new not in text:
              if old not in text: raise SystemExit('terminal status anchor missing')
              text = text.replace(old, new, 1)
          old = '''\treturn checkpoint.RateLimited || checkpoint.ProviderUnavailable || checkpoint.UserInterrupted\n'''
          new = '''\treturn checkpoint.RateLimited || checkpoint.ProviderUnavailable || checkpoint.UserInterrupted || checkpoint.GuardRecoverable\n'''
          if new not in text:
              if old not in text: raise SystemExit('resume availability anchor missing')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          gofmt -w glm-worker/internal/app/stop_endpoint.go
          git add glm-worker/internal/app/stop_endpoint.go
          git commit -m 'feat: expose guard recovery through stop endpoint'
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/gpt-guard-recovery-stop-endpoint.yml
          git commit -m 'chore: remove temporary stop endpoint patcher'
          git push origin HEAD:gpt/guard-failure-task-recovery
