name: GPT issue30 apply and validate

on:
  push:
    branches:
      - gpt/decision-boundary-enforcement

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/decision-boundary-enforcement
          fetch-depth: 0
      - name: Verify base and apply patch
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "ab55c51f798138f4aaecd57a95fcb7986d784bee"
          python3 .github/gpt/issue30_patch.py
          python3 .github/gpt/issue30_test_fix.py
          python3 .github/gpt/issue30_test_fix2.py
          python3 .github/gpt/issue30_test_fix3.py
          gofmt -w \
            glm-worker/internal/packet/schema.go \
            glm-worker/internal/packet/schema_test.go \
            glm-worker/internal/packet/validate.go \
            glm-worker/internal/packet/reviewer_decision_test.go \
            glm-worker/internal/runner/structured_test.go \
            glm-worker/internal/workflow/rule_activation.go \
            glm-worker/internal/workflow/workflow.go \
            glm-worker/internal/workflow/workflow_test.go \
            glm-worker/internal/workflow/decision_boundary_review.go \
            glm-worker/internal/workflow/decision_boundary_review_test.go
          rm -f \
            .github/gpt/issue30_patch.py \
            .github/gpt/issue30_test_fix.py \
            .github/gpt/issue30_test_fix2.py \
            .github/gpt/issue30_test_fix3.py \
            .github/workflows/gpt-issue30-apply.yml
          git add -A
          changed="$(git diff --cached --name-only origin/main | sort)"
          expected="$(printf '%s\n' \
            glm-worker/internal/packet/reviewer_decision_test.go \
            glm-worker/internal/packet/schema.go \
            glm-worker/internal/packet/schema_test.go \
            glm-worker/internal/packet/validate.go \
            glm-worker/internal/runner/structured_test.go \
            glm-worker/internal/workflow/decision_boundary_review.go \
            glm-worker/internal/workflow/decision_boundary_review_test.go \
            glm-worker/internal/workflow/rule_activation.go \
            glm-worker/internal/workflow/workflow.go \
            glm-worker/internal/workflow/workflow_test.go | sort)"
          test "$changed" = "$expected"
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.4
          cache: false
      - name: Focused tests
        working-directory: glm-worker
        run: go test ./internal/packet ./internal/runner ./internal/workflow -run 'Reviewer|DecisionBoundary|Task011PublicSurface|PassesRoleSchema' -count=1
      - name: Workflow package
        working-directory: glm-worker
        run: go test ./internal/workflow -count=1
      - name: Full tests
        working-directory: glm-worker
        run: go test ./... -count=1
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Repository lint
        run: ./harnesslint
      - name: Commit validated implementation
        env:
          REMOTE_HEAD: ${{ github.sha }}
        run: |
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git commit -m 'fix: enforce unresolved decision boundaries in review'
          git push --force-with-lease=refs/heads/gpt/decision-boundary-enforcement:$REMOTE_HEAD origin HEAD:refs/heads/gpt/decision-boundary-enforcement
