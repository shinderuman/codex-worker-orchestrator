name: Temporary issue 93 validation

on:
  push:
    branches:
      - gpt/blocking-wait-93

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/blocking-wait-93
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Apply blocking wait boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          agents = Path('codex/AGENTS.md')
          text = agents.read_text()
          old = '- GLM実行・待機 → `~/.codex/instructions/glm-execution.md`'
          new = '- GLM実行・待機 → `~/.codex/instructions/glm-execution.md`・`~/.codex/instructions/glm-wait.md`'
          if text.count(old) != 1:
              raise SystemExit(f'AGENTS replacement count={text.count(old)}')
          agents.write_text(text.replace(old, new, 1))

          Path('codex/instructions/glm-wait.md').write_text('''# GLM実行中の待機\n\n`glm-worker`の通常task・resume・review/fix/decisionを起動した後、processの完了を待つ間だけ適用する。\n\n- `~/.codex/config.toml`の`background_terminal_max_timeout=21600000`msを前提とし、起動済みprocessは利用可能な最大待機時間のblocking waitで待つ。\n- runningであることを確認するだけの定期status/process pollを行わない。状態が変わっていないことだけを伝えるuser-visible進捗報告も行わない。\n- 完了、Sol判断/review、guard stop、rate/provider stop、user割り込みなど意味のある状態変化で制御が戻った時点から次の処理へ進む。\n- tool sessionが中断した後の復旧、failure診断、制御復帰時の状態が曖昧な場合は、必要な`glm-worker --status`等を実行してよい。定期liveness確認の代用にはしない。\n- 待機のためのtimer、background watcher、追加model call、runtime telemetryは追加しない。\n''')
          PY
      - name: Test
        working-directory: glm-worker
        run: go test ./...
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Commit instruction change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex/AGENTS.md codex/instructions/glm-wait.md
          git diff --cached --check
          git commit -m 'Use blocking wait for running glm-worker calls'
          git push origin HEAD:gpt/blocking-wait-93
