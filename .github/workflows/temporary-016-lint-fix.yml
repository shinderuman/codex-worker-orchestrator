name: Temporary 016 Lint Fix

on:
  push:
    branches:
      - hardening-task/worker-repo-search-integration

permissions:
  contents: write

jobs:
  validate-016:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Remove obsolete constructor wrapper reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/workflow/workflow.go')
          s = path.read_text()
          s = s.replace('\t\trepoSearch:             defaultRepoSearch,\n', '', 1)
          path.write_text(s)
          PY
          gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/worker_repo_search.go
      - name: Validate production and repository harness
        run: |
          cd glm-worker
          go test ./internal/workflow ./internal/reposearch
          go test -race ./internal/workflow ./internal/reposearch
          go vet ./...
          go build ./...
          cd ..
          go run ./glm-worker/cmd/harnesslint
      - name: Commit clean lint fix
        run: |
          rm .github/workflows/temporary-016-lint-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy 016 repository lint'
          git push
