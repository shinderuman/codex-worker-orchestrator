name: Web GPT Validation

on:
  push:
    branches:
      - 'web-gpt/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-gpt-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.created == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools"
          printf 'QUALITY_TOOLS_BIN_DIR=%s\n' "$quality_bin" >> "$GITHUB_ENV"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
      - name: Repository lint gate
        run: ./harnesslint
      - name: Go vet gate
        run: ./goquality vet
      - name: Go build gate
        run: ./goquality build
      - name: Full Go test suite
        working-directory: glm-worker
        run: go test ./...
      - name: Installer smoke
        run: ./tests/install_smoke.sh
