name: Temporary F5 Runtime Validation

on:
  push:
    branches:
      - hardening-task/deterministic-rule-activation

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install required quality tools
        env:
          GOTOOLCHAIN: auto
        run: |
          command -v git
          command -v rsync
          command -v cmp
          command -v shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.7.0
      - name: Install runtime
        run: ./install.sh
      - name: Verify installed/source equality
        run: |
          build_dir=$(mktemp -d)
          trap 'rm -rf "$build_dir"' EXIT
          (
            cd glm-worker
            go build -buildvcs=false -trimpath -o "$build_dir/glm-worker" ./cmd/glm-worker
            go build -buildvcs=false -trimpath -o "$build_dir/commentlint" ./cmd/commentlint
            go build -buildvcs=false -trimpath -o "$build_dir/harnesslint" ./cmd/harnesslint
            go build -buildvcs=false -trimpath -o "$build_dir/merge-json" ./cmd/merge-json
          )
          for name in glm-worker commentlint harnesslint merge-json; do
            cmp "$build_dir/$name" "$HOME/.local/bin/$name"
          done
          cmp codex/AGENTS.md "$HOME/.codex/AGENTS.md"
          cmp codex/glm-worker/prompts/WORKER.md "$HOME/.codex/glm-worker/prompts/WORKER.md"
          cmp codex/instructions/worker/go.md "$HOME/.codex/instructions/worker/go.md"
      - name: Installed production smoke
        run: |
          output=$("$HOME/.local/bin/glm-worker" --status)
          printf '%s\n' "$output" | python3 -c 'import json,sys; value=json.load(sys.stdin); assert isinstance(value, dict)'
