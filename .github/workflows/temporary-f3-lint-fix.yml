name: Temporary F3 Lint Fix

on:
  push:
    branches:
      - hardening-task/glm-git-authority-enforcement

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refactor guard without behavior change
        run: |
          perl -0pi -e 's/\t"strconv"\n//' glm-worker/internal/runner/git_authority_guard.go
          python3 -c 'from pathlib import Path; p=Path("glm-worker/internal/runner/git_authority_guard.go"); s=p.read_text(); a=s.index("func (g *gitAuthorityGuard) applyChildEnv"); b=s.index("func (g *gitAuthorityGuard) verify()", a); p.write_text(s[:a]+s[b:])'
          cat > /tmp/verify.go <<'EOF'
          func (g *gitAuthorityGuard) verify() error {
          	if g == nil || !g.before.active {
          		return nil
          	}
          	attempts, err := readGitAuthorityAttempts(g.attemptLog)
          	if err != nil {
          		return &GitAuthorityGuardError{Stage: "read-blocked-attempts", Cause: err}
          	}
          	after, err := captureGitAuthoritySnapshot(g.realGit, g.repoRoot)
          	if err != nil {
          		return &GitAuthorityGuardError{Stage: "capture-after-call", Mutations: attempts, Cause: err}
          	}
          	snapshotMutations := gitAuthoritySnapshotMutations(g.before, after)
          	mutations := append(append([]string(nil), attempts...), snapshotMutations...)
          	mutations = uniqueSortedStrings(mutations)
          	if len(mutations) == 0 {
          		return nil
          	}
          	stage := "blocked-command"
          	if len(snapshotMutations) > 0 {
          		stage = "after-call-mutation"
          	}
          	return &GitAuthorityGuardError{Stage: stage, Mutations: mutations}
          }

          func gitAuthoritySnapshotMutations(before, after gitAuthoritySnapshot) []string {
          	mutations := make([]string, 0, 5)
          	if before.head != after.head {
          		mutations = append(mutations, "HEAD")
          	}
          	if before.symbolicHead != after.symbolicHead {
          		mutations = append(mutations, "symbolic-HEAD")
          	}
          	if before.refsDigest != after.refsDigest {
          		mutations = append(mutations, "refs")
          	}
          	if before.indexDigest != after.indexDigest {
          		mutations = append(mutations, "index")
          	}
          	if before.configDigest != after.configDigest {
          		mutations = append(mutations, "local-config")
          	}
          	return mutations
          }
          EOF
          python3 -c 'from pathlib import Path; p=Path("glm-worker/internal/runner/git_authority_guard.go"); s=p.read_text(); a=s.index("func (g *gitAuthorityGuard) verify()"); b=s.index("func (g *gitAuthorityGuard) cleanup()", a); r=Path("/tmp/verify.go").read_text()+"\n"; p.write_text(s[:a]+r+s[b:])'
          gofmt -w glm-worker/internal/runner/git_authority_guard.go
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Runner tests
        run: go -C glm-worker test ./internal/runner
      - name: Runner vet
        run: go -C glm-worker vet ./internal/runner
      - name: Build all packages
        run: go -C glm-worker build ./...
      - name: Commit validated lint fix
        run: |
          rm .github/workflows/temporary-f3-lint-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/runner/git_authority_guard.go .github/workflows/temporary-f3-lint-fix.yml
          git commit -m 'refactor: satisfy F3 repository lint'
          git push
