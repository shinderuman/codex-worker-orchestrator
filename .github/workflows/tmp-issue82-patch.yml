name: Temporary Issue 82 Patch

on:
  push:
    branches:
      - gpt/accept-completes-82

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/accept-completes-82
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Apply patch and validate
        run: |
          python3 .github/issue82_patch.py
          gofmt -w glm-worker/internal/app/output.go glm-worker/internal/app/parent_review_test.go
          (cd glm-worker && go test ./internal/app)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/app/output.go glm-worker/internal/app/parent_review_test.go
          git commit -m 'Complete accepted parent reviews'
          git push origin HEAD:gpt/accept-completes-82
