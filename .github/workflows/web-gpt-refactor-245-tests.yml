name: web-gpt-refactor-245-tests
on: push
permissions:
  contents: write
jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/refactor-245-parent-action-admission
      - run: python3 .github/web-gpt-refactor-245-tests.py
      - run: gofmt -w glm-worker/internal/workflow/activetask_test.go glm-worker/internal/workflow/external_feasibility_gate_test.go glm-worker/internal/workflow/report_only_snapshot_test.go glm-worker/internal/workflow/workflow_test.go
      - name: Commit edits
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow/activetask_test.go glm-worker/internal/workflow/external_feasibility_gate_test.go glm-worker/internal/workflow/report_only_snapshot_test.go glm-worker/internal/workflow/workflow_test.go
          git commit -m 'test: align direct workflow fixtures with canonical admission'
          git push origin HEAD:web-gpt/refactor-245-parent-action-admission
