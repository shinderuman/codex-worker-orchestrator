name: Issue 62 Implementation

on:
  push:
    branches:
      - gpt/issue-62-reviewer-phase-parser

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, 'Implement issue 62 reviewer phase parser') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/issue-62-reviewer-phase-parser
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Implement shared reviewer phase grammar
        run: |
          cat > glm-worker/internal/state/reviewer_phase.go <<'EOF'
          package state

          import (
          	"strconv"
          	"strings"
          )

          const (
          	ReviewerPhaseCategoryReview    = "reviewer"
          	ReviewerPhaseCategoryRiskFloor = "reviewer-risk-floor"
          	ReviewerPhaseCategoryHighFloor = "reviewer-high-floor"
          )

          type ReviewerPhaseInfo struct {
          	ReviewNumber int
          	Category     string
          }

          func ParseReviewerPhase(phase string) (ReviewerPhaseInfo, bool) {
          	rest, ok := strings.CutPrefix(phase, ReviewerPhaseCategoryReview+"-")
          	if !ok {
          		return ReviewerPhaseInfo{}, false
          	}
          	numberText, suffix, separated := strings.Cut(rest, "-")
          	if numberText == "" || !reviewerPhaseDigits(numberText) {
          		return ReviewerPhaseInfo{}, false
          	}
          	reviewNumber, err := strconv.Atoi(numberText)
          	if err != nil {
          		return ReviewerPhaseInfo{}, false
          	}
          	category := ReviewerPhaseCategoryReview
          	if separated {
          		switch suffix {
          		case "result-correct":
          		case "risk-floor", "risk-floor-result-correct":
          			category = ReviewerPhaseCategoryRiskFloor
          		case "high-floor", "high-floor-result-correct":
          			category = ReviewerPhaseCategoryHighFloor
          		default:
          			return ReviewerPhaseInfo{}, false
          		}
          	}
          	return ReviewerPhaseInfo{ReviewNumber: reviewNumber, Category: category}, true
          }

          func ReviewerPhaseCategory(phase string) string {
          	parsed, ok := ParseReviewerPhase(phase)
          	if !ok {
          		return phase
          	}
          	return parsed.Category
          }

          func reviewerPhaseDigits(value string) bool {
          	for _, char := range value {
          		if char < '0' || char > '9' {
          			return false
          		}
          	}
          	return true
          }
          EOF

          cat > glm-worker/internal/state/reviewer_phase_test.go <<'EOF'
          package state

          import "testing"

          func TestParseReviewerPhase(t *testing.T) {
          	tests := []struct {
          		phase    string
          		number   int
          		category string
          		ok       bool
          	}{
          		{phase: "reviewer-1", number: 1, category: ReviewerPhaseCategoryReview, ok: true},
          		{phase: "reviewer-12-result-correct", number: 12, category: ReviewerPhaseCategoryReview, ok: true},
          		{phase: "reviewer-2-risk-floor", number: 2, category: ReviewerPhaseCategoryRiskFloor, ok: true},
          		{phase: "reviewer-2-risk-floor-result-correct", number: 2, category: ReviewerPhaseCategoryRiskFloor, ok: true},
          		{phase: "reviewer-3-high-floor", number: 3, category: ReviewerPhaseCategoryHighFloor, ok: true},
          		{phase: "reviewer-3-high-floor-result-correct", number: 3, category: ReviewerPhaseCategoryHighFloor, ok: true},
          		{phase: "worker-new"},
          		{phase: "reviewer-report-only-1"},
          		{phase: "reviewer-"},
          		{phase: "reviewer-x"},
          		{phase: "reviewer-1-unexpected"},
          		{phase: "reviewer-1-high-floor-extra"},
          	}
          	for _, tc := range tests {
          		t.Run(tc.phase, func(t *testing.T) {
          			got, ok := ParseReviewerPhase(tc.phase)
          			if ok != tc.ok {
          				t.Fatalf("ParseReviewerPhase(%q) ok = %v want %v", tc.phase, ok, tc.ok)
          			}
          			if !ok {
          				return
          			}
          			if got.ReviewNumber != tc.number || got.Category != tc.category {
          				t.Fatalf("ParseReviewerPhase(%q) = %#v want number=%d category=%q", tc.phase, got, tc.number, tc.category)
          			}
          		})
          	}
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path('glm-worker/internal/state/routingeval.go')
          s = p.read_text()
          start = s.index('const (\n\tReviewerPhaseCategoryReview')
          end = s.index('func BuildModelRoutingReport', start)
          p.write_text(s[:start] + s[end:])

          p = Path('glm-worker/internal/app/convergence.go')
          s = p.read_text()
          s = s.replace('\t"regexp"\n', '', 1)
          s = s.replace('var convergenceReviewerPhase = regexp.MustCompile(`^reviewer-(\\d+)(-risk-floor)?$`)\n\n', '', 1)
          old = '''\t\tmatch := convergenceReviewerPhase.FindStringSubmatch(entry.Phase)
          \t\tif match == nil || match[1] != fmt.Sprint(reviewNumber) {
          \t\t\t*mismatch = true
          \t\t\tcontinue
          \t\t}
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''\t\tparsed, ok := state.ParseReviewerPhase(entry.Phase)
          \t\tif !ok || parsed.ReviewNumber != reviewNumber {
          \t\t\t*mismatch = true
          \t\t\tcontinue
          \t\t}
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old not in s:
              raise SystemExit('reviewer bucket anchor not found')
          s = s.replace(old, new, 1)
          old = '''\t\tif strings.HasSuffix(entry.Phase, "-risk-floor") {
          \t\t\tout.RiskFloorReemit = true
          \t\t}
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''\t\tif parsed, ok := state.ParseReviewerPhase(entry.Phase); ok && parsed.Category == state.ReviewerPhaseCategoryRiskFloor {
          \t\t\tout.RiskFloorReemit = true
          \t\t}
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old not in s:
              raise SystemExit('risk-floor output anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('glm-worker/internal/app/convergence_test.go')
          s = p.read_text()
          anchor = 'func TestConvergenceGapAndMismatchFallToUnknown(t *testing.T) {'
          test = r'''func TestReviewerCallsInBucketRecognizesCurrentReviewerPhaseGrammar(t *testing.T) {
          entries := []state.ModelCallLog{
              {Role: state.ReviewerRole, Phase: "reviewer-2"},
              {Role: state.ReviewerRole, Phase: "reviewer-2-result-correct"},
              {Role: state.ReviewerRole, Phase: "reviewer-2-risk-floor"},
              {Role: state.ReviewerRole, Phase: "reviewer-2-risk-floor-result-correct"},
              {Role: state.ReviewerRole, Phase: "reviewer-2-high-floor"},
              {Role: state.ReviewerRole, Phase: "reviewer-2-high-floor-result-correct"},
          }
          mismatch := false
          got := reviewerCallsInBucket(entries, 2, &mismatch)
          if mismatch || len(got) != len(entries) {
              t.Fatalf("valid reviewer phases were not attributed: mismatch=%v calls=%#v", mismatch, got)
          }

          mismatch = false
          got = reviewerCallsInBucket([]state.ModelCallLog{{Role: state.ReviewerRole, Phase: "reviewer-2-future-floor"}}, 2, &mismatch)
          if !mismatch || len(got) != 0 {
              t.Fatalf("unknown reviewer phase must remain mismatch: mismatch=%v calls=%#v", mismatch, got)
          }
          }

          func TestConvergenceHighFloorReviewerDoesNotCreateSubsequentGap(t *testing.T) {
          base := convergenceBaseTime()
          snapshot := state.SnapshotDigest{Head: "h", IndexDigest: "i", WorktreeDigest: "w"}
          records := []state.RoundRecord{
              {Seq: 1, WorkerPhase: state.RoundWorkerPhaseBaseline, CapturedAt: base, Snapshot: snapshot},
              {Seq: 2, ReviewNumber: 1, WorkerPhase: "worker-new", CapturedAt: base.Add(10 * time.Second), Snapshot: snapshot},
              {Seq: 3, ReviewNumber: 2, WorkerPhase: "worker-auto-fix-1", CapturedAt: base.Add(30 * time.Second), Snapshot: snapshot},
          }
          logs := []state.ModelCallLog{{
              CallType: state.CallTypeTask, Role: state.ReviewerRole, Phase: "reviewer-1-high-floor",
              StartedAt: base.Add(20 * time.Second), PacketStatus: "NEEDS_SOL_REVIEW",
          }}
          rounds, _ := buildConvergenceRounds(records, logs)
          if len(rounds) != 2 {
              t.Fatalf("rounds = %#v", rounds)
          }
          if rounds[0].mismatch {
              t.Fatalf("high-floor reviewer was treated as mismatch: %#v", rounds[0])
          }
          if rounds[1].gap || rounds[1].delta.Class == state.RoundDeltaUnknown {
              t.Fatalf("high-floor reviewer created a subsequent gap: %#v", rounds[1])
          }
          }

          func TestConvergenceRiskFloorResultCorrectionRemainsRiskFloor(t *testing.T) {
          riskRound := convergenceRound{reviewer: []state.ModelCallLog{{
              Role: state.ReviewerRole, Phase: "reviewer-1-risk-floor-result-correct",
          }}}
          if got := convergenceReviewOutDetail(riskRound); !got.RiskFloorReemit {
              t.Fatalf("risk-floor result correction lost risk-floor identity: %#v", got)
          }
          highRound := convergenceRound{reviewer: []state.ModelCallLog{{
              Role: state.ReviewerRole, Phase: "reviewer-1-high-floor-result-correct",
          }}}
          if got := convergenceReviewOutDetail(highRound); got.RiskFloorReemit {
              t.Fatalf("high-floor result correction was conflated with risk-floor: %#v", got)
          }
          }

          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines())
          if anchor not in s:
              raise SystemExit('convergence regression anchor not found')
          p.write_text(s.replace(anchor, test + anchor, 1))
          PY

          gofmt -w glm-worker/internal/state/reviewer_phase.go glm-worker/internal/state/reviewer_phase_test.go glm-worker/internal/state/routingeval.go glm-worker/internal/app/convergence.go glm-worker/internal/app/convergence_test.go
          git diff --check
      - name: Validate
        run: |
          (cd glm-worker && go test ./...)
          (cd glm-worker && go vet ./...)
          (cd glm-worker && go build ./...)
          ./harnesslint
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/state/reviewer_phase.go glm-worker/internal/state/reviewer_phase_test.go glm-worker/internal/state/routingeval.go glm-worker/internal/app/convergence.go glm-worker/internal/app/convergence_test.go
          git commit -m 'Implement issue 62 reviewer phase parser'
          git push origin HEAD:gpt/issue-62-reviewer-phase-parser
