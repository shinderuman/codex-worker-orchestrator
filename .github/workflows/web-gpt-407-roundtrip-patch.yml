name: Web GPT Issue 407 Round Trip Patch

on:
  push:
    branches:
      - web-gpt/issue-407-project-scoped-agents

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-407-project-scoped-agents
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: glm-worker/go.mod
      - name: Apply exact round-trip patch
        run: python3 .github/web-gpt-407-roundtrip-patch.py
      - name: Format Go changes
        run: gofmt -w glm-worker/internal/codexcontext/project_agents.go glm-worker/internal/codexcontext/project_agents_test.go
      - name: Commit patch
        run: |
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m 'Preserve project AGENTS exclude round trip'
          git push origin HEAD:web-gpt/issue-407-project-scoped-agents
