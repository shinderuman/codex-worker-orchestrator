name: GPT model call correlation patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'gpt/model-call-correlation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Read Go version
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Share one call ID per Claude invocation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/runner/runner.go')
          text = path.read_text()
          replacements = [
              (
                  '\tInstructionReads   []string\n\n\tPlainFailure ProviderFailureClass',
                  '\tInstructionReads   []string\n\tCallID             string\n\n\tPlainFailure ProviderFailureClass',
              ),
              (
                  '\targs := r.buildRunArgs(role, taskID, sessionID, ready, model, readOnly, effort, prompt, inputs)\n\tingester, stderrPath, runErr, err := r.executeRunCommand(\n\t\trole, phase, model, taskID, sessionID, ready, args, inputs, outputPath,\n\t)',
                  '\targs := r.buildRunArgs(role, taskID, sessionID, ready, model, readOnly, effort, prompt, inputs)\n\tcallID, callIDErr := state.NewUUID()\n\tif callIDErr != nil {\n\t\tstate.WarnTaskEventSkip("call ID生成", callIDErr)\n\t} else {\n\t\tresult.CallID = callID\n\t}\n\tingester, stderrPath, runErr, err := r.executeRunCommand(\n\t\trole, phase, model, taskID, sessionID, callID, ready, args, inputs, outputPath,\n\t)',
              ),
              (
                  '\tphase, model, taskID, sessionID string,\n\tready bool,',
                  '\tphase, model, taskID, sessionID, callID string,\n\tready bool,',
              ),
              (
                  '\tingester := r.newTaskEventIngester(taskID, role, phase, model, sessionID, ready)',
                  '\tingester := r.newTaskEventIngester(taskID, callID, role, phase, model, sessionID, ready)',
              ),
              (
                  'func (r *ClaudeRunner) newTaskEventIngester(\n\ttaskID string,\n\trole state.SessionRole,',
                  'func (r *ClaudeRunner) newTaskEventIngester(\n\ttaskID, callID string,\n\trole state.SessionRole,',
              ),
              (
                  ') *streamEventIngester {\n\tcallID, err := state.NewUUID()\n\tif err != nil {\n\t\tstate.WarnTaskEventSkip("call ID生成", err)\n\t\treturn &streamEventIngester{closed: true}\n\t}\n\tingester := newStreamEventIngester(r.state, taskID, callID, role, phase, model, sessionID, resumed)',
                  ') *streamEventIngester {\n\tif callID == "" {\n\t\treturn &streamEventIngester{closed: true}\n\t}\n\tingester := newStreamEventIngester(r.state, taskID, callID, role, phase, model, sessionID, resumed)',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'runner match count={text.count(old)} for {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('glm-worker/internal/workflow/workflow.go')
          text = path.read_text()
          old = '\treturn state.ModelCallLog{\n\t\tTaskID:             w.state.ReadOr("task.id", "unknown"),\n\t\tCallType:           state.CallTypeTask,'
          new = '\treturn state.ModelCallLog{\n\t\tCallID:             runResult.CallID,\n\t\tTaskID:             w.state.ReadOr("task.id", "unknown"),\n\t\tCallType:           state.CallTypeTask,'
          if text.count(old) != 1:
              raise SystemExit(f'workflow match count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('glm-worker/internal/runner/stream_events_test.go')
          text = path.read_text()
          old = '\tfirstCall := records[0].CallID\n\tif records[4].CallID == firstCall {\n\t\tt.Fatal("呼出ごとにcall_idが変わっていません")\n\t}'
          new = '\tfirstCall := records[0].CallID\n\tif first.CallID == "" || second.CallID == "" {\n\t\tt.Fatalf("RunResult call IDs = %q / %q", first.CallID, second.CallID)\n\t}\n\tif firstCall != first.CallID || records[4].CallID != second.CallID {\n\t\tt.Fatalf("event/result call IDs = %q/%q, %q/%q", firstCall, first.CallID, records[4].CallID, second.CallID)\n\t}\n\tif second.CallID == first.CallID {\n\t\tt.Fatal("呼出ごとにcall_idが変わっていません")\n\t}'
          if text.count(old) != 1:
              raise SystemExit(f'stream test match count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > glm-worker/internal/workflow/model_call_correlation_test.go <<'EOF'
          package workflow

          import (
          	"testing"
          	"time"

          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/config"
          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/runner"
          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"
          )

          func TestBuildModelCallLogKeepsRunnerCallID(t *testing.T) {
          	st, err := state.NewStateStore(config.AppConfig{
          		StateBase: t.TempDir(),
          		RepoHash:  "call-id-test",
          		RepoRoot:  t.TempDir(),
          	})
          	if err != nil {
          		t.Fatal(err)
          	}
          	w := &Workflow{state: st}
          	now := time.Now().UTC()
          	entry := w.buildModelCallLog(
          		state.ResumeCheckpoint{Role: state.WorkerRole, Model: "opus", Prompt: "prompt"},
          		runner.RunResult{CallID: "call-123", SessionID: "session", Response: "response"},
          		now,
          		now.Add(time.Second),
          		"success",
          		"IMPLEMENTED",
          		nil,
          		"unused",
          	)
          	if entry.CallID != "call-123" {
          		t.Fatalf("model call ID = %q", entry.CallID)
          	}
          }
          EOF

          gofmt -w glm-worker/internal/runner/runner.go glm-worker/internal/runner/stream_events_test.go glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/model_call_correlation_test.go
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/runner/runner.go glm-worker/internal/runner/stream_events_test.go glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/model_call_correlation_test.go
          git commit -m 'fix: share call IDs across events and telemetry'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Focused tests
        working-directory: glm-worker
        run: go test ./internal/runner ./internal/state ./internal/workflow -count=1
      - name: Full tests
        working-directory: glm-worker
        run: go test ./... -count=1
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
