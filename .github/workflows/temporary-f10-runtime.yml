name: Temporary F10 Runtime Completion
on:
  push:
    branches:
      - hardening-task/exhaustive-search-gate
permissions:
  contents: write
jobs:
  runtime-f10:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install quality prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          GOTOOLCHAIN=auto go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate installed runtime
        shell: bash
        run: |
          git branch -m hardening/agent-guardrails
          ./install.sh
          build_dir=$(mktemp -d)
          trap 'rm -rf "$build_dir"' EXIT
          cd glm-worker
          for name in glm-worker commentlint harnesslint merge-json; do
            go build -buildvcs=false -trimpath -o "$build_dir/$name" "./cmd/$name"
            cmp "$build_dir/$name" "$HOME/.local/bin/$name"
          done
          cd ..
          cmp codex/AGENTS.md "$HOME/.codex/AGENTS.md"
          cmp codex/glm-worker/prompts/WORKER.md "$HOME/.codex/glm-worker/prompts/WORKER.md"
          cmp codex/instructions/worker/go.md "$HOME/.codex/instructions/worker/go.md"
          "$HOME/.local/bin/glm-worker" --status > /tmp/glm-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/glm-status.json').read_text())
          if not isinstance(value, dict):
              raise SystemExit('installed --status did not return a JSON object')
          PY
          git branch -m hardening-task/exhaustive-search-gate
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-f10-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary F10 runtime workflow'
          git push origin HEAD:hardening-task/exhaustive-search-gate
