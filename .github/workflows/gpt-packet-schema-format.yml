name: GPT packet schema format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'gpt/packet-schema-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/packet-schema-contract
      - name: Format changed Go files
        run: gofmt -w glm-worker/internal/packet/schema.go glm-worker/internal/packet/schema_test.go glm-worker/internal/runner/runner.go glm-worker/internal/runner/structured_schema_test.go
      - name: Remove temporary files
        run: rm -f .github/workflows/gpt-packet-schema-format.yml .gpt-packet-test.log
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'style: format packet schema changes'
            git push origin HEAD:gpt/packet-schema-contract
          fi
