name: Temporary #1160 bundle analysis split

on:
  push:
    branches:
      - web-gpt/1160-codex-working-set

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1160-codex-working-set
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod

      - name: Split stable bundle-analysis owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('glm-worker/internal/app/bundle_analysis.go')
          text = source.read_text()

          def take_block(text, start_marker, end_marker):
              if text.count(start_marker) != 1 or text.count(end_marker) != 1:
                  raise SystemExit(f'expected unique markers: {start_marker!r} / {end_marker!r}')
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + text[end:], text[start:end].rstrip() + '\n'

          # Extract later block first so marker relations remain explicit and deterministic.
          text, token_block = take_block(
              text,
              'func analysisExecutionTokenDelta(',
              'func collectAnalysisValidationRuns(',
          )
          text, wait_block = take_block(
              text,
              'func analysisWaitCalls(',
              'func collectAnalysisValidationRuns(',
          )

          source.write_text(text)
          Path('glm-worker/internal/app/bundle_analysis_waits.go').write_text(
              'package app\n\nimport (\n\t"sort"\n\t"time"\n)\n\n' + wait_block
          )
          Path('glm-worker/internal/app/bundle_analysis_tokens.go').write_text(
              'package app\n\nimport "time"\n\n' + token_block
          )
          PY

          gofmt -w \
            glm-worker/internal/app/bundle_analysis.go \
            glm-worker/internal/app/bundle_analysis_waits.go \
            glm-worker/internal/app/bundle_analysis_tokens.go

      - name: Targeted app validation
        working-directory: glm-worker
        run: go test ./internal/app

      - name: Commit semantic split and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-1160-bundle-split.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: split bundle analysis semantic owners'
          git push origin HEAD:web-gpt/1160-codex-working-set
