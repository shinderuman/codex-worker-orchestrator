name: Web GPT Deterministic Autofix

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Existing web-gpt/** branch to canonicalize
        required: true
        type: string
      expected_head_sha:
        description: Exact current HEAD SHA required before mutation
        required: true
        type: string
  workflow_call:
    inputs:
      target_branch:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
    outputs:
      changed:
        description: Whether deterministic Autofix prepared a non-empty patch
        value: ${{ jobs.prepare.outputs.changed }}

concurrency:
  group: web-gpt-autofix-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - name: Require canonical dispatch ref
        env:
          CONTROL_REF: ${{ github.ref }}
        run: test "$CONTROL_REF" = refs/heads/main
      - name: Checkout canonical autofix control source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Read quality tool contract
        id: quality-tools
        working-directory: control
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Validate canonical operation request
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          go -C control/glm-worker run ./cmd/web-gpt-dispatch-request fields autofix "$TARGET_BRANCH" "$EXPECTED_HEAD_SHA" "" ""
      - name: Checkout target at expected head without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head_sha }}
          path: target
          persist-credentials: false
          fetch-depth: 1
      - name: Cache quality tools
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/codex-worker-orchestrator-quality-tools
          key: quality-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('control/quality-tools.yml', 'control/install-quality-tools.sh') }}
      - name: Install canonical quality tools
        working-directory: control
        run: |
          quality_bin="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools"
          printf 'QUALITY_TOOLS_BIN_DIR=%s\n' "$quality_bin" >> "$GITHUB_ENV"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
      - name: Prepare deterministic autofix patch
        working-directory: target
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          WEB_GPT_AUTOFIX_CONTROL_ROOT: ${{ github.workspace }}/control
        run: |
          mkdir -p "$RUNNER_TEMP/web-gpt-autofix-prepared"
          : >"$RUNNER_TEMP/web-gpt-autofix-prepared/autofix.patch"
          sh ../control/web-gpt-autofix.sh prepare "$TARGET_BRANCH" "$EXPECTED_HEAD_SHA" "$RUNNER_TEMP/web-gpt-autofix-prepared/autofix.patch" "$RUNNER_TEMP/web-gpt-autofix-prepared/result.json"
      - name: Expose prepared result
        id: result
        if: ${{ success() }}
        run: |
          if grep -q '"changed":true' "$RUNNER_TEMP/web-gpt-autofix-prepared/result.json"; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload prepared evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-gpt-autofix-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/web-gpt-autofix-prepared
          if-no-files-found: error
          retention-days: 7
      - name: Summarize prepared result
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/web-gpt-autofix-prepared/result.json" ]; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/web-gpt-autofix-prepared/result.json" >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.changed == 'true' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical dispatch ref
        env:
          CONTROL_REF: ${{ github.ref }}
        run: test "$CONTROL_REF" = refs/heads/main
      - name: Checkout canonical publication control source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout target at expected head for publication
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head_sha }}
          path: target
          fetch-depth: 1
      - name: Download prepared patch
        uses: actions/download-artifact@v4
        with:
          name: web-gpt-autofix-prepared-${{ github.run_id }}
          path: prepared
      - name: Publish prepared autofix commit
        working-directory: target
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          sh ../control/web-gpt-autofix.sh publish "$TARGET_BRANCH" "$EXPECTED_HEAD_SHA" "../prepared/autofix.patch" "$RUNNER_TEMP/web-gpt-autofix-published.json"
      - name: Upload publication result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-gpt-autofix-result-${{ github.run_id }}
          path: ${{ runner.temp }}/web-gpt-autofix-published.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize publication result
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/web-gpt-autofix-published.json" ]; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/web-gpt-autofix-published.json" >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
