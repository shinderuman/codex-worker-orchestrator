name: Web GPT 357 Validation

on:
  push:
    branches:
      - web-gpt/357-execution-continuity-guard-recovery

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: glm-worker/go.mod
      - name: Comment lint
        run: ./commentlint
      - name: Harness lint
        run: ./harnesslint
      - name: Go vet
        run: ./goquality vet
      - name: Go build
        run: ./goquality build
      - name: Go test
        working-directory: glm-worker
        run: go test ./...
      - name: Go race
        working-directory: glm-worker
        run: go test -race ./...
