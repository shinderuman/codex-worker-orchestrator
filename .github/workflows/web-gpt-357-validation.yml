name: Web GPT 357 Validation

on:
  push:
    branches:
      - web-gpt/357-execution-continuity-guard-recovery

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Comment lint
        run: ./commentlint
      - name: Harness lint
        run: ./harnesslint
      - name: Go vet
        run: ./goquality vet
      - name: Go build
        run: ./goquality build
      - name: Go test
        working-directory: glm-worker
        run: go test ./...
      - name: Go race
        working-directory: glm-worker
        run: go test -race ./...
