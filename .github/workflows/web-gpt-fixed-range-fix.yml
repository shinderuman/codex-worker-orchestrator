name: Web GPT Fixed-Range Fix

on:
  push:
    branches:
      - 'web-gpt/review-fix/6682699-73a0bfb'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-gpt-fixed-range-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          raw = Path('.github/web-gpt-fixed-range-fix-script.txt').read_text()
          marker = "          python3 - <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index('\n          PY', start)
          block = raw[start:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          old = "if '/private/tmp/' in text or '/Users/shinderumanm/' in text:\n    raise SystemExit('Review.md still contains machine-local links')\nreview.write_text(text)"
          new = "text = re.sub(r'/Users/shinderumanm/[^)\\s`]+', 'review-evidence/README.md', text)\ntext = re.sub(r'/private/tmp/[^)\\s`]+', 'review-evidence/README.md', text)\nif '/private/tmp/' in text or '/Users/shinderumanm/' in text:\n    raise SystemExit('Review.md still contains machine-local links')\nreview.write_text(text)"
          if old not in block:
              raise SystemExit('review cleanup patch anchor missing')
          block = block.replace(old, new, 1)
          Path('/tmp/web-gpt-fix.py').write_text(block)
          subprocess.run(['python3', '/tmp/web-gpt-fix.py'], check=True)

          path = Path('glm-worker/internal/parentactioncmd/publication_sequence_test.go')
          text = path.read_text()
          old = '''\tfor _, name := range []string{"reference-transaction", "pre-push"} {\n\t\tif err := os.WriteFile(filepath.Join(hooksDir, name), []byte("#!/bin/sh\\nexit 0\\n"), 0o755); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\trunFinalizationGit(t, fixture.repo, "config", "core.hooksPath", ".githooks")\n'''
          new = '''\tfor _, name := range []string{"reference-transaction", "pre-push"} {\n\t\tif err := os.WriteFile(filepath.Join(hooksDir, name), []byte("#!/bin/sh\\nexit 0\\n"), 0o755); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tguardPath := filepath.Join(t.TempDir(), "glm-parent-action")\n\tif err := os.WriteFile(guardPath, []byte("#!/bin/sh\\nexit 0\\n"), 0o755); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := os.WriteFile(filepath.Join(hooksDir, "glm-parent-action.path"), []byte(guardPath+"\\n"), 0o600); err != nil {\n\t\tt.Fatal(err)\n\t}\n\trunFinalizationGit(t, fixture.repo, "config", "core.hooksPath", ".githooks")\n'''
          if text.count(old) != 1:
              raise SystemExit('publication fixture guard anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('func TestPublicationSequenceOffersTrackedHookModeRepair(t *testing.T) {', 'func TestPublicationSequenceRejectsTrackedHookModeWithoutBinding(t *testing.T) {', 1)
          old = '''\tif sequence.NextAction == nil || sequence.NextAction.Stage != "repair-guard-setup" {\n\t\tt.Fatalf("tracked-mode repair = %#v", sequence.NextAction)\n\t}\n'''
          new = '''\tif sequence.NextAction != nil {\n\t\tt.Fatalf("tracked mode without executable binding returned repair action: %#v", sequence.NextAction)\n\t}\n\tif !strings.Contains(sequence.Failure.Detail, "glm-parent-action.path") {\n\t\tt.Fatalf("tracked-mode failure detail = %q", sequence.Failure.Detail)\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit('tracked-mode expectation anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w glm-worker/internal/parentevidence/projector.go glm-worker/internal/parentevidence/projector_budget_test.go glm-worker/internal/publicationguard/setup.go glm-worker/internal/publicationguard/setup_test.go glm-worker/internal/parentactioncmd/publication_sequence_test.go
      - name: Focused Go tests
        working-directory: glm-worker
        run: go test ./internal/parentevidence ./internal/publicationguard ./internal/parentactioncmd
      - name: Hook ownership smoke
        run: sh ./tests/install_hook_ownership_smoke.sh
      - name: Full Go test suite
        working-directory: glm-worker
        run: go test ./...
      - name: Commit fixes
        run: |
          git rm .github/workflows/web-gpt-fixed-range-fix.yml .github/web-gpt-fixed-range-fix-script.txt
          git config user.name 'web-gpt-review-fix'
          git config user.email 'web-gpt-review-fix@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix validated fixed-range review findings'
          git push origin HEAD:${GITHUB_REF_NAME}
