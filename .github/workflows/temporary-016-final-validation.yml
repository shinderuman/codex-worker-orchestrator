name: Temporary 016 Final Validation

on:
  push:
    branches:
      - hardening-task/worker-repo-search-integration

permissions:
  contents: write

jobs:
  validate-016:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Validate routing and core
        working-directory: glm-worker
        run: |
          gofmt -w internal/workflow/worker_repo_search.go internal/workflow/worker_repo_search_test.go internal/workflow/workflow.go
          git diff --exit-code
          go test ./internal/workflow ./internal/reposearch
          go test -race ./internal/workflow ./internal/reposearch
          go vet ./...
          go build ./...
      - name: Commit clean validation checkpoint
        run: |
          rm .github/workflows/temporary-016-final-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: verify 016 production tree'
          git push
