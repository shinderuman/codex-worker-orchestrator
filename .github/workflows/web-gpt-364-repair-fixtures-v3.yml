name: Web GPT 364 Repair Fixtures V3

on:
  push:
    branches:
      - web-gpt/364-quality-scope-fail-closed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repair active harness fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("glm-worker/internal/workflow/repository_harness_boundary_test.go")
          s = p.read_text()
          old = '''func trackRepositoryHarnessMarker(t *testing.T, repoRoot string) {
          \tt.Helper()
          \tgoMod := filepath.Join(repoRoot, "glm-worker", "go.mod")
          \tif err := os.MkdirAll(filepath.Dir(goMod), 0o755); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif err := os.WriteFile(goMod, []byte("module github.com/shinderuman/codex-worker-orchestrator/glm-worker\\n"), 0o644); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif err := os.WriteFile(filepath.Join(repoRoot, repositoryharness.MarkerPath), []byte(repositoryharness.MarkerContent), 0o644); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tmarkerGit(t, repoRoot, "add", "--", repositoryharness.MarkerPath, "glm-worker/go.mod")
          }
          '''
          new = '''func trackRepositoryHarnessMarker(t *testing.T, repoRoot string) {
          \tt.Helper()
          \tif err := os.WriteFile(filepath.Join(repoRoot, repositoryharness.MarkerPath), []byte(repositoryharness.MarkerContent), 0o644); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tmarkerGit(t, repoRoot, "add", "--", repositoryharness.MarkerPath)
          }
          '''
          if old not in s:
              raise SystemExit("workflow marker helper pattern not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("glm-worker/internal/workflow/interrupted_retention_test.go")
          s = p.read_text()
          old = '''\tgoMod := filepath.Join(repo, "glm-worker", "go.mod")
          \tif err := os.MkdirAll(filepath.Dir(goMod), 0o755); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif err := os.WriteFile(goMod, []byte("module github.com/shinderuman/codex-worker-orchestrator/glm-worker\\n"), 0o644); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif err := os.WriteFile(filepath.Join(repo, repositoryharness.MarkerPath), []byte(repositoryharness.MarkerContent), 0o644); err != nil {
          \t\tt.Fatal(err)
          \t}
          \trun("add", "tracked.md")
          \trun("add", "--", repositoryharness.MarkerPath, "glm-worker/go.mod")
          '''
          new = '''\tif err := os.WriteFile(filepath.Join(repo, repositoryharness.MarkerPath), []byte(repositoryharness.MarkerContent), 0o644); err != nil {
          \t\tt.Fatal(err)
          \t}
          \trun("add", "tracked.md")
          \trun("add", "--", repositoryharness.MarkerPath)
          '''
          if old not in s:
              raise SystemExit("retention fixture module pattern not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("glm-worker/internal/app/multirepo_process_test.go")
          s = p.read_text()
          s = s.replace('''\t"path/filepath"\n''', '''\t"path/filepath"\n\t"runtime"\n''', 1)
          s = s.replace('''\t"time"\n)''', '''\t"time"\n\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/repositoryharness"\n)''', 1)
          s = s.replace('''\toverride  string\n\trepoA''', '''\toverride  string\n\tqualityBin string\n\trepoA''', 1)
          s = s.replace('''\t\toverride:  filepath.Join(root, "absent-claude-override.json"),\n\t}''', '''\t\toverride:   filepath.Join(root, "absent-claude-override.json"),\n\t\tqualityBin: filepath.Join(root, "quality-bin"),\n\t}''', 1)
          s = s.replace('''\tfor _, dir := range []string{env.home, env.promptDir, env.claudeCfg} {''', '''\tfor _, dir := range []string{env.home, env.promptDir, env.claudeCfg, env.qualityBin} {''', 1)
          anchor = '''\tfor _, prompt := range []struct{ name, body string }{\n'''
          insert = '''\twriteMultiRepoQualityToolStubs(t, env.qualityBin)\n\n'''
          if anchor not in s:
              raise SystemExit("prompt anchor not found")
          s = s.replace(anchor, insert + anchor, 1)
          child_old = '''\treturn []string{\n\t\t"PATH=" + os.Getenv("PATH"),'''
          child_new = '''\treturn []string{\n\t\t"PATH=" + e.qualityBin + string(os.PathListSeparator) + os.Getenv("PATH"),'''
          if child_old not in s:
              raise SystemExit("child PATH pattern not found")
          s = s.replace(child_old, child_new, 1)

          anchor = '''func writeMultiRepoStubClaude(t *testing.T, dir string) string {'''
          helpers = r'''func activateMultiRepoRepositoryHarness(t *testing.T, repoRoot, qualityBin string) {
          	t.Helper()
          	sourceRoot := multiRepoSourceRepositoryRoot(t)
          	for _, path := range []string{
          		".golangci.yml",
          		".github/workflows/quality.yml",
          		".githooks/post-merge",
          		"harnesslint",
          		"install.sh",
          		"install-quality-tools.sh",
          		"glm-worker/internal/workflow/workflow.go",
          		"glm-worker/internal/workflow/quality_gate.go",
          	} {
          		copyMultiRepoFixtureFile(t, sourceRoot, repoRoot, path)
          	}
          	goVersion := strings.TrimPrefix(runtime.Version(), "go")
          	qualityTools := fmt.Sprintf("go: %s\nlint-go: %s\ngolangci-lint: 2.7.0\nshellcheck: 0.11.0\nshfmt: 3.13.0\n", goVersion, goVersion)
          	if err := os.WriteFile(filepath.Join(repoRoot, "quality-tools.yml"), []byte(qualityTools), 0o644); err != nil {
          		t.Fatal(err)
          	}
          	commentlint := "#!/bin/sh\nprintf '%s\\n' '{\"status\":\"pass\",\"fixed\":0,\"violations\":[]}'\n"
          	if err := os.WriteFile(filepath.Join(repoRoot, "commentlint"), []byte(commentlint), 0o755); err != nil {
          		t.Fatal(err)
          	}
          	if err := os.WriteFile(filepath.Join(repoRoot, repositoryharness.MarkerPath), []byte(repositoryharness.MarkerContent), 0o644); err != nil {
          		t.Fatal(err)
          	}
          	command := exec.Command("git", "-C", repoRoot, "add", ".")
          	if output, err := command.CombinedOutput(); err != nil {
          		t.Fatalf("git add active harness fixture: %v: %s", err, output)
          	}
          	command = exec.Command("git", "-C", repoRoot, "commit", "-q", "-m", "activate repository harness")
          	if output, err := command.CombinedOutput(); err != nil {
          		t.Fatalf("git commit active harness fixture: %v: %s", err, output)
          	}
          	_ = qualityBin
          }

          func multiRepoSourceRepositoryRoot(t *testing.T) string {
          	t.Helper()
          	moduleRoot, err := filepath.Abs("../..")
          	if err != nil {
          		t.Fatal(err)
          	}
          	return filepath.Dir(moduleRoot)
          }

          func copyMultiRepoFixtureFile(t *testing.T, sourceRoot, targetRoot, path string) {
          	t.Helper()
          	source := filepath.Join(sourceRoot, filepath.FromSlash(path))
          	target := filepath.Join(targetRoot, filepath.FromSlash(path))
          	data, err := os.ReadFile(source)
          	if err != nil {
          		t.Fatalf("read fixture %s: %v", path, err)
          	}
          	info, err := os.Stat(source)
          	if err != nil {
          		t.Fatalf("stat fixture %s: %v", path, err)
          	}
          	if err := os.MkdirAll(filepath.Dir(target), 0o755); err != nil {
          		t.Fatal(err)
          	}
          	if err := os.WriteFile(target, data, info.Mode().Perm()); err != nil {
          		t.Fatal(err)
          	}
          }

          func writeMultiRepoQualityToolStubs(t *testing.T, dir string) {
          	t.Helper()
          	tools := map[string]string{
          		"golangci-lint": "#!/bin/sh\nif [ \"$1\" = version ]; then echo 'golangci-lint has version 2.7.0'; fi\nexit 0\n",
          		"shellcheck":    "#!/bin/sh\nif [ \"$1\" = --version ]; then echo 'ShellCheck version 0.11.0'; fi\nexit 0\n",
          		"shfmt":         "#!/bin/sh\nif [ \"$1\" = --version ]; then echo 'v3.13.0'; fi\nexit 0\n",
          	}
          	for name, body := range tools {
          		if err := os.WriteFile(filepath.Join(dir, name), []byte(body), 0o755); err != nil {
          			t.Fatal(err)
          		}
          	}
          }

          '''
          if anchor not in s:
              raise SystemExit("stub helper anchor not found")
          s = s.replace(anchor, helpers + anchor, 1)
          p.write_text(s)

          for path in ["glm-worker/internal/app/isolation_process_test.go", "glm-worker/internal/app/isolation_plan_process_test.go"]:
              p = Path(path)
              s = p.read_text()
              needle = '''\tenv := newMultiRepoEnv(t)\n'''
              replacement = '''\tenv := newMultiRepoEnv(t)\n\tactivateMultiRepoRepositoryHarness(t, env.repoA, env.qualityBin)\n'''
              if needle not in s:
                  raise SystemExit(f"env fixture anchor not found: {path}")
              p.write_text(s.replace(needle, replacement, 1))
          PY
          gofmt -w glm-worker/internal/workflow/repository_harness_boundary_test.go glm-worker/internal/workflow/interrupted_retention_test.go glm-worker/internal/app/multirepo_process_test.go glm-worker/internal/app/isolation_process_test.go glm-worker/internal/app/isolation_plan_process_test.go
          rm .github/workflows/web-gpt-364-repair-fixtures-v3.yml
          git config user.name "web-gpt"
          git config user.email "web-gpt@users.noreply.github.com"
          git add -A
          git commit -m "test: model valid opted-in process repositories"
          git push origin HEAD:web-gpt/364-quality-scope-fail-closed
