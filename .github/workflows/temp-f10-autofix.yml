name: Temporary F10 Auto Fix
on:
  push:
    branches:
      - hardening-task/exhaustive-search-gate
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
      - name: Patch auto-fix and cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('glm-worker/internal/workflow/workflow.go')
          s = p.read_text()
          old = '''\tif reportOnly {\n\t\tprompt = reportOnlyFixPrompt(request, decision, reviewReport, activeTaskPath)\n\t\tphase = fmt.Sprintf("worker-report-only-%d", nextAutoFixes)\n\t}\n\treturn state.ResumeCheckpoint{\n'''
          new = '''\tif reportOnly {\n\t\tprompt = reportOnlyFixPrompt(request, decision, reviewReport, activeTaskPath)\n\t\tphase = fmt.Sprintf("worker-report-only-%d", nextAutoFixes)\n\t}\n\texhaustiveContext, err := w.exhaustiveSearchContext(request, activeTaskPath, state.WorkerRole, nextAutoFixes)\n\tif err != nil {\n\t\treturn state.ResumeCheckpoint{}, err\n\t}\n\tprompt += exhaustiveContext\n\treturn state.ResumeCheckpoint{\n'''
          if old not in s:
              raise SystemExit('auto-fix anchor missing')
          p.write_text(s.replace(old, new, 1))
          p = Path('glm-worker/internal/workflow/exhaustive_search.go')
          s = p.read_text()
          line = 'type exhaustiveSearchFunc func(context.Context, string, string, reposearch.ExhaustiveOptions) (reposearch.ExhaustiveReport, error)\n\n'
          if line not in s:
              raise SystemExit('unused type anchor missing')
          p.write_text(s.replace(line, '', 1))
          p = Path('glm-worker/internal/workflow/exhaustive_search_test.go')
          s = p.read_text()
          s += '''\nfunc TestExhaustiveProofPersistsIntoAutoFixPrompt(t *testing.T) {\n\trepoRoot := initMutationRepo(t)\n\twritePlanFileContent(t, repoRoot, planGuardSeed)\n\tif err := os.WriteFile(filepath.Join(repoRoot, "needle-target.txt"), []byte("needle implementation\\n"), 0o644); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tw, r, _, _ := newPlanFileWorkflow(t, repoRoot, []runnerStep{\n\t\t{structured: implementedPacket("initial")},\n\t\t{structured: fixRequiredPacket()},\n\t\t{structured: implementedPacket("fixed")},\n\t\t{structured: passPacket()},\n\t}, "", 0, nil)\n\tif err := w.ExecuteNewTask("exhaustive needle inspection"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(r.prompts) != 4 {\n\t\tt.Fatalf("calls=%d want=4 phases=%v", len(r.prompts), r.phases)\n\t}\n\tif !strings.Contains(r.prompts[2], "EXHAUSTIVE_SEARCH_PROOF:") || !strings.Contains(r.prompts[2], "ROLE: worker") {\n\t\tt.Fatalf("auto-fix prompt lost exhaustive proof:\\n%s", r.prompts[2])\n\t}\n}\n'''
          p.write_text(s)
          PY
          gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/exhaustive_search.go glm-worker/internal/workflow/exhaustive_search_test.go
      - name: Validate
        working-directory: glm-worker
        run: |
          go test ./internal/reposearch ./internal/workflow
          go test -race ./internal/reposearch ./internal/workflow
          go vet ./...
          go build ./...
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/exhaustive_search.go glm-worker/internal/workflow/exhaustive_search_test.go
          git commit -m 'fix: preserve exhaustive proof across auto-fix'
          git push origin HEAD:hardening-task/exhaustive-search-gate
