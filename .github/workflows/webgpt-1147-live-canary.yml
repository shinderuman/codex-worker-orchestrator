name: Web GPT 1147 live canary

on:
  push:
    branches:
      - webgpt/refactor-1147-subprocess-credential-scrub

jobs:
  claude-subprocess-env-scrub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm install -g @anthropic-ai/claude-code@latest
      - working-directory: glm-worker
        run: go test ./internal/runner -run '^TestClaudeSubprocessEnvScrubLiveNoAI$' -count=1 -v
