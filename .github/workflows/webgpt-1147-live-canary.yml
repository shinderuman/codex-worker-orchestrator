name: Web GPT 1147 live canary

on:
  push:
    branches:
      - webgpt/refactor-1147-subprocess-credential-scrub

jobs:
  worker-bash-credential-deny:
    strategy:
      fail-fast: false
      matrix:
        claude-version: ['2.1.226', 'latest']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-version }}
      - run: claude --version
      - name: Verify production CLI flags remain available
        run: |
          help="$(claude --help)"
          for flag in --safe-mode --setting-sources --no-session-persistence --model --output-format --dangerously-skip-permissions --strict-mcp-config --mcp-config --disable-slash-commands --settings --tools; do
            if ! printf '%s\n' "$help" | grep -Fq -- "$flag"; then
              echo "missing production flag: $flag"
              exit 1
            fi
          done
      - name: Verify parent provider credential remains available
        working-directory: glm-worker
        run: go test ./internal/runner -run '^TestClaudeProviderCredentialLiveNoAI$' -count=1 -v
      - name: Verify worker Bash cannot observe provider credentials
        working-directory: glm-worker
        run: go test ./internal/runner -run '^TestClaudeSubprocessEnvScrubLiveNoAI$' -count=1 -v
