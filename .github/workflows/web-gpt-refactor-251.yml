name: web-gpt-refactor-251
on: push
permissions:
  contents: write
jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/refactor-251-machine-contract-owner
      - run: python3 .github/web-gpt-refactor-251.py
      - run: gofmt -w glm-worker/internal/packet/contract.go glm-worker/internal/packet/contract_test.go glm-worker/internal/packet/result.go glm-worker/internal/packet/schema.go glm-worker/internal/packet/validate.go
      - name: Commit edit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/packet/contract.go glm-worker/internal/packet/contract_test.go glm-worker/internal/packet/result.go glm-worker/internal/packet/schema.go glm-worker/internal/packet/validate.go
          git commit -m 'refactor: centralize packet machine contract metadata'
          git push origin HEAD:web-gpt/refactor-251-machine-contract-owner
