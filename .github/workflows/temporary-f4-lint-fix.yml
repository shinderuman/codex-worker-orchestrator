name: Temporary F4 Lint Fix

on:
  push:
    branches:
      - hardening-task/quality-evidence-mutation-risk

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/workflow/quality_evidence.go')
          text = path.read_text()
          text = text.replace('import (\n\t"bytes"\n', 'import (\n\t"bytes"\n\t"errors"\n', 1)
          old = '''func classifyQualityEvidence(repoRoot, baselineHead string, paths []string) (qualityEvidenceDecision, error) {\n\tif strings.TrimSpace(baselineHead) == "" || !hasQualityEvidenceChanges(paths) {\n\t\treturn qualityEvidenceDecision{}, nil\n\t}\n\tif err := verifyQualityEvidenceBaseline(repoRoot, baselineHead); err != nil {\n\t\treturn qualityEvidenceDecision{}, err\n\t}\n\tbefore := map[string]int{}\n\tafter := map[string]int{}\n\tfor _, path := range paths {\n\t\tdecision, handled, err := classifyRepositoryQualityEvidence(repoRoot, baselineHead, path)\n\t\tif err != nil {\n\t\t\treturn qualityEvidenceDecision{}, err\n\t\t}\n\t\tif handled {\n\t\t\tif decision.High {\n\t\t\t\treturn decision, nil\n\t\t\t}\n\t\t\tcontinue\n\t\t}\n\t\tif !isGenericQualityEvidencePath(path) {\n\t\t\tcontinue\n\t\t}\n\t\tif err := collectQualityEvidenceSignatures(repoRoot, baselineHead, path, before, after); err != nil {\n\t\t\treturn qualityEvidenceDecision{}, err\n\t\t}\n\t}\n\tif missing := firstMissingEvidenceSignature(before, after); missing != "" {\n\t\treturn qualityEvidenceDecision{High: true, Source: "track-a-evidence-removed", HitPath: missing}, nil\n\t}\n\treturn qualityEvidenceDecision{}, nil\n}\n'''
          new = '''func classifyQualityEvidence(repoRoot, baselineHead string, paths []string) (qualityEvidenceDecision, error) {\n\tif strings.TrimSpace(baselineHead) == "" || !hasQualityEvidenceChanges(paths) {\n\t\treturn qualityEvidenceDecision{}, nil\n\t}\n\tif err := verifyQualityEvidenceBaseline(repoRoot, baselineHead); err != nil {\n\t\treturn qualityEvidenceDecision{}, err\n\t}\n\tbefore := map[string]int{}\n\tafter := map[string]int{}\n\tdecision, err := classifyChangedQualityEvidence(repoRoot, baselineHead, paths, before, after)\n\tif err != nil || decision.High {\n\t\treturn decision, err\n\t}\n\tif missing := firstMissingEvidenceSignature(before, after); missing != "" {\n\t\treturn qualityEvidenceDecision{High: true, Source: "track-a-evidence-removed", HitPath: missing}, nil\n\t}\n\treturn qualityEvidenceDecision{}, nil\n}\n\nfunc classifyChangedQualityEvidence(\n\trepoRoot, baselineHead string,\n\tpaths []string,\n\tbefore, after map[string]int,\n) (qualityEvidenceDecision, error) {\n\tfor _, path := range paths {\n\t\tdecision, err := classifyQualityEvidencePath(repoRoot, baselineHead, path, before, after)\n\t\tif err != nil || decision.High {\n\t\t\treturn decision, err\n\t\t}\n\t}\n\treturn qualityEvidenceDecision{}, nil\n}\n\nfunc classifyQualityEvidencePath(\n\trepoRoot, baselineHead, path string,\n\tbefore, after map[string]int,\n) (qualityEvidenceDecision, error) {\n\tdecision, handled, err := classifyRepositoryQualityEvidence(repoRoot, baselineHead, path)\n\tif err != nil {\n\t\treturn qualityEvidenceDecision{}, err\n\t}\n\tif handled {\n\t\treturn decision, nil\n\t}\n\tif !isGenericQualityEvidencePath(path) {\n\t\treturn qualityEvidenceDecision{}, nil\n\t}\n\tif err := collectQualityEvidenceSignatures(repoRoot, baselineHead, path, before, after); err != nil {\n\t\treturn qualityEvidenceDecision{}, err\n\t}\n\treturn qualityEvidenceDecision{}, nil\n}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'classifier anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''\tif err := check.Run(); err != nil {\n\t\tif _, ok := err.(*exec.ExitError); ok {\n\t\t\treturn nil, false, nil\n\t\t}\n\t\treturn nil, false, err\n\t}\n'''
          new = '''\tif err := check.Run(); err != nil {\n\t\tvar exitErr *exec.ExitError\n\t\tif errors.As(err, &exitErr) {\n\t\t\treturn nil, false, nil\n\t\t}\n\t\treturn nil, false, err\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'errorlint anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace('case "test", "test-fixture", "test-harness":', 'case testPathCategory, "test-fixture", "test-harness":', 1)
          path.write_text(text)

          sp = Path('glm-worker/internal/workflow/selfprotection.go')
          text = sp.read_text()
          old = 'const emptyTreeObject = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"\n'
          new = '''const (\n\temptyTreeObject  = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"\n\ttestPathCategory = "test"\n)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'const anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          if text.count('return false, "test"') != 2:
              raise SystemExit(f'test category count={text.count(chr(34)+"test"+chr(34))}')
          text = text.replace('return false, "test"', 'return false, testPathCategory')
          sp.write_text(text)
          PY
          gofmt -w glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/selfprotection.go
      - name: Workflow tests
        run: go -C glm-worker test ./internal/workflow
      - name: Workflow vet
        run: go -C glm-worker vet ./internal/workflow
      - name: Build packages
        run: go -C glm-worker build ./...
      - name: Commit validated lint fix
        run: |
          rm .github/workflows/temporary-f4-lint-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/selfprotection.go .github/workflows/temporary-f4-lint-fix.yml
          git commit -m 'refactor: satisfy F4 repository lint'
          git push
