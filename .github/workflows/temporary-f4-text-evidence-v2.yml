name: Temporary F4 Text Evidence V2

on:
  push:
    branches:
      - hardening-task/quality-evidence-mutation-risk

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply narrowing patch
        run: |
          printf '%s' '' | base64 -d | python3
          gofmt -w glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/quality_evidence_test.go
      - name: Workflow tests
        run: go -C glm-worker test ./internal/workflow
      - name: Workflow vet
        run: go -C glm-worker vet ./internal/workflow
      - name: Commit validated narrowing
        run: |
          rm -f .github/workflows/temporary-f4-text-evidence.yml .github/workflows/temporary-f4-text-evidence-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/quality_evidence_test.go .github/workflows/temporary-f4-text-evidence.yml .github/workflows/temporary-f4-text-evidence-v2.yml
          git commit -m 'hardening: narrow non-Go quality evidence risk signal'
          git push
