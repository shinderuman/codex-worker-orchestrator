name: Web GPT Issue 396 Apply

on:
  push:
    branches:
      - web-gpt/issue-396-sol-review-evidence
    paths:
      - .github/workflows/web-gpt-396-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-396-sol-review-evidence
      - name: Apply bounded review-evidence changes
        run: python3 .github/web-gpt-396-apply.py
      - name: Format and commit
        run: |
          gofmt -w \
            glm-worker/internal/state/parent_review_evidence.go \
            glm-worker/internal/state/parent_review_state.go \
            glm-worker/internal/state/stats.go \
            glm-worker/internal/workflow/workflow.go \
            glm-worker/internal/state/parent_accept.go \
            glm-worker/internal/app/parent_evidence.go
          rm .github/web-gpt-396-apply.py .github/workflows/web-gpt-396-apply.yml
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m "Bind Sol review evidence to parent accept"
          git push origin HEAD:web-gpt/issue-396-sol-review-evidence
