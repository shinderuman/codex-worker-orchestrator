name: Web GPT 358 validation

on:
  push:
    branches:
      - web-gpt/358-external-review-follow-up
    paths:
      - .github/workflows/web-gpt-358-edit.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Targeted regression tests
        working-directory: glm-worker
        run: |
          sqlite3 --version
          go test ./internal/app -run 'Test(AnalysisSubsequentTurnPropagatesCounterReset|AnalysisAnchoredTokenDeltaMarksMissingEndpointFieldUnknown|InstallSmokeEvidenceRedactsAuthorizationValues|InstallSmokeEvidenceRetentionKeepsRecentRuns|TimelineSkipsCorruptLines|ParentHandoffRejectsRoutingEvidenceWithoutTaskID|ParseCommandTopLevelUsageIncludesVerifyCodexWake|RunVerifyCodexWakeFailsClosedOnIdentityMixups)$'
          go test ./internal/parentactioncmd -run '^TestFinalizationVerifiedEvidenceDirRejectsLexicallyOutsideMissingPath$'
          go test ./internal/harnesslint -run '^Test(ParentMaintenanceDirectEditAuthorityIsScoped|IsolationInstructionRetainsBranchUntilOriginalTaskCompletes)$'
      - name: Repository lint gate
        run: ./harnesslint
      - name: Full Go test suite
        working-directory: glm-worker
        run: go test ./...
