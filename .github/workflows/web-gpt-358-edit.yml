          replace_once(
              "glm-worker/internal/parentactioncmd/finalization.go",
              '''func finalizationDirOutsideRepository(repoRoot, dir string) bool {
''',
              '''func finalizationDirLexicallyOutsideRepository(repoRoot, dir string) bool {
