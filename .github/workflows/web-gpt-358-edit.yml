\t\t\tvar verification *VerificationError
\t\t\tif !errors.As(err, &verification) || verification.Outcome != autoresume.Fail {
\t\t\t\tt.Fatalf("verification fail typed errorを期待: %v", err)
\t\t\t}
\t\t\tif out.String() != "" {
