name: Web GPT 358 scoped edit

on:
  push:
    branches:
      - web-gpt/358-external-review-follow-up
    paths:
      - .github/workflows/web-gpt-358-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped edits
        run: python3 .github/web-gpt-358-edit.py
      - name: Format and commit
        run: |
          gofmt -w glm-worker/internal/app/bundle_analysis.go glm-worker/internal/app/parent_handoff.go glm-worker/internal/parentactioncmd/finalization.go glm-worker/internal/app/execute_test.go
          git diff --check
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/app/bundle_analysis.go glm-worker/internal/app/parent_handoff.go glm-worker/internal/parentactioncmd/finalization.go glm-worker/internal/app/execute_test.go codex/AGENTS.md codex/instructions/glm-stop-isolate.md
          git commit -m 'Apply remaining external review fixes'
          git push
