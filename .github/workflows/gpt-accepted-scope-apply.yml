name: GPT accepted scope apply

on:
  push:
    branches:
      - gpt/accepted-sol-decision-scope

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/accepted-sol-decision-scope
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/gpt/accepted_scope_lint_fix.py
      - name: Format
        run: gofmt -w glm-worker/internal/app/app.go glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/accepted_fix_scope.go glm-worker/internal/workflow/accepted_fix_scope_risk_test.go
      - name: Commit branch changes
        run: |
          git rm .github/workflows/gpt-accepted-scope-apply.yml .github/gpt/accepted_scope_lint_fix.py
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add codex/instructions/glm-execution.md codex/instructions/glm-packets.md glm-worker/internal/app/app.go glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/accepted_fix_scope.go glm-worker/internal/workflow/accepted_fix_scope_risk_test.go
          git commit -m 'fix: keep accepted scope guard within quality budget'
          git push origin HEAD:gpt/accepted-sol-decision-scope
      - name: Focused tests
        working-directory: glm-worker
        run: go test ./internal/app ./internal/workflow ./internal/state -count=1
      - name: Full tests
        working-directory: glm-worker
        run: go test ./... -count=1
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
