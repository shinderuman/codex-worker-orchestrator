name: Temporary F2 Retention Baseline

on:
  push:
    branches:
      - hardening-task/unknown-production-surface-risk

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Make retention baseline explicitly documentation-only
        shell: python
        run: |
          from pathlib import Path

          path = Path("glm-worker/internal/workflow/interrupted_retention_test.go")
          text = path.read_text()
          count = text.count("tracked.txt")
          if count == 0:
              raise SystemExit("tracked retention fixture not found")
          path.write_text(text.replace("tracked.txt", "tracked.md"))
          Path(".github/workflows/temporary-f2-retention-baseline.yml").unlink()
      - name: Commit fixture update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow/interrupted_retention_test.go .github/workflows/temporary-f2-retention-baseline.yml
          git commit -m "test: make retention baseline explicitly non-production"
          git push
