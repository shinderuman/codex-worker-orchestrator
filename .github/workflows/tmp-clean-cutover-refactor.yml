name: Temporary clean cutover lint refactor

on:
  push:
    branches:
      - web-gpt/issue-1311-from-1310

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'Arm clean-cutover lint refactor v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: glm-worker/go.mod
          cache: false
      - name: Split structural lint helpers and validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64

          path = Path('glm-worker/internal/harnesslint/clean_cutover.go')
          text = path.read_text()

          def replace_between(start_marker, end_marker, encoded):
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'missing start marker: {start_marker}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'missing end marker after {start_marker}: {end_marker}')
              replacement = base64.b64decode(encoded).decode()
              text = text[:start] + replacement + text[end:]

          replace_between('func findParentActionRejectionPredicate(', '\nfunc parentActionRejectionGuardCall(', '')
          replace_between('func parentActionRejectionGuardCall(', '\nfunc cleanCutoverConditionIsNonNil(', '')
          replace_between('func cleanCutoverRejectionPredicateCall(', '\nfunc cleanCutoverBooleanCall(', '')

          nil_literals = text.count('"nil"')
          if nil_literals != 3:
              raise SystemExit(f'expected 3 nil identifier literals, found {nil_literals}')
          text = text.replace('"nil"', 'forwardOnlyNilIdentifier')
          path.write_text(text)
          PY

          gofmt -w glm-worker/internal/harnesslint/clean_cutover.go
          git diff --check
          (cd glm-worker && go test ./internal/harnesslint)

          python3 <<'PY'
          import json, os, pathlib, urllib.request
          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          expected = os.environ['EXPECTED_HEAD']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          ref = request('GET', f'{api}/git/ref/heads/{branch}')
          if ref['object']['sha'] != expected:
              raise SystemExit(f'branch moved: expected {expected}, got {ref["object"]["sha"]}')
          commit = request('GET', f'{api}/git/commits/{expected}')
          content = pathlib.Path('glm-worker/internal/harnesslint/clean_cutover.go').read_text()
          blob = request('POST', f'{api}/git/blobs', {'content': content, 'encoding': 'utf-8'})
          tree = request('POST', f'{api}/git/trees', {'base_tree': commit['tree']['sha'], 'tree': [{'path': 'glm-worker/internal/harnesslint/clean_cutover.go', 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}]})
          new_commit = request('POST', f'{api}/git/commits', {'message': 'Simplify clean-cutover structural lint', 'tree': tree['sha'], 'parents': [expected]})
          request('PATCH', f'{api}/git/refs/heads/{branch}', {'sha': new_commit['sha'], 'force': False})
          print(new_commit['sha'])
          PY
