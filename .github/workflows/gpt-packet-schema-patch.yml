name: GPT packet schema patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'gpt/packet-schema-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/packet-schema-contract
      - name: Apply exact runner patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/runner/runner.go')
          text = path.read_text()

          replacements = [
              ('''var (\n\tworkerSchemaOnce   sync.Once\n\treviewerSchemaOnce sync.Once\n\tworkerSchemaValue  string\n\tworkerSchemaErr    error\n\treviewerSchemaVal  string\n\treviewerSchemaFail error\n)''', '''var (\n\tworkerSchemaOnce           sync.Once\n\treviewerSchemaOnce         sync.Once\n\triskFloorReviewerSchemaOnce sync.Once\n\tworkerSchemaValue          string\n\tworkerSchemaErr            error\n\treviewerSchemaVal          string\n\treviewerSchemaFail         error\n\triskFloorReviewerSchemaVal string\n\triskFloorReviewerSchemaErr error\n)'''),
              ('''func structuredSchema(role state.SessionRole) (string, error) {\n\tif role == state.ReviewerRole {\n\t\treviewerSchemaOnce.Do(func() {\n\t\t\treviewerSchemaVal, reviewerSchemaFail = packet.ReviewerSchemaJSON()\n\t\t})\n\t\treturn reviewerSchemaVal, reviewerSchemaFail\n\t}\n\tworkerSchemaOnce.Do(func() {\n\t\tworkerSchemaValue, workerSchemaErr = packet.WorkerSchemaJSON()\n\t})\n\treturn workerSchemaValue, workerSchemaErr\n}''', '''func structuredSchema(role state.SessionRole, phase string) (string, error) {\n\tif role == state.ReviewerRole {\n\t\tif strings.HasSuffix(phase, "-risk-floor") {\n\t\t\triskFloorReviewerSchemaOnce.Do(func() {\n\t\t\t\triskFloorReviewerSchemaVal, riskFloorReviewerSchemaErr = packet.RiskFloorReviewerSchemaJSON()\n\t\t\t})\n\t\t\treturn riskFloorReviewerSchemaVal, riskFloorReviewerSchemaErr\n\t\t}\n\t\treviewerSchemaOnce.Do(func() {\n\t\t\treviewerSchemaVal, reviewerSchemaFail = packet.ReviewerSchemaJSON()\n\t\t})\n\t\treturn reviewerSchemaVal, reviewerSchemaFail\n\t}\n\tworkerSchemaOnce.Do(func() {\n\t\tworkerSchemaValue, workerSchemaErr = packet.WorkerSchemaJSON()\n\t})\n\treturn workerSchemaValue, workerSchemaErr\n}'''),
              ('inputs, err := r.prepareRunInputs(role, &result)', 'inputs, err := r.prepareRunInputs(role, phase, &result)'),
              ('func (r *ClaudeRunner) prepareRunInputs(role state.SessionRole, result *RunResult) (runInputs, error) {', 'func (r *ClaudeRunner) prepareRunInputs(role state.SessionRole, phase string, result *RunResult) (runInputs, error) {'),
              ('schema, err := structuredSchema(role)', 'schema, err := structuredSchema(role, phase)'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact replacement count={count} for {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Add phase-selection regression
        run: |
          cat > glm-worker/internal/runner/structured_schema_test.go <<'EOF'
          package runner

          import (
          	"encoding/json"
          	"testing"

          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"
          )

          func TestStructuredSchemaUsesRiskFloorContractOnlyForRiskFloorPhase(t *testing.T) {
          	regular, err := structuredSchema(state.ReviewerRole, "reviewer-1")
          	if err != nil {
          		t.Fatal(err)
          	}
          	riskFloor, err := structuredSchema(state.ReviewerRole, "reviewer-1-risk-floor")
          	if err != nil {
          		t.Fatal(err)
          	}

          	regularRequired := schemaRequiredForTest(t, regular)
          	if regularRequired["test_evidence"] || regularRequired["sol_question"] {
          		t.Fatalf("regular reviewer required = %v", regularRequired)
          	}
          	riskFloorRequired := schemaRequiredForTest(t, riskFloor)
          	for _, field := range []string{"test_evidence", "sol_question", "targets", "artifacts"} {
          		if !riskFloorRequired[field] {
          			t.Fatalf("risk-floor requiredに%sがありません: %v", field, riskFloorRequired)
          		}
          	}

          	var schema map[string]any
          	if err := json.Unmarshal([]byte(riskFloor), &schema); err != nil {
          		t.Fatal(err)
          	}
          	properties := schema["properties"].(map[string]any)
          	status := properties["status"].(map[string]any)["enum"].([]any)
          	risk := properties["risk"].(map[string]any)["enum"].([]any)
          	if len(status) != 1 || status[0] != "NEEDS_SOL_REVIEW" {
          		t.Fatalf("status enum = %v", status)
          	}
          	if len(risk) != 1 || risk[0] != "HIGH" {
          		t.Fatalf("risk enum = %v", risk)
          	}
          }

          func schemaRequiredForTest(t *testing.T, encoded string) map[string]bool {
          	t.Helper()
          	var schema map[string]any
          	if err := json.Unmarshal([]byte(encoded), &schema); err != nil {
          		t.Fatal(err)
          	}
          	result := map[string]bool{}
          	for _, raw := range schema["required"].([]any) {
          		result[raw.(string)] = true
          	}
          	return result
          }
          EOF
          gofmt -w glm-worker/internal/runner/runner.go glm-worker/internal/runner/structured_schema_test.go
      - name: Remove patch workflow and diagnostic log
        run: rm -f .github/workflows/gpt-packet-schema-patch.yml .gpt-packet-test.log
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: select strict schema for risk-floor review'
            git push origin HEAD:gpt/packet-schema-contract
          fi
