name: Temporary F2 Patch

on:
  push:
    branches:
      - hardening-task/unknown-production-surface-risk

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply fail-closed classifier patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("glm-worker/internal/workflow/selfprotection.go")
          text = path.read_text()

          old_low = '''func classifyNonCriticalPathPattern(path string) (bool, string) {
          \tswitch {
          \tcase strings.HasSuffix(path, "_test.go"):
          \t\treturn false, "test"
          \tcase strings.Contains(path, "testdata/"):
          \t\treturn false, "test-fixture"
          \tcase strings.HasPrefix(path, "tests/"), strings.HasPrefix(path, "glm-worker/scripts/"):
          \t\treturn false, "test-harness"
          \tdefault:
          \t\treturn false, ""
          \t}
          }
          '''
          new_low = '''func classifyNonCriticalPathPattern(path string) (bool, string) {
          \tswitch {
          \tcase strings.HasSuffix(path, "_test.go"):
          \t\treturn false, "test"
          \tcase strings.Contains(path, "testdata/"):
          \t\treturn false, "test-fixture"
          \tcase strings.HasPrefix(path, "tests/"), strings.HasPrefix(path, "glm-worker/scripts/"):
          \t\treturn false, "test-harness"
          \tcase isKnownSafeTestPath(path):
          \t\treturn false, "test"
          \tcase isKnownSafeDocumentationPath(path):
          \t\treturn false, "docs"
          \tdefault:
          \t\treturn false, ""
          \t}
          }
          '''
          if text.count(old_low) != 1:
              raise SystemExit("classifyNonCriticalPathPattern source mismatch")
          text = text.replace(old_low, new_low)

          old_loop = '''\tfor _, p := range paths {
          \t\tif ok, cat := IsCriticalPath(p); ok {
          \t\t\tcategories[cat] = struct{}{}
          \t\t\tif firstHit == "" {
          \t\t\t\tfirstHit = p
          \t\t\t}
          \t\t}
          \t}
          '''
          new_loop = '''\tfor _, p := range paths {
          \t\tcritical, cat := IsCriticalPath(p)
          \t\tif !critical && cat == "" {
          \t\t\tcritical = true
          \t\t\tcat = "unknown-surface"
          \t\t}
          \t\tif critical {
          \t\t\tcategories[cat] = struct{}{}
          \t\t\tif firstHit == "" {
          \t\t\t\tfirstHit = p
          \t\t\t}
          \t\t}
          \t}
          '''
          if text.count(old_loop) != 1:
              raise SystemExit("classifySelfProtection source mismatch")
          path.write_text(text.replace(old_loop, new_loop))

          Path(".github/workflows/temporary-f2-patch.yml").unlink()
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow/selfprotection.go .github/workflows/temporary-f2-patch.yml
          git commit -m "hardening: fail closed on unclassified changed surfaces"
          git push
