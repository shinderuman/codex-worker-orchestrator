name: tmp-1134-app-fixtures
on:
  push:
    branches:
      - web-gpt/1134-parent-evidence-diff-target
jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1134-parent-evidence-diff-target
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Patch parent-review fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('glm-worker/internal/app/parent_review_test.go')
          text = p.read_text()
          def one(old, new):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, got {n}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          one('''import (\n\t"bytes"\n\t"encoding/json"\n\t"errors"\n\t"io"\n\t"strings"\n\t"testing"\n''', '''import (\n\t"bytes"\n\t"encoding/json"\n\t"errors"\n\t"io"\n\t"os"\n\t"path/filepath"\n\t"strings"\n\t"testing"\n''')

          one('''func applyParentReviewFix(t *testing.T, cfg config.AppConfig) {\n\tt.Helper()\n\tfix := &fakeRunner{steps: []fakeStep{\n''', '''func writeParentReviewTaskChange(t *testing.T, cfg config.AppConfig) {\n\tt.Helper()\n\tif err := os.WriteFile(filepath.Join(cfg.RepoRoot, "parent-review-change.txt"), []byte("task change\\n"), 0o644); err != nil {\n\t\tt.Fatal(err)\n\t}\n}\n\nfunc applyParentReviewFix(t *testing.T, cfg config.AppConfig) {\n\tt.Helper()\n\twriteParentReviewTaskChange(t, cfg)\n\tfix := &fakeRunner{steps: []fakeStep{\n''')

          old = '''\tfix := &fakeRunner{steps: []fakeStep{\n\t\t{structured: implementedPacketApp("fixed")},\n\t\t{structured: passPacketApp()},\n\t\t{structured: passPacketApp()},\n\t}}\n\tif err := Execute(Command{Mode: ModeFix, Payload: "直したい"}, cfg, fix.factory(), io.Discard, io.Discard); err != nil {\n'''
          new = '''\twriteParentReviewTaskChange(t, cfg)\n\tfix := &fakeRunner{steps: []fakeStep{\n\t\t{structured: implementedPacketApp("fixed")},\n\t\t{structured: passPacketApp()},\n\t\t{structured: passPacketApp()},\n\t}}\n\tif err := Execute(Command{Mode: ModeFix, Payload: "直したい"}, cfg, fix.factory(), io.Discard, io.Discard); err != nil {\n'''
          one(old, new)

          old = '''\t\tfix := &fakeRunner{steps: []fakeStep{\n\t\t\t{structured: implementedPacketApp("fixed")},\n\t\t\t{structured: passPacketApp()},\n\t\t\t{structured: passPacketApp()},\n\t\t}}\n\t\tif err := Execute(Command{Mode: ModeFix, Payload: "直したい", Origin: origin}, cfg, fix.factory(), io.Discard, io.Discard); err != nil {\n'''
          new = '''\t\twriteParentReviewTaskChange(t, cfg)\n\t\tfix := &fakeRunner{steps: []fakeStep{\n\t\t\t{structured: implementedPacketApp("fixed")},\n\t\t\t{structured: passPacketApp()},\n\t\t\t{structured: passPacketApp()},\n\t\t}}\n\t\tif err := Execute(Command{Mode: ModeFix, Payload: "直したい", Origin: origin}, cfg, fix.factory(), io.Discard, io.Discard); err != nil {\n'''
          one(old, new)
          p.write_text(text)
          PY
          gofmt -w glm-worker/internal/app/parent_review_test.go
      - name: Targeted tests
        working-directory: glm-worker
        run: go test ./internal/app ./internal/reviewtarget ./internal/parentevidence ./internal/workflow
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-1134-app-fixtures.yml
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/app/parent_review_test.go .github/workflows/tmp-1134-app-fixtures.yml
          git commit -m 'test: give parent-review fixes a task change'
          git push origin HEAD:web-gpt/1134-parent-evidence-diff-target
