name: tmp-1134-risk-floor-semantic-target

on:
  push:
    branches:
      - web-gpt/1134-risk-floor-semantic-target

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1134-risk-floor-semantic-target
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Apply focused #1134 correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          workflow_path = Path('glm-worker/internal/workflow/workflow.go')
          text = workflow_path.read_text()
          text = replace_once(
              text,
              'return resolveRiskFloorReemit(reemitResult), false, nil\n}\n\nfunc resolveRiskFloorReemit(reemitResult packet.Result) packet.Result {\n\tif reemitResult.Status == packet.StatusNeedsSolReview {\n\t\treturn reemitResult\n\t}\n\treturn riskFloorFailClosedResult(reemitResult)\n}\n\nfunc riskFloorFailClosedResult(reemitResult packet.Result) packet.Result {',
              'return w.resolveRiskFloorReemit(reemitResult), false, nil\n}\n\nfunc (w *Workflow) resolveRiskFloorReemit(reemitResult packet.Result) packet.Result {\n\tif reemitResult.Status == packet.StatusNeedsSolReview {\n\t\treturn reemitResult\n\t}\n\treturn w.riskFloorFailClosedResult(reemitResult)\n}\n\nfunc (w *Workflow) riskFloorFailClosedResult(reemitResult packet.Result) packet.Result {',
              'risk-floor method binding',
          )
          text = replace_once(
              text,
              '\t\tTargets:             []string{"glm-worker/internal/workflow/workflow.go:riskFloorFailClosedResult"},',
              '\t\tTargets:             w.riskFloorReviewTargets(),',
              'risk-floor target field',
          )
          marker = '''\t\tSolQuestion:         "reviewer非準拠時の最終確認・修正方針をSolが判断する",\n\t}\n}\n'''
          helper = '''\t\tSolQuestion:         "reviewer非準拠時の最終確認・修正方針をSolが判断する",\n\t}\n}\n\nfunc (w *Workflow) riskFloorReviewTargets() []string {\n\tpaths, err := w.collectChangedPaths(w.config.RepoRoot, w.state.ReadOr("baseline-head", ""))\n\tif err == nil {\n\t\ttargets := make([]string, 0, len(paths))\n\t\tfor _, path := range paths {\n\t\t\tif path != "" {\n\t\t\t\ttargets = append(targets, path+":diff")\n\t\t\t}\n\t\t}\n\t\tif len(targets) > 0 {\n\t\t\treturn targets\n\t\t}\n\t}\n\tif path, err := w.state.CurrentTaskAuthorityPath(); err == nil && path != "" {\n\t\treturn []string{path + ":1"}\n\t}\n\treturn []string{implementationPlanFile + ":1"}\n}\n'''
          text = replace_once(text, marker, helper, 'risk-floor target helper')
          workflow_path.write_text(text)

          test_path = Path('glm-worker/internal/workflow/risk_floor_test.go')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '''func TestRiskFloorFailClosedPacketIsValid(t *testing.T) {\n\tpassPkt := resultFromBody(`{"status":"PASS","risk":"LOW","summary":"reviewer pass","requirement_coverage":"covered","invariants":"preserved","test_evidence":"ev","issues":"none","residual_risk":"none","targets":["none"]}`)\n\n\tenforced := riskFloorFailClosedResult(passPkt)\n''',
              '''func TestRiskFloorFailClosedPacketIsValid(t *testing.T) {\n\tpassPkt := resultFromBody(`{"status":"PASS","risk":"LOW","summary":"reviewer pass","requirement_coverage":"covered","invariants":"preserved","test_evidence":"ev","issues":"none","residual_risk":"none","targets":["none"]}`)\n\tst := newStateStoreT(t)\n\tw := newWorkflowT(t, st, &scriptedRunner{})\n\tw.collectChangedPaths = func(string, string) ([]string, error) {\n\t\treturn []string{"internal/task/change.go", "cmd/tool/main.go"}, nil\n\t}\n\n\tenforced := w.riskFloorFailClosedResult(passPkt)\n''',
              'risk-floor packet test setup',
          )
          tests = replace_once(
              tests,
              '''\tif err := validateTypedResult(enforced); err != nil {\n\t\tt.Fatalf("fail closed結果がvalidate不合格: %v", err)\n\t}\n''',
              '''\tif err := validateTypedResult(enforced); err != nil {\n\t\tt.Fatalf("fail closed結果がvalidate不合格: %v", err)\n\t}\n\tif got := strings.Join(enforced.Targets, ","); got != "internal/task/change.go:diff,cmd/tool/main.go:diff" {\n\t\tt.Fatalf("fail closed TARGETSがcurrent task diffを指していない: %q", got)\n\t}\n''',
              'risk-floor semantic target assertion',
          )
          tests = replace_once(
              tests,
              '''func TestResolveRiskFloorReemitAcceptsCompliantAndFailsClosed(t *testing.T) {\n\tcompliant := resultFromBody''',
              '''func TestResolveRiskFloorReemitAcceptsCompliantAndFailsClosed(t *testing.T) {\n\tst := newStateStoreT(t)\n\tw := newWorkflowT(t, st, &scriptedRunner{})\n\tw.collectChangedPaths = func(string, string) ([]string, error) {\n\t\treturn []string{"internal/task/change.go"}, nil\n\t}\n\tcompliant := resultFromBody''',
              'risk-floor resolve test setup',
          )
          tests = tests.replace('if resolved := resolveRiskFloorReemit(compliant);', 'if resolved := w.resolveRiskFloorReemit(compliant);', 1)
          tests = tests.replace('closed := resolveRiskFloorReemit(passed)', 'closed := w.resolveRiskFloorReemit(passed)', 1)
          test_path.write_text(tests)
          PY
          gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/risk_floor_test.go
          cd glm-worker
          go test ./internal/workflow
      - name: Commit focused change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-1134-risk-floor-semantic-target.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/risk_floor_test.go .github/workflows/tmp-1134-risk-floor-semantic-target.yml
          git commit -m 'fix: bind risk-floor fallback to task review targets'
          git push origin HEAD:web-gpt/1134-risk-floor-semantic-target
