name: Web GPT Issue 390 Run

on:
  push:
    branches:
      - web-gpt/issue-390-rotation-failure-proof

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-390-rotation-failure-proof
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: glm-worker/go.mod
          cache: false
      - name: Apply implementation script
        run: |
          python3 - <<'PY_RUNNER'
          from pathlib import Path

          workflow = Path('.github/workflows/web-gpt-issue-390-apply.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, 'issue-390-apply.py', 'exec'))
          PY_RUNNER
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/web-gpt-issue-390-apply.yml
          git rm .github/workflows/web-gpt-issue-390-run.yml
      - name: Format Go changes
        run: |
          gofmt -w \
            glm-worker/internal/state/session_rotation.go \
            glm-worker/internal/state/session_rotation_failure.go \
            glm-worker/internal/state/session_rotation_test.go \
            glm-worker/internal/state/session_rotation_failure_test.go \
            glm-worker/internal/parentactioncmd/parentactioncmd.go \
            glm-worker/internal/parentactioncmd/session_rotation_failure.go \
            glm-worker/internal/parentactioncmd/session_rotation_failure_test.go
      - name: Targeted tests
        working-directory: glm-worker
        run: go test ./internal/state ./internal/parentactioncmd
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Repository lint gate
        run: ./harnesslint
      - name: Full Go test suite
        working-directory: glm-worker
        run: go test ./...
      - name: Commit implementation
        run: |
          git config user.name "web-gpt"
          git config user.email "web-gpt@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind rotation claim release to creation failure proof"
          git push origin HEAD:web-gpt/issue-390-rotation-failure-proof
