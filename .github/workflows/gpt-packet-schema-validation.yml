name: GPT packet schema validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'gpt/packet-schema-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/packet-schema-contract
      - name: Read Go version
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Changed package tests
        id: changed-tests
        working-directory: glm-worker
        shell: bash
        run: |
          set +e
          go test ./internal/packet ./internal/runner -count=1 > ../.gpt-packet-test.log 2>&1
          status=$?
          cat ../.gpt-packet-test.log
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save failure log
        if: steps.changed-tests.outputs.status != '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .gpt-packet-test.log
          if ! git diff --cached --quiet; then
            git commit -m 'ci: capture packet schema test failure'
            git push origin HEAD:gpt/packet-schema-contract
          fi
      - name: Fail changed package tests
        if: steps.changed-tests.outputs.status != '0'
        run: exit 1
      - name: Vet
        if: steps.changed-tests.outputs.status == '0'
        working-directory: glm-worker
        run: go vet ./...
