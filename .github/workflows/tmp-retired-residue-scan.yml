name: Temporary retired residue scan

on:
  push:
    branches:
      - web-gpt/issue-1311-from-1310

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan retired residue
        shell: bash
        run: |
          set -uo pipefail
          patterns='newControllerActionFixture|completeStatusAwaiting|completeStatusTerminal|newFinalizationTestFixture|runPrepareCommand|newCanonicalCutoverConfig|finalizationCommitFile|runCompleteCommand|completeHeadState|pushBindingTargetFromRepo|newPushBindingFixture|writePushBindingFile|installScriptName|installRuntimeManagedConfigs'
          echo '=== tracked hits ==='
          git grep -n -E "$patterns" -- ':!*.md' ':!*.json' || true
          echo '=== parentactioncmd files ==='
          find glm-worker/internal/parentactioncmd -maxdepth 1 -type f -print | sort
