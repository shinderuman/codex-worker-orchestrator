name: Temporary F7 Implementation

on:
  push:
    branches:
      - hardening-task/prose-semantic-guard-migration

permissions:
  contents: write

jobs:
  implement-f7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply typed active-task prompt contract
        run: |
          cat > glm-worker/internal/workflow/active_task_prompt_contract.go <<'EOF'
          package workflow

          import (
          	"fmt"
          	"strings"
          )

          type activeTaskPromptAudience string

          const (
          	activeTaskAudienceWorker   activeTaskPromptAudience = "worker"
          	activeTaskAudienceReviewer activeTaskPromptAudience = "reviewer"
          )

          type activeTaskRequirement uint16

          const (
          	activeTaskOriginalInstruction activeTaskRequirement = 1 << iota
          	activeTaskAmendments
          	activeTaskResolvedReferences
          	activeTaskContract
          	activeTaskMustNot
          	activeTaskAcceptanceCriteria
          	activeTaskHistoricalInvariants
          )

          const activeTaskWorkerRequirements = activeTaskOriginalInstruction |
          	activeTaskAmendments |
          	activeTaskResolvedReferences |
          	activeTaskContract |
          	activeTaskMustNot |
          	activeTaskAcceptanceCriteria

          const activeTaskReviewerRequirements = activeTaskWorkerRequirements | activeTaskHistoricalInvariants

          type activeTaskPromptContract struct {
          	path                  string
          	audience              activeTaskPromptAudience
          	requirements          activeTaskRequirement
          	parentManaged         bool
          	verifyDerivedContract bool
          }

          func newActiveTaskPromptContract(path string, audience activeTaskPromptAudience) activeTaskPromptContract {
          	contract := activeTaskPromptContract{
          		path:          path,
          		audience:      audience,
          		parentManaged: true,
          	}
          	switch audience {
          	case activeTaskAudienceReviewer:
          		contract.requirements = activeTaskReviewerRequirements
          		contract.verifyDerivedContract = true
          	default:
          		contract.requirements = activeTaskWorkerRequirements
          	}
          	return contract
          }

          func (c activeTaskPromptContract) valid() bool {
          	if c.path == "" || !c.parentManaged {
          		return false
          	}
          	switch c.audience {
          	case activeTaskAudienceWorker:
          		return c.requirements == activeTaskWorkerRequirements && !c.verifyDerivedContract
          	case activeTaskAudienceReviewer:
          		return c.requirements == activeTaskReviewerRequirements && c.verifyDerivedContract
          	default:
          		return false
          	}
          }

          func renderActiveTaskPromptContract(contract activeTaskPromptContract) string {
          	if contract.path == "" {
          		return ""
          	}
          	if !contract.valid() {
          		panic("invalid active task prompt contract")
          	}

          	var block strings.Builder
          	block.WriteString("ACTIVE_TASK_CONTEXT:\n")
          	block.WriteString("PATH: ")
          	block.WriteString(contract.path)
          	block.WriteString("\nAUDIENCE: ")
          	block.WriteString(string(contract.audience))
          	block.WriteString("\nSOURCE_AUTHORITY: active-task-file\n")
          	block.WriteString("REQUIRED_SECTIONS: ")
          	block.WriteString(strings.Join(activeTaskRequirementNames(contract.requirements), ","))
          	block.WriteString("\nPARENT_MANAGED: true\n")
          	block.WriteString("DERIVED_CONTRACT_REVIEW: ")
          	block.WriteString(fmt.Sprintf("%t", contract.verifyDerivedContract))
          	block.WriteString("\nEND_ACTIVE_TASK_CONTEXT\n")
          	return block.String()
          }

          func activeTaskRequirementNames(requirements activeTaskRequirement) []string {
          	ordered := []struct {
          		flag activeTaskRequirement
          		name string
          	}{
          		{activeTaskOriginalInstruction, "original-instruction"},
          		{activeTaskAmendments, "amendments"},
          		{activeTaskResolvedReferences, "resolved-references"},
          		{activeTaskContract, "contract"},
          		{activeTaskMustNot, "must-not"},
          		{activeTaskAcceptanceCriteria, "acceptance-criteria"},
          		{activeTaskHistoricalInvariants, "historical-invariants"},
          	}
          	names := make([]string, 0, len(ordered))
          	for _, item := range ordered {
          		if requirements&item.flag != 0 {
          			names = append(names, item.name)
          		}
          	}
          	return names
          }
          EOF

          cat > glm-worker/internal/workflow/active_task_prompt_contract_test.go <<'EOF'
          package workflow

          import (
          	"strings"
          	"testing"
          )

          func TestActiveTaskWorkerContractPinsSemanticsWithoutProse(t *testing.T) {
          	contract := newActiveTaskPromptContract("IMPLEMENTATION_TASKS/task.md", activeTaskAudienceWorker)
          	if !contract.valid() {
          		t.Fatal("worker contract must be valid")
          	}
          	if contract.requirements != activeTaskWorkerRequirements {
          		t.Fatalf("requirements = %b want %b", contract.requirements, activeTaskWorkerRequirements)
          	}
          	if contract.verifyDerivedContract {
          		t.Fatal("worker must not own derived-contract review")
          	}
          }

          func TestActiveTaskReviewerContractAddsIndependentContractCheck(t *testing.T) {
          	contract := newActiveTaskPromptContract("IMPLEMENTATION_TASKS/task.md", activeTaskAudienceReviewer)
          	if !contract.valid() {
          		t.Fatal("reviewer contract must be valid")
          	}
          	if contract.requirements != activeTaskReviewerRequirements {
          		t.Fatalf("requirements = %b want %b", contract.requirements, activeTaskReviewerRequirements)
          	}
          	if !contract.verifyDerivedContract {
          		t.Fatal("reviewer must verify derived contract against requirement source")
          	}
          }

          func TestActiveTaskContractRejectsSemanticWeakening(t *testing.T) {
          	contract := newActiveTaskPromptContract("IMPLEMENTATION_TASKS/task.md", activeTaskAudienceWorker)
          	contract.requirements &^= activeTaskAcceptanceCriteria
          	if contract.valid() {
          		t.Fatal("dropping acceptance criteria must invalidate the machine contract")
          	}

          	contract = newActiveTaskPromptContract("IMPLEMENTATION_TASKS/task.md", activeTaskAudienceReviewer)
          	contract.verifyDerivedContract = false
          	if contract.valid() {
          		t.Fatal("disabling reviewer derived-contract verification must invalidate the machine contract")
          	}

          	contract = newActiveTaskPromptContract("IMPLEMENTATION_TASKS/task.md", activeTaskAudienceWorker)
          	contract.parentManaged = false
          	if contract.valid() {
          		t.Fatal("allowing worker ownership of the requirement source must invalidate the machine contract")
          	}
          }

          func TestActiveTaskContractRenderIsStructuredWiring(t *testing.T) {
          	block := renderActiveTaskPromptContract(newActiveTaskPromptContract("IMPLEMENTATION_TASKS/task.md", activeTaskAudienceWorker))
          	for _, marker := range []string{
          		"ACTIVE_TASK_CONTEXT:",
          		"PATH: IMPLEMENTATION_TASKS/task.md",
          		"SOURCE_AUTHORITY: active-task-file",
          		"REQUIRED_SECTIONS: original-instruction,amendments,resolved-references,contract,must-not,acceptance-criteria",
          		"PARENT_MANAGED: true",
          		"END_ACTIVE_TASK_CONTEXT",
          	} {
          		if !strings.Contains(block, marker) {
          			t.Fatalf("structured marker %q missing from %q", marker, block)
          		}
          	}
          	if strings.Contains(block, "task file本文") {
          		t.Fatalf("machine contract must not depend on explanatory prose: %q", block)
          	}
          }
          EOF

          python3 <<'PY'
          import re
          from pathlib import Path

          p = Path('glm-worker/internal/workflow/prompts.go')
          text = p.read_text()
          pattern = r'func activeTaskPromptBlock\(activeTaskPath string\) string \{.*?\n\}\n\nfunc reviewerActiveTaskBlock\(activeTaskPath string\) string \{.*?\n\}\n'
          replacement = '''func activeTaskPromptBlock(activeTaskPath string) string {
          	return renderActiveTaskPromptContract(newActiveTaskPromptContract(activeTaskPath, activeTaskAudienceWorker))
          }

          func reviewerActiveTaskBlock(activeTaskPath string) string {
          	return renderActiveTaskPromptContract(newActiveTaskPromptContract(activeTaskPath, activeTaskAudienceReviewer))
          }
          '''
          text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('prompt block replacement failed')
          p.write_text(text)

          p = Path('glm-worker/internal/workflow/activetask_test.go')
          text = p.read_text()
          old = '''		if !strings.Contains(prompt, "Acceptance criteria") || !strings.Contains(prompt, "task file本文") {
          			t.Fatalf("prompt %dがtask file本文確認指示を欠いています:\n%s", i, prompt)
          		}
          '''
          if old not in text:
              raise SystemExit('vulnerable prose-pin assertion not found')
          p.write_text(text.replace(old, '', 1))

          p = Path('codex/glm-worker/prompts/WORKER.md')
          text = p.read_text()
          old = 'ACTIVE task fileが提示されている場合、要求の正はその本文(Original instruction・Amendments・Resolved references・Contract・Must not・Acceptance criteria)です。提示されない場合はUSER_REQUESTを正とします。'
          new = 'wrapperから`ACTIVE_TASK_CONTEXT`が提示される場合、そのstructured fieldsを要求源境界として扱い、`PATH`のtask fileから`REQUIRED_SECTIONS`を確認します。`SOURCE_AUTHORITY: active-task-file`、`PARENT_MANAGED: true`、`DERIVED_CONTRACT_REVIEW`の意味を周辺の自由文や追記で弱めません。提示されない場合はUSER_REQUESTを正とします。'
          if old not in text:
              raise SystemExit('WORKER active-task authority line not found')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w glm-worker/internal/workflow/active_task_prompt_contract.go glm-worker/internal/workflow/active_task_prompt_contract_test.go glm-worker/internal/workflow/prompts.go glm-worker/internal/workflow/activetask_test.go
      - name: Inventory residual prompt prose pins
        run: |
          echo '=== prompt substring assertions ==='
          rg -n 'strings\.Contains\([^\n]*(prompt|Prompt|prompts)' glm-worker --glob '*_test.go' || true
          echo '=== instruction/document substring assertions ==='
          rg -n 'strings\.(Contains|HasPrefix|HasSuffix)\(' glm-worker --glob '*_test.go' | rg '(AGENTS|WORKER|prompt|instruction|Markdown|task file|Acceptance criteria|ACTIVE_TASK)' || true
      - name: Validate F7 implementation
        working-directory: glm-worker
        run: |
          go test ./internal/workflow ./internal/harnesslint
          go vet ./...
          go build ./...
      - name: Commit F7 implementation
        run: |
          rm .github/workflows/temporary-f7-implementation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'hardening: replace active-task prose pin with typed contract'
          git push
