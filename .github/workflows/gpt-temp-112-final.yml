name: GPT Temporary 112 Final Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read Go version
        id: go
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: App race tests
        run: cd glm-worker && go test -race ./internal/app/...
      - name: Full validation
        run: |
          cd glm-worker
          go test ./...
          go vet ./...
          go build ./...
          test -z "$(gofmt -l .)"
