name: Temporary 016 Completion

on:
  push:
    branches:
      - hardening-task/worker-repo-search-integration

permissions:
  contents: write

jobs:
  complete-016:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Close 016 metadata and promote F9
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plan_path = Path('IMPLEMENTATION_PLAN.local.md')
          plan = plan_path.read_text()
          replacements = [
              ('## ACTIVE\n\n- `IMPLEMENTATION_TASKS/016-worker-repo-search-integration.md`',
               '## ACTIVE\n\n- `IMPLEMENTATION_TASKS/017-reviewer-diff-first-search.md`'),
              ('- `IMPLEMENTATION_TASKS/017-reviewer-diff-first-search.md`\n', ''),
              ('- current implementation: F8 `instruction-conflict-resolution`はPR #18のSquash Merge commit `407595e2e2a8a095c16a93624bef57d1b2bb32b3`としてCOMPLETE。F9 `017-reviewer-diff-first-search.md`は`016-worker-repo-search-integration.md`へのhard dependencyが未充足のため、016がACTIVE',
               '- current implementation: 016 `worker-repo-search-integration`はproduction routing、独立review修正、恒久Repository Lint `33121225295`までCOMPLETE。F9 `017-reviewer-diff-first-search.md`をACTIVEへ昇格したが、PR #22のruntime completion・final lint・Squash Merge完了まではF9実装を開始しない'),
              ('016開始を妨げるdependency / permission waitはない。F9は016完了までhard dependency待ち。',
               '016実装は完了し、PR #22のruntime completion / final lint / Squash Merge待ち。F9はACTIVEへ昇格済みだが016 integration完了までは実装開始しない。'),
              ('latest integrationを016専用task branchへ履歴を書き換えず同期し、Rules / Plan / ACTIVE 016 taskを再読する。worker repo-search production routingの現行surfaceとknown/unknown target判定、fallback、telemetryを棚卸しして実装を開始する。',
               '016 completion treeでinstall.sh本配置・source equality・installed smokeを確認し、runtime evidenceをPlan/Historyへ同期、final Repository Lint後にPR #22をReady化してSquash Mergeする。その後F9専用branchへlatest integrationを履歴を書き換えず同期する。'),
          ]
          for old, new in replacements:
              if old not in plan:
                  raise SystemExit(f'plan anchor missing: {old[:80]!r}')
              plan = plan.replace(old, new, 1)
          plan_path.write_text(plan)

          task17_path = Path('IMPLEMENTATION_TASKS/017-reviewer-diff-first-search.md')
          task17 = task17_path.read_text()
          old_boundary = '## Current boundary\n\n未着手。\n'
          new_boundary = ('## Current boundary\n\nACTIVE。016 `worker-repo-search-integration`のproduction routing完了を前提に、'
                          'reviewerをdiff-firstで開始し、impact expansion後に必要な場合だけworker searchとは独立したrepo-searchを行う最小境界を調査・実装する。'
                          'PR #22がhardening integrationへSquash Mergeされるまでは実装開始しない。\n')
          if old_boundary not in task17:
              raise SystemExit('017 current boundary anchor missing')
          task17_path.write_text(task17.replace(old_boundary, new_boundary, 1))

          history_path = Path('IMPLEMENTATION_HISTORY.md')
          history = history_path.read_text()
          entry = ('- [x] 016 worker repo-search integration: 既存BM25 coreを再実装せずproduction `worker-new` dispatchへ接続し、明示された既知repo targetではsearchをskip、target不明時だけBM25を1回実行してpath/line候補をnavigation-only blockとしてworker promptへ追加する境界を実装した。0件またはsearch errorではpromptを変更せず既存normal repo inspectionへ戻し、retry tree・multiple backend・embedding fallbackは追加していない。route outcomeはmodel-call列を汚染せず既存task event streamへ記録する。独立reviewで自然文中の裸directory名を既知targetと誤認してsearchをskipし得る欠陥を検出し、slashを含む明示pathまたは実在root fileだけをskip候補に限定した。さらに初回telemetry実装がmodel-call sequenceへeventを混入したためtask eventへ移動し、Repository Lintのthin-wrapper findingでは不要な`defaultRepoSearch` forwarding wrapperを削除した。production validation `33120228099`、review修正後validation `33120423858`、lint-fix validation `33121097871`でtest/race/vet/buildをPASSし、clean production treeの恒久Repository Lint `33121225295`もPASS。既知target taskへの追加search/model/Sol callは0、target不明時の追加はlocal BM25 searchだけで追加Sol/Codex callは0。\n')
          marker = '## 重大インシデント / 再オープン中\n\n'
          if entry not in history:
              if marker not in history:
                  raise SystemExit('history insertion marker missing')
              history = history.replace(marker, marker + entry, 1)
              history_path.write_text(history)

          task16 = Path('IMPLEMENTATION_TASKS/016-worker-repo-search-integration.md')
          if not task16.exists():
              raise SystemExit('016 task file already missing')
          task16.unlink()
          PY
      - name: Commit completion metadata
        run: |
          rm .github/workflows/temporary-016-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close 016 completion metadata'
          git push
