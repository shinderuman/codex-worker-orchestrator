          replace_regex_once(app, r'\nfunc qualityGateCommand\(args \[\]string\) \(Command, error\) \{.*?\n\}\n\nfunc stdinPayloadCommand', '\nfunc stdinPayloadCommand')
          replace_once(app, 'func Execute(cmd Command, cfg config.AppConfig, rf RunnerFactory, stdout, _ io.Writer) error {', 'func Execute(cmd Command, cfg config.AppConfig, rf RunnerFactory, stdout, stderr io.Writer) error {')
          replace_once(app, 'if handled, err := executeStateOnly(cmd, cfg, st, stdout); handled {', 'if handled, err := executeStateOnly(cmd, cfg, st, stdout, stderr); handled {')
          replace_once(app, 'func executeStateOnly(cmd Command, cfg config.AppConfig, st *state.StateStore, stdout io.Writer) (bool, error) {', 'func executeStateOnly(cmd Command, cfg config.AppConfig, st *state.StateStore, stdout, stderr io.Writer) (bool, error) {')
          replace_once(app, 'return true, runQualityGate(cmd.Payload, st, stdout)', 'return true, runQualityGate(cmd.Payload, st, stdout, stderr)')

