          replace_regex_once(qg, r'func executeQualityGateRun\(st \*state\.StateStore, runID string\) error \{.*?\n\}\n\nfunc finishQualityGateCommand', r'''func executeQualityGateRun(st *state.StateStore, runID string) error {
	record, goArgs, active, err := beginQualityGateRun(st, runID)
	if err != nil || !active {
		return err
	}
	gateLog, runErr := runQualityGateProcess(record, goArgs)
	final, err := completeQualityGateRun(st, record, gateLog, runErr)
	if err != nil {
		return err
	}
	if final.Status != qualityGateStatusPass {
		return qualityGateErrorFromRecord(final)
	}
