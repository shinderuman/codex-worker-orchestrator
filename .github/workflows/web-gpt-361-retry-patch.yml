name: Web GPT Issue 361 Retry Patch

on:
  push:
    branches:
      - web-gpt/issue-361-structured-validation-telemetry
    paths:
      - .github/workflows/web-gpt-361-retry-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: |
          python3 .github/web-gpt-361-retry-patch.py
          gofmt -w glm-worker/internal/runner/runner.go glm-worker/internal/runner/stream_events.go
      - name: Commit patch
        run: |
          git config user.name "Web GPT"
          git config user.email "web-gpt@users.noreply.github.com"
          git rm .github/workflows/web-gpt-361-retry-patch.yml .github/web-gpt-361-retry-patch.py
          git add glm-worker/internal/runner/runner.go glm-worker/internal/runner/stream_events.go
          git commit -m "Track validation retries across calls"
          git push
