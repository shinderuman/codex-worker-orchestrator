name: Issue 242 fixture migration

on:
  push:
    branches:
      - web-gpt/issue-242-canonical-stop-kind
    paths:
      - .github/workflows/issue-242-fixture-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/web-gpt/issue-242-canonical-stop-kind'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-242-canonical-stop-kind
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Migrate removed stop fields
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('glm-worker/internal/workflow')
          fields = {
              'RateLimited': 'state.ResumeStopRateLimited',
              'ProviderUnavailable': 'state.ResumeStopProviderUnavailable',
              'UserInterrupted': 'state.ResumeStopInterrupted',
              'GuardRecoverable': 'state.ResumeStopGuardRecoverable',
          }
          changed = []
          for path in sorted(root.glob('*_test.go')):
              text = path.read_text()
              original = text
              for field, kind in fields.items():
                  text = re.sub(rf'\b{field}:\s*true\b', f'StopKind: {kind}', text)
                  text = re.sub(rf'!(\w+)\.{field}\b', rf'\1.StopKind != {kind}', text)
                  text = re.sub(rf'\b(\w+)\.{field}\b', rf'\1.StopKind == {kind}', text)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))
          print('changed files:')
          print('\n'.join(changed))

          legacy = re.compile(r'(?:\.(?:RateLimited|ProviderUnavailable|UserInterrupted|GuardRecoverable)\b|\b(?:RateLimited|ProviderUnavailable|UserInterrupted|GuardRecoverable):)')
          leftovers = []
          for path in sorted(root.glob('*_test.go')):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if legacy.search(line):
                      leftovers.append(f'{path}:{number}:{line.strip()}')
          if leftovers:
              print('remaining legacy stop references:')
              print('\n'.join(leftovers))
              raise SystemExit(1)
          PY
          mapfile -t changed < <(git diff --name-only -- 'glm-worker/internal/workflow/*_test.go')
          if ((${#changed[@]})); then
            gofmt -w "${changed[@]}"
          fi
          cd glm-worker
          go test ./internal/state ./internal/workflow
      - name: Commit migrated fixtures
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/workflow
          if git diff --cached --quiet; then
            echo 'no fixture changes to commit'
            exit 0
          fi
          git commit -m 'test: migrate remaining stop-kind fixtures'
          git push origin HEAD:web-gpt/issue-242-canonical-stop-kind
