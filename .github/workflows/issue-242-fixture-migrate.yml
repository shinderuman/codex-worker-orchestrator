name: Issue 242 fixture migration

on:
  push:
    branches:
      - web-gpt/issue-242-canonical-stop-kind
    paths:
      - .github/workflows/issue-242-fixture-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/web-gpt/issue-242-canonical-stop-kind'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-242-canonical-stop-kind
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Migrate removed app stop fields
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('glm-worker/internal/app')
          fields = {
              'RateLimited': 'state.ResumeStopRateLimited',
              'ProviderUnavailable': 'state.ResumeStopProviderUnavailable',
              'UserInterrupted': 'state.ResumeStopInterrupted',
              'GuardRecoverable': 'state.ResumeStopGuardRecoverable',
          }
          changed = []
          for path in sorted(root.glob('*_test.go')):
              text = path.read_text()
              original = text
              # All legacy boolean keys reported by typecheck in this package are
              # ResumeCheckpoint literals. Do not rewrite similarly named statusOutput fields.
              for field, kind in fields.items():
                  text = re.sub(rf'\b{field}:\s*true\b', f'StopKind: {kind}', text)
                  text = re.sub(rf'\bcheckpoint\.{field}\s*=\s*true\b', f'checkpoint.StopKind = {kind}', text)
                  text = re.sub(rf'\bcheckpoint\.{field}\s*=\s*false\b', 'checkpoint.StopKind = state.ResumeStopNone', text)
                  text = re.sub(rf'!checkpoint\.{field}\b', f'checkpoint.StopKind != {kind}', text)
                  text = re.sub(rf'\bcheckpoint\.{field}\b(?!\s*=)', f'checkpoint.StopKind == {kind}', text)
              if path.name == 'multirepo_process_test.go':
                  text = text.replace(
                      'checkpointA["rate_limited"] != true || !strings.Contains(fmt.Sprint(checkpointA["request"]), "MRISOA2")',
                      'checkpointA["stop_kind"] != "rate-limited" || !strings.Contains(fmt.Sprint(checkpointA["request"]), "MRISOA2")',
                  )
              if path.name == 'stop_process_test.go':
                  text = text.replace(
                      'checkpoint["user_interrupted"] != true || checkpoint["rate_limited"] == true',
                      'checkpoint["stop_kind"] != "interrupted"',
                  )
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))
          print('changed files:')
          print('\n'.join(changed))

          # Fail before tests if any removed checkpoint field still appears. Output/status
          # surfaces named RateLimited/ProviderUnavailable are intentionally excluded.
          legacy_key = re.compile(r'\b(?:RateLimited|ProviderUnavailable|UserInterrupted|GuardRecoverable):\s*true\b')
          legacy_checkpoint = re.compile(r'\bcheckpoint\.(?:RateLimited|ProviderUnavailable|UserInterrupted|GuardRecoverable)\b')
          raw_legacy = re.compile(r'\["(?:rate_limited|provider_unavailable|user_interrupted|guard_recoverable)"\]')
          leftovers = []
          for path in sorted(root.glob('*_test.go')):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if legacy_key.search(line) or legacy_checkpoint.search(line) or raw_legacy.search(line):
                      leftovers.append(f'{path}:{number}:{line.strip()}')
          if leftovers:
              print('remaining legacy checkpoint stop references:')
              print('\n'.join(leftovers))
              raise SystemExit(1)
          PY
          mapfile -t changed < <(git diff --name-only -- 'glm-worker/internal/app/*_test.go')
          if ((${#changed[@]})); then
            gofmt -w "${changed[@]}"
          fi
          cd glm-worker
          go test ./internal/app
      - name: Commit migrated fixtures
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/app
          if git diff --cached --quiet; then
            echo 'no fixture changes to commit'
            exit 0
          fi
          git commit -m 'test: migrate app stop-kind fixtures'
          git push origin HEAD:web-gpt/issue-242-canonical-stop-kind
