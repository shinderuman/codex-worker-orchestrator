name: GPT Temporary 112 State Lock Patcher

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply run-state serialization repair
        run: |
          python3 .github/scripts/gpt-temp-112-state-lock-patch.py
          gofmt -w glm-worker/internal/app/quality_gate.go glm-worker/internal/app/quality_gate_recovery_test.go
          git diff --check
      - name: Commit repair
        run: |
          git config user.name "web-gpt-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glm-worker/internal/app/quality_gate.go glm-worker/internal/app/quality_gate_recovery_test.go
          git commit -m "fix: serialize quality-gate terminal state recovery"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
