name: Web GPT Issue 407 Smoke Env Patch

on:
  push:
    branches:
      - web-gpt/issue-407-project-scoped-agents

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-407-project-scoped-agents
          fetch-depth: 0
      - name: Patch smoke HOME
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/install_smoke.sh')
          s = p.read_text()
          old = '"$home/.local/bin/glm-codex-context"'
          new = 'HOME="$home" "$home/.local/bin/glm-codex-context"'
          if s.count(old) != 3:
              raise SystemExit(f'glm-codex-context invocation count={s.count(old)}')
          p.write_text(s.replace(old, new))
          Path('.github/workflows/web-gpt-407-smoke-debug.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m 'Use smoke HOME for Codex context lifecycle'
          git push origin HEAD:web-gpt/issue-407-project-scoped-agents
