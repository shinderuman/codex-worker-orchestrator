name: Bundle Validation

on:
  push:
    branches:
      - gpt/issue-59-bundle

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read Go version
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Capture validation
        working-directory: glm-worker
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bundle-validation"
          go test ./... > "$RUNNER_TEMP/bundle-validation/test.log" 2>&1
          test_status=$?
          go vet ./... > "$RUNNER_TEMP/bundle-validation/vet.log" 2>&1
          vet_status=$?
          go build ./... > "$RUNNER_TEMP/bundle-validation/build.log" 2>&1
          build_status=$?
          printf 'test=%s\nvet=%s\nbuild=%s\n' "$test_status" "$vet_status" "$build_status" > "$RUNNER_TEMP/bundle-validation/status.txt"
          exit 0
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-validation
          path: ${{ runner.temp }}/bundle-validation
