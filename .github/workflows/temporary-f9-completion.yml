name: Temporary F9 Completion

on:
  push:
    branches:
      - hardening-task/reviewer-diff-first-search

permissions:
  contents: write

jobs:
  complete-f9:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync completion metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          history_path = Path('IMPLEMENTATION_HISTORY.md')
          history = history_path.read_text()
          anchor = '## 重大インシデント / 再オープン中\n\n'
          entry = '- [x] F9 reviewer diff-first independent search: reviewer production checkpointへwrapper-owned `REVIEW_DIFF_FIRST_NAVIGATION`を追加し、task baselineからactual changed pathsを確定してreviewerにdiff-first inspectionを要求した。test/fixture/harness/docs/parent-managedのみのdiffでは独立searchをskipし、production-impact pathがある場合だけ既存BM25 coreを1回使う。reviewer queryはUSER_REQUEST、impact path、actual git diffの追加・削除行から抽出したbounded impact termsでwrapperが独立生成し、worker query/resultを入力authorityにしない。BM25候補からchanged path自体を除外し、impact candidateはnavigation-onlyとして提示する。worker/reviewer search queryとcandidate pathはrole/phaseを分けたpassive task eventへ別々に記録し、model-call列は変更しない。独立reviewで初期実装がpath分類だけでsearch seedを作っておりactual diff内容を見ていない弱さを検出し、diff impact termsを追加した。implementation validation `33122796287`、review-fix validation `33123044738`、lint-fix validation `33123274715`でtest/race/vet/buildをPASSし、clean production treeの恒久Repository Lint `33123373513`もPASS。test/docs-onlyでは追加search 0、production-impact時の追加はlocal BM25 1回のみで追加Sol/Codex/model callは0。\n'
          if entry not in history:
              history_path.write_text(history.replace(anchor, anchor + entry, 1))

          plan_path = Path('IMPLEMENTATION_PLAN.local.md')
          plan = plan_path.read_text()
          plan = plan.replace('## ACTIVE\n\n- `IMPLEMENTATION_TASKS/017-reviewer-diff-first-search.md`\n\n## NEXT（優先順）\n- `IMPLEMENTATION_TASKS/010-task-splitting-milestones.md`', '## ACTIVE\n\n- `IMPLEMENTATION_TASKS/010-task-splitting-milestones.md`\n\n## NEXT（優先順）', 1)
          old_current = '- current implementation: 016 `worker-repo-search-integration`はPR #22のSquash Merge commit `da468541683a832b102acecc60770678452e6fa4`としてCOMPLETE。F9 `017-reviewer-diff-first-search.md`はACTIVEで、016 dependencyは充足済み。F9専用branchへintegrationをmerge commit `9b5af253d6bfefd6d1d835730937e39484c1c8e6`で履歴rewriteなしに同期済み'
          new_current = '- current implementation: F9 `017-reviewer-diff-first-search`はproduction routing、独立review修正、恒久Repository Lint `33123373513`までCOMPLETE。`010-task-splitting-milestones.md`をACTIVEへ昇格したが、PR #19のruntime completion・final lint・Squash Merge完了までは010実装を開始しない'
          if old_current not in plan:
              raise SystemExit('plan current implementation anchor missing')
          plan = plan.replace(old_current, new_current, 1)
          plan = plan.replace('F9開始を妨げるdependency / permission waitはない。', 'F9実装は完了し、PR #19のruntime completion / final lint / Squash Merge待ち。010はACTIVEへ昇格済みだがF9 integration完了までは実装開始しない。', 1)
          plan = plan.replace('Rules / Plan / ACTIVE 017 taskを再読し、reviewer production prompt/dispatchの現行diff入力、impact expansion surface、repo-search接続点、worker searchとの独立性、telemetry分離を棚卸ししてF9実装を開始する。', 'F9 completion treeでinstall.sh本配置・source equality・installed smokeを確認し、runtime evidenceをPlan/Historyへ同期、final Repository Lint後にPR #19をReady化してSquash Mergeする。その後010専用branch境界を確定する。', 1)
          plan_path.write_text(plan)

          task010 = Path('IMPLEMENTATION_TASKS/010-task-splitting-milestones.md')
          text = task010.read_text()
          old_boundary = '## Current boundary\n\nTask 009の再現可能outlier reportは利用可能。2026-08-23 baselineはworker時間比率約81%と複数の累積400 turn超taskを示すが、分割効果は未確定。'
          new_boundary = '## Current boundary\n\nACTIVE。Task 009の再現可能outlier reportは利用可能。2026-08-23 baselineはworker時間比率約81%と複数の累積400 turn超taskを示すが、分割効果は未確定。PR #19がhardening integrationへSquash Mergeされるまでは実装開始しない。'
          if old_boundary not in text:
              raise SystemExit('010 boundary anchor missing')
          task010.write_text(text.replace(old_boundary, new_boundary, 1))

          Path('IMPLEMENTATION_TASKS/017-reviewer-diff-first-search.md').unlink()
          PY
      - name: Commit completion metadata
        run: |
          rm .github/workflows/temporary-f9-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close F9 completion metadata'
          git push origin HEAD:hardening-task/reviewer-diff-first-search
