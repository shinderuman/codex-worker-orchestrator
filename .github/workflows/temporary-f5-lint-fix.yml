name: Temporary F5 Lint Fix

on:
  push:
    branches:
      - hardening-task/deterministic-rule-activation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply lint-only refactor
        run: |
          python3 <<'PY'
          from pathlib import Path

          stream_path = Path('glm-worker/internal/runner/stream_events.go')
          text = stream_path.read_text()
          start = text.index('func workerInstructionReadName(')
          end = text.index('\nfunc (g *streamEventIngester) instructionReadNames()', start)
          replacement = r'''func workerInstructionReadName(toolName string, input json.RawMessage, instructionDir string) (string, bool) {
          \tif toolName != "Read" || len(input) == 0 || instructionDir == "" {
          \t\treturn "", false
          \t}
          \tvar parsed struct {
          \t\tFilePath string `json:"file_path"`
          \t}
          \tif err := json.Unmarshal(input, &parsed); err != nil {
          \t\treturn "", false
          \t}
          \tname, ok := workerInstructionReadPathName(parsed.FilePath, instructionDir)
          \tif !ok {
          \t\treturn "", false
          \t}
          \treturn knownWorkerInstructionFile(name)
          }

          func workerInstructionReadPathName(filePath, instructionDir string) (string, bool) {
          \treadPath, err := filepath.Abs(filepath.Clean(filePath))
          \tif err != nil {
          \t\treturn "", false
          \t}
          \troot, err := filepath.Abs(filepath.Clean(instructionDir))
          \tif err != nil {
          \t\treturn "", false
          \t}
          \trelative, err := filepath.Rel(root, readPath)
          \tif err != nil || relative == "." || filepath.IsAbs(relative) || relative == ".." {
          \t\treturn "", false
          \t}
          \tif strings.HasPrefix(relative, ".."+string(filepath.Separator)) || strings.ContainsRune(relative, filepath.Separator) {
          \t\treturn "", false
          \t}
          \treturn filepath.Base(readPath), true
          }

          func knownWorkerInstructionFile(name string) (string, bool) {
          \tswitch name {
          \tcase "common-code.md", "testing.md", "state-transitions.md", "cli.md",
          \t\t"go.md", "javascript.md", "php.md", "eslint.md":
          \t\treturn name, true
          \tdefault:
          \t\treturn "", false
          \t}
          }
          '''
          stream_path.write_text(text[:start] + replacement + text[end:])

          workflow_dir = Path('glm-worker/internal/workflow')
          for path in workflow_dir.glob('*.go'):
          \tdata = path.read_text()
          \tif '"test-fixture"' in data:
          \t\tpath.write_text(data.replace('"test-fixture"', 'testFixturePathCategory'))

          quality_path = workflow_dir / 'quality_evidence.go'
          quality = quality_path.read_text()
          anchor = 'const parentBehaviorEvalPath = "tests/parent-behavior-evals.json"\n'
          if anchor not in quality:
          \traise SystemExit('quality evidence const anchor not found')
          quality_path.write_text(quality.replace(anchor, anchor + 'const testFixturePathCategory = "test-fixture"\n', 1))

          workflow_path = workflow_dir / 'workflow.go'
          workflow = workflow_path.read_text()
          old = '''\tif checkpoint.Role == state.WorkerRole && !checkpoint.ReportOnly {
          \t\tactivatedCheckpoint, _, activationErr := w.activateCheckpointRules(checkpoint)
          \t\tif activationErr != nil {
          \t\t\treturn checkpoint, false, activationErr
          \t\t}
          \t\tcheckpoint = activatedCheckpoint
          \t}
          '''
          new = '''\tactivatedCheckpoint, activationErr := w.activateResumeRuleContext(checkpoint)
          \tif activationErr != nil {
          \t\treturn checkpoint, false, activationErr
          \t}
          \tcheckpoint = activatedCheckpoint
          '''
          if old not in workflow:
          \traise SystemExit('resume activation block not found')
          workflow = workflow.replace(old, new, 1)
          helper_anchor = '\nfunc (w *Workflow) activateResume(checkpoint state.ResumeCheckpoint) error {'
          helper = r'''
          func (w *Workflow) activateResumeRuleContext(checkpoint state.ResumeCheckpoint) (state.ResumeCheckpoint, error) {
          \tif checkpoint.Role != state.WorkerRole || checkpoint.ReportOnly {
          \t\treturn checkpoint, nil
          \t}
          \tactivated, _, err := w.activateCheckpointRules(checkpoint)
          \tif err != nil {
          \t\treturn checkpoint, err
          \t}
          \treturn activated, nil
          }
          '''
          if helper_anchor not in workflow:
          \traise SystemExit('activateResume helper anchor not found')
          workflow_path.write_text(workflow.replace(helper_anchor, '\n' + helper + helper_anchor, 1))
          PY
          gofmt -w glm-worker/internal/runner/stream_events.go glm-worker/internal/workflow/*.go
      - name: Focused tests
        working-directory: glm-worker
        run: go test ./internal/runner ./internal/workflow
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
      - name: Install quality tools
        env:
          GOTOOLCHAIN: auto
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.7.0
      - name: Repository lint
        env:
          GOTOOLCHAIN: local
        run: ./harnesslint
      - name: Commit validated lint fix
        run: |
          rm .github/workflows/temporary-f5-lint-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/runner/stream_events.go glm-worker/internal/workflow .github/workflows/temporary-f5-lint-fix.yml
          git commit -m 'fix: satisfy F5 repository lint'
          git push
