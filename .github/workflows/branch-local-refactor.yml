name: Branch Local Refactor

on:
  push:
    branches:
      - 'web-gpt/organize-web-gpt-validation-workflows'

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.event.head_commit.message == 'Apply guarded quality wiring refactor' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/organize-web-gpt-validation-workflows
          fetch-depth: 0
      - name: Split quality wiring checks without changing coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/harnesslint/quality_surface.go')
          text = path.read_text()
          start_marker = 'func qualityToolWiringChecks() []qualityWiringCheck {'
          end_marker = 'func qualityWiringPackageViolations('
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('unexpected quality wiring function boundaries')
          if 'func qualityWorkflowWiringChecks()' in text:
              raise SystemExit('quality workflow helper already exists')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          for required in (
              'path: "quality-tools.yml"',
              'path: ".github/workflows/ci.yml"',
              'path: ".github/workflows/install-smoke.yml"',
              'path: "install-quality-tools.sh"',
              'path: "tests/install_quality_tools_smoke.sh"',
          ):
              if required not in old:
                  raise SystemExit(f'missing expected check before refactor: {required}')
          new = '''func qualityToolWiringChecks() []qualityWiringCheck {
	checks := []qualityWiringCheck{
		{
			path: "quality-tools.yml",
			tokens: []string{
				"namespace:",
				"default-bin-dir:",
				"go:",
				"lint-go:",
				"golangci-lint:",
				"deadcode:",
				"shellcheck:",
				"shfmt:",
			},
		},
	}
	checks = append(checks, qualityWorkflowWiringChecks()...)
	return append(checks, qualityToolInstallerWiringChecks()...)
}

func qualityWorkflowWiringChecks() []qualityWiringCheck {
	return []qualityWiringCheck{
		{
			path: ".github/workflows/ci.yml",
			tokens: []string{
				"quality-tools.yml",
				"quality-tools.outputs.go_version",
				"QUALITY_TOOLS_BIN_DIR",
				"$GITHUB_ENV",
				"./install-quality-tools.sh",
				"./tests/install_quality_tools_smoke.sh",
				"./.github/workflows/install-smoke.yml",
			},
		},
		{
			path: ".github/workflows/install-smoke.yml",
			tokens: []string{
				"workflow_call:",
				"quality-tools.yml",
				"quality-tools.outputs.go_version",
				"QUALITY_TOOLS_BIN_DIR",
				"$GITHUB_ENV",
				"./install-quality-tools.sh",
				"./tests/install_smoke.sh",
				"./tests/install_detached_runtime_identity_smoke.sh",
			},
		},
	}
}

func qualityToolInstallerWiringChecks() []qualityWiringCheck {
	return []qualityWiringCheck{
		{
			path: "install-quality-tools.sh",
			tokens: []string{
				"quality-tools.yml",
				"QUALITY_TOOLS_BIN_DIR",
				"tool_namespace=$(contract_value namespace)",
				"default_bin_dir=$(contract_value default-bin-dir)",
				"deadcode_version=$(contract_value deadcode)",
				"quality_tool_path",
				"target_needs_install",
				"golang.org/x/tools/cmd/deadcode@v$deadcode_version",
				"golangci-lint/releases/download",
				"shellcheck/releases/download",
				"go install",
			},
		},
		{
			path: "tests/install_quality_tools_smoke.sh",
			tokens: []string{
				"user-owned-$tool",
				"codex-worker-orchestrator-deadcode-0.49.0",
				"codex-worker-orchestrator-shfmt-3.13.1",
				"codex-worker-orchestrator-shfmt-3.13.2",
				"quality tool collision:",
			},
		},
	}
}

'''
          path.write_text(text[:start] + new + text[end:])
          PY
          gofmt -w glm-worker/internal/harnesslint/quality_surface.go
      - name: Remove one-shot workflow and push exact refactor
        run: |
          rm .github/workflows/branch-local-refactor.yml
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add glm-worker/internal/harnesslint/quality_surface.go .github/workflows/branch-local-refactor.yml
          git diff --cached --check
          git commit -m 'Split quality workflow wiring checks'
          git push origin HEAD:web-gpt/organize-web-gpt-validation-workflows
