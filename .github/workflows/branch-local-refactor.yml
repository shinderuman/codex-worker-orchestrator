name: Branch Local Refactor

on:
  push:
    branches:
      - 'web-gpt/organize-web-gpt-validation-workflows'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/organize-web-gpt-validation-workflows
          fetch-depth: 0
      - name: Split workflow wiring checks
        env:
          OLD_BLOCK_B64: 
          NEW_CALLS_B64: CQljaVdvcmtmbG93V2lyaW5nQ2hlY2soKSwKCQlpbnN0YWxsU21va2VXb3JrZmxvd1dpcmluZ0NoZWNrKCksCg==
          HELPERS_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('glm-worker/internal/harnesslint/quality_surface.go')
          text = path.read_text()
          old = base64.b64decode(os.environ['OLD_BLOCK_B64']).decode()
          new = base64.b64decode(os.environ['NEW_CALLS_B64']).decode()
          helpers = base64.b64decode(os.environ['HELPERS_B64']).decode()
          marker = 'func qualityWiringPackageViolations('
          if text.count(old) != 1:
              raise SystemExit(f'unexpected workflow block count: {text.count(old)}')
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected insertion marker count: {text.count(marker)}')
          if 'func ciWorkflowWiringCheck()' in text:
              raise SystemExit('workflow wiring helper already exists')
          text = text.replace(old, new, 1)
          text = text.replace(marker, helpers + marker, 1)
          path.write_text(text)
          PY
          gofmt -w glm-worker/internal/harnesslint/quality_surface.go
      - name: Remove helper and push
        run: |
          rm .github/workflows/branch-local-refactor.yml
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add glm-worker/internal/harnesslint/quality_surface.go .github/workflows/branch-local-refactor.yml
          git diff --cached --check
          git commit -m 'Split quality workflow wiring checks'
          git push origin HEAD:web-gpt/organize-web-gpt-validation-workflows
