name: Issue 239 transition migration retry

on:
  push:
    branches:
      - web-gpt/issue-239-lifecycle-transition-authority
    paths:
      - .github/workflows/issue-239-transition-migrate-v2.yml

permissions:
  contents: write

env:
  MIGRATION_ATTEMPT: "2"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-239-lifecycle-transition-authority
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Apply transition migration
        shell: bash
        run: |
          awk '/^          python3 - <<'"'"'PY'"'"'$/ {capture=1; next} capture && /^          PY$/ {exit} capture {sub(/^          /, ""); print}' .github/workflows/issue-239-transition-migrate.yml > /tmp/issue239.py
          python3 /tmp/issue239.py
          sed -i '/internal\/state"/d' glm-worker/internal/workflow/decision_boundary_review.go
          sed -i '/internal\/state"/d' glm-worker/internal/workflow/quality_gate.go
          remaining=$(grep -RIn --include='*.go' --exclude='*_test.go' 'SetTaskStatus' glm-worker/internal | grep -v '/internal/state/' || true)
          if [[ -n "$remaining" ]]; then
            echo "$remaining"
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only -- 'glm-worker/internal/**/*.go')
          if ((${#changed[@]})); then
            gofmt -w "${changed[@]}"
          fi
          cd glm-worker
          go test ./internal/state ./internal/workflow ./internal/app
      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal
          git commit -m 'refactor: route lifecycle writes through state authority'
          git push origin HEAD:web-gpt/issue-239-lifecycle-transition-authority
