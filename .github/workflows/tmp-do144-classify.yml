name: tmp do144 classify

on:
  push:
    branches:
      - gpt/do-144-go-cache

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/do-144-go-cache
          fetch-depth: 0
      - name: Read Go version
        id: go-version
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: false
      - name: Classify launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('glm-worker/internal/commentlint/commentlint.go')
          text = p.read_text()
          old = 'if base == "commentlint" || base == "harnesslint" || path == ".githooks/post-merge" {'
          new = 'if base == "commentlint" || base == "harnesslint" || base == "goquality" || path == ".githooks/post-merge" {'
          if old not in text:
              raise SystemExit('commentlint classification anchor not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('glm-worker/internal/commentlint/commentlint_test.go')
          text = p.read_text()
          old = '\t\t{"harnesslint", "shell", true},\n'
          new = old + '\t\t{"goquality", "shell", true},\n'
          if old not in text:
              raise SystemExit('classification test anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w glm-worker/internal/commentlint/commentlint.go glm-worker/internal/commentlint/commentlint_test.go
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Validate final branch
        run: |
          (cd glm-worker && go test ./internal/commentlint/... ./internal/workflow/... ./internal/harnesslint/...)
          ./goquality vet
          ./goquality build
          ./harnesslint
          git diff --check
      - name: Commit validated patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-do144-classify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/commentlint/commentlint.go glm-worker/internal/commentlint/commentlint_test.go .github/workflows/tmp-do144-classify.yml
          git commit -m "fix: classify goquality launcher"
          git push origin HEAD:gpt/do-144-go-cache
