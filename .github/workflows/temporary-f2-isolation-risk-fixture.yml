name: Temporary F2 Isolation Risk Fixture

on:
  push:
    branches:
      - hardening-task/unknown-production-surface-risk

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch fixture
        run: |
          python3 .github/tmp-f2-patch.py
          gofmt -w glm-worker/internal/workflow/interrupted_retention_test.go
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Workflow tests
        run: go -C glm-worker test ./internal/workflow
      - name: Workflow vet
        run: go -C glm-worker vet ./internal/workflow
      - name: Build all packages
        run: go -C glm-worker build ./...
      - name: Commit validated patch
        run: |
          rm .github/tmp-f2-patch.py
          rm .github/workflows/temporary-f2-isolation-risk-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align isolated source integration with risk floor'
          git push
