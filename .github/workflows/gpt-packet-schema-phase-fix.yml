name: GPT packet schema phase fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'gpt/packet-schema-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/packet-schema-contract
      - name: Apply exact phase suffix patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/runner/runner.go')
          text = path.read_text()
          old = 'strings.HasSuffix(phase, "-risk-floor")'
          new = 'strings.HasSuffix(phase, "risk-floor")'
          if text.count(old) != 1:
              raise SystemExit(f'exact replacement count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w glm-worker/internal/runner/runner.go
      - name: Remove temporary files
        run: rm -f .github/workflows/gpt-packet-schema-phase-fix.yml .gpt-packet-test.log
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: keep risk-floor phase marker out of flag inventory'
          git push origin HEAD:gpt/packet-schema-contract
