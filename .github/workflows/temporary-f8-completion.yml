name: Temporary F8 Completion

on:
  push:
    branches:
      - hardening-task/instruction-conflict-resolution

permissions:
  contents: write

jobs:
  complete-f8:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Close F8 metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          history = Path('IMPLEMENTATION_HISTORY.md')
          h = history.read_text()
          marker = '## 重大インシデント / 再オープン中\n\n'
          entry = ('- [x] F8 instruction conflict resolution: Track Aとしてwrapper-owned `INSTRUCTION_CONFLICT_BOUNDARY`を導入し、generic worker ruleをACTIVE taskまたはUSER_REQUEST由来のprimary authorityより従属させた。scope expansionとmachine contract overrideを禁止し、public surface追加はprimary authorityが要求・許可した場合だけ許容する。F5 rule-activation correctionにもpin済みACTIVE task authorityを再注入し、generic correction promptだけが局所ruleを優先する経路を閉じた。Track Bとして`common-code.md`の診断情報をinternal state/artifact/logger等の既存sinkへ限定してmachine stdout/stderrへのhuman text混入を禁止し、`cli.md`のshort option規則をprimary authority依存へ修正した。独立reviewでPlan非接続repoにおけるUSER_REQUEST authorityとdiagnostic sink表現を補正。production implementation run `33118531106` PASS、final validation run `33118860692`でworkflow conflict tests、既存machine-output contract tests、`go vet ./...`、`go build ./...`をPASS、clean production headの恒久Repository Lint `33118968569`もPASS。追加model/Sol callは0。runtime completion evidenceは後段で追記する。\n')
          if entry not in h:
              h = h.replace(marker, marker + entry, 1)
              history.write_text(h)

          plan = Path('IMPLEMENTATION_PLAN.local.md')
          p = plan.read_text()
          p = p.replace('- `IMPLEMENTATION_TASKS/instruction-conflict-resolution.md`\n\n## NEXT（優先順）', '- `IMPLEMENTATION_TASKS/016-worker-repo-search-integration.md`\n\n## NEXT（優先順）', 1)
          p = p.replace('- `IMPLEMENTATION_TASKS/016-worker-repo-search-integration.md`\n', '', 1)
          old = '- current implementation: F7 `prose-semantic-guard-migration`はPR #17のSquash Merge commit `1b4546548a5089c8160f6f53263ea91fb39a821d`としてCOMPLETE。F8 `instruction-conflict-resolution`がACTIVE'
          new = '- current implementation: F8 `instruction-conflict-resolution`はproduction実装・独立review・final validation `33118860692`・恒久Repository Lint `33118968569`までCOMPLETEでPR #18 merge待ち。F9 `017-reviewer-diff-first-search.md`は`016-worker-repo-search-integration.md`へのhard dependencyが未充足のため、016をACTIVEへ昇格'
          p = p.replace(old, new)
          p = p.replace('F8開始を妨げるdependency / permission waitはない。', 'F8はCOMPLETE。F9のhard dependencyを満たすため`016-worker-repo-search-integration.md`をACTIVEとして先行実装する。')
          p = p.replace('latest integrationをF8 branchへ履歴を書き換えず同期し、Rules / Plan / ACTIVE F8 taskを再読する。instruction conflict resolutionの現行production authorityとconflict pathを棚卸しし、F8 production実装を進める。', 'F8 completion runtime validationを完了し、最終completion-tree Repository Lint後にPR #18をSquash Mergeする。その後integration metadataを同期し、016専用task branchをlatest integrationへ履歴を書き換えず同期して開始する。')
          plan.write_text(p)

          task = Path('IMPLEMENTATION_TASKS/instruction-conflict-resolution.md')
          task.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close F8 completion metadata'
          git push
      - name: Install runtime prerequisites
        run: |
          export PATH="$HOME/go/bin:$PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o /tmp/shellcheck.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/shellcheck-v0.10.0/shellcheck "$HOME/.local/bin/shellcheck"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate installed runtime
        run: |
          git branch -m hardening/agent-guardrails
          ./install.sh
          build_dir=$(mktemp -d)
          cd glm-worker
          for pair in 'glm-worker ./cmd/glm-worker' 'commentlint ./cmd/commentlint' 'harnesslint ./cmd/harnesslint' 'merge-json ./cmd/merge-json'; do
            name=${pair%% *}
            pkg=${pair#* }
            go build -buildvcs=false -trimpath -o "$build_dir/$name" "$pkg"
            cmp "$build_dir/$name" "$HOME/.local/bin/$name"
          done
          cd ..
          cmp codex/instructions/worker/common-code.md "$HOME/.codex/instructions/worker/common-code.md"
          cmp codex/instructions/worker/cli.md "$HOME/.codex/instructions/worker/cli.md"
          "$HOME/.local/bin/glm-worker" --status >/tmp/f8-status.json
          python3 - <<'PY'
          import json
          with open('/tmp/f8-status.json') as f:
              value = json.load(f)
          if not isinstance(value, dict):
              raise SystemExit('status output is not a JSON object')
          PY
          git branch -m hardening-task/instruction-conflict-resolution
      - name: Record F8 runtime evidence
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          run_id = os.environ['GITHUB_RUN_ID']
          history = Path('IMPLEMENTATION_HISTORY.md')
          h = history.read_text()
          h = h.replace('追加model/Sol callは0。runtime completion evidenceは後段で追記する。', f'追加model/Sol callは0。runtime completion run `{run_id}`で`install.sh`本配置、`glm-worker`/`commentlint`/`harnesslint`/`merge-json`のsource rebuild一致、managed `common-code.md`/`cli.md`一致、installed `glm-worker --status` JSON smokeをPASSした。', 1)
          history.write_text(h)

          plan = Path('IMPLEMENTATION_PLAN.local.md')
          p = plan.read_text()
          p = p.replace('F8 `instruction-conflict-resolution`はproduction実装・独立review・final validation `33118860692`・恒久Repository Lint `33118968569`までCOMPLETEでPR #18 merge待ち。', f'F8 `instruction-conflict-resolution`はproduction実装・独立review・final validation `33118860692`・恒久Repository Lint `33118968569`・runtime completion `{run_id}`までCOMPLETEでPR #18 merge待ち。', 1)
          p = p.replace('F8 completion runtime validationを完了し、最終completion-tree Repository Lint後にPR #18をSquash Mergeする。', 'F8 completion-treeの最終Repository Lint後にPR #18をSquash Mergeする。', 1)
          plan.write_text(p)
          Path('.github/workflows/temporary-f8-completion.yml').unlink()
          PY
          git add -A
          git commit -m 'docs: record F8 runtime evidence'
          git push origin HEAD:hardening-task/instruction-conflict-resolution
