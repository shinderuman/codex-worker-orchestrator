name: Temporary F8 Completion

on:
  push:
    branches:
      - hardening-task/instruction-conflict-resolution

permissions:
  contents: write

jobs:
  complete-f8:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install runtime prerequisites
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/golangci/golangci-lint/releases/download/v2.1.6/golangci-lint-2.1.6-linux-amd64.tar.gz -o /tmp/golangci-lint.tar.gz
          tar -xzf /tmp/golangci-lint.tar.gz -C /tmp
          install -m 0755 /tmp/golangci-lint-2.1.6-linux-amd64/golangci-lint "$HOME/.local/bin/golangci-lint"
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 -o "$HOME/.local/bin/shfmt"
          chmod 0755 "$HOME/.local/bin/shfmt"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o /tmp/shellcheck.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 /tmp/shellcheck-v0.10.0/shellcheck "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate installed runtime
        run: |
          git branch -m hardening/agent-guardrails
          ./install.sh
          build_dir=$(mktemp -d)
          cd glm-worker
          for pair in 'glm-worker ./cmd/glm-worker' 'commentlint ./cmd/commentlint' 'harnesslint ./cmd/harnesslint' 'merge-json ./cmd/merge-json'; do
            name=${pair%% *}
            pkg=${pair#* }
            go build -buildvcs=false -trimpath -o "$build_dir/$name" "$pkg"
            cmp "$build_dir/$name" "$HOME/.local/bin/$name"
          done
          cd ..
          cmp codex/instructions/worker/common-code.md "$HOME/.codex/instructions/worker/common-code.md"
          cmp codex/instructions/worker/cli.md "$HOME/.codex/instructions/worker/cli.md"
          "$HOME/.local/bin/glm-worker" --status >/tmp/f8-status.json
          python3 - <<'PY'
          import json
          with open('/tmp/f8-status.json') as f:
              value = json.load(f)
          if not isinstance(value, dict):
              raise SystemExit('status output is not a JSON object')
          PY
          git branch -m hardening-task/instruction-conflict-resolution
      - name: Record F8 runtime evidence
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          run_id = os.environ['GITHUB_RUN_ID']
          history = Path('IMPLEMENTATION_HISTORY.md')
          h = history.read_text()
          h = h.replace('追加model/Sol callは0。runtime completion evidenceは後段で追記する。', f'追加model/Sol callは0。runtime completion run `{run_id}`で`install.sh`本配置、`glm-worker`/`commentlint`/`harnesslint`/`merge-json`のsource rebuild一致、managed `common-code.md`/`cli.md`一致、installed `glm-worker --status` JSON smokeをPASSした。', 1)
          history.write_text(h)

          plan = Path('IMPLEMENTATION_PLAN.local.md')
          p = plan.read_text()
          p = p.replace('F8 `instruction-conflict-resolution`はproduction実装・独立review・final validation `33118860692`・恒久Repository Lint `33118968569`までCOMPLETEでPR #18 merge待ち。', f'F8 `instruction-conflict-resolution`はproduction実装・独立review・final validation `33118860692`・恒久Repository Lint `33118968569`・runtime completion `{run_id}`までCOMPLETEでPR #18 merge待ち。', 1)
          p = p.replace('F8 completion runtime validationを完了し、最終completion-tree Repository Lint後にPR #18をSquash Mergeする。', 'F8 completion-treeの最終Repository Lint後にPR #18をSquash Mergeする。', 1)
          plan.write_text(p)
          Path('.github/workflows/temporary-f8-completion.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record F8 runtime evidence'
          git push origin HEAD:hardening-task/instruction-conflict-resolution
