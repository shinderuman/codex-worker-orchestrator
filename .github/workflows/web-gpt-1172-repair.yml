name: Web GPT 1172 repair

on:
  push:
    branches:
      - web-gpt/1172-review-target-shadow-evidence
    paths:
      - .github/workflows/web-gpt-1172-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1172-review-target-shadow-evidence
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Update common workflow fixture
        run: |
          perl -0pi -e 's/return nil, nil\n\t}/return []string{"tracked.go"}, nil\n\t}/' glm-worker/internal/workflow/workflow_test.go
          gofmt -w glm-worker/internal/workflow/workflow_test.go
          grep -A2 'w.collectChangedPaths = func' glm-worker/internal/workflow/workflow_test.go | head -3
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/workflow/workflow_test.go
          git diff --cached --quiet || git commit -m "test: provide default review target fixture"
          git push origin HEAD:web-gpt/1172-review-target-shadow-evidence
      - name: Focused tests
        run: |
          cd glm-worker
          go test ./internal/workflow ./internal/shadoweval
