name: Web GPT 1172 repair

on:
  push:
    branches:
      - web-gpt/1172-review-target-shadow-evidence
    paths:
      - .github/workflows/web-gpt-1172-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1172-review-target-shadow-evidence
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Update common workflow fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/workflow/workflow_test.go')
          text = path.read_text()
          old = '''\tw.collectChangedPaths = func(string, string) ([]string, error) {
\t\treturn nil, nil
\t}'''
          new = '''\tw.collectChangedPaths = func(string, string) ([]string, error) {
\t\treturn []string{"tracked.go"}, nil
\t}'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one default collectChangedPaths fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w glm-worker/internal/workflow/workflow_test.go
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/workflow/workflow_test.go
          git commit -m "test: provide default review target fixture"
          git push origin HEAD:web-gpt/1172-review-target-shadow-evidence
      - name: Focused tests
        run: |
          cd glm-worker
          go test ./internal/workflow ./internal/shadoweval
