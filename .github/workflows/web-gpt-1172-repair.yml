name: Web GPT 1172 repair

on:
  push:
    branches:
      - web-gpt/1172-review-target-shadow-evidence
    paths:
      - .github/workflows/web-gpt-1172-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1172-review-target-shadow-evidence
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Repair unused import
        run: |
          sed -i '/glm-worker\/internal\/reviewtarget/d' glm-worker/internal/workflow/workflow.go
          gofmt -w glm-worker/internal/workflow/workflow.go
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/workflow/workflow.go
          git diff --cached --quiet || git commit -m "fix: clean review target imports"
          git push origin HEAD:web-gpt/1172-review-target-shadow-evidence
      - name: Focused tests
        run: |
          cd glm-worker
          go test ./internal/workflow ./internal/shadoweval
