                if out.Len() != 0 {
                    t.Fatalf("producer emitted a packet without actual task targets: %s", out.String())
                }
                if st.TaskStatus() != before {
                    t.Fatalf("producer committed terminal/wait state without actual targets: before=%s after=%s", before, st.TaskStatus())
                }
            })
        }
    }
}
''')
