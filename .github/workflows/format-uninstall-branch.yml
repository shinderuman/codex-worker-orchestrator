name: Uninstall branch source formatting

on:
  push:
    branches:
      - web-gpt/installation-managed-uninstall

concurrency:
  group: uninstall-format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w glm-worker/cmd/uninstall/main.go glm-worker/internal/uninstallcmd/run.go glm-worker/internal/codexinstall/retire.go glm-worker/internal/codexinstall/retire_test.go glm-worker/internal/settingsmerge/retire.go glm-worker/internal/settingsmerge/retire_test.go
          tool_dir="$RUNNER_TEMP/uninstall-format-quality-tools"
          QUALITY_TOOLS_BIN_DIR="$tool_dir" ./install-quality-tools.sh
          "$tool_dir/codex-worker-orchestrator-shfmt-3.13.1" -i=0 -w uninstall.sh scripts/manage-pull-hook.sh tests/install_smoke.sh
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add glm-worker/cmd/uninstall/main.go glm-worker/internal/uninstallcmd/run.go glm-worker/internal/codexinstall/retire.go glm-worker/internal/codexinstall/retire_test.go glm-worker/internal/settingsmerge/retire.go glm-worker/internal/settingsmerge/retire_test.go uninstall.sh scripts/manage-pull-hook.sh tests/install_smoke.sh
            git commit -m 'style(uninstall): format Go and shell sources'
            git push origin HEAD:web-gpt/installation-managed-uninstall
          fi
