name: web-gpt-refactor-243
on: push
permissions:
  contents: write
jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/refactor-243-current-status-authority
      - run: python3 .github/web-gpt-refactor-243.py
      - run: gofmt -w glm-worker/internal/app/bundle.go glm-worker/internal/app/bundle_status_authority_test.go
      - name: Commit edit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/app/bundle.go glm-worker/internal/app/bundle_status_authority_test.go
          git commit -m 'refactor: keep live task status authoritative'
          git push origin HEAD:web-gpt/refactor-243-current-status-authority
