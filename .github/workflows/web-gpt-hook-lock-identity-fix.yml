name: Web GPT Hook Lock Identity Fix

on:
  push:
    branches:
      - web-gpt/review-fix/5eb816d-c2b6893

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply lock identity fix
        run: |
          python3 .github/web-gpt-lock-identity-fix.py
          rm .github/web-gpt-lock-identity-fix.py .github/workflows/web-gpt-hook-lock-identity-fix.yml
      - name: Validate shell
        run: |
          sh -n scripts/manage-pull-hook.sh
          sh -n tests/install_hook_ownership_smoke.sh
          sh tests/install_hook_ownership_smoke.sh
          git diff --check
      - name: Commit production fix
        run: |
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add scripts/manage-pull-hook.sh tests/install_hook_ownership_smoke.sh .github/web-gpt-lock-identity-fix.py .github/workflows/web-gpt-hook-lock-identity-fix.yml
          git commit -m "Harden hook installer lock identity"
          git push origin HEAD:web-gpt/review-fix/5eb816d-c2b6893
