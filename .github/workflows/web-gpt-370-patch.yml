name: Web GPT 370 Patch

on:
  push:
    branches:
      - web-gpt/370-parent-wait-runtime-enforcement

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply parent wait runtime ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply runtime wait ownership
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('glm-worker/internal/parentactioncmd/parentactioncmd.go')
          s = p.read_text()
          s = s.replace(' | complete | install | resume | park | unpark | evidence', ' | complete | install | resume | wait | park | unpark | evidence', 1)
          s = s.replace('''\tcase "install":
\t\treturn executeInstall(cfg, args, stdout, stderr)
\tcase actionApprove:''', '''\tcase "install":
\t\treturn executeInstall(cfg, args, stdout, stderr)
\tcase "wait":
\t\treturn executeParentWait(cfg, args, stdout, stderr)
\tcase actionApprove:''', 1)
          s = s.replace('''\treturn executePayloadAction(cfg.RepoRoot, descriptor, args[1:], stdout, stderr, extraEnv)
}''', '''\treturn withParentWaitLease(cfg, func() error {
\t\treturn executePayloadAction(cfg.RepoRoot, descriptor, args[1:], stdout, stderr, extraEnv)
\t})
}''', 1)
          s = s.replace('''\treturn runWorker(cfg.RepoRoot, directWorkerArgs(actionApprove), nil, stdout, stderr, nil)
}''', '''\treturn withParentWaitLease(cfg, func() error {
\t\treturn runWorker(cfg.RepoRoot, directWorkerArgs(actionApprove), nil, stdout, stderr, nil)
\t})
}''', 1)
          s = s.replace('''\tif action == "resume" {
\t\tif err := persistParentCodexIdentity(cfg); err != nil {
\t\t\treturn err
\t\t}
\t\treturn executeResumeWithGuardRepair(cfg, stdout, stderr, extraEnv)
\t}
\treturn runWorker(cfg.RepoRoot, directWorkerArgs(action), nil, stdout, stderr, extraEnv)
}''', '''\tif action == "resume" {
\t\tif err := persistParentCodexIdentity(cfg); err != nil {
\t\t\treturn err
\t\t}
\t\treturn withParentWaitLease(cfg, func() error {
\t\t\treturn executeResumeWithGuardRepair(cfg, stdout, stderr, extraEnv)
\t\t})
\t}
\tif action == actionStart {
\t\treturn withParentWaitLease(cfg, func() error {
\t\t\treturn runWorker(cfg.RepoRoot, directWorkerArgs(action), nil, stdout, stderr, extraEnv)
\t\t})
\t}
\treturn runWorker(cfg.RepoRoot, directWorkerArgs(action), nil, stdout, stderr, extraEnv)
}''', 1)
          p.write_text(s)

          Path('glm-worker/internal/parentactioncmd/parent_wait.go').write_text(r'''package parentactioncmd

import (
	"bytes"
	"encoding/json"
	"fmt"
	"io"

	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/config"
	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/repolock"
	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"
)

const parentWaitLockFile = "parent-wait.lock"

const parentWaitStatusReleased = "released"

type parentWaitOutput struct {
	Status    string          `json:"status"`
	TaskStatus state.TaskStatus `json:"task_status"`
	OwnerLost bool            `json:"owner_lost"`
	Handoff   json.RawMessage `json:"handoff"`
}

func withParentWaitLease(cfg config.AppConfig, body func() error) error {
	st, err := state.NewStateStore(cfg)
	if err != nil {
		return err
	}
	lock, err := repolock.Acquire(st.Path(parentWaitLockFile))
	if err != nil {
		return fmt.Errorf("parent wait owner is already active: %w", err)
	}
	defer func() { _ = lock.Close() }()
	return body()
}

func executeParentWait(cfg config.AppConfig, args []string, stdout, stderr io.Writer) error {
	if len(args) != 1 {
		return fmt.Errorf("usage: glm-parent-action wait")
	}
	st, err := state.NewStateStore(cfg)
	if err != nil {
		return err
	}
	owner, err := repolock.AcquireWait(st.Path(parentWaitLockFile))
	if err != nil {
		return fmt.Errorf("wait for parent owner: %w", err)
	}
	defer func() { _ = owner.Close() }()

	worker, err := repolock.AcquireWait(st.LockPath())
	if err != nil {
		return fmt.Errorf("wait for worker owner: %w", err)
	}
	if err := worker.Close(); err != nil {
		return err
	}

	handoff, err := parentWaitHandoff(cfg, stderr)
	if err != nil {
		return err
	}
	status := st.TaskStatus()
	return json.NewEncoder(stdout).Encode(parentWaitOutput{
		Status:     parentWaitStatusReleased,
		TaskStatus: status,
		OwnerLost:  status == state.TaskStatusActive,
		Handoff:    handoff,
	})
}

func parentWaitHandoff(cfg config.AppConfig, stderr io.Writer) (json.RawMessage, error) {
	var output bytes.Buffer
	if err := runWorker(cfg.RepoRoot, []string{"--handoff", "recovery"}, nil, &output, stderr, nil); err != nil {
		return nil, err
	}
	data := bytes.TrimSpace(output.Bytes())
	var object map[string]any
	if err := json.Unmarshal(data, &object); err != nil || object == nil {
		return nil, fmt.Errorf("parent wait recovery handoff is not a JSON object")
	}
	return json.RawMessage(bytes.Clone(data)), nil
}
''')

          Path('glm-worker/internal/parentactioncmd/parent_wait_test.go').write_text(r'''package parentactioncmd

import (
	"bytes"
	"encoding/json"
	"errors"
	"os"
	"path/filepath"
	"testing"
	"time"

	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/repolock"
	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"
