name: Temporary F5 Marker Boundary

on:
  push:
    branches:
      - hardening-task/deterministic-rule-activation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply marker-boundary fix
        run: |
          sed -i "s/addition = r'''/addition = '''/" .github/f5_marker_patch.py
          python3 .github/f5_marker_patch.py
          gofmt -w glm-worker/internal/state/resume.go glm-worker/internal/workflow/rule_activation.go glm-worker/internal/workflow/rule_activation_test.go
      - name: Focused tests
        working-directory: glm-worker
        run: go test ./internal/state ./internal/workflow ./internal/runner
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
      - name: Commit validated fix
        run: |
          rm .github/workflows/temporary-f5-marker-boundary.yml .github/f5_marker_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/state/resume.go glm-worker/internal/workflow/rule_activation.go glm-worker/internal/workflow/rule_activation_test.go .github/workflows/temporary-f5-marker-boundary.yml .github/f5_marker_patch.py
          git commit -m 'fix: keep rule activation authority in wrapper state'
          git push
