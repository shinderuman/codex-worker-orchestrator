name: GPT PR46 Validation

on:
  push:
    branches:
      - gpt/effective-compaction-window
    paths:
      - .github/workflows/gpt-pr46-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read Go version
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Test
        working-directory: glm-worker
        run: go test ./... -count=1
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
