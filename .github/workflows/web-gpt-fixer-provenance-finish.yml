name: Web GPT Fixer Provenance Finish

on:
  push:
    branches:
      - web-gpt/review-fix/5eb816d-c2b6893

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply provenance boundary
        run: |
          python3 .github/web-gpt-fixer-provenance-finish.py
          rm .github/web-gpt-fixer-provenance-finish.py .github/workflows/web-gpt-fixer-provenance-finish.yml
          gofmt -w glm-worker/internal/harnesslint/fix_isolation.go glm-worker/internal/harnesslint/fix_isolation_test.go glm-worker/internal/harnesslint/run.go glm-worker/internal/harnesslint/types.go glm-worker/internal/workflow/quality_gate.go glm-worker/internal/workflow/quality_fixer_snapshot_test.go glm-worker/internal/workflow/review_flow.go
      - name: Validate focused provenance tests
        run: |
          cd glm-worker
          go test ./internal/harnesslint ./internal/workflow
          cd ..
          git diff --check
      - name: Commit production fix
        run: |
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add glm-worker/internal/harnesslint/fix_isolation.go glm-worker/internal/harnesslint/fix_isolation_test.go glm-worker/internal/harnesslint/run.go glm-worker/internal/harnesslint/types.go glm-worker/internal/workflow/quality_gate.go glm-worker/internal/workflow/quality_fixer_snapshot_test.go glm-worker/internal/workflow/review_flow.go .github/web-gpt-fixer-provenance-finish.py .github/workflows/web-gpt-fixer-provenance-finish.yml
          git commit -m "Prove quality fixer postimage provenance"
          git push origin HEAD:web-gpt/review-fix/5eb816d-c2b6893
