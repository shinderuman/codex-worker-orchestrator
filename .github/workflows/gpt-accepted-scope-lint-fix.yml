name: GPT accepted scope lint fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'gpt/accepted-sol-decision-scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply lint-safe accepted scope wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: match count={count} for {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'codex/instructions/glm-execution.md',
              '- Sol High自身が現在のnon-parent diffを確認し、fix本文で撤回・縮小を指示する部分以外は受理済みと明示判断した場合だけ、`--fix-stdin`へ`--accepted-scope current-diff`を追加してよい。`--origin`やreviewerのPASSからこの受理を推測しない。不確実なら指定しない。glm-workerはfix開始時のchange setをscopeとして保存し、fix後のchange setがそのsubsetである場合だけ同一HIGH riskの再Sol escalationを省略する。新しい変更・別replacement・新規file内容・比較不能なbinary/dirty baselineがあれば通常のrisk floorへ戻る。\n',
              '',
          )
          replace_once(
              'codex/instructions/glm-packets.md',
              '- 修正が必要ならCodex自身で編集せず、修正方針本文を`~/.codex/instructions/glm-execution.md`のstdin mode（`--fix-stdin <payload-bytes>`）で同じworker sessionへ差し戻す。修正後は独立reviewerまで自動再実行される。\n',
              '- 修正が必要ならCodex自身で編集せず、修正方針本文を`~/.codex/instructions/glm-execution.md`のstdin mode（`--fix-stdin <payload-bytes>`）で同じworker sessionへ差し戻す。修正後は独立reviewerまで自動再実行される。Sol自身が現diffの残存部分を受理し、fixが撤回・縮小だけなら`--accepted-scope current-diff`を付ける。不確実または新規変更を許すfixでは付けない。\n',
          )

          replace_once(
              'glm-worker/internal/app/app.go',
              'func applyStdinPayloadOption(command *Command, name, value, usage string, allowOrigin bool, seenSHA256 *bool) error {\n\tswitch name {',
              'func applyStdinPayloadOption(command *Command, name, value, usage string, allowOrigin bool, seenSHA256 *bool) error {\n\tif name == "--accepted-scope" {\n\t\treturn applyAcceptedScopeOption(command, value, usage, allowOrigin)\n\t}\n\tswitch name {',
          )
          replace_once(
              'glm-worker/internal/app/app.go',
              '\tcase "--accepted-scope":\n\t\tif !allowOrigin || command.AcceptedScope != "" || value != "current-diff" {\n\t\t\treturn usageError("%s", usage)\n\t\t}\n\t\tcommand.AcceptedScope = value\n\t\treturn nil\n',
              '',
          )
          replace_once(
              'glm-worker/internal/app/app.go',
              '\nfunc parsePayloadSHA256(value string) (string, error) {',
              '\nfunc applyAcceptedScopeOption(command *Command, value, usage string, allowOrigin bool) error {\n\tif !allowOrigin || command.AcceptedScope != "" || value != "current-diff" {\n\t\treturn usageError("%s", usage)\n\t}\n\tcommand.AcceptedScope = value\n\treturn nil\n}\n\nfunc parsePayloadSHA256(value string) (string, error) {',
          )

          replace_once(
              'glm-worker/internal/workflow/workflow.go',
              '\t\tpocStage := decl.pocStage()\n\t\tif err := w.state.Remove(acceptedFixScopeStateFile); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tif err := w.state.Write("last-decision", decision); err != nil {\n\t\t\treturn err\n\t\t}',
              '\t\tpocStage := decl.pocStage()\n\t\tif err := w.replaceAcceptedScopeWithDecision(decision); err != nil {\n\t\t\treturn err\n\t\t}',
          )
          replace_once(
              'glm-worker/internal/workflow/workflow.go',
              '\nfunc (w *Workflow) ExecuteExplicitFix(instruction, origin string) error {',
              '\nfunc (w *Workflow) replaceAcceptedScopeWithDecision(decision string) error {\n\tif err := w.state.Remove(acceptedFixScopeStateFile); err != nil {\n\t\treturn err\n\t}\n\treturn w.state.Write("last-decision", decision)\n}\n\nfunc (w *Workflow) ExecuteExplicitFix(instruction, origin string) error {',
          )
          replace_once(
              'glm-worker/internal/workflow/workflow.go',
              '\treturn quietWhenParentFileGuardStopped(w.withTemp(func() error {\n\t\tif acceptedScope != "" && acceptedScope != acceptedFixScopeCurrentDiff {\n\t\t\treturn &WorkerError{Message: "unknown accepted fix scope: " + acceptedScope}\n\t\t}\n\t\tif w.state.Exists("pending-decision") {',
              '\treturn quietWhenParentFileGuardStopped(w.withTemp(func() error {\n\t\tif w.state.Exists("pending-decision") {',
          )

          path = Path('glm-worker/internal/workflow/accepted_fix_scope.go')
          text = path.read_text()
          old = '''const (
\tacceptedFixScopeStateFile   = "accepted-fix-scope.json"
\tacceptedFixScopeCurrentDiff = "current-diff"
\tacceptedFixScopeVersion     = 1
)

type acceptedFixScope struct {
\tVersion      int            `json:"version"`
\tBaselineHead string         `json:"baseline_head"`
\tChanges      map[string]int `json:"changes"`
}
'''
          new = '''type acceptedFixScope struct {
\tVersion      int            `json:"version"`
\tBaselineHead string         `json:"baseline_head"`
\tChanges      map[string]int `json:"changes"`
}

type acceptedPatchState struct {
\toldLine        int
\tinHunk         bool
\tpreviousChange byte
}

const (
\tacceptedFixScopeStateFile   = "accepted-fix-scope.json"
\tacceptedFixScopeCurrentDiff = "current-diff"
\tacceptedFixScopeVersion     = 1
)
'''
          if text.count(old) != 1:
              raise SystemExit('accepted_fix_scope declaration anchor mismatch')
          text = text.replace(old, new, 1)
          start = text.index('func addPatchScopeChanges(')
          end = text.index('\nfunc changeSetSubset(', start)
          replacement = r'''func addPatchScopeChanges(changes map[string]int, path string, patch []byte) error {
\tif bytes.Contains(patch, []byte("GIT binary patch")) || bytes.Contains(patch, []byte("Binary files ")) || bytes.IndexByte(patch, 0) >= 0 {
\t\treturn fmt.Errorf("accepted scope cannot compare binary patch %s", path)
\t}
\tstate := acceptedPatchState{}
\tfor _, line := range strings.Split(string(patch), "\n") {
\t\thandled, err := state.addMetadataChange(changes, path, line)
\t\tif err != nil {
\t\t\treturn err
\t\t}
\t\tif handled {
\t\t\tcontinue
\t\t}
\t\tif err := state.addHunkChange(changes, path, line); err != nil {
\t\t\treturn err
\t\t}
\t}
\treturn nil
}

func (s *acceptedPatchState) addMetadataChange(changes map[string]int, path, line string) (bool, error) {
\tswitch {
\tcase line == "":
\t\treturn true, nil
\tcase strings.HasPrefix(line, "diff --git "), strings.HasPrefix(line, "index "), strings.HasPrefix(line, "--- "), strings.HasPrefix(line, "+++ "):
\t\treturn true, nil
\tcase strings.HasPrefix(line, "old mode "), strings.HasPrefix(line, "new mode "), strings.HasPrefix(line, "new file mode "), strings.HasPrefix(line, "deleted file mode "):
\t\tchanges["meta\x00"+path+"\x00"+line]++
\t\treturn true, nil
\tcase strings.HasPrefix(line, "@@ "):
\t\tmatch := zeroContextHunk.FindStringSubmatch(line)
\t\tif match == nil {
\t\t\treturn true, fmt.Errorf("accepted scope cannot parse hunk %q", line)
\t\t}
\t\tvalue, err := strconv.Atoi(match[1])
\t\tif err != nil {
\t\t\treturn true, err
\t\t}
\t\ts.oldLine = value
\t\ts.inHunk = true
\t\ts.previousChange = 0
\t\treturn true, nil
\tcase strings.HasPrefix(line, `\\ No newline at end of file`):
\t\tif !s.inHunk || s.previousChange == 0 {
\t\t\treturn true, fmt.Errorf("accepted scope cannot place no-newline marker in %s", path)
\t\t}
\t\tchanges[fmt.Sprintf("newline\x00%s\x00%c\x00%d", path, s.previousChange, s.oldLine)]++
\t\treturn true, nil
\tcase !s.inHunk:
\t\treturn true, fmt.Errorf("accepted scope cannot parse patch metadata %q", line)
\tdefault:
\t\treturn false, nil
\t}
}

func (s *acceptedPatchState) addHunkChange(changes map[string]int, path, line string) error {
\tswitch line[0] {
\tcase '-':
\t\tchanges[fmt.Sprintf("line\x00%s\x00-\x00%d\x00%s", path, s.oldLine, line[1:])]++
\t\ts.oldLine++
\t\ts.previousChange = '-'
\tcase '+':
\t\tchanges[fmt.Sprintf("line\x00%s\x00+\x00%d\x00%s", path, s.oldLine, line[1:])]++
\t\ts.previousChange = '+'
\tcase ' ':
\t\ts.oldLine++
\t\ts.previousChange = 0
\tdefault:
\t\treturn fmt.Errorf("accepted scope cannot parse patch line %q", line)
\t}
\treturn nil
}
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          Path('glm-worker/internal/workflow/accepted_fix_scope_risk_test.go').write_text(r'''package workflow

import (
\t"io"
\t"testing"

\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/config"
\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/packet"
\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"
)

func TestAcceptedFixScopeSkipsRedundantRiskFloorCall(t *testing.T) {
\trepo := t.TempDir()
\tgitScope(t, repo, "init")
\tgitScope(t, repo, "config", "user.email", "scope@example.invalid")
\tgitScope(t, repo, "config", "user.name", "scope-test")
\twriteScopeFile(t, repo, "code.go", "package sample\\n")
\tgitScope(t, repo, "add", ".")
\tgitScope(t, repo, "commit", "-m", "baseline")

\tcfg := config.AppConfig{RepoRoot: repo, StateBase: t.TempDir(), RepoHash: "scope-risk"}
\tst, err := state.NewStateStore(cfg)
\tif err != nil {
\t\tt.Fatal(err)
\t}
\tif err := state.CaptureGitBaseline(cfg, st); err != nil {
\t\tt.Fatal(err)
\t}
\twriteScopeFile(t, repo, "code.go", "package sample\\n\\nvar retained = 1\\nvar removeMe = 2\\n")

\trunner := &scriptedRunner{}
\tw := NewWorkflow(cfg, st, runner, io.Discard)
\tw.prepareAcceptedFixScope(acceptedFixScopeCurrentDiff)
\twriteScopeFile(t, repo, "code.go", "package sample\\n\\nvar retained = 1\\n")

\tresult, stopped, err := w.enforceRiskFloor("request", packet.Result{}, 1, 0, "none", true, packet.Result{Status: packet.StatusPass})
\tif err != nil || stopped || result.Status != packet.StatusPass {
\t\tt.Fatalf("result = %#v, stopped=%v, err=%v", result, stopped, err)
\t}
\tif len(runner.phases) != 0 {
\t\tt.Fatalf("redundant risk-floor model call phases = %v", runner.phases)
\t}
}
''')
          PY
          gofmt -w glm-worker/internal/app/app.go glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/accepted_fix_scope.go glm-worker/internal/workflow/accepted_fix_scope_risk_test.go
          git rm .github/workflows/gpt-accepted-scope-lint-fix.yml
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add codex/instructions/glm-execution.md codex/instructions/glm-packets.md glm-worker/internal/app/app.go glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/accepted_fix_scope.go glm-worker/internal/workflow/accepted_fix_scope_risk_test.go
          git commit -m 'fix: keep accepted scope guard within quality budget'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Focused tests
        working-directory: glm-worker
        run: go test ./internal/app ./internal/workflow ./internal/state -count=1
      - name: Full tests
        working-directory: glm-worker
        run: go test ./... -count=1
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
