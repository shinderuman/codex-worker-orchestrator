name: Web GPT 369 Validation

on:
  push:
    branches:
      - web-gpt/369-runtime-install-completion

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply fixture repairs
        if: github.event.head_commit.message == 'ci: apply #369 fixture repairs'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parent = Path('glm-worker/internal/parentactioncmd/parentactioncmd_test.go')
          text = parent.read_text()
          old = 'StateBase: filepath.Join(root, "sessions"),'
          new = 'StateBase: filepath.Join(t.TempDir(), "sessions"),'
          if text.count(old) != 1:
              raise SystemExit(f'parent fixture match count: {text.count(old)}')
          parent.write_text(text.replace(old, new, 1))

          install = Path('glm-worker/internal/parentactioncmd/install_test.go')
          text = install.read_text()
          old = '[]byte("#!/bin/sh\\nexit 0\\n"), 0o755)'
          new = '[]byte("#!/bin/sh\\n# baseline install fixture\\nexit 0\\n"), 0o755)'
          if text.count(old) < 1:
              raise SystemExit('install baseline fixture not found')
          text = text.replace(old, new, 1)
          old = '''t.Run("guard rejected", func(t *testing.T) {
              cfg, st := newInstallActionRepo(t)
              if err := st.SetTaskStatus(state.TaskStatusAwaitingParentCompletion); err != nil {'''
          new = '''t.Run("guard rejected", func(t *testing.T) {
              cfg, st := newInstallActionRepo(t)
              if err := os.Remove(filepath.Join(cfg.RepoRoot, installScriptName)); err != nil {
                  t.Fatal(err)
              }
              if err := st.SetTaskStatus(state.TaskStatusAwaitingParentCompletion); err != nil {'''
          if text.count(old) != 1:
              raise SystemExit(f'guard fixture match count: {text.count(old)}')
          install.write_text(text.replace(old, new, 1))
          PY
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add glm-worker/internal/parentactioncmd/parentactioncmd_test.go glm-worker/internal/parentactioncmd/install_test.go
          git commit -m 'test: repair runtime install fixtures'
          git push origin HEAD:web-gpt/369-runtime-install-completion
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Repository lint gate
        run: ./harnesslint
      - name: Full Go test suite
        working-directory: glm-worker
        run: go test ./...
      - name: Install smoke
        run: ./tests/install_smoke.sh
