name: Web GPT 369 Validation

on:
  push:
    branches:
      - web-gpt/369-runtime-install-completion

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Install smoke admission diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/install_smoke.sh')
          text = path.read_text()
          needle = '''grep -q 'install is not admitted' "$tmp/parent-action-install.stderr"'''
          if text.count(needle) != 1:
              raise SystemExit('admission assertion not found')
          path.write_text(text.replace(needle, '''cat "$tmp/parent-action-install.stderr" >&2\n''' + needle, 1))
          PY
          sh -x ./tests/install_smoke.sh
