name: Temporary 016 Implementation

on:
  push:
    branches:
      - hardening-task/worker-repo-search-integration

permissions:
  contents: write

jobs:
  implement-016:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply production routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/workflow/workflow.go')
          s = path.read_text()
          s = s.replace('captureQualitySurface func(root string) (string, error)\n', 'captureQualitySurface func(root string) (string, error)\n\trepoSearch             repoSearchFunc\n', 1)
          s = s.replace('captureQualitySurface: captureQualitySurfaceDigest,\n', 'captureQualitySurface: captureQualitySurfaceDigest,\n\t\trepoSearch:             defaultRepoSearch,\n', 1)
          s = s.replace('prompt := newTaskPrompt(request, activeTaskPath)\n', 'prompt := w.newWorkerTaskPrompt(request, activeTaskPath)\n', 1)
          path.write_text(s)
          PY
          cat > glm-worker/internal/workflow/worker_repo_search.go <<'EOF'
          package workflow

          import (
          	"context"
          	"fmt"
          	"os"
          	"path/filepath"
          	"strconv"
          	"strings"
          	"time"

          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/reposearch"
          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"
          )

          type repoSearchFunc func(context.Context, string, string, reposearch.Options) (reposearch.Report, error)

          const (
          	repoSearchPhase         = "worker-repo-search"
          	repoSearchKnownSkip     = "known-target-skip"
          	repoSearchHit           = "search-hit"
          	repoSearchEmptyFallback = "search-empty-fallback"
          	repoSearchErrorFallback = "search-error-fallback"
          	repoSearchMaxResults    = 8
          )

          func defaultRepoSearch(ctx context.Context, root string, query string, opts reposearch.Options) (reposearch.Report, error) {
          	return reposearch.Search(ctx, root, query, opts)
          }

          func (w *Workflow) newWorkerTaskPrompt(request string, activeTaskPath string) string {
          	prompt := newTaskPrompt(request, activeTaskPath)
          	search := w.repoSearch
          	if search == nil {
          		search = defaultRepoSearch
          	}
          	block, outcome := routeWorkerRepoSearch(context.Background(), w.config.RepoRoot, request, search)
          	w.recordWorkerRepoSearchOutcome(outcome)
          	if block == "" {
          		return prompt
          	}
          	return strings.TrimRight(prompt, "\n") + block
          }

          func routeWorkerRepoSearch(ctx context.Context, repoRoot string, request string, search repoSearchFunc) (string, string) {
          	if requestHasKnownRepoTarget(repoRoot, request) {
          		return "", repoSearchKnownSkip
          	}
          	report, err := search(ctx, repoRoot, request, reposearch.Options{MaxResults: repoSearchMaxResults})
          	if err != nil {
          		return "", repoSearchErrorFallback
          	}
          	if len(report.Results) == 0 {
          		return "", repoSearchEmptyFallback
          	}
          	return renderRepoSearchNavigation(report.Results), repoSearchHit
          }

          func requestHasKnownRepoTarget(repoRoot string, request string) bool {
          	for _, raw := range strings.Fields(request) {
          		candidate := normalizeRequestPathCandidate(raw)
          		if candidate == "" || filepath.IsAbs(candidate) {
          			continue
          		}
          		path := filepath.Join(repoRoot, filepath.FromSlash(candidate))
          		rel, err := filepath.Rel(repoRoot, path)
          		if err != nil || rel == ".." || strings.HasPrefix(rel, ".."+string(filepath.Separator)) {
          			continue
          		}
          		if _, err := os.Lstat(path); err == nil {
          			return true
          		}
          	}
          	return false
          }

          func normalizeRequestPathCandidate(raw string) string {
          	value := strings.Trim(raw, "`'\"()[]{}<>.,;:、。")
          	value = strings.TrimPrefix(value, "./")
          	if index := strings.LastIndex(value, ":"); index > 0 {
          		if _, err := strconv.Atoi(value[index+1:]); err == nil {
          			value = value[:index]
          		}
          	}
          	return filepath.ToSlash(value)
          }

          func renderRepoSearchNavigation(results []reposearch.Result) string {
          	var block strings.Builder
          	block.WriteString("\n\nREPO_SEARCH_NAVIGATION:\n")
          	block.WriteString("MODE: wrapper-bm25-navigation\n")
          	block.WriteString(fmt.Sprintf("RESULT_COUNT: %d\n", len(results)))
          	for _, result := range results {
          		block.WriteString("CANDIDATE: ")
          		block.WriteString(result.Path)
          		if result.Line > 0 {
          			block.WriteString(":")
          			block.WriteString(strconv.Itoa(result.Line))
          		}
          		block.WriteString("\n")
          	}
          	block.WriteString("AUTHORITY: navigation-only\n")
          	block.WriteString("END_REPO_SEARCH_NAVIGATION\n")
          	return block.String()
          }

          func (w *Workflow) recordWorkerRepoSearchOutcome(outcome string) {
          	taskID, err := w.state.TaskID()
          	if err != nil {
          		return
          	}
          	now := time.Now
          	if w.now != nil {
          		now = w.now
          	}
          	at := now().UTC()
          	w.state.RecordModelCallLog(state.ModelCallLog{
          		TaskID:      taskID,
          		CallType:    state.CallTypeEvent,
          		StartedAt:   at,
          		CompletedAt: at,
          		Phase:       repoSearchPhase,
          		Role:        state.WorkerRole,
          		Outcome:     outcome,
          	})
          }
          EOF
          cat > glm-worker/internal/workflow/worker_repo_search_test.go <<'EOF'
          package workflow

          import (
          	"context"
          	"errors"
          	"os"
          	"path/filepath"
          	"strings"
          	"testing"
          	"time"

          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/config"
          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/reposearch"
          	"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"
          )

          func TestRouteWorkerRepoSearchSkipsKnownTarget(t *testing.T) {
          	root := t.TempDir()
          	path := filepath.Join(root, "internal", "workflow", "workflow.go")
          	if err := os.MkdirAll(filepath.Dir(path), 0o700); err != nil {
          		t.Fatal(err)
          	}
          	if err := os.WriteFile(path, []byte("package workflow\n"), 0o600); err != nil {
          		t.Fatal(err)
          	}
          	calls := 0
          	search := func(context.Context, string, string, reposearch.Options) (reposearch.Report, error) {
          		calls++
          		return reposearch.Report{}, nil
          	}
          	block, outcome := routeWorkerRepoSearch(context.Background(), root, "fix `internal/workflow/workflow.go`", search)
          	if calls != 0 || block != "" || outcome != repoSearchKnownSkip {
          		t.Fatalf("calls=%d block=%q outcome=%q", calls, block, outcome)
          	}
          }

          func TestRouteWorkerRepoSearchInjectsUnknownTargetCandidates(t *testing.T) {
          	search := func(_ context.Context, root string, query string, opts reposearch.Options) (reposearch.Report, error) {
          		if root != "/repo" || query != "find worker dispatch" || opts.MaxResults != repoSearchMaxResults {
          			t.Fatalf("root=%q query=%q opts=%#v", root, query, opts)
          		}
          		return reposearch.Report{Results: []reposearch.Result{
          			{Path: "glm-worker/internal/workflow/workflow.go", Line: 142},
          			{Path: "glm-worker/internal/workflow/prompts.go", Line: 31},
          		}}, nil
          	}
          	block, outcome := routeWorkerRepoSearch(context.Background(), "/repo", "find worker dispatch", search)
          	if outcome != repoSearchHit {
          		t.Fatalf("outcome=%q", outcome)
          	}
          	for _, want := range []string{
          			"REPO_SEARCH_NAVIGATION:",
          			"CANDIDATE: glm-worker/internal/workflow/workflow.go:142",
          			"CANDIDATE: glm-worker/internal/workflow/prompts.go:31",
          			"AUTHORITY: navigation-only",
          		} {
          			if !strings.Contains(block, want) {
          				t.Fatalf("missing %q in %s", want, block)
          			}
          	}
          }

          func TestRouteWorkerRepoSearchFallsBackOnEmptyOrError(t *testing.T) {
          	tests := []struct {
          		name    string
          		report  reposearch.Report
          		err     error
          		outcome string
          	}{
          		{name: "empty", outcome: repoSearchEmptyFallback},
          		{name: "error", err: errors.New("unavailable"), outcome: repoSearchErrorFallback},
          	}
          	for _, tt := range tests {
          		t.Run(tt.name, func(t *testing.T) {
          			search := func(context.Context, string, string, reposearch.Options) (reposearch.Report, error) {
          				return tt.report, tt.err
          			}
          			block, outcome := routeWorkerRepoSearch(context.Background(), t.TempDir(), "unknown target", search)
          			if block != "" || outcome != tt.outcome {
          				t.Fatalf("block=%q outcome=%q", block, outcome)
          			}
          		})
          	}
          }

          func TestNewWorkerTaskPromptRecordsRepoSearchTelemetry(t *testing.T) {
          	root := t.TempDir()
          	cfg := config.AppConfig{RepoRoot: root, RepoHash: "repo-search-routing", StateBase: t.TempDir()}
          	st, err := state.NewStateStore(cfg)
          	if err != nil {
          		t.Fatal(err)
          	}
          	taskID, err := st.StartNewTask()
          	if err != nil {
          		t.Fatal(err)
          	}
          	fixed := time.Date(2026, 8, 28, 0, 0, 0, 0, time.UTC)
          	w := NewWorkflow(cfg, st, nil, nil)
          	w.now = func() time.Time { return fixed }
          	w.repoSearch = func(context.Context, string, string, reposearch.Options) (reposearch.Report, error) {
          		return reposearch.Report{Results: []reposearch.Result{{Path: "internal/worker.go", Line: 9}}}, nil
          	}
          	prompt := w.newWorkerTaskPrompt("unknown worker target", "")
          	if !strings.Contains(prompt, "CANDIDATE: internal/worker.go:9") {
          		t.Fatalf("navigation missing from production prompt: %s", prompt)
          	}
          	logs, err := st.ReadModelCallLogs(taskID)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if len(logs) != 1 || logs[0].CallType != state.CallTypeEvent || logs[0].Phase != repoSearchPhase || logs[0].Outcome != repoSearchHit {
          		t.Fatalf("logs=%#v", logs)
          	}
          	if logs[0].Prompt != "" || logs[0].Response != "" {
          		t.Fatalf("repo-search telemetry stored payload: %#v", logs[0])
          	}
          }
          EOF
          gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/worker_repo_search.go glm-worker/internal/workflow/worker_repo_search_test.go
      - name: Validate 016 routing
        working-directory: glm-worker
        run: |
          go test ./internal/workflow ./internal/reposearch
          go test -race ./internal/workflow ./internal/reposearch
          go vet ./...
          go build ./...
      - name: Commit implementation
        run: |
          rm .github/workflows/temporary-016-implementation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: route unknown worker targets through repo search'
          git push
