name: Temporary F5 Deterministic Rule Activation

on:
  push:
    branches:
      - hardening-task/deterministic-rule-activation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply F5 wiring
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: anchor count={count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          runner = Path("glm-worker/internal/runner/runner.go")
          replace_once(
              runner,
              "\tSystemPromptSHA256 string\n\n\tPlainFailure ProviderFailureClass\n",
              "\tSystemPromptSHA256 string\n\tInstructionReads   []string\n\n\tPlainFailure ProviderFailureClass\n",
          )
          replace_once(
              runner,
              "\tparsed, parseErr := parseCapturedStreamResult(ingester.result())\n",
              "\tresult.InstructionReads = ingester.instructionReadNames()\n\tparsed, parseErr := parseCapturedStreamResult(ingester.result())\n",
          )

          events = Path("glm-worker/internal/runner/stream_events.go")
          replace_once(events, '\t"sort"\n\t"time"\n', '\t"sort"\n\t"strings"\n\t"time"\n')
          replace_once(
              events,
              "\ttools      map[string]toolUseObservation\n\tnow        func() time.Time\n",
              "\ttools            map[string]toolUseObservation\n\tinstructionReads map[string]struct{}\n\tnow              func() time.Time\n",
          )
          replace_once(
              events,
              "\t\ttools: make(map[string]toolUseObservation),\n\t\tnow:   time.Now,\n",
              "\t\ttools:            make(map[string]toolUseObservation),\n\t\tinstructionReads: make(map[string]struct{}),\n\t\tnow:              time.Now,\n",
          )
          replace_once(
              events,
              '''\tif input, ok := inputs[block.ToolID]; ok {
          \t\tdetail := extractLiveToolDetail(input)
          \t\tobservation.command = detail.command
          \t\tobservation.purpose = detail.purpose
          \t\tobservation.background = detail.background
          \t\tobservation.waitTaskID = detail.waitTaskID
          \t}
          ''',
              '''\tif input, ok := inputs[block.ToolID]; ok {
          \t\tdetail := extractLiveToolDetail(input)
          \t\tobservation.command = detail.command
          \t\tobservation.purpose = detail.purpose
          \t\tobservation.background = detail.background
          \t\tobservation.waitTaskID = detail.waitTaskID
          \t\tif name, matched := workerInstructionReadName(observation.name, input); matched {
          \t\t\tg.instructionReads[name] = struct{}{}
          \t\t}
          \t}
          ''',
          )
          helper_anchor = "func (g *streamEventIngester) observeToolResult(block *state.TaskBlockSummary, at time.Time) bool {"
          helper = r'''func workerInstructionReadName(toolName string, input json.RawMessage) (string, bool) {
          	if toolName != "Read" || len(input) == 0 {
          		return "", false
          	}
          	var parsed struct {
          		FilePath string `json:"file_path"`
          	}
          	if err := json.Unmarshal(input, &parsed); err != nil {
          		return "", false
          	}
          	path := strings.ReplaceAll(parsed.FilePath, "\\", "/")
          	if !strings.Contains(path, "/instructions/worker/") {
          		return "", false
          	}
          	name := path[strings.LastIndexByte(path, '/')+1:]
          	switch name {
          	case "common-code.md", "testing.md", "state-transitions.md", "cli.md",
          		"go.md", "javascript.md", "php.md", "eslint.md":
          		return name, true
          	default:
          		return "", false
          	}
          }

          func (g *streamEventIngester) instructionReadNames() []string {
          	if len(g.instructionReads) == 0 {
          		return nil
          	}
          	result := make([]string, 0, len(g.instructionReads))
          	for name := range g.instructionReads {
          		result = append(result, name)
          	}
          	sort.Strings(result)
          	return result
          }

          '''
          replace_once(events, helper_anchor, helper + helper_anchor)

          workflow = Path("glm-worker/internal/workflow/workflow.go")
          replace_once(
              workflow,
              "\tlastProducer state.ParentReviewProducer\n}\n",
              "\tlastProducer             state.ParentReviewProducer\n\tobservedInstructionReads map[string]struct{}\n}\n",
          )
          replace_once(
              workflow,
              "\tworkerResult, err := w.runModel(checkpoint)\n",
              "\tworkerResult, err := w.runWorkerModelWithRuleActivation(checkpoint)\n",
          )
          replace_once(
              workflow,
              '''\tresult, err := w.runModel(checkpoint)
          \tif err != nil {
          \t\treturn w.handleResumeRunError(checkpoint, previousCheckpoint, err)
          \t}
          ''',
              '''\tw.resetInstructionReadObservation()
          \tresult, err := w.runModel(checkpoint)
          \tif err != nil {
          \t\treturn w.handleResumeRunError(checkpoint, previousCheckpoint, err)
          \t}
          ''',
          )
          replace_once(
              workflow,
              "\tcheckpoint.Prompt = resumePrompt(checkpoint)\n\tif checkpoint.Stage == state.ResumeStageWorker {\n",
              '''\tcheckpoint.Prompt = resumePrompt(checkpoint)
          \tif checkpoint.Role == state.WorkerRole && !checkpoint.ReportOnly {
          \t\tactivatedCheckpoint, _, activationErr := w.activateCheckpointRules(checkpoint)
          \t\tif activationErr != nil {
          \t\t\treturn checkpoint, false, activationErr
          \t\t}
          \t\tcheckpoint = activatedCheckpoint
          \t}
          \tif checkpoint.Stage == state.ResumeStageWorker {
          ''',
          )
          replace_once(
              workflow,
              "\treturn w.handleWorkerResult(checkpoint.Request, result, checkpoint.Phase)\n}\n\nfunc (w *Workflow) routeReviewResumeResult",
              '''\tresult, err := w.convergeWorkerRuleActivation(checkpoint, result, w.activatedRulesForCheckpoint(checkpoint))
          \tif err != nil {
          \t\treturn err
          \t}
          \treturn w.handleWorkerResult(checkpoint.Request, result, checkpoint.Phase)
          }

          func (w *Workflow) routeReviewResumeResult''',
          )
          replace_once(
              workflow,
              '''\treturn w.handleAutoFixResult(
          \t\tcheckpoint.Request,
          \t\tresult,
          \t\tcheckpoint.ReviewNumber,
          \t\tcheckpoint.AutoFixes,
          \t\tcheckpoint.Phase,
          \t)
          }

          func isKnownResumeStage''',
              '''\tif !checkpoint.ReportOnly {
          \t\tvar err error
          \t\tresult, err = w.convergeWorkerRuleActivation(checkpoint, result, w.activatedRulesForCheckpoint(checkpoint))
          \t\tif err != nil {
          \t\t\treturn err
          \t\t}
          \t}
          \treturn w.handleAutoFixResult(
          \t\tcheckpoint.Request,
          \t\tresult,
          \t\tcheckpoint.ReviewNumber,
          \t\tcheckpoint.AutoFixes,
          \t\tcheckpoint.Phase,
          \t)
          }

          func isKnownResumeStage''',
          )
          replace_once(
              workflow,
              '''\tprompt := reviewerPrompt(
          \t\trequest,
          \t\tdecision,
          \t\tworkerReport,
          \t\treviewNumber,
          \t\tw.state.BaselineDescription(),
          \t\tactiveTaskPath,
          \t)
          \treturn state.ResumeCheckpoint{
          ''',
              '''\tprompt := reviewerPrompt(
          \t\trequest,
          \t\tdecision,
          \t\tworkerReport,
          \t\treviewNumber,
          \t\tw.state.BaselineDescription(),
          \t\tactiveTaskPath,
          \t)
          \tprompt, err = w.withCurrentRuleContext(prompt)
          \tif err != nil {
          \t\treturn state.ResumeCheckpoint{}, "", false, err
          \t}
          \treturn state.ResumeCheckpoint{
          ''',
          )
          replace_once(
              workflow,
              "\tfixResult, err := w.runModel(checkpoint)\n",
              "\tfixResult, err := w.runWorkerModelWithRuleActivation(checkpoint)\n",
          )
          replace_once(
              workflow,
              '''\texecution, err = w.resolveModelCallFailure(checkpoint, outputPath, execution)
          \tif err != nil {
          \t\treturn packet.Result{}, err
          \t}
          \tif err := w.finalizeModelCallState(checkpoint, outputPath, execution); err != nil {
          ''',
              '''\texecution, err = w.resolveModelCallFailure(checkpoint, outputPath, execution)
          \tif err != nil {
          \t\treturn packet.Result{}, err
          \t}
          \tw.observeInstructionReads(execution.runResult.InstructionReads)
          \tif err := w.finalizeModelCallState(checkpoint, outputPath, execution); err != nil {
          ''',
          )
          PY
          gofmt -w glm-worker/internal/workflow/rule_activation.go glm-worker/internal/workflow/rule_activation_test.go glm-worker/internal/workflow/workflow.go glm-worker/internal/runner/runner.go glm-worker/internal/runner/stream_events.go glm-worker/internal/runner/instruction_reads_test.go
      - name: Focused tests
        run: go -C glm-worker test ./internal/runner ./internal/workflow
      - name: Vet
        run: go -C glm-worker vet ./internal/runner ./internal/workflow
      - name: Build
        run: go -C glm-worker build ./...
      - name: Commit validated implementation
        run: |
          rm .github/workflows/temporary-f5-rule-activation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/workflow/rule_activation.go glm-worker/internal/workflow/rule_activation_test.go glm-worker/internal/workflow/workflow.go glm-worker/internal/runner/runner.go glm-worker/internal/runner/stream_events.go glm-worker/internal/runner/instruction_reads_test.go .github/workflows/temporary-f5-rule-activation.yml
          git commit -m 'hardening: activate worker rules deterministically'
          git push
