name: Temporary F8 Implementation

on:
  push:
    branches:
      - hardening-task/instruction-conflict-resolution

permissions:
  contents: write

jobs:
  implement-f8:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply F8 production conflict boundary
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('glm-worker/internal/workflow/rule_activation.go')
          text = p.read_text()
          old = '''\tblock.WriteString(strings.Join(files, ","))
          \tblock.WriteString("\\nwrapperが実diffから決定論的に選択したcontractです。以下の本文を今回の作業・reviewへ適用してください。\\n")
          '''
          new = '''\tblock.WriteString(strings.Join(files, ","))
          \tblock.WriteString("\\n")
          \tblock.WriteString(renderInstructionConflictBoundary(defaultInstructionConflictBoundary()))
          \tblock.WriteString("wrapperが実diffから決定論的に選択したcontractです。以下の本文を今回の作業・reviewへ適用してください。\\n")
          '''
          if old not in text:
              raise SystemExit('worker rule context anchor missing')
          text = text.replace(old, new, 1)

          old = '''\tprompt := fmt.Sprintf(`MODE: APPLY_DETERMINISTIC_RULES

          ORIGINAL_USER_REQUEST:
          %s

          PREVIOUS_SOL_DECISION:
          %s

          %s
          実diffに対してwrapperが必要contractの未適用を検出しました。
          '''
          new = '''\tprimaryAuthority := activeTaskPromptBlock(w.readActiveTaskState())
          \tprompt := fmt.Sprintf(`MODE: APPLY_DETERMINISTIC_RULES

          ORIGINAL_USER_REQUEST:
          %s

          PREVIOUS_SOL_DECISION:
          %s

          %s%s
          実diffに対してwrapperが必要contractの未適用を検出しました。
          '''
          if old not in text:
              raise SystemExit('rule correction prompt anchor missing')
          text = text.replace(old, new, 1)
          old = ''', parent.Request, parent.Decision, block)
          \tcorrection := parent
          '''
          new = ''', parent.Request, parent.Decision, primaryAuthority, block)
          \tcorrection := parent
          '''
          if old not in text:
              raise SystemExit('rule correction fmt args missing')
          p.write_text(text.replace(old, new, 1))

          p = Path('codex/instructions/worker/common-code.md')
          text = p.read_text()
          old = '- エラーを握り潰さず原因調査に必要な情報を保持・ログ出力する。'
          new = '- エラーを握り潰さず原因調査に必要な情報を保持する。診断情報は内部state・artifact・logger等の既存診断sinkへ記録し、外部machine stdout/stderrへ人間向けtextを追加しない。'
          if old not in text:
              raise SystemExit('common-code diagnostic rule missing')
          p.write_text(text.replace(old, new, 1))

          p = Path('codex/instructions/worker/cli.md')
          text = p.read_text()
          old = '''# CLI規則
          - CLIオプション追加時は可能な限り対応する短縮オプションも用意する。
          - 短縮形を設けない場合は合理的理由が必要。
          '''
          new = '''# CLI規則
          - task-specific contractが短縮オプションを要求・許可しているCLIオプションでは、既存CLI規約と整合する短縮形を用意する。
          - task-specific contractが長形式だけを要求している、または短縮形が要求外public surfaceを増やす場合は短縮形を追加しない。
          '''
          if old not in text:
              raise SystemExit('cli rule body missing')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w glm-worker/internal/workflow/instruction_conflict.go glm-worker/internal/workflow/instruction_conflict_test.go glm-worker/internal/workflow/instruction_conflict_integration_test.go glm-worker/internal/workflow/rule_activation.go
      - name: Validate F8 representative conflicts
        working-directory: glm-worker
        run: |
          go test ./internal/workflow
          go vet ./...
          go build ./...
      - name: Commit F8 implementation
        run: |
          rm .github/workflows/temporary-f8-implementation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'hardening: resolve generic instruction conflicts deterministically'
          git push
