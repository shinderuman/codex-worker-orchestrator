              '''func (s *StateStore) ReleaseSessionRotationClaim(parentThreadID, directiveID, claimID string, result SessionRotationCreationResult) error {
\tmarker, err := s.LoadSessionRotationMarker(parentThreadID)
\tif err != nil {
\t\treturn err
\t}
\tif marker == nil || marker.Directive == nil || marker.Claim == nil || marker.Directive.DirectiveID != directiveID || marker.Claim.ClaimID != claimID {
