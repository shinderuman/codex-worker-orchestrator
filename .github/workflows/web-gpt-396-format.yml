name: Web GPT Issue 396 Format

on:
  push:
    branches:
      - web-gpt/issue-396-sol-review-evidence
    paths:
      - .github/workflows/web-gpt-396-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-396-sol-review-evidence
      - name: Format tests
        run: |
          gofmt -w glm-worker/internal/state/parent_review_evidence_test.go glm-worker/internal/app/parent_review_evidence_test.go
          rm .github/workflows/web-gpt-396-format.yml
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m "Format review evidence regressions"
          git push origin HEAD:web-gpt/issue-396-sol-review-evidence
