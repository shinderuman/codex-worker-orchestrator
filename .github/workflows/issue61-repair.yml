name: Issue 61 Workflow Repair

on:
  push:
    branches:
      - gpt/issue-61-temp-index-read-tree

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Fix issue 61 workflow syntax') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/issue-61-temp-index-read-tree
      - name: Repair implementation workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/issue61-implement.yml')
          s = p.read_text()
          old = "s = s.replace(anchor, helper + anchor, 1)"
          new = "s = s.replace(anchor, helper + '\\n' + anchor, 1)"
          if old not in s:
              raise SystemExit('helper insertion anchor not found')
          p.write_text(s.replace(old, new, 1))
          Path('glm-worker/internal/runner/issue61_debug_test.go').unlink(missing_ok=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/issue61-implement.yml glm-worker/internal/runner/issue61_debug_test.go
          git commit -m 'Fix issue 61 workflow syntax'
          git push origin HEAD:gpt/issue-61-temp-index-read-tree
