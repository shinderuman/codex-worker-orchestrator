name: Temporary Brew Completion Reconciliation

on:
  push:
    branches:
      - hardening-maintenance/reconcile-brew-completion

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconcile tracked metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plan_path = Path("IMPLEMENTATION_PLAN.local.md")
          plan = plan_path.read_text()
          old_schedule = """## ACTIVE

          - `IMPLEMENTATION_TASKS/installer-missing-dependency-brew-hint.md`

          ## NEXT（優先順）

          - `IMPLEMENTATION_TASKS/instruction-surface-ownership.md`
          """
          new_schedule = """## ACTIVE

          - `IMPLEMENTATION_TASKS/instruction-surface-ownership.md`

          ## NEXT（優先順）

          """
          if old_schedule not in plan:
              raise SystemExit("expected brew ACTIVE schedule not found")
          plan = plan.replace(old_schedule, new_schedule, 1)
          boundary = """## 現在のGit境界

          - branch: `hardening/agent-guardrails`
          - accepted main baseline: `815efc8f6601d344a93e8fa213d0227306db1f0d`
          - implementation boundary: PR #3 `6f08b301e9c4e1444af80c9b9ee646eb778a3baa`でrepository quality linter、PR #4 `b5a4f2e9fd4a3199470e9df0759c8b969f6813c5`でrepository-wide quality enforcement、PR #5 `21cb94b5f4b9800f8092f2e2f5afc276ad37ae62`でmetadata reconciliation、PR #6 `2c8bf5fe22b529dd446c65bd43b6a2289819730d`でPlan branch metadata修復、PR #7 `a111e0adc2d4f299e677f85148f34906d74e9c2c`でinstaller Homebrew hint、PR #9 `84e3baf18fc8d1c722682288c91ceb1623fd4e20`で恒久Repository Lint、PR #10 `815efc8f6601d344a93e8fa213d0227306db1f0d`でGreptile / CodeRabbit自動review停止をmainへ反映済み
          - preserved boundary: wake coalescing、machine output、safe-stop/resume、provider accounting、parent-managed metadata guard、GLM commit/push禁止、Direct Codex対orchestratedのCodex Reduction / Quality Delta最上位評価を維持
          - current implementation: `hardening/agent-guardrails`をintegration branchとし、`hardening-task/instruction-surface-ownership`のPR #8でF1 instruction surface ownership hardeningを進行中
          - merge boundary: hardening taskは専用task branchへ細かくcheckpoint commit/pushし、taskごとに`hardening/agent-guardrails`向けPRをSquash Mergeして1 task = 1 integration commitとする。hardening campaign完了時はintegrationからmainへSquashしないmergeを行う

          ## 現在の停止理由

          PR #7はmainへmerge済みで、ユーザーからmerge後の`./install.sh`が問題なく動作することを確認済み。Brew hint taskを完了としてHistoryへ移し、`instruction-surface-ownership`をACTIVEとしてhardening campaignを継続する。

          ## 次の親Codex操作

          PR #8のtask固有validation・恒久lint・最終diffを閉じ、`hardening/agent-guardrails`へSquash Mergeする。その後Plan優先順に次のhardening taskへ進む。
          """
          marker = "## 現在のGit境界"
          if marker not in plan:
              raise SystemExit("git boundary section not found")
          plan = plan[:plan.index(marker)] + boundary
          plan_path.write_text(plan)

          task_path = Path("IMPLEMENTATION_TASKS/instruction-surface-ownership.md")
          task = task_path.read_text()
          current_marker = "## Current boundary\n\n"
          if current_marker not in task:
              raise SystemExit("instruction task current boundary not found")
          task = task[:task.index(current_marker)] + current_marker + "ACTIVE。Track Aのtask-wide instruction identity / mutation restore / session破棄とTrack Bのrepo instruction HIGH分類をproductionへ実装済み。task branchで恒久lint、targeted test / vet、全package buildがPASSしており、一時validation workflow削除後の最終lintとintegration squashを残す。\n"
          task_path.write_text(task)

          history_path = Path("IMPLEMENTATION_HISTORY.md")
          history = history_path.read_text()
          evidence = "- [x] installer missing dependency Homebrew hint: PR #7 `a111e0adc2d4f299e677f85148f34906d74e9c2c`で、Homebrew formulaを明示対応した`golangci-lint` / `shellcheck` / `shfmt`欠落時に既存fail-closed errorへ`brew install <formula>`案内を追加し、標準commandでは誤ったhintを出さないpositive/negative install smoke regressionを導入。main merge後、ユーザーから`./install.sh`が問題なく動作することを確認した。\n"
          if evidence not in history:
              with history_path.open("a") as stream:
                  stream.write("\n## 2026-08-28 parent completion reconciliation\n\n")
                  stream.write(evidence)

          Path("IMPLEMENTATION_TASKS/installer-missing-dependency-brew-hint.md").unlink()
          PY
          rm .github/workflows/temporary-reconcile-brew.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: reconcile completed brew task metadata'
          git push origin "HEAD:${GITHUB_REF_NAME}"
