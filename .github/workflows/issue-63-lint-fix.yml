name: Issue 63 Lint Fix

on:
  push:
    branches:
      - gpt/issue-63-active-feasibility

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix issue 63 lint findings') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/issue-63-active-feasibility
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Apply lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('glm-worker/internal/taskcontract/task.go')
          s = p.read_text()
          start = s.index('const (')
          end = s.index('var feasibilityFieldKeys')
          header = '''type ExternalFeasibility struct {
              Status         string
              Assumption     string
              EvidenceSource string
              Evidence       string
              GoDecision     string
          }

          type FeasibilityRejectKind int

          type FeasibilityError struct {
              Kind   FeasibilityRejectKind
              Reason string
          }

          const (
              TasksDir                   = "IMPLEMENTATION_TASKS"
              ExternalFeasibilityHeading = "## External feasibility"

              FeasibilityRejectMissing FeasibilityRejectKind = iota + 1
              FeasibilityRejectMalformed
              FeasibilityRejectUnverified

              StatusNotApplicable  = "not-applicable"
              StatusPoC            = "poc"
              StatusObservation    = "observation"
              StatusImplementation = "implementation"

              evidenceProducer = "producer"
          )

          '''
          header = '\n'.join(line[10:] if line.startswith('          ') else line for line in header.splitlines())
          p.write_text(s[:start] + header + s[end:])

          p = Path('glm-worker/internal/workflow/activetask.go')
          s = p.read_text()
          s = s.replace('entries, err := activeSectionEntries(string(content))', 'entries, err := taskcontract.ActiveSectionEntries(string(content))')
          s = s.replace('if err := validateActiveTaskPath(path); err != nil {', 'if err := taskcontract.ValidateActiveTaskPath(path); err != nil {')
          start = s.index('func activeSectionEntries')
          end = s.index('func (w *Workflow) readActiveTaskState')
          p.write_text(s[:start] + s[end:])

          p = Path('glm-worker/internal/workflow/plan_final_head.go')
          s = p.read_text()
          if 'internal/taskcontract' not in s:
              s = s.replace('"strings"\n)', '"strings"\n\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/taskcontract"\n)')
          s = s.replace('activeSectionEntries(plan)', 'taskcontract.ActiveSectionEntries(plan)')
          s = s.replace('activeSectionEntries(synthetic)', 'taskcontract.ActiveSectionEntries(synthetic)')
          s = s.replace('validateActiveTaskPath(path)', 'taskcontract.ValidateActiveTaskPath(path)')
          p.write_text(s)

          src = Path('glm-worker/internal/workflow/activetask_parser_test.go')
          dst = Path('glm-worker/internal/taskcontract/task_test.go')
          s = src.read_text()
          s = s.replace('package workflow', 'package taskcontract', 1)
          s = s.replace('validateActiveTaskPath(', 'ValidateActiveTaskPath(')
          s = s.replace('activeSectionEntries(', 'ActiveSectionEntries(')
          dst.write_text(s)
          src.unlink()
          PY
          gofmt -w glm-worker/internal/taskcontract/task.go glm-worker/internal/taskcontract/task_test.go glm-worker/internal/workflow/activetask.go glm-worker/internal/workflow/plan_final_head.go
          git diff --check
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A glm-worker/internal/taskcontract glm-worker/internal/workflow/activetask.go glm-worker/internal/workflow/activetask_parser_test.go glm-worker/internal/workflow/plan_final_head.go
          git commit -m 'Fix issue 63 lint findings'
          git push origin HEAD:gpt/issue-63-active-feasibility
