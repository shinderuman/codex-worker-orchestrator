name: GPT PR57 refactor validate

on:
  push:
    branches:
      - gpt/reviewer-current-diff-evidence

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/reviewer-current-diff-evidence
      - name: Validate
        shell: bash
        run: |
          cd glm-worker
          go test ./internal/state ./internal/workflow -count=1
          go vet ./...
          go build ./...
