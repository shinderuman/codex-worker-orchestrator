name: Web GPT 364 Fix Plan Fixture

on:
  push:
    branches:
      - web-gpt/364-quality-scope-fail-closed

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/364-quality-scope-fail-closed
          fetch-depth: 0
      - name: Keep interrupted task scheduled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/app/isolation_plan_process_test.go')
          text = path.read_text()
          old = 'switchedPlan := []byte("# 計画\\n\\n## ACTIVE\\n\\n- `" + planInterruptionTaskPath + "`\\n")'
          new = 'switchedPlan := []byte("# 計画\\n\\n## ACTIVE\\n\\n- `" + planInterruptionTaskPath + "`\\n\\n## BLOCKED\\n\\n- `" + planOriginalTaskPath + "`\\n")'
          if old not in text:
              raise SystemExit('switched plan fixture insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/app/isolation_plan_process_test.go
          git commit -m 'test: keep interrupted task scheduled during isolation'
          git push origin HEAD:web-gpt/364-quality-scope-fail-closed
