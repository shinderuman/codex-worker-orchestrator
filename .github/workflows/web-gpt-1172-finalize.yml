name: Web GPT 1172 finalize

on:
  push:
    branches:
      - web-gpt/1172-review-target-shadow-evidence

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Apply target corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'glm-worker/internal/workflow/workflow.go',
              '''func (w *Workflow) nonConvergedResult(reviewResult packet.Result) (packet.Result, error) {
          \ttargets, err := w.currentReviewDiffTargets()
          ''',
              '''func (w *Workflow) nonConvergedResult(reviewResult packet.Result) (packet.Result, error) {
          \ttargets, err := w.resultOrCurrentReviewTargets(reviewResult)
          ''',
          )
          replace_once(
              'glm-worker/internal/workflow/workflow.go',
              '\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/reviewtarget"\n',
              '',
          )

          p = Path('glm-worker/internal/workflow/parent_validation.go')
          text = p.read_text()
          pattern = r'(func \(w \*Workflow\) parentValidationNonConvergedResult\(failure packet\.Result\) \(packet\.Result, error\) \{\n\t)targets, err := w\.currentReviewDiffTargets\(\)'
          updated, count = re.subn(pattern, r'\1targets, err := w.resultOrCurrentReviewTargets(failure)', text, count=1)
          if count != 1:
              raise SystemExit(f'parent_validation.go: expected one target resolver match, found {count}')
          p.write_text(updated)

          for p in Path('glm-worker/internal/workflow').glob('*_test.go'):
              text = p.read_text()
              if 'collectReviewTargetPaths' in text:
                  p.write_text(text.replace('collectReviewTargetPaths', 'collectChangedPaths'))
          PY
          gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/parent_validation.go glm-worker/internal/workflow/*_test.go
      - name: Commit target corrections
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow
          git commit -m 'fix: preserve semantic review targets'
          git push origin HEAD:web-gpt/1172-review-target-shadow-evidence
      - name: Focused workflow tests
        working-directory: glm-worker
        run: go test ./internal/workflow
