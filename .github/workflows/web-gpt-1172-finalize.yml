name: Web GPT 1172 finalize

on:
  push:
    branches:
      - web-gpt/1172-review-target-shadow-evidence

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Align shared target fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              'glm-worker/internal/workflow/parent_validation_test.go',
              'glm-worker/internal/workflow/plan_file_guard_test.go',
              'glm-worker/internal/workflow/report_only_snapshot_test.go',
              'glm-worker/internal/workflow/repository_boundary_activation_test.go',
              'glm-worker/internal/workflow/review_end_snapshot_test.go',
              'glm-worker/internal/workflow/review_resume_parent_canonical_test.go',
              'glm-worker/internal/workflow/review_resume_parent_test.go',
              'glm-worker/internal/workflow/workflow_snapshot_test.go',
          ]

          def call_end(text, paren):
              depth = 0
              in_string = False
              escape = False
              for i in range(paren, len(text)):
                  ch = text[i]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
                      if depth == 0:
                          return i + 1
              return None

          changed = []
          for filename in files:
              p = Path(filename)
              text = p.read_text()
              original = text
              pos = 0
              while True:
                  m = re.search(r'(?m)^(\s*)([A-Za-z_]\w*)\s*:=\s*(?:NewWorkflow|newWorkflow\w*)\s*\(', text[pos:])
                  if not m:
                      break
                  absolute = pos + m.start()
                  paren = text.find('(', absolute)
                  end = call_end(text, paren)
                  if end is None:
                      raise SystemExit(f'{filename}: cannot locate constructor call end')
                  var = m.group(2)
                  indent = m.group(1)
                  tail = text[end:end+240]
                  if re.match(r'\s*\n\s*' + re.escape(var) + r'\.collectChangedPaths\s*=', tail):
                      pos = end
                      continue
                  injection = f'\n{indent}{var}.collectChangedPaths = func(string, string) ([]string, error) {{ return []string{{"fixture.go"}}, nil }}'
                  text = text[:end] + injection + text[end:]
                  pos = end + len(injection)
              if text != original:
                  p.write_text(text)
                  changed.append(filename)

          if not changed:
              raise SystemExit('no shared workflow fixtures were patched')
          print('\n'.join(changed))
          PY
          gofmt -w glm-worker/internal/workflow/*_test.go
      - name: Commit shared fixture alignment
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow
          git commit -m 'test: align shared review target fixtures'
          git push origin HEAD:web-gpt/1172-review-target-shadow-evidence
      - name: Focused workflow tests
        working-directory: glm-worker
        run: go test ./internal/workflow
