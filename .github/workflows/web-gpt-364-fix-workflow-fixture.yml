name: Web GPT 364 Fix Workflow Fixture

on:
  push:
    branches:
      - web-gpt/364-quality-scope-fail-closed

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/364-quality-scope-fail-closed
          fetch-depth: 0
      - name: Keep generic unit fixture outside quality scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/workflow/interrupted_retention_test.go')
          text = path.read_text()
          old = 'w.captureQualitySurface = func(string) (string, error) { return "quality-baseline", nil }'
          new = 'w.captureQualitySurface = func(string) (string, error) { return "", nil }'
          if old not in text:
              raise SystemExit('quality surface fixture insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/workflow/interrupted_retention_test.go
          git commit -m 'test: keep generic workflow fixture outside quality scope'
          git push origin HEAD:web-gpt/364-quality-scope-fail-closed
