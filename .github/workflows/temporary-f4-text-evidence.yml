name: Temporary F4 Text Evidence

on:
  push:
    branches:
      - hardening-task/quality-evidence-mutation-risk

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Narrow non-Go evidence signal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/workflow/quality_evidence.go')
          text = path.read_text()
          old = '''func qualityEvidenceSignatures(path string, data []byte, exists bool) ([]string, error) {
          \tif !exists {
          \t\treturn nil, nil
          \t}
          \tif strings.HasSuffix(strings.ToLower(path), ".go") {
          \t\treturn goQualityEvidenceSignatures(data)
          \t}
          \treturn textQualityEvidenceSignatures(data), nil
          }
'''.replace('          ', '')
          new = '''func qualityEvidenceSignatures(path string, data []byte, exists bool) ([]string, error) {
          \tif !exists {
          \t\treturn nil, nil
          \t}
          \tlower := strings.ToLower(path)
          \tif strings.HasSuffix(lower, ".go") {
          \t\treturn goQualityEvidenceSignatures(data)
          \t}
          \tif strings.HasSuffix(lower, ".json") {
          \t\treturn jsonQualityEvidenceSignatures(data)
          \t}
          \treturn textQualityEvidenceSignatures(data), nil
          }
'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'qualityEvidenceSignatures anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''func textQualityEvidenceSignatures(data []byte) []string {
          \tsignatures := []string{"file:text-test"}
          \tfor _, raw := range strings.Split(string(data), "\\n") {
          \t\tline := strings.Join(strings.Fields(raw), " ")
          \t\tif line == "" || strings.HasPrefix(line, "#") || strings.HasPrefix(line, "//") {
          \t\t\tcontinue
          \t\t}
          \t\tsignatures = append(signatures, "line:"+line)
          \t}
          \treturn signatures
          }
'''.replace('          ', '')
          new = '''func jsonQualityEvidenceSignatures(data []byte) ([]string, error) {
          \tvar value any
          \tif err := json.Unmarshal(data, &value); err != nil {
          \t\treturn nil, err
          \t}
          \tsignatures := []string{"file:json-test"}
          \tfor range countJSONEvidenceUnits(value) {
          \t\tsignatures = append(signatures, "json-unit")
          \t}
          \treturn signatures, nil
          }

          func countJSONEvidenceUnits(value any) int {
          \tswitch item := value.(type) {
          \tcase map[string]any:
          \t\tcount := 0
          \t\tfor _, child := range item {
          \t\t\tcount++
          \t\t\tcount += countJSONEvidenceUnits(child)
          \t\t}
          \t\treturn count
          \tcase []any:
          \t\tcount := 0
          \t\tfor _, child := range item {
          \t\t\tcount++
          \t\t\tcount += countJSONEvidenceUnits(child)
          \t\t}
          \t\treturn count
          \tdefault:
          \t\treturn 1
          \t}
          }

          func textQualityEvidenceSignatures(data []byte) []string {
          \tsignatures := []string{"file:text-test"}
          \tfor _, raw := range strings.Split(string(data), "\\n") {
          \t\tline := strings.Join(strings.Fields(raw), " ")
          \t\tif line == "" || strings.HasPrefix(line, "#") || strings.HasPrefix(line, "//") {
          \t\t\tcontinue
          \t\t}
          \t\tsignatures = append(signatures, "text-unit")
          \t}
          \treturn signatures
          }
'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'textQualityEvidenceSignatures anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('glm-worker/internal/workflow/quality_evidence_test.go')
          tests = test_path.read_text()
          anchor = '''func TestParentBehaviorEvalStatusOnlyChangeStaysLow(t *testing.T) {'''
          insert = '''func TestTextQualityEvidenceMechanicalUpdateStaysLow(t *testing.T) {
          \troot, baseline := newQualityEvidencePathRepo(t, "tests/cases.txt", "case one\\ncase two\\n")
          \twriteGitTestFile(t, root, "tests/cases.txt", "case alpha\\ncase beta\\n")
          \tdecision := qualityEvidenceDecisionForTest(t, root, baseline)
          \tif decision.High {
          \t\tt.Fatalf("mechanical text update raised risk: %#v", decision)
          \t}
          }

          func TestTextQualityEvidenceCoverageDeletionRaisesRisk(t *testing.T) {
          \troot, baseline := newQualityEvidencePathRepo(t, "tests/cases.txt", "case one\\ncase two\\n")
          \twriteGitTestFile(t, root, "tests/cases.txt", "case one\\n")
          \tdecision := qualityEvidenceDecisionForTest(t, root, baseline)
          \tif !decision.High || decision.Source != "track-a-evidence-removed" {
          \t\tt.Fatalf("decision = %#v", decision)
          \t}
          }
          
          '''.replace('          ', '')
          if tests.count(anchor) != 1:
              raise SystemExit(f'test insertion anchor count={tests.count(anchor)}')
          tests = tests.replace(anchor, insert + anchor, 1)
          helper_anchor = '''func newQualityEvidenceRegistryRepo(t *testing.T, status, positive string) (string, string) {'''
          helper = '''func newQualityEvidencePathRepo(t *testing.T, path, content string) (string, string) {
          \tt.Helper()
          \troot := t.TempDir()
          \trunGitTest(t, root, "init")
          \trunGitTest(t, root, "config", "user.email", "quality@example.invalid")
          \trunGitTest(t, root, "config", "user.name", "quality evidence")
          \twriteGitTestFile(t, root, path, content)
          \trunGitTest(t, root, "add", ".")
          \trunGitTest(t, root, "commit", "-m", "baseline")
          \treturn root, runGitTest(t, root, "rev-parse", "HEAD")
          }

          '''.replace('          ', '')
          if tests.count(helper_anchor) != 1:
              raise SystemExit(f'helper anchor count={tests.count(helper_anchor)}')
          test_path.write_text(tests.replace(helper_anchor, helper + helper_anchor, 1))
          PY
          gofmt -w glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/quality_evidence_test.go
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Workflow tests
        run: go -C glm-worker test ./internal/workflow
      - name: Workflow vet
        run: go -C glm-worker vet ./internal/workflow
      - name: Commit validated narrowing
        run: |
          rm .github/workflows/temporary-f4-text-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker/internal/workflow/quality_evidence.go glm-worker/internal/workflow/quality_evidence_test.go .github/workflows/temporary-f4-text-evidence.yml
          git commit -m 'hardening: narrow non-Go quality evidence risk signal'
          git push
