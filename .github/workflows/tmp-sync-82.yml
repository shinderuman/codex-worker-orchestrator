name: Temporary Sync 82

on:
  push:
    branches:
      - gpt/accept-completes-82

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/accept-completes-82
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Merge current main and validate
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          cd glm-worker
          go test ./...
          go vet ./...
          go build ./...
          cd ..
          git push origin HEAD:gpt/accept-completes-82
