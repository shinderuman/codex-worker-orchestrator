name: GPT PR56 funlen fix

on:
  push:
    branches:
      - gpt/high-floor-first-review

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/high-floor-first-review
      - name: Extract floor context helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('glm-worker/internal/workflow/workflow.go')
          text = p.read_text()
          old = '\tfloorActive := risk.high && !w.acceptedFixScopeCoversCurrent()\n\tphase := fmt.Sprintf("reviewer-%d", reviewNumber)\n\tif floorActive {\n\t\tphase += "-high-floor"\n\t}\n'
          new = '\tphase, floorPrompt, floorActive := w.reviewerRiskFloorContext(reviewNumber, risk)\n'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('floor phase block not found')
              text = text.replace(old, new, 1)
          old = '\tif floorActive {\n\t\tprompt += reviewerHighRiskFloorPrompt(risk.source)\n\t}\n'
          new = '\tprompt += floorPrompt\n'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('floor prompt block not found')
              text = text.replace(old, new, 1)
          marker = 'func (w *Workflow) runReviewModel('
          helper = 'func (w *Workflow) reviewerRiskFloorContext(reviewNumber int, risk effectiveRisk) (string, string, bool) {\n\tfloorActive := risk.high && !w.acceptedFixScopeCoversCurrent()\n\tphase := fmt.Sprintf("reviewer-%d", reviewNumber)\n\tif !floorActive {\n\t\treturn phase, "", false\n\t}\n\treturn phase + "-high-floor", reviewerHighRiskFloorPrompt(risk.source), true\n}\n\n'
          if helper not in text:
              if text.count(marker) != 1:
                  raise SystemExit('runReviewModel marker not found')
              text = text.replace(marker, helper + marker, 1)
          p.write_text(text)
          PY
          gofmt -w glm-worker/internal/workflow/workflow.go
      - name: Validate
        shell: bash
        run: |
          cd glm-worker
          go test ./internal/workflow -count=1
          go vet ./...
          go build ./...
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ChatGPT Web GPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glm-worker/internal/workflow/workflow.go
          git commit -m "refactor: isolate reviewer floor context"
          git push origin HEAD:gpt/high-floor-first-review
