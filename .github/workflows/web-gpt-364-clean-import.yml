name: Web GPT 364 Clean Fixture Import

on:
  push:
    branches:
      - web-gpt/364-quality-scope-fail-closed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove obsolete import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("glm-worker/internal/app/multirepo_process_test.go")
          s = p.read_text()
          needle = '\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/repositoryharness"\n'
          if needle not in s:
              raise SystemExit("repositoryharness import not found")
          p.write_text(s.replace(needle, '\n', 1))
          PY
          gofmt -w glm-worker/internal/app/multirepo_process_test.go
          rm .github/workflows/web-gpt-364-clean-import.yml
          git config user.name "web-gpt"
          git config user.email "web-gpt@users.noreply.github.com"
          git add -A
          git commit -m "test: remove obsolete process fixture import"
          git push origin HEAD:web-gpt/364-quality-scope-fail-closed
