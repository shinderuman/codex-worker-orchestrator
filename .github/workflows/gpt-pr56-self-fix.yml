name: GPT PR56 repair validator

on:
  push:
    branches:
      - gpt/high-floor-first-review

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/high-floor-first-review
      - name: Repair validator working directory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/gpt-pr56-fix.yml')
          text = p.read_text()
          old = '''          go build ./...\n          ./harnesslint\n'''
          new = '''          go build ./...\n          cd ..\n          ./harnesslint\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('validator command block not found')
              p.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "ChatGPT Web GPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/gpt-pr56-fix.yml
          git commit -m "chore: fix temporary validation path"
          git push origin HEAD:gpt/high-floor-first-review
