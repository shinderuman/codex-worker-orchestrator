name: web-gpt-refactor-247-edit

on:
  workflow_dispatch:
  push:
    branches:
      - web-gpt/refactor-247-bundle-evidence-projection
    paths:
      - ".github/workflows/web-gpt-refactor-247-edit.yml"

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply production edit
        run: python3 .github/web-gpt-refactor-247.py
      - name: Commit production edit
        run: |
          gofmt -w glm-worker/internal/app/bundle.go
          git diff --check
          git diff --exit-code -- glm-worker/internal/app/bundle.go && exit 1 || true
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add glm-worker/internal/app/bundle.go
          git commit -m "refactor: centralize bundle evidence projection"
          git push origin HEAD:web-gpt/refactor-247-bundle-evidence-projection
