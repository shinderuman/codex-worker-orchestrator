name: web-gpt-refactor-245-edit
on: push
permissions:
  contents: write
jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/refactor-245-parent-action-admission
      - run: python3 .github/web-gpt-refactor-245.py
      - run: gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/execution_milestone_flow.go
      - name: Commit edits
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/execution_milestone_flow.go
          git commit -m 'refactor: route workflow through parent action admission'
          git push origin HEAD:web-gpt/refactor-245-parent-action-admission
