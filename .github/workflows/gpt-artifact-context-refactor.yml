name: GPT artifact context refactor

on:
  push:
    branches:
      - gpt/artifact-ownership-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/artifact-ownership-recovery
          fetch-depth: 0
      - name: Configure bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Extract artifact prompt context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/workflow/workflow.go')
          text = path.read_text()
          old = '''\tif checkpoint.Role == state.WorkerRole {\n\t\tartifactDir, err := w.state.PrepareArtifactDir()\n\t\tif err != nil {\n\t\t\treturn checkpoint, outputPath, parentFileGuard{}, err\n\t\t}\n\t\tcheckpoint.Prompt = withArtifactContext(checkpoint.Prompt, artifactDir)\n\t\tif checkpoint.OriginalPrompt != "" {\n\t\t\tcheckpoint.OriginalPrompt = withArtifactContext(checkpoint.OriginalPrompt, artifactDir)\n\t\t}\n\t} else if checkpoint.Role == state.ReviewerRole {\n\t\ttaskID, err := w.state.TaskID()\n\t\tif err != nil {\n\t\t\treturn checkpoint, outputPath, parentFileGuard{}, err\n\t\t}\n\t\tartifactDir := w.state.ArtifactDir(taskID)\n\t\tcheckpoint.Prompt = withReviewerArtifactContext(checkpoint.Prompt, artifactDir)\n\t\tif checkpoint.OriginalPrompt != "" {\n\t\t\tcheckpoint.OriginalPrompt = withReviewerArtifactContext(checkpoint.OriginalPrompt, artifactDir)\n\t\t}\n\t}\n'''
          new = '''\tif err := w.applyModelArtifactContext(&checkpoint); err != nil {\n\t\treturn checkpoint, outputPath, parentFileGuard{}, err\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one role artifact block, found {text.count(old)}')
          text = text.replace(old, new)
          anchor = '''\tw.state.RecordModelCall(checkpoint.Role, checkpoint.Model)\n\treturn checkpoint, outputPath, guardBefore, nil\n}\n\nfunc (w *Workflow) invokeModelCall(\n'''
          helper = '''\tw.state.RecordModelCall(checkpoint.Role, checkpoint.Model)\n\treturn checkpoint, outputPath, guardBefore, nil\n}\n\nfunc (w *Workflow) applyModelArtifactContext(checkpoint *state.ResumeCheckpoint) error {\n\tswitch checkpoint.Role {\n\tcase state.WorkerRole:\n\t\tartifactDir, err := w.state.PrepareArtifactDir()\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t\tcheckpoint.Prompt = withArtifactContext(checkpoint.Prompt, artifactDir)\n\t\tif checkpoint.OriginalPrompt != "" {\n\t\t\tcheckpoint.OriginalPrompt = withArtifactContext(checkpoint.OriginalPrompt, artifactDir)\n\t\t}\n\tcase state.ReviewerRole:\n\t\ttaskID, err := w.state.TaskID()\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t\tartifactDir := w.state.ArtifactDir(taskID)\n\t\tcheckpoint.Prompt = withReviewerArtifactContext(checkpoint.Prompt, artifactDir)\n\t\tif checkpoint.OriginalPrompt != "" {\n\t\t\tcheckpoint.OriginalPrompt = withReviewerArtifactContext(checkpoint.OriginalPrompt, artifactDir)\n\t\t}\n\t}\n\treturn nil\n}\n\nfunc (w *Workflow) invokeModelCall(\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one helper anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, helper))
          PY
          gofmt -w glm-worker/internal/workflow/workflow.go
          git add glm-worker/internal/workflow/workflow.go
          git commit -m 'refactor: isolate model artifact context setup'
          git push origin HEAD:gpt/artifact-ownership-recovery
      - name: Remove temporary workflow
        run: |
          git pull --ff-only origin gpt/artifact-ownership-recovery
          git rm .github/workflows/gpt-artifact-context-refactor.yml
          git commit -m 'ci: remove temporary artifact context refactor'
          git push origin HEAD:gpt/artifact-ownership-recovery
