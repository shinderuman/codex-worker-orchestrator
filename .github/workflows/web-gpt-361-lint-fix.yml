name: Web GPT Issue 361 Lint Fix

on:
  push:
    branches:
      - web-gpt/issue-361-structured-validation-telemetry
    paths:
      - .github/workflows/web-gpt-361-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.4
          cache: false
      - name: Apply lint fixes
        run: |
          python3 .github/scripts/web-gpt-361-lint-fix.py
          gofmt -w \
            glm-worker/internal/app/quality_gate.go \
            glm-worker/internal/app/quality_gate_validation_telemetry_test.go \
            glm-worker/internal/app/testimpact_structured_validation_test.go \
            glm-worker/internal/runner/stream_events.go \
            glm-worker/internal/runner/validation_binding_test.go \
            glm-worker/internal/runner/validation_observation.go \
            glm-worker/internal/state/events.go \
            glm-worker/internal/state/testimpact.go \
            glm-worker/internal/state/testimpact_validation.go \
            glm-worker/internal/state/testimpact_validation_test.go \
            glm-worker/internal/state/validation.go
      - name: Commit lint fixes
        run: |
          git config user.name "Web GPT"
          git config user.email "web-gpt@users.noreply.github.com"
          git rm .github/workflows/web-gpt-361-lint-fix.yml .github/scripts/web-gpt-361-lint-fix.py
          git add glm-worker/internal
          git commit -m "Conform structured validation telemetry to repository lint"
          git push
