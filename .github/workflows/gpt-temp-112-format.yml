name: GPT Temporary 112 Gofmt

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Format touched Go files
        run: |
          gofmt -w glm-worker/internal/app/quality_gate.go glm-worker/internal/app/quality_gate_recovery_test.go
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "web-gpt-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glm-worker/internal/app/quality_gate.go glm-worker/internal/app/quality_gate_recovery_test.go
          git commit -m "style: gofmt quality-gate recovery changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
