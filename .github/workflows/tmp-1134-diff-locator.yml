name: tmp-1134-diff-locator
on:
  push:
    branches:
      - web-gpt/1134-parent-evidence-diff-target
jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1134-parent-evidence-diff-target
      - uses: actions/setup-go@v5
        with:
          go-version-file: glm-worker/go.mod
      - name: Apply exact locator replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('glm-worker/internal/workflow/risk_floor_test.go'): [
                  ('internal/task/change.go:diff', 'internal/task/change.go:@diff'),
              ],
              Path('glm-worker/internal/workflow/risk_floor_parent_evidence_test.go'): [
                  ('tracked.md:diff', 'tracked.md:@diff'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, got {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Targeted tests
        working-directory: glm-worker
        run: go test ./internal/reviewtarget ./internal/parentevidence ./internal/workflow
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-1134-diff-locator.yml
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add glm-worker/internal/workflow/risk_floor_test.go glm-worker/internal/workflow/risk_floor_parent_evidence_test.go .github/workflows/tmp-1134-diff-locator.yml
          git commit -m 'test: use reserved whole-file diff locator'
          git push origin HEAD:web-gpt/1134-parent-evidence-diff-target
