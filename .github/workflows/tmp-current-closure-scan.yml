name: Temporary current closure rewrite

on:
  push:
    branches:
      - web-gpt/issue-1311-from-1310

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.head_commit.message == 'Arm temporary closure rewrite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: glm-worker/go.mod
          cache: false
      - name: Remove stale deleted-owner closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_exact(path, old, new, count=1):
              p = root / path
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}')
              p.write_text(text.replace(old, new, count))

          session_import = '\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/sessionrotation"\n'
          old_completion = '''\tif _, err := st.CompleteParentAwaiting(func(acceptedRisk string) (*state.SessionRotationEvaluation, error) {\n\t\treturn sessionrotation.EvaluateTerminal(cfg, st, state.SessionRotationTerminalAccept, acceptedRisk)\n\t}); err != nil {\n'''
          current_completion = '''\tif _, err := completeParentWithPendingRotation(st, codexTestParentThreadID); err != nil {\n'''

          for path in ['glm-worker/internal/app/execute_test.go', 'glm-worker/internal/app/parent_review_test.go']:
              replace_exact(path, session_import, '')
              replace_exact(path, old_completion, current_completion)

          handoff = root / 'glm-worker/internal/app/parent_handoff_test.go'
          text = handoff.read_text()
          if text.count(session_import) != 1 or text.count(old_completion) != 1:
              raise SystemExit('parent_handoff_test.go: unexpected deleted-owner shape')
          text = text.replace(session_import, '', 1).replace(old_completion, current_completion, 1)
          start = text.find('func TestSessionRotationCompletionFailsClosedWithoutParentIdentity')
          end = text.find('func TestSessionRotationNewThreadBindRetiresOldDirective', start)
          if start < 0 or end < 0:
              raise SystemExit('parent_handoff_test.go: retired evaluator test boundary not found')
          text = text[:start] + text[end:]
          anchor = 'func TestSessionRotationAcceptWritesPendingDirectiveProjectedByHandoff'
          pos = text.find(anchor)
          if pos < 0:
              raise SystemExit('parent_handoff_test.go: helper insertion anchor not found')
          helper = '''func completeParentWithPendingRotation(st *state.StateStore, parentThreadID string) (bool, error) {\n\ttaskID, err := st.TaskID()\n\tif err != nil {\n\t\treturn false, err\n\t}\n\treturn st.CompleteParentAwaiting(func(string) (*state.SessionRotationEvaluation, error) {\n\t\treturn &state.SessionRotationEvaluation{\n\t\t\tParentThreadID: parentThreadID,\n\t\t\tTaskID:         taskID,\n\t\t\tTerminal:       state.SessionRotationTerminalAccept,\n\t\t\tDecision: state.SessionRotationDecision{Required: true, Reason: state.SessionRotationReasonEvidenceUnavailable},\n\t\t}, nil\n\t})\n}\n\n'''
          text = text[:pos] + helper + text[pos:]
          handoff.write_text(text)

          replace_exact('glm-worker/internal/app/canonical_lifecycle_guard_test.go', '''\tif active, err := controller.CanonicalAuthorityActive(cfg); err != nil || active {\n\t\tt.Fatalf("pristine fixture reported canonical authority: active=%v err=%v", active, err)\n\t}\n''', '')
          replace_exact('glm-worker/internal/app/canonical_lifecycle_guard_test.go', '''\tif active, err := controller.CanonicalAuthorityActive(cfg); err != nil || !active {\n\t\tt.Fatalf("explicit activation did not establish canonical authority: active=%v err=%v", active, err)\n\t}\n''', '')

          for path in ['glm-worker/internal/app/parent_review_evidence_projection_test.go', 'glm-worker/internal/app/session_rotation_authority_test.go']:
              p = root / path
              if not p.exists():
                  raise SystemExit(f'{path}: expected stale test file missing')
              p.unlink()

          improvement = root / 'glm-worker/internal/app/improvement_signal.go'
          improvement.write_text('''package app\n\nimport "github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"\n\ntype parentHandoffImprovementSignal struct {\n\tSignal     state.ImprovementSignal  `json:"signal"`\n\tActionSpec parentHandoffActionSpec `json:"action_spec"`\n}\n\nconst invalidPacketOutcome = "invalid_packet"\n\nfunc projectImprovementSignal(output *parentHandoffOutput) *parentHandoffImprovementSignal {\n\tif output == nil || output.Controller == nil {\n\t\treturn nil\n\t}\n\treturn projectCanonicalImprovementSignal(improvementSignalFromMaterial(output.LastMaterial))\n}\n\nfunc projectRecoveryImprovementSignal(output *parentHandoffRecoveryOutput) *parentHandoffImprovementSignal {\n\tif output == nil || output.Controller == nil {\n\t\treturn nil\n\t}\n\treturn projectCanonicalImprovementSignal(improvementSignalFromRecoveryMaterial(output.LastMaterial))\n}\n\nfunc projectCanonicalImprovementSignal(signal *state.ImprovementSignal) *parentHandoffImprovementSignal {\n\tif signal == nil {\n\t\treturn nil\n\t}\n\tspec, ok := parentActionSpec("controller-semantic", nil)\n\tif !ok {\n\t\treturn nil\n\t}\n\treturn &parentHandoffImprovementSignal{Signal: *signal, ActionSpec: spec}\n}\n\nfunc improvementSignalFromMaterial(material *parentHandoffMaterial) *state.ImprovementSignal {\n\tif material == nil || material.Outcome != invalidPacketOutcome {\n\t\treturn nil\n\t}\n\treturn invalidPacketImprovementSignal(material.CallID, material.PacketRejectReason)\n}\n\nfunc improvementSignalFromRecoveryMaterial(material *parentHandoffRecoveryMaterial) *state.ImprovementSignal {\n\tif material == nil || material.Outcome != invalidPacketOutcome {\n\t\treturn nil\n\t}\n\treturn invalidPacketImprovementSignal(material.CallID, material.PacketRejectReason)\n}\n\nfunc invalidPacketImprovementSignal(callID *string, rejectReason string) *state.ImprovementSignal {\n\tif callID == nil || *callID == "" {\n\t\treturn nil\n\t}\n\treason := rejectReason\n\tif reason == "" {\n\t\treason = state.ImprovementSignalInvalidPacket\n\t}\n\treturn &state.ImprovementSignal{Kind: state.ImprovementSignalInvalidPacket, Count: 1, SourceCallID: *callID, Reason: reason}\n}\n''')

          signal_test = root / 'glm-worker/internal/app/improvement_signal_test.go'
          s = signal_test.read_text()
          s = s.replace('''\t"testing"\n\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"\n''', '''\t"testing"\n\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/controller"\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"\n''', 1)
          s = s.replace('''\toutput := parentHandoffOutput{\n\t\tRequiredAction: &required,\n''', '''\toutput := parentHandoffOutput{\n\t\tController:     &controller.ControllerStatusReport{},\n\t\tRequiredAction: &required,\n''', 1)
          old = '''\tspec := decoded.ImprovementSignal.ActionSpec\n\taction := string(state.ParentActionImprovementDisposition)\n\tif spec.Kind != "bounded-choice" {\n\t\tt.Fatalf("action spec = %#v", spec)\n\t}\n\tif len(spec.Command) != 6 ||\n\t\tspec.Command[0] != "glm-parent-action" ||\n\t\tspec.Command[1] != action ||\n\t\tspec.Command[2] != "--signal-kind" ||\n\t\tspec.Command[3] != state.ImprovementSignalInvalidPacket ||\n\t\tspec.Command[4] != "--source-call-id" ||\n\t\tspec.Command[5] != callID {\n\t\tt.Fatalf("command = %#v", spec.Command)\n\t}\n\tchoices := spec.Choices["--disposition"]\n\tif len(choices) != 5 {\n\t\tt.Fatalf("choices = %#v", choices)\n\t}\n'''
          new = '''\tspec := decoded.ImprovementSignal.ActionSpec\n\tif spec.Kind != "staged" || len(spec.PrepareCommand) != 3 || spec.PrepareCommand[0] != "glm-parent-action" || spec.PrepareCommand[1] != "prepare" || spec.PrepareCommand[2] != "controller-semantic" {\n\t\tt.Fatalf("controller semantic action spec = %#v", spec)\n\t}\n'''
          if old not in s:
              raise SystemExit('improvement_signal_test.go: retired action assertion not found')
          signal_test.write_text(s.replace(old, new, 1))

          defect = root / 'glm-worker/internal/app/parent_handoff_defect_registration_test.go'
          s = defect.read_text()
          start = s.find('func TestParentHandoffProjectsDefectBindingAction')
          end = s.find('func TestPendingDefectRegistrationBlocksParentRequestStopBeforeTaskPlanBinding', start)
          if start < 0 or end < 0:
              raise SystemExit('defect registration test boundary not found')
          replacement = '''func TestParentHandoffMapsDefectBindingToControllerSemanticAction(t *testing.T) {\n\taction := canonicalParentAction(string(state.ParentActionBindDefectTask))\n\tif action != "controller-semantic" {\n\t\tt.Fatalf("canonical defect action = %q", action)\n\t}\n\tspec, ok := parentActionSpec(action, nil)\n\tif !ok || spec.Kind != "staged" || !reflect.DeepEqual(spec.PrepareCommand, []string{"glm-parent-action", "prepare", "controller-semantic"}) {\n\t\tt.Fatalf("controller semantic spec = %#v ok=%t", spec, ok)\n\t}\n}\n\n'''
          defect.write_text(s[:start] + replacement + s[end:])

          reopen = root / 'glm-worker/internal/app/parent_handoff_reopen_test.go'
          s = reopen.read_text()
          for call in ['\tassertHandoffJSONOmitsReopenSpec(t, before)\n', '\tassertHandoffJSONExposesReopenSpec(t, after)\n', '\tassertHandoffJSONExposesReopenSpec(t, recovery)\n']:
              if call not in s:
                  raise SystemExit(f'reopen test call missing: {call!r}')
              s = s.replace(call, '', 1)
          helper_start = s.find('func assertHandoffJSONExposesReopenSpec')
          if helper_start < 0:
              raise SystemExit('reopen presentation helper not found')
          s = s[:helper_start]
          s = s.replace('\t"encoding/json"\n', '').replace('\t"reflect"\n', '')
          reopen.write_text(s)
          PY

          gofmt -w \
            glm-worker/internal/app/canonical_lifecycle_guard_test.go \
            glm-worker/internal/app/execute_test.go \
            glm-worker/internal/app/improvement_signal.go \
            glm-worker/internal/app/improvement_signal_test.go \
            glm-worker/internal/app/parent_handoff_defect_registration_test.go \
            glm-worker/internal/app/parent_handoff_reopen_test.go \
            glm-worker/internal/app/parent_handoff_test.go \
            glm-worker/internal/app/parent_review_test.go

          if git grep -n -E 'CanonicalAuthorityActive|internal/sessionrotation|sessionrotation\.|PrintReviewEvidence|BuildReviewManifest' -- ':!*.md' ':!*.json' ':!.github/workflows/tmp-current-closure-scan.yml'; then
            echo 'stale deleted-owner references remain' >&2
            exit 1
          fi
          git diff --check
          (cd glm-worker && go test ./internal/app)

          python3 <<'PY'
          import json, os, pathlib, urllib.request
          repo, branch, expected, token = os.environ['REPO'], os.environ['BRANCH'], os.environ['EXPECTED_HEAD'], os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          ref = request('GET', f'{api}/git/ref/heads/{branch}')
          if ref['object']['sha'] != expected:
              raise SystemExit(f'branch moved: expected {expected}, got {ref["object"]["sha"]}')
          commit = request('GET', f'{api}/git/commits/{expected}')
          modified = [
              'glm-worker/internal/app/canonical_lifecycle_guard_test.go',
              'glm-worker/internal/app/execute_test.go',
              'glm-worker/internal/app/improvement_signal.go',
              'glm-worker/internal/app/improvement_signal_test.go',
              'glm-worker/internal/app/parent_handoff_defect_registration_test.go',
              'glm-worker/internal/app/parent_handoff_reopen_test.go',
              'glm-worker/internal/app/parent_handoff_test.go',
              'glm-worker/internal/app/parent_review_test.go',
          ]
          tree_entries = []
          for path in modified:
              blob = request('POST', f'{api}/git/blobs', {'content': pathlib.Path(path).read_text(), 'encoding': 'utf-8'})
              tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          for path in ['glm-worker/internal/app/parent_review_evidence_projection_test.go', 'glm-worker/internal/app/session_rotation_authority_test.go']:
              tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = request('POST', f'{api}/git/trees', {'base_tree': commit['tree']['sha'], 'tree': tree_entries})
          new_commit = request('POST', f'{api}/git/commits', {'message': 'Remove stale deleted-owner app closure', 'tree': tree['sha'], 'parents': [expected]})
          request('PATCH', f'{api}/git/refs/heads/{branch}', {'sha': new_commit['sha'], 'force': False})
          print(new_commit['sha'])
          PY
