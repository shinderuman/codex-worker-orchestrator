name: Temporary issue 76 final validation

on:
  push:
    branches:
      - gpt/git-sandbox-76-final

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/git-sandbox-76-final
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Adapt patch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/issue76_final_patch.py')
          text = path.read_text()
          old = '''p = Path("glm-worker/internal/runner/runner_test.go")
s = p.read_text()
if "isolationSettings(configDir)" not in s:
    raise SystemExit("runner_test isolationSettings call not found")
p.write_text(s.replace("isolationSettings(configDir)", "isolationSettings(configDir, nil)"))
'''
          new = '''p = Path("glm-worker/internal/runner/runner_test.go")
s = p.read_text()
needle = "isolationSettings("
pos = 0
changed = 0
while True:
    start = s.find(needle, pos)
    if start < 0:
        break
    i = start + len(needle)
    depth = 1
    while i < len(s) and depth:
        if s[i] == "(":
            depth += 1
        elif s[i] == ")":
            depth -= 1
        i += 1
    if depth:
        raise SystemExit("unterminated runner_test isolationSettings call")
    close = i - 1
    s = s[:close] + ", nil" + s[close:]
    pos = close + len(", nil") + 1
    changed += 1
if changed == 0:
    raise SystemExit("runner_test isolationSettings call not found")
p.write_text(s)
'''
          if old not in text:
              raise SystemExit('helper adaptation point not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply patch
        run: python3 .github/issue76_final_patch.py
      - name: Format
        working-directory: glm-worker
        run: gofmt -w internal/runner/git_authority_guard.go internal/runner/git_authority_claude_wrapper.go internal/runner/git_authority_sandbox.go internal/runner/git_authority_sandbox_test.go internal/runner/git_authority_temp_root_test.go internal/runner/instruction_surface_runner.go internal/runner/runner.go internal/runner/probe.go internal/runner/runner_test.go
      - name: Test
        working-directory: glm-worker
        run: go test ./...
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce Git authority with Claude Bash sandbox'
          git push origin HEAD:gpt/git-sandbox-76-final
