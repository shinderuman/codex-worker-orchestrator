name: GPT guard recovery doc cleanup

on:
  push:
    branches:
      - gpt/guard-failure-task-recovery

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/guard-failure-task-recovery
          fetch-depth: 0
      - name: Configure bot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Remove runtime markdown addition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex/instructions/glm-execution.md')
          text = path.read_text()
          line = '- `task_status: guard-recoverable`はguardがmodel sessionを失効させたがtask checkpointを保持した状態である。親が報告されたguard conditionとrepository現物を確認・必要なら修正した後、別taskを起こさず同じ`--resume`を実行する。resumeは失効済みmodel sessionを再利用せず、保存済みworker resultを安全に再利用できない場合だけfresh worker callから同stageをやり直す。\n'
          if line not in text:
              raise SystemExit('guard recovery runtime instruction not found')
          path.write_text(text.replace(line, '', 1))
          PY
          git add codex/instructions/glm-execution.md
          git commit -m 'docs: keep guard recovery out of runtime budget'
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/gpt-guard-recovery-doc-cleanup.yml
          git commit -m 'chore: remove temporary doc cleanup workflow'
          git push origin HEAD:gpt/guard-failure-task-recovery
