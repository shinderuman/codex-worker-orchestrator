func TestControllerRuntimeBindingRoundTripAndWorkflowTaskPath(t *testing.T) {
\tst := newControllerRuntimeBindingTestStore(t)
\tif err := st.Write("active-task", "IMPLEMENTATION_TASKS/plan.md"); err != nil {
\t\tt.Fatal(err)
