name: Web GPT 1287 Cutover

on:
  push:
    branches:
      - web-gpt/issue-1287-controller-runtime-binding

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-1287-controller-runtime-binding
      - uses: actions/setup-go@v7
        with:
          go-version-file: glm-worker/go.mod
      - name: Apply controller runtime binding cutover
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          def replace_between(path, start, end, new):
              p = Path(path)
              text = p.read_text()
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f'{path}: replacement boundary is not unique')
              a = text.index(start)
              b = text.index(end, a)
              p.write_text(text[:a] + new + text[b:])

          path = 'glm-worker/internal/state/controller_runtime_binding.go'
          replace(path,
              'import (\n\t"encoding/json"\n\t"fmt"\n\t"os"\n)',
