\t\treturn "", err
\t}
\treturn s.ReadOr("active-task", ""), nil
}

func (s *StateStore) ClearControllerRuntimeBinding() error {
''')

          replace_between(
              'glm-worker/internal/workflow/controller_workflow_reentry.go',
              'func (w *Workflow) bindCanonicalWorkflowAttempt(admission controller.Admission) error {',
              'func (w *Workflow) reenterCanonicalWorkflow(admission controller.Admission) error {',
              '''func (w *Workflow) bindCanonicalWorkflowAttempt(admission controller.Admission) error {
\ttarget := state.ControllerRuntimeBinding{
\t\tAttemptID:          admission.Attempt.AttemptID,
\t\tTaskPath:           admission.Attempt.SemanticTaskRef.TaskPath,
\t\tTaskContractDigest: admission.Attempt.SemanticTaskRef.ContractDigest,
\t}
\tprevious, err := w.state.LoadControllerRuntimeBinding()
\tswitch {
\tcase errors.Is(err, os.ErrNotExist):
\tcase err != nil:
\t\treturn fmt.Errorf("read controller runtime binding: %w", err)
\tcase previous.AttemptID == target.AttemptID:
\t\tif previous.TaskPath != target.TaskPath || previous.TaskContractDigest != target.TaskContractDigest {
\t\t\treturn fmt.Errorf("workflow runtime binding does not match canonical controller task")
\t\t}
\tdefault:
\t\tif previous.AttemptID != admission.Attempt.PredecessorAttemptID {
\t\t\treturn fmt.Errorf("workflow session does not belong to the canonical attempt predecessor")
\t\t}
\t\tif err := w.reenterCanonicalWorkflow(admission); err != nil {
\t\t\treturn err
\t\t}
\t}
\tif err := w.state.SaveControllerRuntimeBinding(target); err != nil {
\t\treturn err
\t}
\treturn w.state.Remove(activeTaskStateKey)
}

''')
