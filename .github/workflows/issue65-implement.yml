name: Issue 65 Implementation

on:
  push:
    branches:
      - gpt/issue-65-attributable-quality

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, 'Implement issue 65 attributable quality') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/issue-65-attributable-quality
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Implement attributable model quality
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {text.count(old)}')
              return text.replace(old, new, 1)

          # TaskCallLogs carries deterministic downstream quality attribution separately from convergence.
          p = Path('glm-worker/internal/state/callstats.go')
          s = p.read_text()
          s = replace_once(s,
          '''type TaskCallLogs struct {
          \tTaskID            string
          \tLogs              []ModelCallLog
          \tConvergenceDeltas map[string]string
          }
          ''',
          '''type TaskCallLogs struct {
          \tTaskID            string
          \tLogs              []ModelCallLog
          \tConvergenceDeltas map[string]string
          \tQualityOutcomes   map[string]string
          }
          ''', 'TaskCallLogs')
          p.write_text(s)

          # Rework model-routing evaluation so operational cells are not quality samples.
          p = Path('glm-worker/internal/state/routingeval.go')
          s = p.read_text()
          s = replace_once(s,
          '''type ModelRoutingSufficiency struct {
          \tMinCalls int    `json:"min_calls_per_cell"`
          \tMinTasks int    `json:"min_tasks_per_cell"`
          \tRule     string `json:"rule"`
          }
          ''',
          '''type ModelRoutingSufficiency struct {
          \tMinQualityCalls int    `json:"min_quality_calls_per_group"`
          \tMinQualityTasks int    `json:"min_quality_tasks_per_group"`
          \tRule            string `json:"rule"`
          }
          ''', 'sufficiency struct')
          s = replace_once(s,
          '''\tCalls             int            `json:"calls"`
          \tTasks             int            `json:"tasks"`
          \tSessions          int            `json:"sessions"`
          \tUsage             TokenUsage     `json:"usage"`
          \tUsageUnknownCalls int            `json:"usage_unknown_calls"`
          \tOutcomes          map[string]int `json:"outcomes"`
          \tPacketStatuses    map[string]int `json:"packet_statuses"`
          \tSufficient        bool           `json:"sufficient"`
          }

          type ModelRoutingAliasLink struct {
          ''',
          '''\tCalls             int            `json:"calls"`
          \tTopLevelCalls     int            `json:"top_level_calls"`
          \tTasks             int            `json:"tasks"`
          \tSessions          int            `json:"sessions"`
          \tUsage             TokenUsage     `json:"usage"`
          \tUsageUnknownCalls int            `json:"usage_unknown_calls"`
          \tOutcomes          map[string]int `json:"outcomes"`
          \tPacketStatuses    map[string]int `json:"packet_statuses"`
          }

          type ModelRoutingQualityGroup struct {
          \tRole             string         `json:"role"`
          \tPhase            string         `json:"phase"`
          \tEffectiveRisk    string         `json:"effective_risk"`
          \tConvergenceDelta string         `json:"convergence_delta"`
          \tResolvedModel    string         `json:"resolved_model"`
          \tCalls            int            `json:"calls"`
          \tTasks            int            `json:"tasks"`
          \tOutcomes         map[string]int `json:"outcomes"`
          \tSufficient       bool           `json:"sufficient"`
          }

          type ModelRoutingAliasLink struct {
          ''', 'cell + quality group structs')
          s = replace_once(s,
          '''\tCells       []ModelRoutingCell      `json:"cells"`
          \tAliasLinks  []ModelRoutingAliasLink `json:"alias_links"`
          \tEvaluation  ModelRoutingEvaluation  `json:"evaluation"`
          ''',
          '''\tCells         []ModelRoutingCell         `json:"cells"`
          \tQualityGroups []ModelRoutingQualityGroup `json:"quality_groups"`
          \tAliasLinks    []ModelRoutingAliasLink    `json:"alias_links"`
          \tEvaluation    ModelRoutingEvaluation     `json:"evaluation"`
          ''', 'report groups')
          s = replace_once(s,
          '''type modelRoutingModelSamples struct {
          \tcalls int
          \ttasks map[string]bool
          }

          type modelRoutingBuilder struct {
          \treport      ModelRoutingReport
          \tcells       map[modelRoutingCellKey]*modelRoutingCellSamples
          \taliasLinks  map[string]map[string]map[string]int
          \tmodelGroups map[modelRoutingGroupKey]map[string]*modelRoutingModelSamples
          \ttaskCalls   int
          }

          const (
          \tModelRoutingUnknownModel    = "unknown"
          \tModelRoutingUnknownRisk     = "unknown"
          \tModelRoutingMinCallsPerCell = 20
          \tModelRoutingMinTasksPerCell = 5
          )
          ''',
          '''type modelRoutingModelSamples struct {
          \tcalls    int
          \ttasks    map[string]bool
          \toutcomes map[string]int
          }

          type modelRoutingBuilder struct {
          \treport        ModelRoutingReport
          \tcells         map[modelRoutingCellKey]*modelRoutingCellSamples
          \taliasLinks    map[string]map[string]map[string]int
          \tqualityGroups map[modelRoutingGroupKey]map[string]*modelRoutingModelSamples
          \ttaskCalls     int
          }

          const (
          \tModelRoutingUnknownModel             = "unknown"
          \tModelRoutingUnknownRisk              = "unknown"
          \tModelRoutingMinQualityCallsPerGroup  = 20
          \tModelRoutingMinQualityTasksPerGroup  = 5
          \tModelRoutingQualityReviewPass        = "review_pass"
          \tModelRoutingQualityReviewFixRequired = "review_fix_required"
          )
          ''', 'builder + constants')
          s = replace_once(s,
          '''const modelRoutingQualityMetric = "per-cell outcome and packet_status distributions (worker terminal packets: IMPLEMENTED, NEEDS_SOL_REVIEW, NEEDS_SOL_DECISION; reviewer packets: PASS, FIX_REQUIRED, NEEDS_SOL_REVIEW, NEEDS_SOL_DECISION) inside cells separated by role, normalized phase, effective risk, and the existing RoundRecord convergence delta class joined per call (unknown when the call cannot be uniquely joined to a round record); no composite quality score is defined"

          const modelRoutingSufficiencyRule = "within one repository, a model quality comparison requires at least 2 distinct resolved models in the same role+normalized-phase+effective-risk+convergence-delta group, each with at least min_calls_per_cell task calls across at least min_tasks_per_cell distinct tasks; meeting these minimums only lists a group as a comparison candidate and is neither a statistical proof of model quality nor a downgrade criterion, below them the quality delta stays unknown or insufficient and cannot support downgrade, and alias-only contrast where the aliases resolve to the same resolved model is not model quality evidence"
          ''',
          '''const modelRoutingQualityMetric = "quality_groups contain only deterministic downstream review outcomes attributed to one producing worker call and its top-level resolved model: review_pass or review_fix_required; operational outcome and packet_status remain in cells for reliability/debugging and are not model-quality evidence; unresolved Sol routing, provider failures, ambiguous producing calls, and unattributable mixed-model results remain absent from quality_groups; no composite quality score is defined"

          const modelRoutingSufficiencyRule = "within one repository, controlled model quality comparison uses alias-independent quality_groups only: effective risk and convergence delta must both be known, and at least 2 distinct resolved models in the same role+normalized-phase+effective-risk+convergence-delta group must each have at least min_quality_calls_per_group attributable downstream quality calls across at least min_quality_tasks_per_group distinct tasks; operational calls without attributable quality do not count, meeting the minimums only lists a comparison candidate and is neither statistical proof nor a routing/downgrade criterion"
          ''', 'metric descriptions')
          s = replace_once(s,
          '''\tbuilder.absorbTasks(tasks)
          \tbuilder.buildCells()
          \tbuilder.buildAliasLinks()
          \tbuilder.buildEvaluation()
          ''',
          '''\tbuilder.absorbTasks(tasks)
          \tbuilder.buildCells()
          \tbuilder.buildQualityGroups()
          \tbuilder.buildAliasLinks()
          \tbuilder.buildEvaluation()
          ''', 'builder pipeline')
          s = replace_once(s,
          '''\t\t\tSufficiency: ModelRoutingSufficiency{
          \t\t\t\tMinCalls: ModelRoutingMinCallsPerCell,
          \t\t\t\tMinTasks: ModelRoutingMinTasksPerCell,
          \t\t\t\tRule:     modelRoutingSufficiencyRule,
          \t\t\t},
          \t\t\tRecords:    CallRecordCounts{},
          \t\t\tCells:      []ModelRoutingCell{},
          \t\t\tAliasLinks: []ModelRoutingAliasLink{},
          \t\t\tEvaluation: ModelRoutingEvaluation{QualityDelta: ModelRoutingQualityDeltaUnknown, Reasons: []string{}},
          \t\t},
          \t\tcells:       make(map[modelRoutingCellKey]*modelRoutingCellSamples),
          \t\taliasLinks:  make(map[string]map[string]map[string]int),
          \t\tmodelGroups: make(map[modelRoutingGroupKey]map[string]*modelRoutingModelSamples),
          ''',
          '''\t\t\tSufficiency: ModelRoutingSufficiency{
          \t\t\t\tMinQualityCalls: ModelRoutingMinQualityCallsPerGroup,
          \t\t\t\tMinQualityTasks: ModelRoutingMinQualityTasksPerGroup,
          \t\t\t\tRule:            modelRoutingSufficiencyRule,
          \t\t\t},
          \t\t\tRecords:       CallRecordCounts{},
          \t\t\tCells:         []ModelRoutingCell{},
          \t\t\tQualityGroups: []ModelRoutingQualityGroup{},
          \t\t\tAliasLinks:    []ModelRoutingAliasLink{},
          \t\t\tEvaluation:    ModelRoutingEvaluation{QualityDelta: ModelRoutingQualityDeltaUnknown, Reasons: []string{}},
          \t\t},
          \t\tcells:         make(map[modelRoutingCellKey]*modelRoutingCellSamples),
          \t\taliasLinks:    make(map[string]map[string]map[string]int),
          \t\tqualityGroups: make(map[modelRoutingGroupKey]map[string]*modelRoutingModelSamples),
          ''', 'builder initialization')
          s = replace_once(s,
          '''\tfor _, model := range routingResolvedModels(log) {
          \t\tb.absorbCell(task.TaskID, log, group, model)
          \t}
          }
          ''',
          '''\towner := routingResultOwner(log)
          \tfor _, model := range routingResolvedModels(log) {
          \t\tb.absorbCell(task.TaskID, log, group, model, owner == model)
          \t}
          \tif outcome := routingQualityOutcome(task, log); outcome != "" && owner != "" && owner != ModelRoutingUnknownModel {
          \t\tb.absorbQualityGroup(task.TaskID, group, owner, outcome)
          \t}
          }
          ''', 'absorb log')
          s = replace_once(s,
          '''func routingResolvedModels(log ModelCallLog) []string {
          \tif len(log.ResolvedModelUsage) > 0 {
          \t\tmodels := make([]string, 0, len(log.ResolvedModelUsage))
          \t\tfor model := range log.ResolvedModelUsage {
          \t\t\tmodels = append(models, model)
          \t\t}
          \t\tslices.Sort(models)
          \t\treturn models
          \t}
          \tif log.ResolvedModelID != "" {
          \t\treturn []string{log.ResolvedModelID}
          \t}
          \treturn []string{ModelRoutingUnknownModel}
          }
          ''',
          '''func routingResolvedModels(log ModelCallLog) []string {
          \tseen := make(map[string]bool)
          \tfor model := range log.ResolvedModelUsage {
          \t\tseen[model] = true
          \t}
          \tif log.ResolvedModelID != "" {
          \t\tseen[log.ResolvedModelID] = true
          \t}
          \tif len(seen) == 0 {
          \t\treturn []string{ModelRoutingUnknownModel}
          \t}
          \tmodels := make([]string, 0, len(seen))
          \tfor model := range seen {
          \t\tmodels = append(models, model)
          \t}
          \tslices.Sort(models)
          \treturn models
          }

          func routingResultOwner(log ModelCallLog) string {
          \tif log.ResolvedModelID != "" {
          \t\treturn log.ResolvedModelID
          \t}
          \tif len(log.ResolvedModelUsage) == 1 {
          \t\tfor model := range log.ResolvedModelUsage {
          \t\t\treturn model
          \t\t}
          \t}
          \tif len(log.ResolvedModelUsage) == 0 {
          \t\treturn ModelRoutingUnknownModel
          \t}
          \treturn ""
          }

          func routingQualityOutcome(task TaskCallLogs, log ModelCallLog) string {
          \tif log.Role != WorkerRole || log.CallID == "" {
          \t\treturn ""
          \t}
          \toutcome := task.QualityOutcomes[log.CallID]
          \tswitch outcome {
          \tcase ModelRoutingQualityReviewPass, ModelRoutingQualityReviewFixRequired:
          \t\treturn outcome
          \tdefault:
          \t\treturn ""
          \t}
          }
          ''', 'model participation and ownership')
          s = replace_once(s,
          '''func (b *modelRoutingBuilder) absorbCell(taskID string, log ModelCallLog, group modelRoutingGroupKey, model string) {
          ''',
          '''func (b *modelRoutingBuilder) absorbCell(taskID string, log ModelCallLog, group modelRoutingGroupKey, model string, ownsTopLevel bool) {
          ''', 'absorbCell signature')
          s = replace_once(s,
          '''\tif log.SessionID != "" {
          \t\tsamples.sessions[log.SessionID] = true
          \t}
          \taddInt(&samples.cell.Outcomes, log.Outcome, 1)
          \taddInt(&samples.cell.PacketStatuses, log.PacketStatus, 1)
          \tabsorbModelRoutingCellUsage(samples, log, model)
          \tb.absorbAliasLink(group.role, log.ModelAlias, model)
          \tb.absorbModelGroup(taskID, group, model)
          }

          func (b *modelRoutingBuilder) absorbModelGroup(taskID string, group modelRoutingGroupKey, model string) {
          \tmodels := b.modelGroups[group]
          \tif models == nil {
          \t\tmodels = make(map[string]*modelRoutingModelSamples)
          \t\tb.modelGroups[group] = models
          \t}
          \tif models[model] == nil {
          \t\tmodels[model] = &modelRoutingModelSamples{tasks: make(map[string]bool)}
          \t}
          \tmodels[model].calls++
          \tmodels[model].tasks[taskID] = true
          }
          ''',
          '''\tif log.SessionID != "" {
          \t\tsamples.sessions[log.SessionID] = true
          \t}
          \tif ownsTopLevel {
          \t\tsamples.cell.TopLevelCalls++
          \t\taddInt(&samples.cell.Outcomes, log.Outcome, 1)
          \t\taddInt(&samples.cell.PacketStatuses, log.PacketStatus, 1)
          \t}
          \tabsorbModelRoutingCellUsage(samples, log, model)
          \tb.absorbAliasLink(group.role, log.ModelAlias, model)
          }

          func (b *modelRoutingBuilder) absorbQualityGroup(taskID string, group modelRoutingGroupKey, model string, outcome string) {
          \tmodels := b.qualityGroups[group]
          \tif models == nil {
          \t\tmodels = make(map[string]*modelRoutingModelSamples)
          \t\tb.qualityGroups[group] = models
          \t}
          \tsamples := models[model]
          \tif samples == nil {
          \t\tsamples = &modelRoutingModelSamples{tasks: make(map[string]bool), outcomes: make(map[string]int)}
          \t\tmodels[model] = samples
          \t}
          \tsamples.calls++
          \tsamples.tasks[taskID] = true
          \taddInt(&samples.outcomes, outcome, 1)
          }
          ''', 'cell result + quality sample')
          s = replace_once(s,
          '''func (b *modelRoutingBuilder) buildCells() {
          \tfor _, samples := range b.cells {
          \t\tsamples.cell.Tasks = len(samples.tasks)
          \t\tsamples.cell.Sessions = len(samples.sessions)
          \t\tsamples.cell.Sufficient = samples.cell.Calls >= ModelRoutingMinCallsPerCell &&
          \t\t\tsamples.cell.Tasks >= ModelRoutingMinTasksPerCell
          \t\tb.report.Cells = append(b.report.Cells, samples.cell)
          \t}
          \tslices.SortFunc(b.report.Cells, compareModelRoutingCell)
          }
          ''',
          '''func (b *modelRoutingBuilder) buildCells() {
          \tfor _, samples := range b.cells {
          \t\tsamples.cell.Tasks = len(samples.tasks)
          \t\tsamples.cell.Sessions = len(samples.sessions)
          \t\tb.report.Cells = append(b.report.Cells, samples.cell)
          \t}
          \tslices.SortFunc(b.report.Cells, compareModelRoutingCell)
          }

          func (b *modelRoutingBuilder) buildQualityGroups() {
          \tfor _, group := range sortedModelRoutingGroups(b.qualityGroups) {
          \t\tmodels := make([]string, 0, len(b.qualityGroups[group]))
          \t\tfor model := range b.qualityGroups[group] {
          \t\t\tmodels = append(models, model)
          \t\t}
          \t\tslices.Sort(models)
          \t\tfor _, model := range models {
          \t\t\tsamples := b.qualityGroups[group][model]
          \t\t\tb.report.QualityGroups = append(b.report.QualityGroups, ModelRoutingQualityGroup{
          \t\t\t\tRole: group.role, Phase: group.phase, EffectiveRisk: group.risk, ConvergenceDelta: group.delta,
          \t\t\t\tResolvedModel: model, Calls: samples.calls, Tasks: len(samples.tasks), Outcomes: samples.outcomes,
          \t\t\t\tSufficient: routingQualityGroupSufficient(group, samples),
          \t\t\t})
          \t\t}
          \t}
          }

          func routingQualityGroupSufficient(group modelRoutingGroupKey, samples *modelRoutingModelSamples) bool {
          \treturn group.risk != ModelRoutingUnknownRisk && group.delta != RoundDeltaUnknown &&
          \t\tsamples.calls >= ModelRoutingMinQualityCallsPerGroup && len(samples.tasks) >= ModelRoutingMinQualityTasksPerGroup
          }
          ''', 'build cells + quality groups')
          s = s.replace('b.modelGroups', 'b.qualityGroups')
          s = replace_once(s,
          '''\tcase len(models) == 0:
          \t\treasons = append(reasons, "no resolved model recorded with usage; resolved-model contrast is unmeasurable")
          \tdefault:
          \t\treasons = append(reasons, fmt.Sprintf(
          \t\t\t"resolved-model contrast requires at least 2 distinct resolved models; observed only %s",
          \t\t\tstrings.Join(models, ", ")))
          ''',
          '''\tcase len(models) == 0:
          \t\treasons = append(reasons, "no attributable downstream quality evidence; operational outcome and packet_status are not model-quality evidence")
          \tdefault:
          \t\treasons = append(reasons, fmt.Sprintf(
          \t\t\t"resolved-model quality contrast requires at least 2 distinct resolved models with attributable downstream evidence; observed only %s",
          \t\t\tstrings.Join(models, ", ")))
          ''', 'unknown evaluation reasons')
          s = replace_once(s,
          '''func routingGroupSufficientModels(group modelRoutingGroupKey, groupModels map[string]*modelRoutingModelSamples, models []string) ([]string, []string) {
          \tcandidates := routingGroupCandidates(groupModels, models)
          \tif len(candidates) < 2 {
          \t\treturn nil, nil
          \t}
          \tsufficient := make([]string, 0, len(candidates))
          \tshortfalls := make([]string, 0)
          \tfor _, model := range candidates {
          \t\tsamples := groupModels[model]
          \t\tif samples.calls >= ModelRoutingMinCallsPerCell && len(samples.tasks) >= ModelRoutingMinTasksPerCell {
          \t\t\tsufficient = append(sufficient, model)
          \t\t\tcontinue
          \t\t}
          \t\tshortfalls = append(shortfalls, fmt.Sprintf(
          \t\t\t"%s: %s has %d calls across %d tasks, below min %d calls / %d tasks",
          \t\t\tmodelRoutingGroupLabel(group), model, samples.calls, len(samples.tasks),
          \t\t\tModelRoutingMinCallsPerCell, ModelRoutingMinTasksPerCell))
          \t}
          \treturn sufficient, shortfalls
          }
          ''',
          '''func routingGroupSufficientModels(group modelRoutingGroupKey, groupModels map[string]*modelRoutingModelSamples, models []string) ([]string, []string) {
          \tcandidates := routingGroupCandidates(groupModels, models)
          \tif len(candidates) < 2 {
          \t\treturn nil, nil
          \t}
          \tif group.risk == ModelRoutingUnknownRisk || group.delta == RoundDeltaUnknown {
          \t\treturn nil, []string{fmt.Sprintf("%s: controlled quality comparison requires known effective risk and convergence delta", modelRoutingGroupLabel(group))}
          \t}
          \tsufficient := make([]string, 0, len(candidates))
          \tshortfalls := make([]string, 0)
          \tfor _, model := range candidates {
          \t\tsamples := groupModels[model]
          \t\tif routingQualityGroupSufficient(group, samples) {
          \t\t\tsufficient = append(sufficient, model)
          \t\t\tcontinue
          \t\t}
          \t\tshortfalls = append(shortfalls, fmt.Sprintf(
          \t\t\t"%s: %s has %d attributable quality calls across %d tasks, below min %d calls / %d tasks",
          \t\t\tmodelRoutingGroupLabel(group), model, samples.calls, len(samples.tasks),
          \t\t\tModelRoutingMinQualityCallsPerGroup, ModelRoutingMinQualityTasksPerGroup))
          \t}
          \treturn sufficient, shortfalls
          }
          ''', 'group sufficiency')
          p.write_text(s)

          # Derive only deterministic downstream review results for producing worker calls.
          p = Path('glm-worker/internal/app/routingeval.go')
          s = p.read_text()
          s = replace_once(s,
          '''\t\treadable++
          \t\ttasks[index].ConvergenceDeltas = convergenceCallDeltas(records, tasks[index].Logs)
          ''',
          '''\t\treadable++
          \t\ttasks[index].ConvergenceDeltas = convergenceCallDeltas(records, tasks[index].Logs)
          \t\ttasks[index].QualityOutcomes = convergenceQualityOutcomes(records, tasks[index].Logs)
          ''', 'attach quality outcomes')
          anchor = '''func convergenceCallDeltas(records []state.RoundRecord, logs []state.ModelCallLog) map[string]string {
          \trounds, _ := buildConvergenceRounds(records, logs)
          \tdeltas := make(map[string]string)
          \tfor _, round := range rounds {
          \t\tfor _, entry := range round.reviewer {
          \t\t\trecordConvergenceCallDelta(deltas, entry, round.delta.Class)
          \t\t}
          \t\tfor _, entry := range round.worker {
          \t\t\trecordConvergenceCallDelta(deltas, entry, round.delta.Class)
          \t\t}
          \t}
          \treturn deltas
          }
          '''
          addition = anchor + '''
          func convergenceQualityOutcomes(records []state.RoundRecord, logs []state.ModelCallLog) map[string]string {
          \trounds, _ := buildConvergenceRounds(records, logs)
          \toutcomes := make(map[string]string)
          \tfor _, round := range rounds {
          \t\tif round.gap || round.mismatch || len(round.worker) != 1 {
          \t\t\tcontinue
          \t\t}
          \t\treview := convergenceReviewOutDetail(round)
          \t\tif review.Outcome == nil {
          \t\t\tcontinue
          \t\t}
          \t\tquality := ""
          \t\tswitch *review.Outcome {
          \t\tcase "PASS":
          \t\t\tquality = state.ModelRoutingQualityReviewPass
          \t\tcase "FIX_REQUIRED":
          \t\t\tquality = state.ModelRoutingQualityReviewFixRequired
          \t\tdefault:
          \t\t\tcontinue
          \t\t}
          \t\tif callID := round.worker[0].CallID; callID != "" {
          \t\t\toutcomes[callID] = quality
          \t\t}
          \t}
          \treturn outcomes
          }
          '''
          s = replace_once(s, anchor, addition, 'quality derivation')
          p.write_text(s)

          # Update state tests to the new machine contract and add focused regressions.
          p = Path('glm-worker/internal/state/routingeval_test.go')
          s = p.read_text()
          s = replace_once(s,
          '''\t\tPhase: phase, Role: role, ModelAlias: alias,
          \t\tOutcome: "success", PacketStatus: "IMPLEMENTED",
          ''',
          '''\t\tPhase: phase, Role: role, ModelAlias: alias, ResolvedModelID: "glm-5.3",
          \t\tOutcome: "success", PacketStatus: "IMPLEMENTED",
          ''', 'fixture top-level model')
          s = s.replace('report.Sufficiency.MinCalls != ModelRoutingMinCallsPerCell || report.Sufficiency.MinTasks != ModelRoutingMinTasksPerCell',
                        'report.Sufficiency.MinQualityCalls != ModelRoutingMinQualityCallsPerGroup || report.Sufficiency.MinQualityTasks != ModelRoutingMinQualityTasksPerGroup')
          s = s.replace('if workerCell.UsageUnknownCalls != 0 || workerCell.Sufficient {\n\t\tt.Fatalf("worker cell境界 = %#v", workerCell)\n\t}',
                        'if workerCell.UsageUnknownCalls != 0 || workerCell.TopLevelCalls != 2 {\n\t\tt.Fatalf("worker cell境界 = %#v", workerCell)\n\t}')
          old = '''\tif report.Evaluation.QualityDelta != ModelRoutingQualityDeltaInsufficient {
          \t\tt.Fatalf("quality delta = %#v", report.Evaluation)
          \t}
          \tif len(report.Evaluation.ComparableGroups) != 0 {
          \t\tt.Fatalf("comparable groups = %#v", report.Evaluation.ComparableGroups)
          \t}
          \tif len(report.Evaluation.Reasons) != 1 ||
          \t\treport.Evaluation.Reasons[0] != "no role+normalized-phase+effective-risk+convergence-delta group contains at least 2 of the observed resolved models" {
