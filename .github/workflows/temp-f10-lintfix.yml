name: Temporary F10 Lint Refactor
on:
  push:
    branches:
      - hardening-task/exhaustive-search-gate
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
      - name: Refactor callers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('glm-worker/internal/workflow/workflow.go')
          s = p.read_text()
          old = '''\t\tprompt := decisionPrompt(request, decision, activeTaskPath)\n\t\texhaustiveContext, err := w.exhaustiveSearchContext(request, activeTaskPath, state.WorkerRole, 1)\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t\tprompt += exhaustiveContext\n\t\tcheckpoint := state.ResumeCheckpoint{'''
          new = '''\t\tprompt := decisionPrompt(request, decision, activeTaskPath)\n\t\tcheckpoint := state.ResumeCheckpoint{'''
          if old not in s:
              raise SystemExit('decision anchor missing')
          s = s.replace(old, new, 1)
          old = '''\t\treturn w.executeWorkerCheckpoint(request, checkpoint, pocStage)\n\t}))\n}\n\nfunc (w *Workflow) ExecuteExplicitFix'''
          new = '''\t\treturn w.executeWorkerCheckpointWithExhaustiveContext(request, activeTaskPath, checkpoint, pocStage)\n\t}))\n}\n\nfunc (w *Workflow) ExecuteExplicitFix'''
          if old not in s:
              raise SystemExit('decision return anchor missing')
          s = s.replace(old, new, 1)
          old = '''\t\tprompt := explicitFixPrompt(request, decision, review, instruction, activeTaskPath)\n\t\texhaustiveContext, err := w.exhaustiveSearchContext(request, activeTaskPath, state.WorkerRole, 1)\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t\tprompt += exhaustiveContext\n\t\tcheckpoint := state.ResumeCheckpoint{'''
          new = '''\t\tprompt := explicitFixPrompt(request, decision, review, instruction, activeTaskPath)\n\t\tcheckpoint := state.ResumeCheckpoint{'''
          if old not in s:
              raise SystemExit('fix anchor missing')
          s = s.replace(old, new, 1)
          old = '''\t\treturn w.executeWorkerCheckpoint(request, checkpoint, pocStage)\n\t}))\n}\n\nfunc (w *Workflow) executeWorkerCheckpoint'''
          new = '''\t\treturn w.executeWorkerCheckpointWithExhaustiveContext(request, activeTaskPath, checkpoint, pocStage)\n\t}))\n}\n\nfunc (w *Workflow) executeWorkerCheckpoint'''
          if old not in s:
              raise SystemExit('fix return anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/exhaustive_search.go glm-worker/internal/reposearch/exhaustive.go
      - name: Validate
        working-directory: glm-worker
        run: |
          go test ./internal/reposearch ./internal/workflow
          go test -race ./internal/reposearch ./internal/workflow
          go vet ./...
          go build ./...
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/exhaustive_search.go glm-worker/internal/reposearch/exhaustive.go
          git rm .github/workflows/temp-f10-lintfix.yml
          git commit -m 'refactor: satisfy F10 repository lint'
          git push origin HEAD:hardening-task/exhaustive-search-gate
