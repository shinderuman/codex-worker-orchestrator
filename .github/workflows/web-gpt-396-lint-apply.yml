name: Web GPT Issue 396 Lint Apply

on:
  push:
    branches:
      - web-gpt/issue-396-sol-review-evidence
    paths:
      - .github/workflows/web-gpt-396-lint-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/issue-396-sol-review-evidence
      - name: Apply lint cleanup
        run: python3 .github/web-gpt-396-lint.py
      - name: Format and commit
        run: |
          gofmt -w glm-worker/internal/app/parent_evidence.go glm-worker/internal/state/parent_review_evidence.go
          rm .github/web-gpt-396-lint.py .github/workflows/web-gpt-396-lint-apply.yml
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m "Simplify review evidence validation"
          git push origin HEAD:web-gpt/issue-396-sol-review-evidence
