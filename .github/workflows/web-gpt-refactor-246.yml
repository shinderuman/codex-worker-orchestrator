name: web-gpt-refactor-246
on: push
permissions:
  contents: write
jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/refactor-246-typed-parent-validation
      - run: python3 .github/web-gpt-refactor-246.py
      - run: gofmt -w glm-worker/internal/packet/result.go glm-worker/internal/packet/validate.go glm-worker/internal/workflow/parent_validation.go glm-worker/internal/workflow/reviewer_validation_reconciliation.go glm-worker/internal/workflow/parent_validation_test.go glm-worker/internal/workflow/reviewer_validation_reconciliation_test.go glm-worker/internal/packet/parent_validation_test.go glm-worker/internal/packet/parent_validation_evidence_test.go
      - name: Commit edit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/packet/result.go glm-worker/internal/packet/validate.go glm-worker/internal/workflow/parent_validation.go glm-worker/internal/workflow/reviewer_validation_reconciliation.go glm-worker/internal/workflow/parent_validation_test.go glm-worker/internal/workflow/reviewer_validation_reconciliation_test.go glm-worker/internal/packet/parent_validation_test.go glm-worker/internal/packet/parent_validation_evidence_test.go
          git commit -m 'refactor: keep parent validation evidence typed'
          git push origin HEAD:web-gpt/refactor-246-typed-parent-validation
