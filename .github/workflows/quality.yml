name: Repository Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Repository lint gate
        run: ./harnesslint
      - name: Diagnose full Go test suite
        working-directory: glm-worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$(go test ./... 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            failure="$(printf '%s\n' "$output" | awk '/^--- FAIL: / { print $3; exit }')"
            package="$(printf '%s\n' "$output" | awk '$1 == "FAIL" && NF >= 2 { print $2; exit }')"
            excerpt="$(printf '%s\n' "$output" | grep -E '^--- FAIL:|^FAIL[[:space:]]|^[[:space:]]+[^[:space:]].*_test\.go:' | head -40)"
            body="$(printf 'CI diagnostic from PR #210: full Go suite failed.\n\n- package: `%s`\n- first failing test: `%s`\n\n```text\n%s\n```' "${package:-unknown}" "${failure:-unknown}" "$excerpt")"
            gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
          exit "$status"
