name: Repository Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Repository lint gate
        run: ./harnesslint
      - name: Diagnose full Go test suite
        id: full-go
        working-directory: glm-worker
        shell: bash
        run: |
          set +e
          output="$(go test ./... 2>&1)"
          status=$?
          printf '%s\n' "$output"
          failure="$(printf '%s\n' "$output" | awk '/^--- FAIL: / { print $3; exit }')"
          package="$(printf '%s\n' "$output" | awk '$1 == "FAIL" && NF >= 2 { print $2; exit }')"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'failure=%s\n' "${failure:-unknown}" >> "$GITHUB_OUTPUT"
          printf 'package=%s\n' "${package:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Full Go failure ${{ steps.full-go.outputs.package }} ${{ steps.full-go.outputs.failure }}
        if: steps.full-go.outputs.status != '0'
        run: exit 1
