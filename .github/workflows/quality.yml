name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Test
        run: go -C glm-worker test ./...
      - name: Race
        if: github.event_name == 'workflow_dispatch'
        run: go -C glm-worker test -race ./...
      - name: Vet
        run: go -C glm-worker vet ./...
      - name: Build
        run: go -C glm-worker build ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          GOBIN="$RUNNER_TEMP/bin" go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Repository quality gate
        run: ./harnesslint
