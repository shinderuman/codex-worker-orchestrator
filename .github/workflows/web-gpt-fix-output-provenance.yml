name: Web GPT Fix Output Provenance

on:
  push:
    branches:
      - web-gpt/review-fix/5eb816d-c2b6893

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Apply output provenance fix
        run: |
          python3 .github/web-gpt-fix-output-provenance.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("glm-worker/internal/workflow/review_flow.go")
          text = p.read_text()
          start = text.index("func qualityFixSnapshotMismatchReason(")
          end = text.index("\nfunc (w *Workflow) handleReviewResult(", start)
          replacement = '''func qualityFixSnapshotMismatchReason(workerEnd, reviewInput state.GitSnapshot, report harnesslint.Report) string {
          \tevidence := report.FixEvidence
          \tif evidence == nil || evidence.Method != harnesslint.FixProvenanceIsolatedPostimageV1 {
          \t\treturn fmt.Sprintf("machine quality fixer provenanceがありません(fixed=%d)", report.Fixed)
          \t}
          \tif !qualityFixEvidenceMatches(workerEnd, evidence.Input) {
          \t\treturn fmt.Sprintf("machine quality fixer input provenanceがworker-end snapshotと一致しません(fixed=%d)", report.Fixed)
          \t}
          \tif !qualityFixEvidenceMatches(reviewInput, evidence.Output) {
          \t\treturn fmt.Sprintf("machine quality fixer output provenanceがreview-input snapshotと一致しません(fixed=%d)", report.Fixed)
          \t}
          \tif reviewInput.Head != workerEnd.Head || reviewInput.IndexDigest != workerEnd.IndexDigest {
          \t\treturn fmt.Sprintf("machine quality fixer実行中にHEAD/indexが変化しました(fixed=%d)", report.Fixed)
          \t}
          \treturn ""
          }

          func qualityFixEvidenceMatches(snapshot state.GitSnapshot, evidence *harnesslint.FixInputSnapshot) bool {
          \treturn evidence != nil &&
          \t\tevidence.Head == snapshot.Head &&
          \t\tevidence.IndexDigest == snapshot.IndexDigest &&
          \t\tevidence.WorktreeDigest == snapshot.WorktreeDigest
          }
          '''
          p.write_text(text[:start] + replacement + text[end:])
          PY
          gofmt -w \
            glm-worker/internal/harnesslint/fix_isolation.go \
            glm-worker/internal/harnesslint/fix_isolation_test.go \
            glm-worker/internal/harnesslint/types.go \
            glm-worker/internal/workflow/review_flow.go \
            glm-worker/internal/workflow/quality_fixer_snapshot_test.go
          rm .github/web-gpt-fix-output-provenance.py .github/workflows/web-gpt-fix-output-provenance.yml
          git diff --check
      - name: Focused tests
        run: |
          go -C glm-worker test ./internal/harnesslint ./internal/workflow
      - name: Repository lint
        run: |
          quality_bin="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./harnesslint
      - name: Commit production fix
        run: |
          git config user.name shinderuman
          git config user.email shinderuman@gmail.com
          git add -A
          git commit -m 'Bind quality fixer output provenance'
          git push origin HEAD:web-gpt/review-fix/5eb816d-c2b6893
