name: Web GPT 387 Edit Validate

on:
  push:
    branches:
      - web-gpt/387-current-architecture-redesign
    paths:
      - .github/workflows/web-gpt-387-edit-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply architecture changes
        run: |
          python3 .github/web-gpt-387-edit.py
          gofmt -w \
            glm-worker/internal/state/store.go \
            glm-worker/internal/state/task_transition_context_test.go \
            glm-worker/internal/workflow/workflow.go \
            glm-worker/internal/app/app.go \
            glm-worker/internal/app/instruction_baseline.go \
            glm-worker/internal/app/parent_action_recovery.go \
            glm-worker/internal/app/quality_surface_recovery.go
          rm -f .github/web-gpt-387-edit.py .github/workflows/web-gpt-387-edit-validate.yml
          git diff --check
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add -A
          git commit -m 'Consolidate task and command state ownership'
          git push
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Targeted architecture tests
        working-directory: glm-worker
        run: go test ./internal/state ./internal/workflow ./internal/app
      - name: Repository lint gate
        run: ./harnesslint
      - name: Full Go test suite
        working-directory: glm-worker
        run: go test ./...
      - name: Full Go vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Full Go build
        working-directory: glm-worker
        run: go build ./...
