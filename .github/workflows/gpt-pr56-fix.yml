name: GPT PR56 fix and validate

on:
  push:
    branches:
      - gpt/high-floor-first-review

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/high-floor-first-review
          fetch-depth: 0
      - name: Apply issue 53 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one match, got {n}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              if new in text and old not in text:
                  return
              n = text.count(old)
              if n != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, got {n}")
              p.write_text(text.replace(old, new))

          schema = "glm-worker/internal/packet/schema.go"
          replace_once(schema,
          '''func riskFloorReviewerSchema() *objectSchema {
          ''',
          '''func highFloorReviewerSchema() *objectSchema {
          \treturn &objectSchema{
          \t\tType: schemaTypeObject,
          \t\tProperties: reviewerProperties(
          \t\t\tstringProperty(string(StatusFixRequired), string(StatusNeedsSolReview), string(StatusNeedsSolDecision)),
          \t\t\triskProperty(),
          \t\t),
          \t\tRequired: []string{"status", "risk", "targets", "artifacts"},
          \t}
          }

          func riskFloorReviewerSchema() *objectSchema {
          ''')
          replace_once(schema,
          '''func RiskFloorReviewerSchemaJSON() (string, error) {
          ''',
          '''func HighFloorReviewerSchemaJSON() (string, error) {
          \treturn schemaJSON(highFloorReviewerSchema())
          }

          func RiskFloorReviewerSchemaJSON() (string, error) {
          ''')

          runner = "glm-worker/internal/runner/runner.go"
          replace_once(runner,
          '''const subtypeStructuredOutputRetryExhausted = "error_max_structured_output_retries"
          ''',
          '''const subtypeStructuredOutputRetryExhausted = "error_max_structured_output_retries"

          const highFloorPhaseMarker = "high-floor"
          ''')
          replace_once(runner,
          '''\tif role == state.ReviewerRole {
          \t\tif strings.HasSuffix(phase, "risk-floor") {
          ''',
          '''\tif role == state.ReviewerRole {
          \t\tif strings.Contains(phase, highFloorPhaseMarker) {
          \t\t\treturn packet.HighFloorReviewerSchemaJSON()
          \t\t}
          \t\tif strings.HasSuffix(phase, "risk-floor") {
          ''')

          prompts = "glm-worker/internal/workflow/prompts.go"
          replace_once(prompts,
          '''func automaticFixPrompt(request string, decision string, reviewReport string, activeTaskPath string) string {
          ''',
          '''func reviewerHighRiskFloorPrompt(source string) string {
          \treturn fmt.Sprintf(`
          WRAPPER_EFFECTIVE_RISK_FLOOR: HIGH
          RISK_FLOOR_SOURCE: %s
          このreviewではPASSを返せません。修正可能な不具合があればFIX_REQUIREDを返してください。actual diffが未解決Sol decision axisを選択している場合はNEEDS_SOL_DECISIONを返してください。それ以外で修正不要ならNEEDS_SOL_REVIEW / HIGHとしてSolが読むべき最小TARGETSとSOL_QUESTIONを同じreview結果へ含めてください。
          `, source)
          }

          func automaticFixPrompt(request string, decision string, reviewReport string, activeTaskPath string) string {
          ''')

          workflow = "glm-worker/internal/workflow/workflow.go"
          replace_once(workflow,
          '''\tphase := fmt.Sprintf("reviewer-%d", reviewNumber)
          ''',
          '''\tfloorActive := risk.high && !w.acceptedFixScopeCoversCurrent()
          \tphase := fmt.Sprintf("reviewer-%d", reviewNumber)
          \tif floorActive {
          \t\tphase += "-high-floor"
          \t}
          ''')
          replace_once(workflow,
          '''\tprompt, err = w.withCurrentRuleContext(prompt)
          ''',
          '''\tif floorActive {
          \t\tprompt += reviewerHighRiskFloorPrompt(risk.source)
          \t}
          \tprompt, err = w.withCurrentRuleContext(prompt)
          ''')
          replace_once(workflow,
          '''\t}, decision, risk.high, nil
          }
          ''',
          '''\t}, decision, floorActive, nil
          }
          ''')

          unknown = "glm-worker/internal/workflow/unknown_surface_selfprotection_test.go"
          replace_once(unknown,
          '''\tr := &scriptedRunner{steps: []runnerStep{
          \t\t{structured: implementedPacket("done")},
          \t\t{structured: passPacket()},
          \t\t{structured: needsSolReviewPacket()},
          \t}}
          ''',
          '''\tr := &scriptedRunner{steps: []runnerStep{
          \t\t{structured: implementedPacket("done")},
          \t\t{structured: needsSolReviewPacket()},
          \t}}
          ''')
          replace_once(unknown,
          '''\tif got := strings.Join(r.phases, ","); got != "worker-new,reviewer-1,reviewer-1-risk-floor" {
          ''',
          '''\tif got := strings.Join(r.phases, ","); got != "worker-new,reviewer-1-high-floor" {
          ''')
          p = Path(unknown)
          marker = "func TestUnknownSurfaceHighFloorAllowsFixRequiredBeforeSolEscalation"
          if marker not in p.read_text():
              p.write_text(p.read_text() + r'''

          func TestUnknownSurfaceHighFloorAllowsFixRequiredBeforeSolEscalation(t *testing.T) {
          	st := newStateStoreT(t)
          	r := &scriptedRunner{steps: []runnerStep{
          		{structured: implementedPacket("initial")},
          		{structured: fixRequiredPacket()},
          		{structured: implementedPacket("fixed")},
          		{structured: needsSolReviewPacket()},
          	}}
          	w := newWorkflowT(t, st, r)
          	w.collectChangedPaths = func(string, string) ([]string, error) {
          		return []string{"runtime/new-worker.py"}, nil
          	}
          	if err := w.ExecuteNewTask("request"); err != nil {
          		t.Fatal(err)
          	}
          	want := "worker-new,reviewer-1-high-floor,worker-auto-fix-1,reviewer-2-high-floor"
          	if got := strings.Join(r.phases, ","); got != want {
          		t.Fatalf("phases = %q, want %q", got, want)
          	}
          	if !strings.Contains(r.prompts[1], "WRAPPER_EFFECTIVE_RISK_FLOOR: HIGH") {
          		t.Fatalf("high-floor prompt missing: %s", r.prompts[1])
          	}
          }

          func TestKnownSafeLowRiskReviewKeepsNormalPassPath(t *testing.T) {
          	st := newStateStoreT(t)
          	r := &scriptedRunner{steps: []runnerStep{
          		{structured: implementedPacket("done")},
          		{structured: passPacket()},
          	}}
          	w := newWorkflowT(t, st, r)
          	w.collectChangedPaths = func(string, string) ([]string, error) {
          		return []string{"docs/guide.md"}, nil
          	}
          	if err := w.ExecuteNewTask("request"); err != nil {
          		t.Fatal(err)
          	}
          	if got := strings.Join(r.phases, ","); got != "worker-new,reviewer-1" {
          		t.Fatalf("phases = %q", got)
          	}
          	if strings.Contains(r.prompts[1], "WRAPPER_EFFECTIVE_RISK_FLOOR") {
          		t.Fatalf("normal reviewer received high-floor prompt: %s", r.prompts[1])
          	}
          }
          ''')

          structured = "glm-worker/internal/runner/structured_schema_test.go"
          p = Path(structured)
          marker = "func TestStructuredSchemaHighFloorExcludesPass"
          if marker not in p.read_text():
              p.write_text(p.read_text() + r'''

          func TestStructuredSchemaHighFloorExcludesPass(t *testing.T) {
          	for _, phase := range []string{"reviewer-1-high-floor", "reviewer-1-high-floor-result-correct"} {
          		encoded, err := structuredSchema(state.ReviewerRole, phase)
          		if err != nil {
          			t.Fatal(err)
          		}
          		var schema map[string]any
          		if err := json.Unmarshal([]byte(encoded), &schema); err != nil {
          			t.Fatal(err)
          		}
          		properties := schema["properties"].(map[string]any)
          		status := properties["status"].(map[string]any)["enum"].([]any)
          		got := map[string]bool{}
          		for _, value := range status {
          			got[value.(string)] = true
          		}
          		for _, want := range []string{"FIX_REQUIRED", "NEEDS_SOL_REVIEW", "NEEDS_SOL_DECISION"} {
          			if !got[want] {
          				t.Fatalf("phase %s status enum = %v", phase, status)
          			}
          		}
          		if got["PASS"] {
          			t.Fatalf("phase %s unexpectedly permits PASS: %v", phase, status)
          		}
          	}
          }
          ''')

          diagnostic = "glm-worker/internal/workflow/diagnostic_test.go"
          text = Path(diagnostic).read_text()
          for fn in [
              "TestDiagnosticRecordsRiskFloorOnHighRiskReviewer",
              "TestDiagnosticRiskFloorReemitCallHasNoFloorDiagnostics",
              "TestDiagnosticPersistsWhenTelemetryContentDisabled",
          ]:
              start = text.index("func " + fn)
              next_func = text.find("\nfunc ", start + 5)
              end = len(text) if next_func < 0 else next_func
              block = text[start:end]
              if 'findLogByPhase(t, logs, "reviewer-1-high-floor")' not in block:
                  old = 'findLogByPhase(t, logs, "reviewer-1")'
                  if old not in block:
                      raise SystemExit(f"{diagnostic}: {fn} reviewer lookup missing")
                  block = block.replace(old, 'findLogByPhase(t, logs, "reviewer-1-high-floor")', 1)
                  text = text[:start] + block + text[end:]
          Path(diagnostic).write_text(text)

          wt = "glm-worker/internal/workflow/workflow_test.go"
          replace_once(wt,
          '''\tif !reflect.DeepEqual(r.phases, []string{"worker-new", "worker-auto-fix-1", "reviewer-2"}) {
          ''',
          '''\tif !reflect.DeepEqual(r.phases, []string{"worker-new", "worker-auto-fix-1", "reviewer-2-high-floor"}) {
          ''')
          replace_all(wt,
          '''\twantPhases := []string{"worker-new", "reviewer-1", "reviewer-1" + resultCorrectionPhaseSuffix, "worker-auto-fix-1", "reviewer-2"}
          ''',
          '''\twantPhases := []string{"worker-new", "reviewer-1-high-floor", "reviewer-1-high-floor" + resultCorrectionPhaseSuffix, "worker-auto-fix-1", "reviewer-2-high-floor"}
          ''', 2)
          replace_once(wt,
          '''\twantPhases := []string{"worker-new", "reviewer-1", "reviewer-1" + resultCorrectionPhaseSuffix}
          ''',
          '''\twantPhases := []string{"worker-new", "reviewer-1-high-floor", "reviewer-1-high-floor" + resultCorrectionPhaseSuffix}
          ''')
          PY
          gofmt -w \
            glm-worker/internal/packet/schema.go \
            glm-worker/internal/runner/runner.go \
            glm-worker/internal/runner/structured_schema_test.go \
            glm-worker/internal/workflow/prompts.go \
            glm-worker/internal/workflow/workflow.go \
            glm-worker/internal/workflow/unknown_surface_selfprotection_test.go \
            glm-worker/internal/workflow/diagnostic_test.go \
            glm-worker/internal/workflow/workflow_test.go
      - name: Validate
        shell: bash
        run: |
          cd glm-worker
          go test ./internal/packet ./internal/runner ./internal/workflow -count=1
          go vet ./...
          go build ./...
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "ChatGPT Web GPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glm-worker/internal/packet/schema.go glm-worker/internal/runner/runner.go glm-worker/internal/runner/structured_schema_test.go glm-worker/internal/workflow/prompts.go glm-worker/internal/workflow/workflow.go glm-worker/internal/workflow/unknown_surface_selfprotection_test.go glm-worker/internal/workflow/diagnostic_test.go glm-worker/internal/workflow/workflow_test.go
          git commit -m "fix: make first HIGH review floor-aware"
          git push origin HEAD:gpt/high-floor-first-review
