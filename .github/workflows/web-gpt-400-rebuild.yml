name: Web GPT Issue 400 Rebuild

on:
  push:
    branches:
      - web-gpt/issue-400-parent-review-authority
    paths:
      - .github/workflows/web-gpt-400-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Rebuild Issue 400 from saved work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore reviewed work without prior branch corruption
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/shinderuman/codex-worker-orchestrator/b148ac163c244af03306b667fb0659ddee4cbf11'
          files=(
            glm-worker/internal/state/lifecycle_transition.go
            glm-worker/internal/state/parent_accept.go
            glm-worker/internal/state/parent_action.go
            glm-worker/internal/state/parent_no_go.go
            glm-worker/internal/state/parent_review.go
            glm-worker/internal/state/parent_review_authority_test.go
            glm-worker/internal/state/parent_review_state.go
            glm-worker/internal/state/quality_surface_recovery.go
            glm-worker/internal/state/stats.go
            glm-worker/internal/state/store.go
            glm-worker/internal/workflow/workflow.go
          )
          for path in "${files[@]}"; do
            curl --fail --silent --show-error --location "$base/$path" --output "$path"
          done
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/state/store.go')
          text = path.read_text()
          duplicate = '''func (s *StateStore) InvalidateAllSessions() error {
          \treturn s.Remove("worker.id", "worker.ready", "reviewer.id", "reviewer.ready", "isolation.policy", isolationOriginStateFile)
          }

          func (s *StateStore) InvalidateSession(role SessionRole) error {
          \treturn s.Remove(string(role)+".id", string(role)+".ready")
          }

          '''
          if text.count(duplicate) != 1:
              raise SystemExit('expected exactly one duplicated session invalidation block')
          path.write_text(text.replace(duplicate, '', 1))

          path = Path('glm-worker/internal/state/parent_review.go')
          text = path.read_text()
          old = '''func (s *StateStore) RecordParentOutcome(kind, origin, cause string) (bool, error) {
          \tresolved, ok, err := s.resolveParentReviewState(kind, origin, cause)
          \tif !ok || err != nil {
          \t\treturn ok, err
          \t}
          \ts.UpdateTaskStats(func(stats *TaskStats) {
          \t\tstats.ParentReviewOpen = nil
          \t\tstats.recordParentOutcome(kind, origin, resolved)
          \t})
          \ttaskID, err := s.TaskID()
          \tif err != nil {
          \t\treturn false, err
          \t}
          \ts.appendParentOutcomeEvent(taskID, parentPhaseOfKind(kind), kind, origin, cause, resolved)
          \treturn true, nil
          }
          '''
          new = '''func (s *StateStore) RecordParentOutcome(kind, origin, cause string) (bool, error) {
          \ttaskID, err := s.TaskID()
          \tif err != nil {
          \t\treturn false, err
          \t}
          \tresolved, ok, err := s.resolveParentReviewState(kind, origin, cause)
          \tif !ok || err != nil {
          \t\treturn ok, err
          \t}
          \ts.UpdateTaskStats(func(stats *TaskStats) {
          \t\tstats.ParentReviewOpen = nil
          \t\tstats.recordParentOutcome(kind, origin, resolved)
          \t})
          \ts.appendParentOutcomeEvent(taskID, parentPhaseOfKind(kind), kind, origin, cause, resolved)
          \treturn true, nil
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected RecordParentOutcome saved form exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w \
            glm-worker/internal/state/lifecycle_transition.go \
            glm-worker/internal/state/parent_accept.go \
            glm-worker/internal/state/parent_action.go \
            glm-worker/internal/state/parent_no_go.go \
            glm-worker/internal/state/parent_review.go \
            glm-worker/internal/state/parent_review_authority_test.go \
            glm-worker/internal/state/parent_review_state.go \
            glm-worker/internal/state/quality_surface_recovery.go \
            glm-worker/internal/state/stats.go \
            glm-worker/internal/state/store.go \
            glm-worker/internal/workflow/workflow.go
          rm .github/workflows/web-gpt-400-rebuild.yml
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Validate
        run: |
          ./commentlint
          ./harnesslint
          ./goquality vet
          ./goquality build
          cd glm-worker
          go test ./...
      - name: Commit rebuilt implementation
        run: |
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add -A
          git commit -m 'Move parent review authority out of TaskStats'
          git push origin HEAD:web-gpt/issue-400-parent-review-authority
