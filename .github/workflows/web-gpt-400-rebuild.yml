name: Web GPT Issue 400 Rebuild

on:
  push:
    branches:
      - web-gpt/issue-400-parent-review-authority
    paths:
      - .github/workflows/web-gpt-400-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Rebuild Issue 400 from saved work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebuild implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/issue400_rebuild.py')
          text = path.read_text()
          old = '''seed_after_task_write(
              "glm-worker/internal/app/watch_orphan_test.go",
              "watchOrphanTaskID",
              "seedParentReviewStateForTest(t, st, watchOrphanTaskID)",
              1,
          )'''
          new = old.rsplit('    1,', 1)[0] + '    2,\n)'
          if text.count(old) != 1:
              raise SystemExit('watch_orphan fixture count patch target missing')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/issue400_rebuild.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/app/machine_output_test.go')
          text = path.read_text()
          old_import = '''\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/config"\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"\n'''
          new_import = '''\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/config"\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/packet"\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"\n'''
          if text.count(old_import) != 1:
              raise SystemExit('machine output import patch target missing')
          text = text.replace(old_import, new_import, 1)
          start = text.index('func TestDispatchReleasesTypedStatsWarningThroughMachineStderr')
          end = text.index('\nfunc ', start + 1)
          section = text[start:end]
          old_seed = '''\tst, err := state.NewStateStore(cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n'''
          new_seed = old_seed + '''\tif _, err := st.StartNewTask(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := st.RecordSolResult(packet.Result{Status: packet.StatusPass, Risk: packet.RiskLow}, state.ParentReviewProducer{}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := st.SetTaskStatus(state.TaskStatusComplete); err != nil {\n\t\tt.Fatal(err)\n\t}\n'''
          if section.count(old_seed) != 1:
              raise SystemExit(f'machine output seed patch target count = {section.count(old_seed)}')
          section = section.replace(old_seed, new_seed, 1)
          old_expect = '''\tif got, want := strings.TrimSpace(stdout.String()), "{\\\"accepted\\\":false}"; got != want {\n'''
          new_expect = '''\tif got, want := strings.TrimSpace(stdout.String()), "{\\\"accepted\\\":true}"; got != want {\n'''
          if section.count(old_expect) != 1:
              raise SystemExit('machine output expectation patch target missing')
          section = section.replace(old_expect, new_expect, 1)
          old_warning = '''\tlines := strings.Split(strings.TrimRight(stderr.String(), "\\n"), "\\n")
\tif len(lines) != 1 {
\t\tt.Fatalf("machine stderrへ出力された行数 = %d want 1: %q", len(lines), stderr.String())
\t}
\tvar event struct {
\t\tType    string `json:"type"`
\t\tScope   string `json:"scope"`
\t\tMessage string `json:"message"`
\t\tError   string `json:"error"`
\t}
\tif err := json.Unmarshal([]byte(lines[0]), &event); err != nil {
\t\tt.Fatalf("machine stderr行がJSON objectとして解析できません: %v: %q", err, lines[0])
\t}
\tif event.Type != "warning" || event.Scope != "task_stats" || event.Message == "" || event.Error == "" {
\t\tt.Fatalf("typed warning eventの契約が守られていません: %#v", event)
\t}
'''
          new_warning = '''\tlines := strings.Split(strings.TrimRight(stderr.String(), "\\n"), "\\n")
\tif len(lines) != 2 {
\t\tt.Fatalf("machine stderrへ出力された行数 = %d want 2: %q", len(lines), stderr.String())
\t}
\tfor _, line := range lines {
\t\tvar event struct {
\t\t\tType    string `json:"type"`
\t\t\tScope   string `json:"scope"`
\t\t\tMessage string `json:"message"`
\t\t\tError   string `json:"error"`
\t\t}
\t\tif err := json.Unmarshal([]byte(line), &event); err != nil {
\t\t\tt.Fatalf("machine stderr行がJSON objectとして解析できません: %v: %q", err, line)
\t\t}
\t\tif event.Type != "warning" || event.Scope != "task_stats" || event.Message == "" || event.Error == "" {
\t\t\tt.Fatalf("typed warning eventの契約が守られていません: %#v", event)
\t\t}
\t}
'''
          if section.count(old_warning) != 1:
              raise SystemExit('machine output warning patch target missing')
          section = section.replace(old_warning, new_warning, 1)
          path.write_text(text[:start] + section + text[end:])
          PY
          mapfile -t go_files < <(git diff --name-only -- '*.go')
          gofmt -w "${go_files[@]}"
          rm .github/workflows/web-gpt-400-rebuild.yml .github/issue400_rebuild.py
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Validate
        run: |
          ./commentlint
          ./harnesslint
          ./goquality vet
          ./goquality build
          cd glm-worker
          go test ./...
      - name: Commit rebuilt implementation
        run: |
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add -A
          git commit -m 'Move parent review authority out of TaskStats'
          git push origin HEAD:web-gpt/issue-400-parent-review-authority
