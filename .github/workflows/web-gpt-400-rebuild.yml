name: Web GPT Issue 400 Rebuild

on:
  push:
    branches:
      - web-gpt/issue-400-parent-review-authority
    paths:
      - .github/workflows/web-gpt-400-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Rebuild Issue 400 from saved work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore reviewed work without prior branch corruption
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/shinderuman/codex-worker-orchestrator/b148ac163c244af03306b667fb0659ddee4cbf11'
          files=(
            glm-worker/internal/state/lifecycle_transition.go
            glm-worker/internal/state/parent_accept.go
            glm-worker/internal/state/parent_action.go
            glm-worker/internal/state/parent_no_go.go
            glm-worker/internal/state/parent_review.go
            glm-worker/internal/state/parent_review_authority_test.go
            glm-worker/internal/state/parent_review_state.go
            glm-worker/internal/state/quality_surface_recovery.go
            glm-worker/internal/state/stats.go
            glm-worker/internal/state/store.go
            glm-worker/internal/workflow/workflow.go
          )
          for path in "${files[@]}"; do
            curl --fail --silent --show-error --location "$base/$path" --output "$path"
          done
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/state/store.go')
          text = path.read_text()
          duplicate = '''func (s *StateStore) InvalidateAllSessions() error {
          \treturn s.Remove("worker.id", "worker.ready", "reviewer.id", "reviewer.ready", "isolation.policy", isolationOriginStateFile)
          }

          func (s *StateStore) InvalidateSession(role SessionRole) error {
          \treturn s.Remove(string(role)+".id", string(role)+".ready")
          }

          '''
          if text.count(duplicate) != 1:
              raise SystemExit('expected exactly one duplicated session invalidation block')
          text = text.replace(duplicate, '', 1)

          resume = '''\tif resume {
          \t\tstats, err := s.loadTaskStats()
          \t\tif err != nil || stats.TaskID != taskID {
          \t\t\ts.InitializeTaskStats(taskID)
          \t\t}
          \t\tif _, err := s.loadParentReviewState(); err != nil {
          \t\t\treturn "", fmt.Errorf("session rotation retry cannot verify parent review state: %w", err)
          \t\t}
          \t\tif err := s.SetTaskStatus(TaskStatusActive); err != nil {
          \t\t\treturn "", err
          \t\t}
          \t\treturn taskID, nil
          \t}
          '''
          if text.count(resume) != 1:
              raise SystemExit('expected session rotation resume branch exactly once')
          text = text.replace(resume, '''\tif resume {
          \t\treturn s.resumeTaskWithID(taskID)
          \t}
          ''', 1)
          marker = '''func newTaskTransitionStateFileNames() []string {
          '''
          helper = '''func (s *StateStore) resumeTaskWithID(taskID string) (string, error) {
          \tstats, err := s.loadTaskStats()
          \tif err != nil || stats.TaskID != taskID {
          \t\ts.InitializeTaskStats(taskID)
          \t}
          \tif _, err := s.loadParentReviewState(); err != nil {
          \t\treturn "", fmt.Errorf("session rotation retry cannot verify parent review state: %w", err)
          \t}
          \tif err := s.SetTaskStatus(TaskStatusActive); err != nil {
          \t\treturn "", err
          \t}
          \treturn taskID, nil
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit('expected newTaskTransitionStateFileNames exactly once')
          path.write_text(text.replace(marker, helper + marker, 1))

          path = Path('glm-worker/internal/state/parent_review.go')
          text = path.read_text()
          old = '''func (s *StateStore) RecordParentOutcome(kind, origin, cause string) (bool, error) {
          \tresolved, ok, err := s.resolveParentReviewState(kind, origin, cause)
          \tif !ok || err != nil {
          \t\treturn ok, err
          \t}
          \ts.UpdateTaskStats(func(stats *TaskStats) {
          \t\tstats.ParentReviewOpen = nil
          \t\tstats.recordParentOutcome(kind, origin, resolved)
          \t})
          \ttaskID, err := s.TaskID()
          \tif err != nil {
          \t\treturn false, err
          \t}
          \ts.appendParentOutcomeEvent(taskID, parentPhaseOfKind(kind), kind, origin, cause, resolved)
          \treturn true, nil
          }
          '''
          new = '''func (s *StateStore) RecordParentOutcome(kind, origin, cause string) (bool, error) {
          \ttaskID, err := s.TaskID()
          \tif err != nil {
          \t\treturn false, err
          \t}
          \tresolved, ok, err := s.resolveParentReviewState(kind, origin, cause)
          \tif !ok || err != nil {
          \t\treturn ok, err
          \t}
          \ts.UpdateTaskStats(func(stats *TaskStats) {
          \t\tstats.ParentReviewOpen = nil
          \t\tstats.recordParentOutcome(kind, origin, resolved)
          \t})
          \ts.appendParentOutcomeEvent(taskID, parentPhaseOfKind(kind), kind, origin, cause, resolved)
          \treturn true, nil
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected RecordParentOutcome saved form exactly once')
          path.write_text(text.replace(old, new, 1))

          changed = 0
          for path in Path('glm-worker').rglob('*_test.go'):
              lines = path.read_text().splitlines(keepends=True)
              out = []
              file_changed = False
              for line in lines:
                  stripped = line.strip()
                  if '.RecordSolResult(' in stripped and stripped.endswith(')') and not stripped.startswith('if err :=') and not stripped.startswith('_ ='):
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(f'{indent}if err := {stripped}; err != nil {{\n')
                      out.append(f'{indent}\tt.Fatal(err)\n')
                      out.append(f'{indent}}}\n')
                      changed += 1
                      file_changed = True
                  else:
                      out.append(line)
              if file_changed:
                  path.write_text(''.join(out))
          if changed != 35:
              raise SystemExit(f'expected to update 35 unchecked RecordSolResult calls, got {changed}')

          path = Path('glm-worker/internal/state/parent_review_test.go')
          text = path.read_text()
          old_sig = 'func recordPacket(st *StateStore, status packet.Status, risk packet.Risk, producer ParentReviewProducer) {'
          new_sig = 'func recordPacket(t *testing.T, st *StateStore, status packet.Status, risk packet.Risk, producer ParentReviewProducer) {'
          if text.count(old_sig) != 1:
              raise SystemExit('expected recordPacket helper signature exactly once')
          text = text.replace(old_sig, new_sig, 1)
          text = text.replace('recordPacket(st, ', 'recordPacket(t, st, ')
          path.write_text(text)
          PY
          mapfile -t go_files < <(git diff --name-only -- '*.go')
          gofmt -w "${go_files[@]}"
          rm .github/workflows/web-gpt-400-rebuild.yml
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Validate
        run: |
          ./commentlint
          ./harnesslint
          ./goquality vet
          ./goquality build
          cd glm-worker
          go test ./...
      - name: Commit rebuilt implementation
        run: |
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add -A
          git commit -m 'Move parent review authority out of TaskStats'
          git push origin HEAD:web-gpt/issue-400-parent-review-authority
