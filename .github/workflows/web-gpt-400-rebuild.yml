name: Web GPT Issue 400 Rebuild

on:
  push:
    branches:
      - web-gpt/issue-400-parent-review-authority
    paths:
      - .github/workflows/web-gpt-400-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Rebuild Issue 400 from saved work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebuild implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/issue400_rebuild.py')
          text = path.read_text()
          old = '''seed_after_task_write(
              "glm-worker/internal/app/watch_orphan_test.go",
              "watchOrphanTaskID",
              "seedParentReviewStateForTest(t, st, watchOrphanTaskID)",
              1,
          )'''
          new = old.rsplit('    1,', 1)[0] + '    2,\n)'
          if text.count(old) != 1:
              raise SystemExit('watch_orphan fixture count patch target missing')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/issue400_rebuild.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('glm-worker/internal/app/machine_output_test.go')
          text = path.read_text()
          old_import = '''\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/config"\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"\n'''
          new_import = '''\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/config"\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/packet"\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"\n'''
          if text.count(old_import) != 1:
              raise SystemExit('machine output import patch target missing')
          text = text.replace(old_import, new_import, 1)
          old_seed = '''\tst, err := state.NewStateStore(cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := os.WriteFile(st.Path("task-stats.json"), []byte("not json\\n"), 0o600); err != nil {\n'''
          new_seed = '''\tst, err := state.NewStateStore(cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif _, err := st.StartNewTask(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := st.RecordSolResult(packet.Result{Status: packet.StatusPass, Risk: packet.RiskLow}, state.ParentReviewProducer{}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := os.WriteFile(st.Path("task-stats.json"), []byte("not json\\n"), 0o600); err != nil {\n'''
          if text.count(old_seed) != 1:
              raise SystemExit('machine output seed patch target missing')
          text = text.replace(old_seed, new_seed, 1)
          old_expect = '''\tif got, want := strings.TrimSpace(stdout.String()), "{\\\"accepted\\\":false}"; got != want {\n'''
          new_expect = '''\tif got, want := strings.TrimSpace(stdout.String()), "{\\\"accepted\\\":true}"; got != want {\n'''
          if text.count(old_expect) != 1:
              raise SystemExit('machine output expectation patch target missing')
          path.write_text(text.replace(old_expect, new_expect, 1))
          PY
          mapfile -t go_files < <(git diff --name-only -- '*.go')
          gofmt -w "${go_files[@]}"
          rm .github/workflows/web-gpt-400-rebuild.yml .github/issue400_rebuild.py
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Validate
        run: |
          ./commentlint
          ./harnesslint
          ./goquality vet
          ./goquality build
          cd glm-worker
          go test ./...
      - name: Commit rebuilt implementation
        run: |
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add -A
          git commit -m 'Move parent review authority out of TaskStats'
          git push origin HEAD:web-gpt/issue-400-parent-review-authority
