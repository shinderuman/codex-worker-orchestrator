name: Web GPT Issue 400 Rebuild

on:
  push:
    branches:
      - web-gpt/issue-400-parent-review-authority
    paths:
      - .github/workflows/web-gpt-400-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Rebuild Issue 400 from saved work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebuild implementation
        run: |
          python3 .github/issue400_rebuild.py
          mapfile -t go_files < <(git diff --name-only -- '*.go')
          gofmt -w "${go_files[@]}"
          rm .github/workflows/web-gpt-400-rebuild.yml .github/issue400_rebuild.py
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Validate
        run: |
          ./commentlint
          ./harnesslint
          ./goquality vet
          ./goquality build
          cd glm-worker
          go test ./...
      - name: Commit rebuilt implementation
        run: |
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add -A
          git commit -m 'Move parent review authority out of TaskStats'
          git push origin HEAD:web-gpt/issue-400-parent-review-authority
