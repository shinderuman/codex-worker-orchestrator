name: Web GPT Issue 400 Rebuild

on:
  push:
    branches:
      - web-gpt/issue-400-parent-review-authority
    paths:
      - .github/workflows/web-gpt-400-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Rebuild Issue 400 from saved work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore reviewed work without prior branch corruption
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/shinderuman/codex-worker-orchestrator/b148ac163c244af03306b667fb0659ddee4cbf11'
          files=(
            glm-worker/internal/state/lifecycle_transition.go
            glm-worker/internal/state/parent_accept.go
            glm-worker/internal/state/parent_action.go
            glm-worker/internal/state/parent_no_go.go
            glm-worker/internal/state/parent_review.go
            glm-worker/internal/state/parent_review_authority_test.go
            glm-worker/internal/state/parent_review_state.go
            glm-worker/internal/state/quality_surface_recovery.go
            glm-worker/internal/state/stats.go
            glm-worker/internal/state/store.go
            glm-worker/internal/workflow/workflow.go
          )
          for path in "${files[@]}"; do
            curl --fail --silent --show-error --location "$base/$path" --output "$path"
          done
          python3 - <<'PY'
          from pathlib import Path

          path = Path('glm-worker/internal/state/store.go')
          text = path.read_text()
          duplicate = '''func (s *StateStore) InvalidateAllSessions() error {
          \treturn s.Remove("worker.id", "worker.ready", "reviewer.id", "reviewer.ready", "isolation.policy", isolationOriginStateFile)
          }

          func (s *StateStore) InvalidateSession(role SessionRole) error {
          \treturn s.Remove(string(role)+".id", string(role)+".ready")
          }

          '''
          if text.count(duplicate) != 1:
              raise SystemExit('expected exactly one duplicated session invalidation block')
          text = text.replace(duplicate, '', 1)

          resume = '''\tif resume {
          \t\tstats, err := s.loadTaskStats()
          \t\tif err != nil || stats.TaskID != taskID {
          \t\t\ts.InitializeTaskStats(taskID)
          \t\t}
          \t\tif _, err := s.loadParentReviewState(); err != nil {
          \t\t\treturn "", fmt.Errorf("session rotation retry cannot verify parent review state: %w", err)
          \t\t}
          \t\tif err := s.SetTaskStatus(TaskStatusActive); err != nil {
          \t\t\treturn "", err
          \t\t}
          \t\treturn taskID, nil
          \t}
          '''
          if text.count(resume) != 1:
              raise SystemExit('expected session rotation resume branch exactly once')
          text = text.replace(resume, '''\tif resume {
          \t\treturn s.resumeTaskWithID(taskID)
          \t}
          ''', 1)
          marker = '''func newTaskTransitionStateFileNames() []string {
          '''
          helper = '''func (s *StateStore) resumeTaskWithID(taskID string) (string, error) {
          \tstats, err := s.loadTaskStats()
          \tif err != nil || stats.TaskID != taskID {
          \t\ts.InitializeTaskStats(taskID)
          \t}
          \tif _, err := s.loadParentReviewState(); err != nil {
          \t\treturn "", fmt.Errorf("session rotation retry cannot verify parent review state: %w", err)
          \t}
          \tif err := s.SetTaskStatus(TaskStatusActive); err != nil {
          \t\treturn "", err
          \t}
          \treturn taskID, nil
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit('expected newTaskTransitionStateFileNames exactly once')
          path.write_text(text.replace(marker, helper + marker, 1))

          path = Path('glm-worker/internal/state/parent_review.go')
          text = path.read_text()
          old = '''func (s *StateStore) RecordParentOutcome(kind, origin, cause string) (bool, error) {
          \tresolved, ok, err := s.resolveParentReviewState(kind, origin, cause)
          \tif !ok || err != nil {
          \t\treturn ok, err
          \t}
          \ts.UpdateTaskStats(func(stats *TaskStats) {
          \t\tstats.ParentReviewOpen = nil
          \t\tstats.recordParentOutcome(kind, origin, resolved)
          \t})
          \ttaskID, err := s.TaskID()
          \tif err != nil {
          \t\treturn false, err
          \t}
          \ts.appendParentOutcomeEvent(taskID, parentPhaseOfKind(kind), kind, origin, cause, resolved)
          \treturn true, nil
          }
          '''
          new = '''func (s *StateStore) RecordParentOutcome(kind, origin, cause string) (bool, error) {
          \ttaskID, err := s.TaskID()
          \tif err != nil {
          \t\treturn false, err
          \t}
          \tresolved, ok, err := s.resolveParentReviewState(kind, origin, cause)
          \tif !ok || err != nil {
          \t\treturn ok, err
          \t}
          \ts.UpdateTaskStats(func(stats *TaskStats) {
          \t\tstats.ParentReviewOpen = nil
          \t\tstats.recordParentOutcome(kind, origin, resolved)
          \t})
          \ts.appendParentOutcomeEvent(taskID, parentPhaseOfKind(kind), kind, origin, cause, resolved)
          \treturn true, nil
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected RecordParentOutcome saved form exactly once')
          path.write_text(text.replace(old, new, 1))

          path = Path('glm-worker/internal/state/parent_review_state.go')
          text = path.read_text()
          needle = '''\tif kind == ParentOutcomeFix {
          \t\tif err := validateParentFixDeclaration(origin, cause); err != nil {
          \t\t\treturn ParentReviewOpenState{}, false, err
          \t\t}
          \t}
          \tstate, err := s.loadParentReviewState()
          '''
          replacement = '''\tif kind == ParentOutcomeFix {
          \t\tif err := validateParentFixDeclaration(origin, cause); err != nil {
          \t\t\treturn ParentReviewOpenState{}, false, err
          \t\t}
          \t}
          \ttaskID, taskErr := s.Read("task.id")
          \tif errors.Is(taskErr, os.ErrNotExist) || taskID == "" {
          \t\treturn ParentReviewOpenState{}, false, nil
          \t}
          \tif taskErr != nil {
          \t\treturn ParentReviewOpenState{}, false, taskErr
          \t}
          \tstate, err := s.loadParentReviewState()
          '''
          if text.count(needle) != 1:
              raise SystemExit('expected resolveParentReviewState load boundary exactly once')
          path.write_text(text.replace(needle, replacement, 1))

          changed = 0
          for path in Path('glm-worker').rglob('*_test.go'):
              lines = path.read_text().splitlines(keepends=True)
              out = []
              file_changed = False
              for line in lines:
                  stripped = line.strip()
                  if '.RecordSolResult(' in stripped and stripped.endswith(')') and not stripped.startswith('if err :=') and not stripped.startswith('_ ='):
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(f'{indent}if err := {stripped}; err != nil {{\n')
                      out.append(f'{indent}\tt.Fatal(err)\n')
                      out.append(f'{indent}}}\n')
                      changed += 1
                      file_changed = True
                  else:
                      out.append(line)
              if file_changed:
                  path.write_text(''.join(out))
          if changed != 35:
              raise SystemExit(f'expected to update 35 unchecked RecordSolResult calls, got {changed}')

          path = Path('glm-worker/internal/state/parent_review_test.go')
          text = path.read_text()
          old_sig = 'func recordPacket(st *StateStore, status packet.Status, risk packet.Risk, producer ParentReviewProducer) {'
          new_sig = 'func recordPacket(t *testing.T, st *StateStore, status packet.Status, risk packet.Risk, producer ParentReviewProducer) {'
          if text.count(old_sig) != 1:
              raise SystemExit('expected recordPacket helper signature exactly once')
          text = text.replace(old_sig, new_sig, 1)
          text = text.replace('recordPacket(st, ', 'recordPacket(t, st, ')
          path.write_text(text)

          helper_path = Path('glm-worker/internal/app/parent_review_state_fixture_test.go')
          helper_path.write_text('''package app

          import (
          \t"fmt"
          \t"testing"

          \t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/state"
          )

          func seedParentReviewStateForTest(t *testing.T, st *state.StateStore, taskID string) {
          \tt.Helper()
          \tvalue := fmt.Sprintf(`{"version":1,"task_id":%q}`, taskID)
          \tif err := st.Write("parent-review-state.json", value); err != nil {
          \t\tt.Fatal(err)
          \t}
          }
          ''')

          path = Path('glm-worker/internal/app/parent_handoff_test.go')
          text = path.read_text()
          task_block = '''\t\t\tif err := st.Write("task.id", routingEvidenceTaskID); err != nil {
          \t\t\t\tt.Fatal(err)
          \t\t\t}
          '''
          if text.count(task_block) != 1:
              raise SystemExit('expected routing evidence task fixture exactly once')
          text = text.replace(task_block, task_block + '\t\t\tseedParentReviewStateForTest(t, st, routingEvidenceTaskID)\n', 1)
          mirror_block = '''\tst.UpdateTaskStats(func(stats *state.TaskStats) {
          \t\tstats.ParentReviewOpen = &state.ParentReviewOpenState{PacketStatus: "PASS", Risk: "LOW"}
          \t})
          '''
          canonical_block = '''\tif err := st.RecordSolResult(packet.Result{Status: packet.StatusPass, Risk: packet.RiskLow}, state.ParentReviewProducer{}); err != nil {
          \t\tt.Fatal(err)
          \t}
          '''
          if text.count(mirror_block) != 2:
              raise SystemExit(f'expected two app PASS mirror fixtures, got {text.count(mirror_block)}')
          path.write_text(text.replace(mirror_block, canonical_block))

          path = Path('glm-worker/internal/app/quality_preflight_test.go')
          text = path.read_text()
          task_block = '''\tif err := st.Write("task.id", taskID); err != nil {
          \t\tt.Fatal(err)
          \t}
          '''
          if text.count(task_block) < 1:
              raise SystemExit('expected preflight task fixture')
          path.write_text(text.replace(task_block, task_block + '\tseedParentReviewStateForTest(t, st, taskID)\n', 1))

          for name in ('glm-worker/internal/app/watch_orphan_test.go', 'glm-worker/internal/app/watch_orphan_unix_test.go'):
              path = Path(name)
              text = path.read_text()
              block = '''if err := st.Write("task.id", watchOrphanTaskID); err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          ''' if name.endswith('_unix_test.go') else '''if err := st.Write("task.id", watchOrphanTaskID); err != nil {
          \t\tt.Fatal(err)
          \t}
          '''
              count = text.count(block)
              if count == 0:
                  raise SystemExit(f'expected watch orphan task fixture in {name}')
              insertion = block + ('\t\tseedParentReviewStateForTest(t, st, watchOrphanTaskID)\n' if name.endswith('_unix_test.go') else '\tseedParentReviewStateForTest(t, st, watchOrphanTaskID)\n')
              path.write_text(text.replace(block, insertion))

          path = Path('glm-worker/internal/state/parent_action_parked_origin_test.go')
          text = path.read_text()
          old = '''func setParkedReviewLabel(t *testing.T, st *StateStore, label string) {
          \tt.Helper()
          \tst.UpdateTaskStats(func(stats *TaskStats) {
          \t\tstats.ParentReviewOpen = &ParentReviewOpenState{PacketStatus: label}
          \t})
          }
          '''
          new = '''func setParkedReviewLabel(t *testing.T, st *StateStore, label string) {
          \tt.Helper()
          \tcurrent, err := st.loadParentReviewState()
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif label == roundCommentNone {
          \t\tcurrent.Open = nil
          \t} else {
          \t\tcurrent.Open = &ParentReviewOpenState{PacketStatus: label}
          \t}
          \tif err := st.writeParentReviewState(current); err != nil {
          \t\tt.Fatal(err)
          \t}
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected parked review mirror helper exactly once')
          path.write_text(text.replace(old, new, 1))

          path = Path('glm-worker/internal/state/session_rotation_test.go')
          text = path.read_text()
          old = '''\t\tst.UpdateTaskStats(func(stats *TaskStats) {
          \t\t\tstats.openParentReview("PASS", "LOW", ParentReviewProducer{})
          \t\t})
          '''
          new = '''\t\tif err := st.openParentReviewState("PASS", "LOW", ParentReviewProducer{}); err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          '''
          if text.count(old) != 1:
              raise SystemExit('expected session rotation mirror fixture exactly once')
          path.write_text(text.replace(old, new, 1))

          path = Path('glm-worker/internal/state/quality_surface_recovery_test.go')
          text = path.read_text()
          old = '''\tseedApprovedQualitySurfaceActivation(t, st)
          \tfailWritesFor(t, st, currentStatsFile)

          \terr := st.ActivateQualitySurfaceApproval()
          '''
          new = '''\tseedApprovedQualitySurfaceActivation(t, st)
          \tfailWritesFor(t, st, parentReviewStateFile)

          \terr := st.ActivateQualitySurfaceApproval()
          '''
          if text.count(old) != 1:
              raise SystemExit('expected quality surface close failure injection exactly once')
          path.write_text(text.replace(old, new, 1))

          path = Path('glm-worker/internal/workflow/quality_surface_parent_approval_test.go')
          text = path.read_text()
          old = '''\tst, err := state.NewStateStore(cfg)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif err := state.CaptureGitBaseline(cfg, st); err != nil {
          '''
          new = '''\tst, err := state.NewStateStore(cfg)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif _, err := st.StartNewTask(); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif err := state.CaptureGitBaseline(cfg, st); err != nil {
          '''
          if text.count(old) != 1:
              raise SystemExit('expected quality surface parent approval setup exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          mapfile -t go_files < <(git diff --name-only -- '*.go')
          gofmt -w "${go_files[@]}"
          rm .github/workflows/web-gpt-400-rebuild.yml
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Validate
        run: |
          ./commentlint
          ./harnesslint
          ./goquality vet
          ./goquality build
          cd glm-worker
          go test ./...
      - name: Commit rebuilt implementation
        run: |
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add -A
          git commit -m 'Move parent review authority out of TaskStats'
          git push origin HEAD:web-gpt/issue-400-parent-review-authority
