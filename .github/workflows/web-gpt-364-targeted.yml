name: Web GPT 364 Targeted Validation

on:
  push:
    branches:
      - web-gpt/364-quality-scope-fail-closed

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Go format check
        run: |
          output=$(gofmt -l glm-worker/internal/repositoryharness/repositoryharness.go glm-worker/internal/repositoryharness/repositoryharness_test.go glm-worker/internal/app/quality_preflight.go glm-worker/internal/app/process_error.go glm-worker/internal/app/quality_scope_preflight_test.go glm-worker/internal/app/multirepo_process_test.go glm-worker/internal/commentlint/repository_scope_test.go glm-worker/internal/workflow/repository_harness_boundary_test.go glm-worker/internal/workflow/interrupted_retention_test.go)
          test -z "$output" || { printf '%s\n' "$output"; exit 1; }
      - name: Targeted tests
        working-directory: glm-worker
        run: go test ./internal/repositoryharness ./internal/commentlint ./internal/app ./internal/workflow
