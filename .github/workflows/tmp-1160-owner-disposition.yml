name: Temporary #1160 owner disposition inventory

on:
  push:
    branches:
      - web-gpt/1160-codex-working-set

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-gpt/1160-codex-working-set
          fetch-depth: 0
      - name: Print material owner declarations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
            'glm-worker/internal/workflow/transient_recovery_test.go',
            'glm-worker/internal/app/bundle_analysis_test.go',
            'glm-worker/internal/workflow/model_call.go',
            'glm-worker/internal/runner/runner_test.go',
            'glm-worker/internal/state/session_rotation_test.go',
            'glm-worker/internal/state/session_rotation.go',
            'glm-worker/internal/parentactioncmd/publication_pretool.go',
            'glm-worker/internal/workflow/external_feasibility_gate_test.go',
            'glm-worker/internal/app/parent_handoff_test.go',
            'glm-worker/internal/workflow/plan_file_guard_test.go',
            'glm-worker/internal/app/bundle.go',
            'glm-worker/internal/parentevidence/projector.go',
            'glm-worker/internal/workflow/report_only_snapshot_test.go',
            'glm-worker/internal/workflow/workflow.go',
            'glm-worker/internal/state/quality_surface_recovery_test.go',
          ]
          for name in files:
            text = Path(name).read_text()
            print(f'OWNER_BEGIN {name} lines={text.count(chr(10))+1}')
            for i, line in enumerate(text.splitlines(), 1):
              m = re.match(r'^(?:func\s+(?:\([^\n]*\)\s*)?|type\s+)([A-Za-z_][A-Za-z0-9_]*)', line)
              if m:
                print(f'DECL {i:5d} {m.group(1)}')
            print(f'OWNER_END {name}')
          PY
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-1160-owner-disposition.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove #1160 disposition inventory workflow'
          git push origin HEAD:web-gpt/1160-codex-working-set
