name: Temporary F7 Wiring

on:
  push:
    branches:
      - hardening-task/prose-semantic-guard-migration

permissions:
  contents: write

jobs:
  wire-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Wire structured contract
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          p = Path('glm-worker/internal/workflow/prompts.go')
          text = p.read_text()
          pattern = r'func activeTaskPromptBlock\(activeTaskPath string\) string \{.*?\n\}\n\nfunc reviewerActiveTaskBlock\(activeTaskPath string\) string \{.*?\n\}\n'
          replacement = '''func activeTaskPromptBlock(activeTaskPath string) string {
          \treturn renderActiveTaskPromptContract(newActiveTaskPromptContract(activeTaskPath, activeTaskAudienceWorker))
          }

          func reviewerActiveTaskBlock(activeTaskPath string) string {
          \treturn renderActiveTaskPromptContract(newActiveTaskPromptContract(activeTaskPath, activeTaskAudienceReviewer))
          }
          '''
          text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('prompt block replacement failed')
          p.write_text(text)

          p = Path('glm-worker/internal/workflow/activetask_test.go')
          text = p.read_text()
          pattern = r'\n\s*if !strings\.Contains\(prompt, "Acceptance criteria"\) \|\| !strings\.Contains\(prompt, "task file本文"\) \{\n\s*t\.Fatalf\("prompt %dがtask file本文確認指示を欠いています:.*?\n\s*\}\n'
          text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('prose-pin assertion replacement failed')
          p.write_text(text)

          p = Path('codex/glm-worker/prompts/WORKER.md')
          text = p.read_text()
          old = 'ACTIVE task fileが提示されている場合、要求の正はその本文(Original instruction・Amendments・Resolved references・Contract・Must not・Acceptance criteria)です。提示されない場合はUSER_REQUESTを正とします。'
          new = 'wrapperから`ACTIVE_TASK_CONTEXT`が提示される場合、そのstructured fieldsを要求源境界として扱い、`PATH`のtask fileから`REQUIRED_SECTIONS`を確認します。`SOURCE_AUTHORITY: active-task-file`、`PARENT_MANAGED: true`、`DERIVED_CONTRACT_REVIEW`の意味を周辺の自由文や追記で弱めません。提示されない場合はUSER_REQUESTを正とします。'
          if old not in text:
              raise SystemExit('WORKER authority line replacement failed')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w glm-worker/internal/workflow/active_task_prompt_contract.go glm-worker/internal/workflow/active_task_prompt_contract_test.go glm-worker/internal/workflow/prompts.go glm-worker/internal/workflow/activetask_test.go
      - name: Inventory residual prompt prose pins
        run: |
          echo '=== prompt substring assertions ==='
          rg -n 'strings\.Contains\([^\n]*(prompt|Prompt|prompts)' glm-worker --glob '*_test.go' || true
          echo '=== instruction/document substring assertions ==='
          rg -n 'strings\.(Contains|HasPrefix|HasSuffix)\(' glm-worker --glob '*_test.go' | rg '(AGENTS|WORKER|prompt|instruction|Markdown|task file|Acceptance criteria|ACTIVE_TASK)' || true
      - name: Validate F7 wiring
        working-directory: glm-worker
        run: |
          go test ./internal/workflow ./internal/harnesslint
          go vet ./...
          go build ./...
      - name: Commit F7 wiring
        run: |
          rm .github/workflows/temporary-f7-wiring.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'hardening: wire typed active-task prompt contract'
          git push
