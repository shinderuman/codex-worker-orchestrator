name: temporary-quality
on:
  push:
    branches:
      - gpt-quality-apply/6f08b30
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.4.0
      - name: Stage temporary quality tools
        run: |
          mkdir -p /tmp/quality-tools
          cp "$(go env GOPATH)/bin/golangci-lint" /tmp/quality-tools/
          cp "$(go env GOPATH)/bin/shfmt" /tmp/quality-tools/
          cp "$(command -v shellcheck)" /tmp/quality-tools/
      - name: Go tests
        working-directory: glm-worker
        run: go test ./...
      - name: Go vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Go build
        working-directory: glm-worker
        run: go build ./...
      - name: Repository quality gate
        run: ./harnesslint
      - name: Install smoke
        run: ./tests/install_smoke.sh
      - name: Preserve quality tools for temporary audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-tools-${{ github.sha }}
          path: /tmp/quality-tools
          retention-days: 1
      - name: Preserve checkout for temporary audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-checkout-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
