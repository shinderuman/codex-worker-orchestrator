name: temporary-quality
on:
  push:
    branches:
      - gpt-quality-apply/6f08b30
    paths:
      - .gpt-checkpoints/quality-progress.ready
      - .github/workflows/temporary-quality.yml
      - glm-worker/**
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply GPT checkpoint parts
        run: |
          if ! git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx '.gpt-checkpoints/quality-progress.ready'; then
            exit 0
          fi
          generation="$(tr -d '\r\n' < .gpt-checkpoints/quality-progress.ready)"
          case "$generation" in
            *[!A-Za-z0-9._-]*|'') echo 'invalid checkpoint generation' >&2; exit 1 ;;
          esac
          part_dir=".gpt-checkpoints/quality-progress/$generation"
          test -d "$part_dir"
          cat "$part_dir"/part-* | base64 -d | gzip -d >/tmp/gpt-quality-progress.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --3way /tmp/gpt-quality-progress.patch
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Archive checkout
        run: tar --exclude=.git -czf /tmp/quality-checkout.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: quality-checkout-${{ github.run_id }}
          path: /tmp/quality-checkout.tgz
          retention-days: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.4.0
      - name: Go tests
        working-directory: glm-worker
        run: go test ./...
      - name: Go vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Go build
        working-directory: glm-worker
        run: go build ./...
      - name: Repository quality gate
        run: ./harnesslint
      - name: Install smoke
        run: ./tests/install_smoke.sh
