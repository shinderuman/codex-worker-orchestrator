name: Web GPT Issue 474 Validation

on:
  push:
    branches:
      - web-gpt/issue-474-cli-binary-ownership

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$RUNNER_TEMP/codex-worker-orchestrator-quality-tools"
          printf 'QUALITY_TOOLS_BIN_DIR=%s\n' "$quality_bin" >> "$GITHUB_ENV"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
      - name: Focused CLI ownership tests
        working-directory: glm-worker
        run: go test ./internal/cliinstall
      - name: commentlint
        run: ./commentlint
      - name: harnesslint
        run: ./harnesslint
      - name: goquality vet
        run: ./goquality vet
      - name: goquality build
        run: ./goquality build
      - name: Go test suite
        working-directory: glm-worker
        run: go test ./...
      - name: Installer smoke
        run: ./tests/install_smoke.sh
