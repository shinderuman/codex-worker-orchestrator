name: Web GPT 377 Final Validate
on:
  push:
    branches:
      - web-gpt/377-architecture-responsibility-audit
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove obsolete usage constant
        run: |
          sed -i '/^const qualityGateUsage = /d' glm-worker/internal/app/app.go
          gofmt -w glm-worker/internal/app/app.go
          rm -f .github/workflows/web-gpt-377-final-validate.yml
          git diff --check
          git config user.name web-gpt
          git config user.email web-gpt@users.noreply.github.com
          git add -A
          git commit -m 'Remove obsolete duplicated usage constant'
          git push
      - name: Read Go version
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Targeted tests
        working-directory: glm-worker
        run: go test ./internal/app ./internal/workflow ./internal/harnesslint
      - name: Repository lint
        run: ./harnesslint
      - name: Full tests
        working-directory: glm-worker
        run: go test ./...
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
