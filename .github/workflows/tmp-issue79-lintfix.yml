name: Temporary Issue 79 Lint Fix

on:
  push:
    branches:
      - gpt/pipeline-validation-79

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/pipeline-validation-79
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: false
      - name: Patch
        run: python3 .github/issue79_lintfix.py
      - name: Format and validate
        run: |
          cd glm-worker
          gofmt -w internal/runner/operation_category.go internal/runner/validation_observation.go internal/state/events.go
          go test ./...
          go vet ./...
          go build ./...
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glm-worker
          git diff --cached --quiet && exit 0
          git commit -m 'Satisfy validation result lint contract'
          git push origin HEAD:gpt/pipeline-validation-79
