name: GPT final validation

on:
  push:
    branches:
      - gpt/accepted-sol-decision-scope

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/accepted-sol-decision-scope
          fetch-depth: 0
      - name: Remove validation helper from worktree
        run: rm .github/workflows/gpt-final-validation.yml
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.4
          cache: false
      - name: Recheck unrelated codexlimit failure
        working-directory: glm-worker
        run: go test ./internal/codexlimit -run TestReadFailures -count=10
      - name: Focused race tests
        working-directory: glm-worker
        run: go test -race ./internal/app ./internal/workflow ./internal/state -count=1
      - name: Full tests
        working-directory: glm-worker
        run: go test ./... -count=1
      - name: Vet
        working-directory: glm-worker
        run: go vet ./...
      - name: Build
        working-directory: glm-worker
        run: go build ./...
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Repository lint gate
        run: ./harnesslint
