name: Temporary F7 Final Validation

on:
  push:
    branches:
      - hardening-task/prose-semantic-guard-migration

permissions:
  contents: write

jobs:
  validate-f7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Inventory residual prose pins
        run: |
          echo '=== candidate prompt/instruction prose pins ==='
          grep -R -nE 'strings\.(Contains|HasPrefix|HasSuffix)\(' glm-worker --include='*_test.go' \
            | grep -E '(prompt|Prompt|AGENTS|WORKER|instruction|Markdown|task file|Acceptance criteria|ACTIVE_TASK)' || true
          echo '=== vulnerable F7 terms ==='
          grep -R -nE 'strings\.Contains\([^)]*(Acceptance criteria|task file本文)' glm-worker --include='*_test.go' || true
      - name: Validate F7 production tree
        working-directory: glm-worker
        run: |
          go test ./internal/workflow ./internal/harnesslint
          go vet ./...
          go build ./...
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/temporary-f7-final-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: verify F7 production tree'
          git push
