name: Issue 61 Implementation

on:
  push:
    branches:
      - gpt/issue-61-temp-index-read-tree

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, 'Implement issue 61 temp index guard') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/issue-61-temp-index-read-tree
      - name: Read quality tool contract
        id: quality-tools
        run: |
          GO_VERSION=$(awk -F': ' '$1 == "go" { print $2 }' quality-tools.yml)
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.quality-tools.outputs.go_version }}
          cache: false
      - name: Install quality tools
        run: |
          quality_bin="$(go env GOPATH)/bin"
          QUALITY_TOOLS_BIN_DIR="$quality_bin" ./install-quality-tools.sh
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Implement temp-index authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('glm-worker/internal/runner/git_authority_guard.go')
          s = p.read_text()
          old = 'proxy := gitAuthorityProxyScript(g.realGit, g.attemptLog, g.repoRoot, os.TempDir())'
          new = 'proxy := gitAuthorityProxyScript(g.realGit, g.attemptLog, g.repoRoot, g.tempDir)'
          if old not in s:
              raise SystemExit('prepareProxy temp root anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('glm-worker/internal/runner/git_authority_claude_wrapper.go')
          s = p.read_text()
          anchor = '\tresult += "PATH=" + shellSingleQuote(g.tempDir) + ":\\\"$PATH\\\"\\nexport PATH\\n"\n'
          replacement = anchor + '\tresult += "GLM_WORKER_GIT_TEMP_ROOT=" + shellSingleQuote(g.tempDir) + "\\nexport GLM_WORKER_GIT_TEMP_ROOT\\n"\n'
          if anchor not in s:
              raise SystemExit('wrapper PATH anchor not found')
          p.write_text(s.replace(anchor, replacement, 1))

          p = Path('glm-worker/internal/workflow/reviewer_diff_evidence.go')
          s = p.read_text()
          old = 'tempDir, err := os.MkdirTemp("", "glm-worker-review-diff-")'
          new = 'tempDir, err := os.MkdirTemp(os.Getenv("GLM_WORKER_GIT_TEMP_ROOT"), "glm-worker-review-diff-")'
          if old not in s:
              raise SystemExit('reviewer diff temp anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('glm-worker/internal/runner/git_authority_proxy.go')
          s = p.read_text()
          anchor = 'git_guard_read_only() {\n'
          helper = r'''git_guard_plain_read_tree() {
          seen=0
          expect=0
          trees=0
          for arg do
            if [ "$seen" -eq 0 ]; then
              if [ "$expect" -eq 1 ]; then expect=0; continue; fi
              case "$arg" in
                -C|-c|--git-dir|--work-tree|--namespace|--config-env) expect=1 ;;
                --git-dir=*|--work-tree=*|--namespace=*|--config-env=*) ;;
                -*) ;;
                read-tree) seen=1 ;;
                *) return 1 ;;
              esac
              continue
            fi
            case "$arg" in
              -*) return 1 ;;
              *) trees=$((trees + 1)) ;;
            esac
          done
          [ "$seen" -eq 1 ] && [ "$trees" -eq 1 ]
          }
          git_guard_temp_index_read_tree() {
          git_guard_plain_read_tree "$@" || return 1
          case "${GIT_INDEX_FILE:-}" in
            /*) ;;
            *) return 1 ;;
          esac
          index=$(git_guard_normalize_path "$GIT_INDEX_FILE" /) || return 1
          [ "$(git_guard_path_scope "$index")" = temp ]
          }
          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())
          if anchor not in s:
              raise SystemExit('proxy read-only anchor not found')
          s = s.replace(anchor, helper + '\n' + anchor, 1)
          old = '''if [ "$scope" = temp ]; then
            GIT_ALLOW_PROTOCOL=file
            export GIT_ALLOW_PROTOCOL
            exec "$real_git" "$@"
          fi
          if git_guard_read_only "$@"; then
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''if [ "$scope" = temp ]; then
            GIT_ALLOW_PROTOCOL=file
            export GIT_ALLOW_PROTOCOL
            exec "$real_git" "$@"
          fi
          if [ "$scope" = protected ] && git_guard_temp_index_read_tree "$@"; then
            exec "$real_git" "$@"
          fi
          if git_guard_read_only "$@"; then
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in s:
              raise SystemExit('proxy dispatch anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('glm-worker/internal/runner/git_authority_guard_test.go')
          s = p.read_text()
          start = s.index('func TestGitAuthorityGuardAllowsFixtureGitOutsideProtectedRepo')
          end = s.index('func TestGitAuthorityGuardDetectsProxyBypassRefMutation', start)
          replacement = r'''func TestGitAuthorityGuardRejectsFixtureGitOutsideInvocationTempRoot(t *testing.T) {
          if runtime.GOOS == "windows" {
              t.Skip("shell fixture is Unix-oriented")
          }
          root := newGitAuthorityRepo(t)
          externalRoot := t.TempDir()
          fixtureRepo := filepath.Join(externalRoot, "repo")
          runGitAuthorityCommand(t, "", "init", "-q", fixtureRepo)
          command := "git -C \"$EXTERNAL_ROOT/repo\" branch blocked"
          guarded, _ := newGitAuthorityProductionRunner(t, root, command, map[string]string{"EXTERNAL_ROOT": externalRoot})
          _, err := guarded.Run(state.WorkerRole, "worker-new", "worker-model", false, "high", "prompt", filepath.Join(t.TempDir(), "output"))
          var guardErr *GitAuthorityGuardError
          if !errors.As(err, &guardErr) || guardErr.Stage != "blocked-command" {
              t.Fatalf("guard error = %#v", err)
          }
          if !containsGitAuthorityMutation(guardErr.Mutations, "command:branch") {
              t.Fatalf("mutations = %v want command:branch", guardErr.Mutations)
          }
          }

          func TestGitAuthorityGuardAllowsProtectedReadTreeWithInvocationTempIndex(t *testing.T) {
          if runtime.GOOS == "windows" {
              t.Skip("shell fixture is Unix-oriented")
          }
          root := newGitAuthorityRepo(t)
          command := "GIT_INDEX_FILE=\"$GLM_WORKER_GIT_TEMP_ROOT/snapshot-index\" git read-tree HEAD; " +
              "GIT_INDEX_FILE=\"$GLM_WORKER_GIT_TEMP_ROOT/snapshot-index\" git ls-files -s >/dev/null"
          guarded, _ := newGitAuthorityProductionRunner(t, root, command, nil)
          if _, err := guarded.Run(state.WorkerRole, "worker-new", "worker-model", false, "high", "prompt", filepath.Join(t.TempDir(), "output")); err != nil {
              t.Fatalf("temp-index read-tree fixture failed: %v", err)
          }
          }

          func TestGitAuthorityGuardRejectsProtectedReadTreeWithoutAuthorizedTempIndex(t *testing.T) {
          if runtime.GOOS == "windows" {
              t.Skip("shell fixture is Unix-oriented")
          }
          root := newGitAuthorityRepo(t)
          externalIndex := filepath.Join(t.TempDir(), "external-index")
          protectedIndex := filepath.Join(root, ".git", "index")
          cases := []struct {
              name    string
              command string
              env     map[string]string
          }{
              {name: "default protected index", command: "git read-tree HEAD"},
              {name: "explicit protected index", command: "GIT_INDEX_FILE=\"$PROTECTED_INDEX\" git read-tree HEAD", env: map[string]string{"PROTECTED_INDEX": protectedIndex}},
              {name: "external index", command: "GIT_INDEX_FILE=\"$EXTERNAL_INDEX\" git read-tree HEAD", env: map[string]string{"EXTERNAL_INDEX": externalIndex}},
              {name: "worktree update option", command: "GIT_INDEX_FILE=\"$GLM_WORKER_GIT_TEMP_ROOT/snapshot-index\" git read-tree -u HEAD"},
          }
          for _, tc := range cases {
              t.Run(tc.name, func(t *testing.T) {
                  guarded, _ := newGitAuthorityProductionRunner(t, root, tc.command, tc.env)
                  _, err := guarded.Run(state.WorkerRole, "worker-new", "worker-model", false, "high", "prompt", filepath.Join(t.TempDir(), "output"))
                  var guardErr *GitAuthorityGuardError
                  if !errors.As(err, &guardErr) || guardErr.Stage != "blocked-command" {
                      t.Fatalf("guard error = %#v", err)
                  }
                  if !containsGitAuthorityMutation(guardErr.Mutations, "command:read-tree") {
                      t.Fatalf("mutations = %v want command:read-tree", guardErr.Mutations)
                  }
              })
          }
          }

          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          p.write_text(s[:start] + replacement + s[end:])
          PY
          gofmt -w glm-worker/internal/runner/git_authority_guard.go glm-worker/internal/runner/git_authority_claude_wrapper.go glm-worker/internal/runner/git_authority_proxy.go glm-worker/internal/runner/git_authority_guard_test.go glm-worker/internal/workflow/reviewer_diff_evidence.go
          git diff --check
      - name: Validate
        run: |
          (cd glm-worker && go test ./...)
          (cd glm-worker && go vet ./...)
          (cd glm-worker && go build ./...)
          ./harnesslint
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/runner/git_authority_guard.go glm-worker/internal/runner/git_authority_claude_wrapper.go glm-worker/internal/runner/git_authority_proxy.go glm-worker/internal/runner/git_authority_guard_test.go glm-worker/internal/workflow/reviewer_diff_evidence.go
          git commit -m 'Implement issue 61 temp index guard'
          git push origin HEAD:gpt/issue-61-temp-index-read-tree
