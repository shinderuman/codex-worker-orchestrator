name: GPT PR56 finalize

on:
  push:
    branches:
      - gpt/high-floor-first-review

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/high-floor-first-review
      - name: Fold floor prompt into construction
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("glm-worker/internal/workflow/workflow.go"); s=p.read_text(); old=")\n\tprompt += floorPrompt\n\tprompt, err = w.withCurrentRuleContext(prompt)"; new=") + floorPrompt\n\tprompt, err = w.withCurrentRuleContext(prompt)"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          gofmt -w glm-worker/internal/workflow/workflow.go
      - name: Validate
        shell: bash
        run: |
          cd glm-worker
          go test ./internal/workflow -count=1
          go vet ./...
          go build ./...
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ChatGPT Web GPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glm-worker/internal/workflow/workflow.go
          git commit -m "refactor: keep review checkpoint within lint bound"
          git push origin HEAD:gpt/high-floor-first-review
