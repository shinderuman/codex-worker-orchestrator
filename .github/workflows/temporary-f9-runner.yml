name: Temporary F9 Runner

on:
  push:
    branches:
      - hardening-task/reviewer-diff-first-search

permissions:
  contents: write

jobs:
  implement-f9:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Apply F9 implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-f9-implementation.yml').read_text()
          start_marker = '      - name: Implement reviewer diff-first independent search\n        run: |\n'
          end_marker = '      - name: Validate F9 routing\n'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-f9.sh').write_text(script)
          PY
          bash /tmp/apply-f9.sh
      - name: Validate F9 routing
        working-directory: glm-worker
        run: |
          go test ./internal/workflow ./internal/state ./internal/reposearch
          go test -race ./internal/workflow ./internal/state ./internal/reposearch
          go vet ./...
          go build ./...
      - name: Commit implementation
        run: |
          rm .github/workflows/temporary-f9-implementation.yml .github/workflows/temporary-f9-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: make reviewer repo search diff-first'
          git push
