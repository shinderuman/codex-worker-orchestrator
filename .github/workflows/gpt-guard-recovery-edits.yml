name: GPT guard recovery small edits

on:
  push:
    branches:
      - gpt/guard-failure-task-recovery

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/guard-failure-task-recovery
          fetch-depth: 0
      - name: Configure bot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Patch status output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('glm-worker/internal/app/output.go')
          s = p.read_text()
          old = '''\t\tstate.TaskStatusProviderUnavailable,\n\t\tstate.TaskStatusInterrupted:\n'''
          new = '''\t\tstate.TaskStatusProviderUnavailable,\n\t\tstate.TaskStatusGuardRecoverable,\n\t\tstate.TaskStatusInterrupted:\n'''
          if new not in s:
              if old not in s: raise SystemExit('taskStatusPtr anchor missing')
              s = s.replace(old, new, 1)
          old = '''\treturn checkpoint.RateLimited || checkpoint.ProviderUnavailable || checkpoint.UserInterrupted\n'''
          new = '''\treturn checkpoint.RateLimited || checkpoint.ProviderUnavailable || checkpoint.UserInterrupted || checkpoint.GuardRecoverable\n'''
          if new not in s:
              if old not in s: raise SystemExit('resumeAvailable anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w glm-worker/internal/app/output.go
          git add glm-worker/internal/app/output.go
          git commit -m 'feat: expose guard recovery in status'
      - name: Patch process error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('glm-worker/internal/app/process_error.go')
          s = p.read_text()
          old = '''\terrorKindProviderUnavailable     = "provider_unavailable"\n\terrorKindInterrupted             = "interrupted"\n'''
          new = '''\terrorKindProviderUnavailable     = "provider_unavailable"\n\terrorKindGuardRecoverable        = "guard_recoverable"\n\terrorKindInterrupted             = "interrupted"\n'''
          if new not in s:
              if old not in s: raise SystemExit('error kind anchor missing')
              s = s.replace(old, new, 1)
          old = '''\tvar providerUnavailable *runner.ProviderUnavailableError\n\tvar interrupted *runner.InterruptedCallError\n\tvar stopEndpoint *StopEndpointError\n'''
          new = '''\tvar providerUnavailable *runner.ProviderUnavailableError\n\tvar guardRecoverable *workflow.GuardRecoverableError\n\tvar interrupted *runner.InterruptedCallError\n\tvar stopEndpoint *StopEndpointError\n'''
          if new not in s:
              if old not in s: raise SystemExit('runtime var anchor missing')
              s = s.replace(old, new, 1)
          old = '''\tcase errors.As(err, &interrupted):\n\t\treturn processErrorBody{\n\t\t\tKind:    errorKindInterrupted,\n'''
          new = '''\tcase errors.As(err, &guardRecoverable):\n\t\treturn processErrorBody{\n\t\t\tKind:    errorKindGuardRecoverable,\n\t\t\tMessage: "guard rejected the model call; inspect or repair the guard condition before resuming the same task",\n\t\t\tDetail: map[string]any{\n\t\t\t\t"phase":                  stringPtr(guardRecoverable.Phase),\n\t\t\t\t"task_id":                stringPtr(guardRecoverable.TaskID),\n\t\t\t\t"repo_root":              stringPtr(guardRecoverable.RepoRoot),\n\t\t\t\t"resume_available":       true,\n\t\t\t\t"completed_result_saved": guardRecoverable.ResultSaved,\n\t\t\t},\n\t\t}, true\n\tcase errors.As(err, &interrupted):\n\t\treturn processErrorBody{\n\t\t\tKind:    errorKindInterrupted,\n'''
          if new not in s:
              if old not in s: raise SystemExit('runtime case anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w glm-worker/internal/app/process_error.go
          git add glm-worker/internal/app/process_error.go
          git commit -m 'feat: report recoverable guard failures'
      - name: Patch parent execution instruction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('codex/instructions/glm-execution.md')
          s = p.read_text()
          anchor = '- 同一taskがSol判断待ち・review fix・rate limit中なら分割や新規起動へ切り替えず、保存済みtaskとsessionを継続する。\n'
          addition = anchor + '- `task_status: guard-recoverable`はguardがmodel sessionを失効させたがtask checkpointを保持した状態である。親が報告されたguard conditionとrepository現物を確認・必要なら修正した後、別taskを起こさず同じ`--resume`を実行する。resumeは失効済みmodel sessionを再利用せず、保存済みworker resultを安全に再利用できない場合だけfresh worker callから同stageをやり直す。\n'
          if addition not in s:
              if anchor not in s: raise SystemExit('instruction anchor missing')
              s = s.replace(anchor, addition, 1)
          p.write_text(s)
          PY
          git add codex/instructions/glm-execution.md
          git commit -m 'docs: define parent guard recovery path'
      - name: Push granular commits
        run: |
          git diff --check
          git push origin HEAD:gpt/guard-failure-task-recovery
