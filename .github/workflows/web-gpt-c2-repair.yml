name: Web GPT C2 Repair
on:
  push:
    branches:
      - web-gpt/review-fix/c2b6893-deb8a18
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-gpt/review-fix/c2b6893-deb8a18
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Apply narrow repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "glm-worker/internal/packet/result.go",
              '''func (r Result) MachineJSON() ([]byte, error) {\n\tif r.Status == StatusNeedsSolReview {\n\t\tif err := validateTargets(r); err != nil {\n\t\t\treturn nil, fmt.Errorf("NEEDS_SOL_REVIEW machine result: %w", err)\n\t\t}\n\t}\n\tobject := map[string]any{''',
              '''func (r Result) MachineJSON() ([]byte, error) {\n\tobject := map[string]any{''',
          )

          replace_once(
              "glm-worker/internal/workflow/workflow.go",
              '''func (w *Workflow) emitResult(value packet.Result) error {\n\tnormalized, err := w.canonicalizeInternalReviewResult(value)\n\tif err != nil {\n\t\treturn err\n\t}\n\tvalue = normalized\n\treport, err := machineReport(value)''',
              '''func (w *Workflow) emitResult(value packet.Result) error {\n\treport, err := machineReport(value)''',
          )

          Path("glm-worker/internal/workflow/internal_review_targets.go").write_text('''package workflow\n\nimport (\n\t"fmt"\n\t"strings"\n\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/reviewtarget"\n)\n\nconst (\n\tinternalReviewNoTarget = "none"\n\tinternalReviewPacketTarget = "PACKET"\n)\n\nfunc canonicalReviewTargets(values []string) []string {\n\ttargets := make([]string, 0, len(values))\n\tseen := make(map[string]struct{}, len(values))\n\tfor _, raw := range values {\n\t\tvalue := strings.TrimSpace(raw)\n\t\tif value == "" || value == internalReviewNoTarget || value == internalReviewPacketTarget {\n\t\t\tcontinue\n\t\t}\n\t\ttarget := value\n\t\tif _, _, err := reviewtarget.Parse(target); err != nil {\n\t\t\tif !strings.Contains(value, "/") && !strings.Contains(value, ".") {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\ttarget = fmt.Sprintf("%s:%s", value, reviewtarget.WholeFileDiffLocator)\n\t\t\tif _, _, parseErr := reviewtarget.Parse(target); parseErr != nil {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t}\n\t\tif _, duplicate := seen[target]; duplicate {\n\t\t\tcontinue\n\t\t}\n\t\tseen[target] = struct{}{}\n\t\ttargets = append(targets, target)\n\t}\n\treturn targets\n}\n\nfunc reviewTargetsOrFallback(values, fallback []string) []string {\n\tif targets := canonicalReviewTargets(values); len(targets) > 0 {\n\t\treturn targets\n\t}\n\treturn canonicalReviewTargets(fallback)\n}\n\nfunc (w *Workflow) currentReviewDiffTargetsOrFallback(fallback []string) []string {\n\tif w.collectChangedPaths != nil {\n\t\tpaths, err := w.collectChangedPaths(w.config.RepoRoot, w.state.ReadOr("baseline-head", ""))\n\t\tif err == nil {\n\t\t\tif targets := canonicalReviewTargets(paths); len(targets) > 0 {\n\t\t\t\treturn targets\n\t\t\t}\n\t\t}\n\t}\n\treturn canonicalReviewTargets(fallback)\n}\n''')

          replace_once(
              "glm-worker/internal/workflow/quality_gate.go",
              '''func (w *Workflow) failClosedQualitySurface(phase, reason string, cause error) error {\n\tif err := w.state.WaitForQualitySurfaceReview(phase); err != nil {\n\t\treturn err\n\t}\n\tif cause != nil {\n\t\treason = fmt.Sprintf("%s: %v", reason, cause)\n\t}\n\ttargets, err := w.currentQualitySurfaceReviewTargets()\n\tif err != nil {\n\t\treturn fmt.Errorf("quality surface review targets: %w", err)\n\t}\n\treturn w.emitResult(qualitySurfaceFailClosedResult(phase, reason, targets))\n}\n\nfunc (w *Workflow) currentQualitySurfaceReviewTargets() ([]string, error) {\n\tpaths, err := w.collectChangedPaths(w.config.RepoRoot, w.state.ReadOr("baseline-head", ""))\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tqualityPaths := make([]string, 0, len(paths))\n\tfor _, path := range paths {\n\t\tif IsQualitySurface(path) {\n\t\t\tqualityPaths = append(qualityPaths, path)\n\t\t}\n\t}\n\treturn canonicalReviewTargets(qualityPaths)\n}''',
              '''func (w *Workflow) failClosedQualitySurface(phase, reason string, cause error) error {\n\ttargets := w.currentQualitySurfaceReviewTargets()\n\tif err := w.state.WaitForQualitySurfaceReview(phase); err != nil {\n\t\treturn err\n\t}\n\tif cause != nil {\n\t\treason = fmt.Sprintf("%s: %v", reason, cause)\n\t}\n\treturn w.emitResult(qualitySurfaceFailClosedResult(phase, reason, targets))\n}\n\nfunc (w *Workflow) currentQualitySurfaceReviewTargets() []string {\n\tqualityPaths := []string(nil)\n\tif w.collectChangedPaths != nil {\n\t\tpaths, err := w.collectChangedPaths(w.config.RepoRoot, w.state.ReadOr("baseline-head", ""))\n\t\tif err == nil {\n\t\t\tfor _, path := range paths {\n\t\t\t\tif IsQualitySurface(path) {\n\t\t\t\t\tqualityPaths = append(qualityPaths, path)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\treturn reviewTargetsOrFallback(qualityPaths, []string{"glm-worker/internal/workflow/quality_gate.go:@diff"})\n}''',
          )

          replace_once(
              "glm-worker/internal/workflow/quality_surface_approval.go",
              '''\ttargets, err := w.currentQualitySurfaceReviewTargets()\n\tif err != nil {\n\t\treturn true, err\n\t}\n\n\tcheckpoint.QualitySurfaceApprovalPending = true''',
              '''\ttargets := w.currentQualitySurfaceReviewTargets()\n\n\tcheckpoint.QualitySurfaceApprovalPending = true''',
          )

          replace_once(
              "glm-worker/internal/workflow/parent_validation.go",
              '''\tresult := parentValidationNonConvergedResult(failure)\n\tresult, err := w.canonicalizeInternalReviewResult(result)\n\tif err != nil {\n\t\treturn err\n\t}\n\tif err := w.state.FinishParentValidationNonConvergence(result, w.lastProducer); err != nil {''',
              '''\tresult := parentValidationNonConvergedResult(failure)\n\tif err := w.state.FinishParentValidationNonConvergence(result, w.lastProducer); err != nil {''',
          )
          replace_once(
              "glm-worker/internal/workflow/parent_validation.go",
              '''func parentValidationNonConvergedResult(failure packet.Result) packet.Result {\n\ttargets := failure.Targets\n\tif len(targets) == 0 || (len(targets) == 1 && targets[0] == "none") {\n\t\ttargets = []string{"the failed gate evidence and the current diff"}\n\t}\n\treturn packet.Result{''',
              '''func parentValidationNonConvergedResult(failure packet.Result) packet.Result {\n\ttargets := reviewTargetsOrFallback(\n\t\tfailure.Targets,\n\t\t[]string{"glm-worker/internal/workflow/parent_validation.go:@diff"},\n\t)\n\treturn packet.Result{''',
          )

          replace_once(
              "glm-worker/internal/workflow/workflow.go",
              '''func (w *Workflow) failClosedSnapshot(stage state.SnapshotStage, workerEnd, reviewStart state.GitSnapshot, reason string, cause error) error {\n\tw.recordSnapshotEvent(state.ReviewerRole, stage, workerEnd, reviewStart, reason, cause)\n\treturn w.failClosedStopped(stage, reason, cause, snapshotFailClosedResult)\n}\n\nfunc (w *Workflow) failClosedReportOnlySnapshot(stage state.SnapshotStage, start, current state.GitSnapshot, reason string, cause error) error {\n\tw.recordSnapshotEvent(state.WorkerRole, stage, start, current, reason, cause)\n\treturn w.failClosedStopped(stage, reason, cause, reportOnlySnapshotFailClosedResult)\n}''',
              '''func (w *Workflow) failClosedSnapshot(stage state.SnapshotStage, workerEnd, reviewStart state.GitSnapshot, reason string, cause error) error {\n\tw.recordSnapshotEvent(state.ReviewerRole, stage, workerEnd, reviewStart, reason, cause)\n\ttargets := w.currentReviewDiffTargetsOrFallback([]string{"glm-worker/internal/state/snapshot.go:@diff"})\n\treturn w.failClosedStopped(stage, reason, cause, func(stage state.SnapshotStage, reason string) packet.Result {\n\t\tresult := snapshotFailClosedResult(stage, reason)\n\t\tresult.Targets = targets\n\t\treturn result\n\t})\n}\n\nfunc (w *Workflow) failClosedReportOnlySnapshot(stage state.SnapshotStage, start, current state.GitSnapshot, reason string, cause error) error {\n\tw.recordSnapshotEvent(state.WorkerRole, stage, start, current, reason, cause)\n\ttargets := w.currentReviewDiffTargetsOrFallback([]string{"glm-worker/internal/workflow/workflow.go:@diff"})\n\treturn w.failClosedStopped(stage, reason, cause, func(stage state.SnapshotStage, reason string) packet.Result {\n\t\tresult := reportOnlySnapshotFailClosedResult(stage, reason)\n\t\tresult.Targets = targets\n\t\treturn result\n\t})\n}''',
          )
          replace_once(
              "glm-worker/internal/workflow/workflow.go",
              '''\t\tTargets:             []string{"repository HEAD/index/worktreeの現在状態と保存済みsnapshot state file"},''',
              '''\t\tTargets:             []string{"glm-worker/internal/state/snapshot.go:@diff"},''',
          )
          replace_once(
              "glm-worker/internal/workflow/workflow.go",
              '''\t\tTargets:             []string{"repository HEAD/index/worktreeの現在状態とreport-only開始前snapshot・telemetry記録"},''',
              '''\t\tTargets:             []string{"glm-worker/internal/workflow/workflow.go:@diff"},''',
          )
          replace_once(
              "glm-worker/internal/workflow/workflow.go",
              '''func nonConvergedResult(reviewResult packet.Result) packet.Result {\n\treturn packet.Result{''',
              '''func nonConvergedResult(reviewResult packet.Result) packet.Result {\n\ttargets := reviewTargetsOrFallback(\n\t\treviewResult.Targets,\n\t\t[]string{"glm-worker/internal/workflow/review_flow.go:@diff"},\n\t)\n\treturn packet.Result{''',
          )
          replace_once(
              "glm-worker/internal/workflow/workflow.go",
              '''\t\tTargets:             []string{"最終diffと直近reviewer指摘に限定"},''',
              '''\t\tTargets:             targets,''',
          )

          replace_once(
              "glm-worker/internal/runner/decision.go",
              '''\t"os"\n\t"os/exec"\n\t"strings"''',
              '''\t"os"\n\t"os/exec"\n\t"path/filepath"\n\t"strings"''',
          )
          replace_once(
              "glm-worker/internal/runner/decision.go",
              '''\toutput, stderr, devNull, rawOutputPath, _, err := openProbeFiles(decisionDir)\n\tif err != nil {\n\t\treturn DecisionCallResult{}, err\n\t}\n\tdefer func() { _ = devNull.Close() }()''',
              '''\toutput, stderr, rawOutputPath, err := openDecisionFiles(decisionDir)\n\tif err != nil {\n\t\treturn DecisionCallResult{}, err\n\t}''',
          )
          replace_once(
              "glm-worker/internal/runner/decision.go",
              '''func finishDecision(model, rawOutputPath string, settingEnv map[string]string, runErr error) (DecisionCallResult, error) {''',
              '''func openDecisionFiles(decisionDir string) (output, stderr *os.File, rawOutputPath string, err error) {\n\trawOutputPath = filepath.Join(decisionDir, "probe.json")\n\toutput, err = createPrivateFile(rawOutputPath)\n\tif err != nil {\n\t\treturn nil, nil, "", err\n\t}\n\tstderr, err = createPrivateFile(filepath.Join(decisionDir, "probe.stderr"))\n\tif err != nil {\n\t\t_ = output.Close()\n\t\treturn nil, nil, "", err\n\t}\n\treturn output, stderr, rawOutputPath, nil\n}\n\nfunc finishDecision(model, rawOutputPath string, settingEnv map[string]string, runErr error) (DecisionCallResult, error) {''',
          )

          replace_once(
              "glm-worker/internal/workflow/parent_validation_test.go",
              '''`"targets":["a.go"]`''',
              '''`"targets":["a.go:@diff"]`''',
          )

          Path("glm-worker/internal/workflow/internal_review_targets_test.go").write_text('''package workflow\n\nimport (\n\t"errors"\n\t"testing"\n\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/packet"\n\t"github.com/shinderuman/codex-worker-orchestrator/glm-worker/internal/reviewtarget"\n)\n\nfunc TestCanonicalInternalReviewTargets(t *testing.T) {\n\ttargets := canonicalReviewTargets([]string{"a.go", "b.go:12-20", "inspect-current-review", "none", "PACKET", "a.go"})\n\tif len(targets) != 2 || targets[0] != "a.go:@diff" || targets[1] != "b.go:12-20" {\n\t\tt.Fatalf("targets = %#v", targets)\n\t}\n\tfor _, target := range targets {\n\t\tif _, _, err := reviewtarget.Parse(target); err != nil {\n\t\t\tt.Fatalf("target %q: %v", target, err)\n\t\t}\n\t}\n}\n\nfunc TestCurrentReviewDiffTargetsFallsBackWithoutBaseline(t *testing.T) {\n\tw := newWorkflowT(t, newStateStoreT(t), &scriptedRunner{})\n\tw.collectChangedPaths = func(string, string) ([]string, error) {\n\t\treturn nil, errors.New("baseline unavailable")\n\t}\n\ttargets := w.currentReviewDiffTargetsOrFallback([]string{"glm-worker/internal/state/snapshot.go:@diff"})\n\tif len(targets) != 1 || targets[0] != "glm-worker/internal/state/snapshot.go:@diff" {\n\t\tt.Fatalf("targets = %#v", targets)\n\t}\n}\n\nfunc TestSyntheticReviewProducersUseCanonicalTargets(t *testing.T) {\n\tresults := []packet.Result{\n\t\tsnapshotFailClosedResult("review-start", "snapshot mismatch"),\n\t\treportOnlySnapshotFailClosedResult("report-only-end", "snapshot mismatch"),\n\t\tnonConvergedResult(packet.Result{Targets: []string{"a.go"}}),\n\t\tparentValidationNonConvergedResult(packet.Result{Targets: []string{"a.go"}}),\n\t}\n\tfor _, result := range results {\n\t\tif len(result.Targets) == 0 {\n\t\t\tt.Fatalf("missing targets: %#v", result)\n\t\t}\n\t\tfor _, target := range result.Targets {\n\t\t\tif _, _, err := reviewtarget.Parse(target); err != nil {\n\t\t\t\tt.Fatalf("target %q: %v", target, err)\n\t\t\t}\n\t\t}\n\t}\n}\n''')
          PY
          gofmt -w \
            glm-worker/internal/packet/result.go \
            glm-worker/internal/workflow/internal_review_targets.go \
            glm-worker/internal/workflow/internal_review_targets_test.go \
            glm-worker/internal/workflow/quality_gate.go \
            glm-worker/internal/workflow/quality_surface_approval.go \
            glm-worker/internal/workflow/parent_validation.go \
            glm-worker/internal/workflow/parent_validation_test.go \
            glm-worker/internal/workflow/workflow.go \
            glm-worker/internal/runner/decision.go
      - name: Focused tests
        working-directory: glm-worker
        run: go test ./internal/packet ./internal/app ./internal/workflow ./internal/runner
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/web-gpt-c2-repair.yml
          git add glm-worker/internal/packet/result.go glm-worker/internal/workflow glm-worker/internal/runner/decision.go
          git commit -m 'Narrow internal review target repair'
          git push origin HEAD:web-gpt/review-fix/c2b6893-deb8a18
