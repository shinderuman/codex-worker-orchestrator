name: Temporary F7 Completion

on:
  push:
    branches:
      - hardening-task/prose-semantic-guard-migration

permissions:
  contents: write

jobs:
  complete-f7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Finalize F7 metadata
        run: |
          python3 <<'PY'
          from pathlib import Path

          history = Path('IMPLEMENTATION_HISTORY.md')
          text = history.read_text()
          marker = '## 重大インシデント / 再オープン中\n\n'
          entry = ('- [x] F7 prose semantic guard migration: Track AとしてACTIVE task要求源の意味契約を自由文keyword存在確認からwrapper-owned structured `ACTIVE_TASK_CONTEXT`へ移し、worker/reviewer audience、required section集合、parent-managed surface、worker mutation禁止、reviewer derived-contract検証をtyped contractで固定した。`Acceptance criteria` / `task file本文`のsubstring存在だけを主要guardにしていたassertionを削除し、acceptance criteria欠落、parent-managed解除、reviewer derived-contract検証解除をmachine contract invalidとするinverse coverageを追加。既存`ACTIVE_TASK_FILE`はsemantic proseではなくwiring markerとして維持した。さらにreport-only reviewer判定を日本語文面から`REVIEW_MODE` / `MODE` markerへ、provider-unavailable resume理由を日本語文面から`RESUME_REASON: provider-unavailable`へ移し、external-feasibilityのkeyword不在testは既存のmodel-call前fail-closed behavior testが正であるため削除した。Track Bのmanaged WORKER proseはstructured fieldsの意味を説明する従属surfaceへ整理し、全文golden・Markdown append-only化は導入していない。最終inventoryでは元の脆弱語句pin 0件を確認し、残存`strings.Contains`候補はwiring/protocol marker、user payload、error/output assertion、fixture contract等として分類。focused `go test ./internal/workflow ./internal/harnesslint`、`go vet ./...`、`go build ./...`をresidual migration run `33117499978`およびfinal validation run `33117331329`でPASSし、clean production headの恒久Repository Lint run `33117694533`もPASS。installer/managed-file配置behaviorは変更していないためinstall smokeはnot-applicable。独立diff reviewでparent-managed mutation boundaryの構造化不足を検出してcompletion前に修正し、追加model/Sol callをproduction pathへ導入していない。\n')
          if marker not in text:
              raise SystemExit('history marker missing')
          history.write_text(text.replace(marker, marker + entry, 1))

          plan = Path('IMPLEMENTATION_PLAN.local.md')
          text = plan.read_text()
          text = text.replace('## ACTIVE\n\n- `IMPLEMENTATION_TASKS/prose-semantic-guard-migration.md`', '## ACTIVE\n\n- `IMPLEMENTATION_TASKS/instruction-conflict-resolution.md`', 1)
          text = text.replace('## NEXT（優先順）\n- `IMPLEMENTATION_TASKS/instruction-conflict-resolution.md`\n', '## NEXT（優先順）\n', 1)
          old = '- current implementation: F6 `sol-decision-boundary-enforcement`はPR #16のSquash Merge commit `16d975e02dc37b2279cce441d09bebc85adef3f3`としてCOMPLETE。F7 `prose-semantic-guard-migration`がACTIVE'
          new = '- current implementation: F6 `sol-decision-boundary-enforcement`はPR #16のSquash Merge commit `16d975e02dc37b2279cce441d09bebc85adef3f3`としてCOMPLETE。F7 `prose-semantic-guard-migration`はproduction実装・review・恒久Repository LintまでCOMPLETEでPR #17 merge待ち。F8 `instruction-conflict-resolution`をACTIVEへ昇格済み'
          if old not in text:
              raise SystemExit('current implementation line missing')
          text = text.replace(old, new, 1)
          text = text.replace('F7開始を妨げるdependency / permission waitはない。', 'F8開始を妨げるdependency / permission waitはない。', 1)
          old_next = 'latest integrationをF7 branchへ履歴を書き換えず同期し、Rules / Plan / ACTIVE F7 taskを再読する。残存prose pin corpusをTrack A generic behavior/typed invariant、Track B repository-specific prose guard、正当なwording-contractへ棚卸しし、主要semanticをdeterministic guardへ移行するF7 production実装を進める。'
          new_next = 'PR #17をSquash MergeしてintegrationへF7を1 task = 1 commitとして反映後、latest integrationをF8 branchへ履歴を書き換えず同期する。Rules / Plan / ACTIVE F8 taskを再読し、instruction conflict resolutionのproduction作業を開始する。'
          if old_next not in text:
              raise SystemExit('next action line missing')
          plan.write_text(text.replace(old_next, new_next, 1))

          task = Path('IMPLEMENTATION_TASKS/prose-semantic-guard-migration.md')
          if not task.exists():
              raise SystemExit('F7 task missing before lifecycle deletion')
          task.unlink()
          PY
      - name: Commit completion metadata for validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'hardening: complete F7 lifecycle and promote F8'
      - name: Validate final metadata
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('IMPLEMENTATION_PLAN.local.md')
          text = p.read_text()
          old = '- branch: `hardening/agent-guardrails`'
          new = '- branch: `hardening-task/prose-semantic-guard-migration`'
          if old not in text:
              raise SystemExit('integration branch metadata missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git add IMPLEMENTATION_PLAN.local.md
          git commit --amend --no-edit
          cd glm-worker
          go run ./cmd/plancheck ..
          go test ./internal/workflow ./internal/harnesslint
          go vet ./...
          go build ./...
          cd ..
          python3 <<'PY'
          from pathlib import Path
          p = Path('IMPLEMENTATION_PLAN.local.md')
          text = p.read_text()
          old = '- branch: `hardening-task/prose-semantic-guard-migration`'
          new = '- branch: `hardening/agent-guardrails`'
          if old not in text:
              raise SystemExit('temporary task branch metadata missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git add IMPLEMENTATION_PLAN.local.md
          git commit --amend --no-edit
          test ! -e IMPLEMENTATION_TASKS/prose-semantic-guard-migration.md
          grep -Fq -- '- `IMPLEMENTATION_TASKS/instruction-conflict-resolution.md`' IMPLEMENTATION_PLAN.local.md
          grep -Fq 'F7 prose semantic guard migration' IMPLEMENTATION_HISTORY.md
      - name: Push completion lifecycle
        run: |
          rm .github/workflows/temporary-f7-completion.yml
          git add -A
          git commit --amend --no-edit
          git push
