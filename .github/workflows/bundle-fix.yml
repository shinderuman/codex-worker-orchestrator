name: Bundle Fix

on:
  push:
    branches:
      - gpt/issue-59-bundle

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix bundle lint findings') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/issue-59-bundle
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Apply narrow source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('glm-worker/internal/app/bundle.go')
          s = p.read_text()

          s = s.replace('const bundleFormat = "glm-worker-task-bundle-v1"\n\n', '')
          marker = 'var bundleAggregateDirs = map[string]bool{'
          s = s.replace(marker, 'const bundleFormat = "glm-worker-task-bundle-v1"\n\n' + marker, 1)

          s = s.replace('collector.collectTaskEvidence(cfg, st, task)', 'collector.collectTaskEvidence(st, task)')
          s = s.replace('sessionIDs := collector.collectTaskSessions(cfg, st, task)', 'sessionIDs := collector.collectTaskSessions(st, task)')
          s = s.replace('func (c *bundleCollector) collectTaskEvidence(cfg config.AppConfig, st *state.StateStore, task bundleTask) {', 'func (c *bundleCollector) collectTaskEvidence(st *state.StateStore, task bundleTask) {')
          s = s.replace('func (c *bundleCollector) collectTaskSessions(cfg config.AppConfig, st *state.StateStore, task bundleTask) []string {', 'func (c *bundleCollector) collectTaskSessions(st *state.StateStore, task bundleTask) []string {')
          s = s.replace('!c.hasTaskAssociationEvidence(st, task.ID)', '!hasTaskAssociationEvidence(st, task.ID)')
          s = s.replace('func (c *bundleCollector) hasTaskAssociationEvidence(st *state.StateStore, taskID string) bool {', 'func hasTaskAssociationEvidence(st *state.StateStore, taskID string) bool {')
          s = s.replace('\n\t_ = cfg\n}\n\nfunc hasTaskAssociationEvidence', '\n}\n\nfunc hasTaskAssociationEvidence', 1)
          s = s.replace('\n\t_ = cfg\n\treturn sortedSet(sessions)\n}', '\n\treturn sortedSet(sessions)\n}', 1)

          start = s.index('func (c *bundleCollector) collectClaudeTranscripts')
          end = s.index('func (c *bundleCollector) collectCurrentState')
          replacement = r'''func (c *bundleCollector) collectClaudeTranscripts(cfg config.AppConfig, sessionIDs []string) {
          if len(sessionIDs) == 0 {
              return
          }
          matches, err := findClaudeTranscripts(cfg.ClaudeConfigDir, sessionIDs)
          if err != nil && !errors.Is(err, os.ErrNotExist) {
              c.addMissing("claude-transcripts/unavailable")
          }
          for _, sessionID := range sessionIDs {
              c.addClaudeTranscriptMatches(sessionID, matches[sessionID])
          }
          }

          func findClaudeTranscripts(configDir string, sessionIDs []string) (map[string][]string, error) {
          targets := make(map[string]struct{}, len(sessionIDs))
          for _, sessionID := range sessionIDs {
              targets[sessionID] = struct{}{}
          }
          matches := make(map[string][]string, len(sessionIDs))
          projectsRoot := filepath.Join(configDir, "projects")
          err := filepath.WalkDir(projectsRoot, func(filePath string, entry fs.DirEntry, walkErr error) error {
              if walkErr != nil {
                  return walkErr
              }
              if entry.IsDir() || !entry.Type().IsRegular() || filepath.Ext(entry.Name()) != ".jsonl" {
                  return nil
              }
              sessionID := strings.TrimSuffix(entry.Name(), ".jsonl")
              if _, ok := targets[sessionID]; ok {
                  matches[sessionID] = append(matches[sessionID], filePath)
              }
              return nil
          })
          return matches, err
          }

          func (c *bundleCollector) addClaudeTranscriptMatches(sessionID string, paths []string) {
          sort.Strings(paths)
          switch len(paths) {
          case 0:
              c.addMissing(path.Join("claude-transcripts", safeArchiveComponent(sessionID)+".jsonl"))
          case 1:
              c.addFile(paths[0], path.Join("claude-transcripts", safeArchiveComponent(sessionID)+".jsonl"))
          default:
              for index, transcriptPath := range paths {
                  archivePath := path.Join("claude-transcripts", safeArchiveComponent(sessionID), fmt.Sprintf("%02d.jsonl", index+1))
                  c.addFile(transcriptPath, archivePath)
              }
          }
          }

          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
          gofmt -w glm-worker/internal/app/bundle.go
          git diff --check
      - name: Commit fixes
        run: |
          if git diff --quiet -- glm-worker/internal/app/bundle.go; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glm-worker/internal/app/bundle.go
          git commit -m 'Fix bundle lint findings'
          git push origin HEAD:gpt/issue-59-bundle
